    values,
    el: panel,
    setValue,
    addControl(spec) {
      spec.kind = kindOf(spec);
      specByName[spec.name] = spec;
      allSpecs.push(spec);
      defaults[spec.name] = spec.default;
      if (!(spec.name in values)) values[spec.name] = spec.default;

      persist();
    },
  };

function createLoop({ onFrame, speed = 1 }) {
  let running = false;
  let lastTime = 0;
  let elapsed = 0;
  let rafId = null;
  let currentSpeed = speed;

  function tick(now) {
    if (!running) return;
    const dt = lastTime ? (now - lastTime) / 1000 : 0;
    lastTime = now;
    const scaledDt = dt * currentSpeed;
    elapsed += scaledDt;
    onFrame(scaledDt, elapsed);
    rafId = requestAnimationFrame(tick);
  }

  return {
    start() {
      if (running) return;
      running = true;
      lastTime = 0;
      rafId = requestAnimationFrame(tick);
    },
    stop() {
      running = false;
      if (rafId) cancelAnimationFrame(rafId);
    },
    setSpeed(n) {
      currentSpeed = n;
    },
    get isRunning() {
      return running;
    },
  };
}

  let t0 = 0.5 - x0 * x0 - y0 * y0;
  if (t0 >= 0) { t0 *= t0; n0 = t0 * t0 * dot(GRAD[gi0], x0, y0); }

  let t1 = 0.5 - x1 * x1 - y1 * y1;
  if (t1 >= 0) { t1 *= t1; n1 = t1 * t1 * dot(GRAD[gi1], x1, y1); }

  let t2 = 0.5 - x2 * x2 - y2 * y2;
  if (t2 >= 0) { t2 *= t2; n2 = t2 * t2 * dot(GRAD[gi2], x2, y2); }

  return 70 * (n0 + n1 + n2);
}

function download(filename, blobOrUrl, mime) {
  const url = blobOrUrl instanceof Blob ? URL.createObjectURL(blobOrUrl) : blobOrUrl;
  const a = document.createElement('a');
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  a.remove();
  if (blobOrUrl instanceof Blob) URL.revokeObjectURL(url);
}

function exportPng(canvas, { multiplier = 1 } = {}) {
  if (multiplier === 1) {
    canvas.toBlob((blob) => download('linefield.png', blob), 'image/png');
    return;
  }
  const scaled = document.createElement('canvas');
  scaled.width = canvas.width * multiplier;
  scaled.height = canvas.height * multiplier;
  const ctx = scaled.getContext('2d');
  ctx.imageSmoothingEnabled = true;
  ctx.drawImage(canvas, 0, 0, scaled.width, scaled.height);
  scaled.toBlob((blob) => download('linefield.png', blob), 'image/png');
}

function exportSvg(paths, { width = 800, height = 600 } = {}) {
  const polylines = paths
    .map((pts) => {
      const pointsAttr = pts.map(([x, y]) => `${x.toFixed(2)},${y.toFixed(2)}`).join(' ');
      return `<polyline points="${pointsAttr}" fill="none" stroke="black" stroke-width="1" />`;
    })
    .join('\n');

  const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="${width}" height="${height}" viewBox="0 0 ${width} ${height}">\n${polylines}\n</svg>`;
  const blob = new Blob([svg], { type: 'image/svg+xml' });
  download('linefield.svg', blob);
}

async function exportSource({ filename = 'linefield-source.html' } = {}) {
  const url = location.href.split(/[?#]/)[0];
  const res = await fetch(url);
  if (!res.ok) throw new Error(`exportSource: could not fetch source (${res.status})`);
  const blob = await res.blob();
  download(filename, blob);
  return blob;
}

// The piece's own import statements are the registration. A hand-maintained
// list is a silent-failure surface: omit an entry and the baked file is
// valid, loads without error, and renders nothing. That shipped once.
const SHARED_IMPORT_RE =
  /^\s*import\s*\{[^}]*\}\s*from\s*['"](\.\.\/\.\.\/shared\/[^'"]+\.js)['"];?\s*$/gm;

// A shared module importing ANOTHER shared module (e.g. controls.js reading
// hexToHue from color.js) addresses it as './color.js' — same directory,
// different relative base than the piece's '../../shared/color.js'. Matched
// separately and normalised back to the piece-style path below so the same
// `seen` dedupe applies to both forms of the same file.
const INNER_SHARED_IMPORT_RE =
  /^\s*import\s*\{[^}]*\}\s*from\s*['"]\.\/([^'"]+\.js)['"];?\s*$/gm;

function stripExports(src) {
  // `export function foo` / `export const foo` -> drop the `export ` keyword.
  return src.replace(/^export\s+/gm, '');
}

function stripInnerImports(src) {
  return src.replace(INNER_SHARED_IMPORT_RE, '');
}

// BFS over the shared-module import graph, not just the piece's own
// top-level imports. Scanning only the piece script is exactly the
// hand-maintained-list failure this function's own comment already warns
// about, one level removed: a shared module's OWN imports were invisible to
// it, so a new cross-shared-module import survived verbatim into a classic
// (non-module) inline script — a SyntaxError this file's <script> tag has no
// listener for, producing a validly-loading, blank-canvas download. See
// skills/building-generative-backgrounds/SKILL.md, "Inlining and bundling".
async function inlineSharedModules(pieceScriptSrc) {
  const strippedPieceSrc = pieceScriptSrc.replace(SHARED_IMPORT_RE, '');
  const initial = [...pieceScriptSrc.matchAll(SHARED_IMPORT_RE)].map((m) => m[1]);
  if (!initial.length) {
    throw new Error('bakeHtml: the piece imports no shared modules — refusing to bake a file that would render blank');
  }

  const seen = new Set();
  const order = [];
  const srcByPath = new Map();
  const queue = [...initial];
  while (queue.length) {
    const path = queue.shift();
    if (seen.has(path)) continue;
    seen.add(path);
    order.push(path);
    const res = await fetch(path);
    if (!res.ok) throw new Error(`bakeHtml: could not fetch ${path} (${res.status})`);
    const src = await res.text();
    srcByPath.set(path, src);
    // Normalise './foo.js' found INSIDE a shared module to the same
    // '../../shared/foo.js' form the piece-level regex produces, so a module
    // reached both ways (e.g. color.js: directly by the piece, and via
    // controls.js) is only ever inlined once.
    const inner = [...src.matchAll(INNER_SHARED_IMPORT_RE)].map((m) => `../../shared/${m[1]}`);
    for (const p of inner) if (!seen.has(p)) queue.push(p);
  }

  const bodies = order.map((path) => {
    const src = srcByPath.get(path);
    return `// --- inlined: ${path} ---\n${stripInnerImports(stripExports(src))}`;
  });

  return `${bodies.join('\n\n')}\n\n// --- piece script ---\n${strippedPieceSrc}`;
}

async function bakeHtml({ sourceHtml, values }) {
  const doc = new DOMParser().parseFromString(sourceHtml, 'text/html');
  doc.querySelectorAll('[data-lf-panel]').forEach((el) => el.remove());

  const pieceScript = doc.querySelector('script[type="module"]');
  const pieceScriptSrc = pieceScript ? pieceScript.textContent : '';
  if (pieceScript) pieceScript.remove();

  const inlinedSrc = await inlineSharedModules(pieceScriptSrc);

  const safeJson = JSON.stringify(values).replace(/</g, '\\u003c');
  const inject = doc.createElement('script');
  inject.textContent = `window.__LF_BAKED_VALUES__ = ${safeJson};\n${inlinedSrc}`;
  doc.body.appendChild(inject);

  const baked = `<!doctype html>\n${doc.documentElement.outerHTML}`;
  const blob = new Blob([baked], { type: 'text/html' });
  download('linefield-baked.html', blob);
  return baked;
}

function describeForAI({ pieceName, values }) {
  const parts = Object.entries(values)
    .map(([k, v]) => `${k}=${typeof v === 'number' ? v.toFixed(2) : v}`)
    .join(', ');
  const text = `A generative line-art background piece called "${pieceName}", rendered on an HTML canvas with parameters: ${parts}.`;
  if (navigator.clipboard) navigator.clipboard.writeText(text);
  return text;
}

// shared/pointer.js
// Tracks the cursor relative to one canvas. A leaf module: no imports, no
// state beyond its own listeners.

function createPointer({ canvas, enabled = true }) {
  const p = {
    x: 0, y: 0, nx: 0, ny: 0, vx: 0, vy: 0,
    active: false, influence: 0,
  };

  let lastX = 0, lastY = 0, lastT = 0;

  function onMove(e) {
    const r = canvas.getBoundingClientRect();
    const x = (e.clientX - r.left) * (canvas.width / r.width);
    const y = (e.clientY - r.top) * (canvas.height / r.height);
    const t = performance.now();
    const dt = lastT ? Math.max((t - lastT) / 1000, 1 / 240) : 0;
    if (dt) { p.vx = (x - lastX) / dt; p.vy = (y - lastY) / dt; }
    p.x = x; p.y = y;
    p.nx = (x / canvas.width) * 2 - 1;
    p.ny = (y / canvas.height) * 2 - 1;
    p.active = true;
    lastX = x; lastY = y; lastT = t;
  }
  function onEnter() { p.active = true; }
  function onLeave() { p.active = false; }

  if (enabled) {
    canvas.addEventListener('pointermove', onMove);
    canvas.addEventListener('pointerenter', onEnter);
    canvas.addEventListener('pointerleave', onLeave);
  }

  // Called once per frame by the piece. `influence` rises while the pointer
  // is over the canvas and eases back to 0 when it leaves, so a piece never
  // snaps as the cursor exits.
  //
  // It takes NO dt argument and keeps its own clock, deliberately. Influence
  // is a UI-response quantity — how present the cursor is right now — not
  // an animation quantity, so it should not track animation timing at all.
  // Accepting a piece's dt would couple the two regardless of how that
  // piece happens to apply values.speed downstream; keeping its own clock
  // keeps cursor response independent of any piece's animation rate,
  // including at Speed 0.
  //
  // performance.now() is safe under the deterministic harness: it is not
  // frozen, it is a controlled clock that stepFrames advances 16ms per frame,
  // so influence rises normally during an audit and two runs stay identical.
  let stepT = 0;
  p.step = () => {
    const now = performance.now();
    const dt = stepT ? Math.min((now - stepT) / 1000, 0.1) : 0;
    stepT = now;
    if (!dt) return;
    const target = p.active ? 1 : 0;
    const rate = p.active ? 6 : 2.5;
    p.influence += (target - p.influence) * Math.min(rate * dt, 1);
    const decay = Math.exp(-4 * dt);
    p.vx *= decay; p.vy *= decay;
  };

  // 0..1 proximity of a canvas point to the pointer, for pieces that
  // modulate locally rather than globally.
  p.falloff = (x, y, radius) => {
    if (!radius) return 0;
    const d = Math.hypot(x - p.x, y - p.y);
    return Math.max(0, 1 - d / radius);
  };

  p.destroy = () => {
    canvas.removeEventListener('pointermove', onMove);
    canvas.removeEventListener('pointerenter', onEnter);
    canvas.removeEventListener('pointerleave', onLeave);
  };

  return p;
}

// Stateless delta emitter: holds no pitch/yaw of its own. Each drag move
// calls onOrbit(dPitchRad, dYawRad) with the frame's delta only; the caller
// (a piece, via panel.setValue) owns where that delta lands, so the panel's
// Pitch/Yaw sliders and the rendered camera can never read two different
// numbers. onSettle fires once on pointerup, for the caller to persist the
// drag's final position without writing to localStorage on every move.
function createOrbit({
  canvas,
  enabled = new URLSearchParams(location.search).get('preview') !== '1',
  sensitivity = 0.008,
  onOrbit = () => {},
  onSettle = () => {},
} = {}) {
  let dragging = false;
  let lastX = 0, lastY = 0;

  function onDown(e) {
    if (e.button !== 0) return;
    dragging = true;
    lastX = e.clientX; lastY = e.clientY;
    canvas.setPointerCapture?.(e.pointerId);
  }
  function onMove(e) {
    if (!dragging) return;
    const dYaw = (e.clientX - lastX) * sensitivity;
    const dPitch = (e.clientY - lastY) * sensitivity;
    lastX = e.clientX; lastY = e.clientY;
    onOrbit(dPitch, dYaw);
  }
  function onUp(e) {
    dragging = false;
    canvas.releasePointerCapture?.(e.pointerId);
    onSettle();
  }

  if (enabled) {
    canvas.addEventListener('pointerdown', onDown);
    canvas.addEventListener('pointermove', onMove);
    canvas.addEventListener('pointerup', onUp);
    canvas.addEventListener('pointercancel', onUp);
  }

  return {
    destroy() {
      canvas.removeEventListener('pointerdown', onDown);
      canvas.removeEventListener('pointermove', onMove);
      canvas.removeEventListener('pointerup', onUp);
      canvas.removeEventListener('pointercancel', onUp);
    },
  };
}


// --- piece script ---






  const PIECE_ID = 'contour-grid';
  const canvas = document.getElementById('canvas');
  const ctx = canvas.getContext('2d');

  function resize() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
  }
  window.addEventListener('resize', resize);
  resize();

  // Band count is derived per frame from density — no persistent array, so no re-seed.
  const BASE_BANDS = 26;
  const STEP_PX = 6;
  let paths = [];

  const PRESETS = {
    whisper: { opacity: 0.3, stroke: 1.1, density: 0.6, saturation: 0.06, glow: 0 },
    ink:     { opacity: 1, stroke: 1.8, density: 0.8, saturation: 0, glow: 0 },
    neon:    { opacity: 0.95, stroke: 1, density: 1.2, saturation: 0.9, glow: 1 },
    drift:   { opacity: 0.5, stroke: 0.9, density: 0.7, speed: 0.3, motion: 1.6 },
    dense:   { opacity: 0.6, stroke: 0.6, density: 2, speed: 0.8, glow: 0 },
  };

  const baked = window.__LF_BAKED_VALUES__;
  const panel = baked ? null : createControlPanel({
    pieceId: PIECE_ID,
    presets: PRESETS,
    onChange: () => {},
    extraControls: [
      { name: 'relief', label: 'Relief', type: 'range', min: 0, max: 2, step: 0.01, default: 1 },
    ],
    defaults: { hue: 35, hueB: 15, saturation: 0.5, colorMode: 'gradient', colorA: '#ff9500', colorB: '#ff4000' },
  });
  const currentValues = baked || panel.values;
  const pointer = createPointer({ canvas });

  function drawFrame(dt, elapsed, values) {
    ctx.fillStyle = values.invert ? '#f2f2f4' : '#0a0a0d';
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    paths = [];
    const bands = Math.max(2, Math.round(BASE_BANDS * values.density));
    const noiseScale = 0.0016 * (0.25 + values.scale);
    // relief sets the static terrain height; motion layers a second,
    // independently-amplitude'd wobble on top; speed is purely the rate that
    // wobble evolves at (not its size) — the three no longer collapse to one knob.
    const baseAmp = 30 * values.relief;
    const moveAmp = 16 * values.motion;
    const t = elapsed * values.speed * 0.12;

    const lineWidth = 0.4 + values.stroke * 1.1;
    ctx.lineWidth = lineWidth;

    // Gate: off at pointer 0, eased by influence, local via falloff. Uses no
    // term scaled by values.speed, so the bulge survives Speed 0.
    const k = values.pointer * pointer.influence;

    // Drawing below happens in the pre-rotation local space that ctx.rotate
    // maps to screen space, but pointer.x/y are screen (canvas-pixel) space.
    // Un-rotate the pointer about the same centre/angle the canvas transform
    // uses, so falloff is evaluated in the same space the geometry is drawn
    // in — otherwise the bulge drifts away from the visible cursor as soon
    // as Angle leaves 0 (confirmed: ~103px off at 15deg, ~515px at 90deg,
    // with an off-centre cursor).
    const rcx = canvas.width / 2, rcy = canvas.height / 2;
    const theta = (values.angle * Math.PI) / 180;
    const cosT = Math.cos(-theta), sinT = Math.sin(-theta);
    const pdx = pointer.x - rcx, pdy = pointer.y - rcy;
    const plx = rcx + pdx * cosT - pdy * sinT;
    const ply = rcy + pdx * sinT + pdy * cosT;

    ctx.save();
    ctx.translate(rcx, rcy);
    ctx.rotate(theta);
    ctx.translate(-rcx, -rcy);

    // Overdraw horizontally so rotation never reveals the canvas edge.
    const margin = Math.max(canvas.width, canvas.height) * 0.4;

    for (let b = 0; b < bands; b++) {
      const f = b / (bands - 1 || 1);
      const baseY = -margin + f * (canvas.height + margin * 2);

      const { h, s } = paletteHsl(values, f);
      const [r, g, bl] = hslToRgb(h, s, values.invert ? 0.35 : 0.6);
      ctx.strokeStyle = `rgba(${r},${g},${bl},${values.opacity})`;

      const pts = [];
      ctx.beginPath();
      for (let x = -margin; x <= canvas.width + margin; x += STEP_PX) {
        const n1 = simplex2(x * noiseScale + values.phase, baseY * noiseScale);
        const n2 = simplex2(x * noiseScale + values.phase + 137, baseY * noiseScale + t);
        // Terrain bulges beneath the pointer: a falloff-weighted offset added
        // to the height field, independent of the speed-scaled wobble above.
        // Falloff against the un-rotated pointer (plx, ply), not pointer.x/y
        // directly — see note above ctx.save().
        const bulge = k ? Math.max(0, 1 - Math.hypot(x - plx, baseY - ply) / 260) * k * 60 : 0;
        const y = baseY + n1 * baseAmp + n2 * moveAmp - bulge;
        if (x === -margin) ctx.moveTo(x, y);
        else ctx.lineTo(x, y);
        pts.push([x, y]);
      }
      if (values.glow > 0) {
        ctx.lineWidth = lineWidth + values.glow * 3;
        ctx.globalAlpha = values.glow * 0.25;
        ctx.stroke();
        ctx.lineWidth = lineWidth;
        ctx.globalAlpha = 1;
      }
      ctx.stroke();
      paths.push(pts);
    }

    ctx.restore();
  }

  const loop = createLoop({
    onFrame(dt, elapsed) {
      pointer.step();
      drawFrame(dt, elapsed, currentValues);
    },
  });
  loop.start();

  document.getElementById('btn-png-2x')?.addEventListener('click', () => exportPng(canvas, { multiplier: 2 }));
  document.getElementById('btn-png-4x')?.addEventListener('click', () => exportPng(canvas, { multiplier: 4 }));
  document.getElementById('btn-svg')?.addEventListener('click', () => exportSvg(paths, { width: canvas.width, height: canvas.height }));
  document.getElementById('btn-baked')?.addEventListener('click', () => {
