<!--
  magnetosphere — a tiny quiet body whose field is pushed in on the sunward
  side and drawn out into a long tail of hairlines, with a solar-wind stream
  piling into a bow shock ahead of it.

  Text-safe zone: the top band (about the top third). Only the faint wings
  of the wind and the bow shock reach toward it; it closes as Scale rises.
  Anchor: the reconnection pinch in the tail, right of centre, where the two
  lobes meet. The lobe lines drift toward the sheet and reconnect there, so
  the pinch brightens and fades on a slow conveyor burst (24 s loop at
  Speed 1) while the tail sways gently around it.

  Technique: field lines are traced once from a dipole plus a tail current
  sheet (with a normal-field reversal at the X), shaped, and drawn as
  additive hairlines bucketed by alpha. The lobe lines are a conveyor
  interpolated between traced lines. The sheet carries a fine stipple
  jetting both ways from the X. Wind particles run straight until they meet
  the shock, then turn, slow and brighten along it. Wind sets the stream's
  strength and density; at 0 the wind and the shock are gone and only the
  field remains.

  SVG export: the field lines (dayside, night-side and tail lobes) as
  polylines, only where they are visibly lit, plus a capped sample of the
  wind dots riding the bow shock as circles. The free-stream wind and the
  reconnection stipple are not exported; use PNG for those.
-->

/* Sticky footer (fix round 1, finding 1): a flex sibling of .lf-body, not a

/* Below ~640px: full-width sheet docked to the bottom edge, collapsed to a

    border-radius: 16px 16px 0 0; border-bottom: none; }
  .lf-handle { display: flex; flex: none; justify-content: center; padding: 8px 0; cursor: pointer; }
  .lf-handle::before { content: ''; width: 36px; height: 4px; border-radius: 999px; background: #3a3a46; }
  .lf-reset { border-radius: 0; }

`;

function kindOf(spec) {
  if (spec.type === 'checkbox') return 'boolean';
  if (spec.type === 'color') return 'color';
  if (spec.type === 'select') return 'enum';
  if (spec.type === 'hidden') return 'hidden';
  return 'number';
}

function injectCss() {
  if (document.getElementById('lf-panel-css')) return;
  const style = document.createElement('style');
  style.id = 'lf-panel-css';
  style.textContent = PANEL_CSS;
  document.head.appendChild(style);
}

function createControlPanel({ pieceId, onChange, extraControls = [], defaults: defaultOverrides = {}, presets = {} }) {
  injectCss();

  // Gallery preview iframes load pieces with ?preview=1: same-origin means
  // they'd otherwise read (and, on interaction, overwrite) the viewer's own
  // localStorage:<pieceId> — showing a hovered card's saved tuning instead
  // of its defaults. Under this flag we neither read nor write it. A piece
  // opened directly, with no query string, is completely unaffected.
  const isPreview = new URLSearchParams(location.search).get('preview') === '1';

  const storageKey = `linefield:${pieceId}`;
  const allSpecs = [...SHARED_CONTROLS, ...extraControls];
  const specByName = {};
  // kind is the discriminant every gate must branch on, never `type`: a gate
  // that switches on the type-name string would silently fall a new type
  // into whichever branch it doesn't match. 'hidden' (hue/hueB) has no panel
  // row at all and is excluded from control gates entirely — it is not a
  // user-facing control, just the exact numeric value colorA/colorB drive.
  for (const spec of allSpecs) {
    spec.kind = kindOf(spec);
    specByName[spec.name] = spec;
  }
  const defaults = {};
  for (const spec of allSpecs) {
    defaults[spec.name] = spec.name in defaultOverrides ? defaultOverrides[spec.name] : spec.default;
  }

  let saved = {};
  if (!isPreview) {
    try {
      saved = JSON.parse(localStorage.getItem(storageKey) || '{}');
    } catch {
      saved = {};
    }
  }

  const values = { ...defaults, ...saved.values };
  // Saved values bypass setValue(), so validate enum membership on load.
  // An option removed or renamed since the save falls back to the control's
  // resolved default, keeping the rendered select and values in sync.
  for (const spec of allSpecs) {
    if (spec.kind === 'enum' && !spec.options.includes(values[spec.name])) {
      values[spec.name] = defaults[spec.name];
    }
  }
  let collapsed = saved.collapsed || false;
  let panelPosition = saved.position && Number.isFinite(saved.position.left) && Number.isFinite(saved.position.top)
    ? saved.position
    : null;
  // Mobile-sheet collapse is a separate, unpersisted flag: it starts
  // collapsed every load (handle-only, per the brief) and is scoped to the
  // <=640px media query in CSS, so toggling it can never affect (or be
  // affected by) the desktop `collapsed` state above.
  let mobileCollapsed = true;
  // Fix round 1, finding 2: sections collapse independently, persisted
  // alongside `collapsed`/`values`. Interactions starts open (the thing the
  // separation was for); Color and Visual start closed, so the panel fits
  // on screen at rest. `saved.sections ?? {}` is deliberately defensive — a
  // blob written before this change has no `sections` key at all, and
  // reading it without the fallback would throw on spread below.
  const DEFAULT_SECTION_OPEN = { interaction: true, color: false, visual: false };
  const sectionOpen = { ...DEFAULT_SECTION_OPEN, ...(saved.sections ?? {}) };

  const panel = document.createElement('div');
  panel.className = 'lf-panel mobile-collapsed' + (collapsed ? ' collapsed' : '');
  panel.setAttribute('data-lf-panel', '');

  // Mobile-only drag handle (CSS hides it above the breakpoint). Tapping it
  // expands/collapses the bottom sheet without touching desktop's own
  // click-to-collapse heading below.
  const handle = document.createElement('div');
  handle.className = 'lf-handle';
  handle.addEventListener('click', () => {
    mobileCollapsed = !mobileCollapsed;
    panel.classList.toggle('mobile-collapsed', mobileCollapsed);
  });
  panel.appendChild(handle);

  const heading = document.createElement('h3');
  const headingLabel = document.createElement('span');
  headingLabel.textContent = 'Controls';
  const status = document.createElement('span');
  status.className = 'lf-status';
  status.innerHTML = '<span class="lf-dot"></span>live';
  heading.append(headingLabel, status);
  heading.title = 'Drag to move · click to collapse';
  let dragState = null;
  let suppressHeadingClick = false;
  heading.addEventListener('pointerdown', (event) => {
    if (event.button !== 0 || window.innerWidth <= 640) return;
    const rect = panel.getBoundingClientRect();
    dragState = { id: event.pointerId, startX: event.clientX, startY: event.clientY, left: rect.left, top: rect.top, moved: false };
    heading.setPointerCapture(event.pointerId);
  });
  heading.addEventListener('pointermove', (event) => {
    if (!dragState || event.pointerId !== dragState.id) return;
    const dx = event.clientX - dragState.startX;
    const dy = event.clientY - dragState.startY;
    if (!dragState.moved && Math.hypot(dx, dy) < 4) return;
    dragState.moved = true;
    const maxLeft = Math.max(0, window.innerWidth - panel.offsetWidth);
    const maxTop = Math.max(0, window.innerHeight - panel.offsetHeight);
    panel.style.left = `${Math.min(maxLeft, Math.max(0, dragState.left + dx))}px`;
    panel.style.top = `${Math.min(maxTop, Math.max(0, dragState.top + dy))}px`;
    panel.style.right = 'auto';
    panel.style.bottom = 'auto';
  });
  function finishPanelDrag(event) {
    if (!dragState || event.pointerId !== dragState.id) return;
    if (heading.hasPointerCapture(event.pointerId)) heading.releasePointerCapture(event.pointerId);
    if (dragState.moved) {
      panelPosition = { left: parseFloat(panel.style.left), top: parseFloat(panel.style.top) };
      suppressHeadingClick = true;
      persist();
    }
    dragState = null;
  }
  heading.addEventListener('pointerup', finishPanelDrag);
  heading.addEventListener('pointercancel', finishPanelDrag);
  heading.addEventListener('click', () => {
    if (suppressHeadingClick) {
      suppressHeadingClick = false;
      return;
    }
    collapsed = !collapsed;
    panel.classList.toggle('collapsed', collapsed);
    persist();
  });
  panel.appendChild(heading);

  const body = document.createElement('div');
  body.className = 'lf-body';
  panel.appendChild(body);

  // The panel configures artwork visuals: camera angles in Interactions,
  // palette in Color, and the remaining rendering parameters in Visual.
  // Each section is a toggle-button header plus a body a category routes
  // rows into — `sectionOf` below is the single place that mapping lives.
  // Collapsing hides `.lf-section-body` via CSS only: rows stay in the DOM
  // (never removed), so a gate that drives a control by name or by
  // `row.querySelector` still finds it whether its section is open or not.
  function makeSection(key, title) {
    const section = document.createElement('div');
    section.className = 'lf-section';

    const headBtn = document.createElement('button');
    headBtn.type = 'button';
    headBtn.className = 'lf-section-head';
    const headLabel = document.createElement('span');
    headLabel.textContent = title;
    const chevron = document.createElement('span');
    chevron.className = 'lf-chevron';
    headBtn.append(headLabel, chevron);

    const sectionBody = document.createElement('div');
    sectionBody.className = 'lf-section-body';
    section.append(headBtn, sectionBody);

    function applyOpenState() {
      const open = sectionOpen[key];
      headBtn.setAttribute('aria-expanded', String(open));
      section.classList.toggle('lf-section-collapsed', !open);
    }
    applyOpenState();
    headBtn.addEventListener('click', () => {
      sectionOpen[key] = !sectionOpen[key];
      applyOpenState();
      persist();
    });

    return { el: section, body: sectionBody };
  }
  const secInteraction = makeSection('interaction', 'Interactions');
  const secColor = makeSection('color', 'Color');
  const secVisual = makeSection('visual', 'Visual');
  body.appendChild(secInteraction.el);
  body.appendChild(document.createElement('hr')).className = 'lf-divider';
  body.appendChild(secColor.el);
  body.appendChild(secVisual.el);

  // category is optional and defaults to 'visual'. Only 'interaction' and
  // 'color' route a control out of Visual — 'motion'/'form'/'ink' (the
  // piece-extra sub-tags called out in the brief) are metadata for a future
  // stage and land in Visual today, same as an uncategorised control.
  function sectionOf(spec) {
    if (spec.category === 'interaction') return secInteraction.body;
    if (spec.category === 'color') return secColor.body;
    return secVisual.body;
  }

  // Per-control render hook. Covers <input type=range|checkbox|color> and
  // <select> uniformly; a future widget that isn't a bare input/select would
  // register its own render(v) instead, so setValue below stays agnostic to
  // what is actually on screen.
  const controllers = {};

  // Clamp to the spec's declared range where numeric, then snap to its step
  // the same way <input type=range> snaps on a programmatic .value set. That
  // browser-side snap is exactly what the old DOM round-trip captured (set
  // .value, then read it back post-sanitization); setValue writes values[]
  // directly and never reads the DOM back, so without this step a control's
  // displayed slider position and its rendered value can disagree — the
  // Pitch/Yaw divergence this stage exists to remove, reintroduced. Not
  // applied to booleans (kind === 'boolean') or to a name with no known spec.
  function clampValue(spec, v) {
    // Enum membership is not optional: a value outside spec.options must be
    // rejected rather than written, or __LF_VALUES__ and the rendered <select>
    // diverge (the <select> silently ignores an out-of-range .value while
    // the state object keeps whatever was passed in). Falls back to the
    // control's current value, the same "previous value stands" rule a
    // number's clamp already applies at its min/max.
    if (spec?.kind === 'enum') {
      return spec.options.includes(v) ? v : values[spec.name];
    }
    if (!spec || spec.kind !== 'number' || typeof spec.min !== 'number' || typeof spec.max !== 'number') {
      return v;
    }
    const clamped = Math.min(spec.max, Math.max(spec.min, v));
    const step = Number(spec.step);
    if (!(step > 0)) return clamped;
    const snapped = spec.min + Math.round((clamped - spec.min) / step) * step;
    const decimals = (String(step).split('.')[1] || '').length;
    return decimals ? Number(snapped.toFixed(decimals)) : snapped;
  }

  // THE write path. Every value change — a drag, a preset, Reset, or a gate
  // script driving the panel with no DOM at all — goes through this and only
  // this, so a value set by an audit renders identically to the same value
  // set by a human: clamp -> write -> render -> clear active chip -> fire
  // onChange exactly once -> persist if asked.
  function setValue(name, value, { persist: shouldPersist = true } = {}) {
    const spec = specByName[name];
    const v = clampValue(spec, value);
    values[name] = v;
    // A colour control's spec names the hidden numeric field it drives
    // (colorA -> hue, colorB -> hueB). This is the ONLY place that hex gets
    // decoded — once per pick, never in a render loop — and it never runs
    // for a programmatic write to the hidden field itself (see applyValues,
    // which reasserts hue/hueB after this fires so a preset/reset always
    // lands on the exact declared number, not a lossy decode of colorA/
    // colorB). An achromatic pick (grey/white/black) has no hue to extract;
    // hexToHue returns null and the previous hue is left untouched.
    if (spec?.linkedHue) {
      const decoded = hexToHue(v);
      if (decoded !== null) values[spec.linkedHue] = decoded;
    }
    controllers[name]?.render(v);
    if (name === 'colorMode') controllers.colorB?.setRowVisible?.(v === 'gradient');
    setActiveChip(null);
    onChange(name, v, values);
    if (shouldPersist) persist();
  }

  // Same decimals rule clampValue's step-snap uses, so a slider's readout
  // never shows more precision than the control itself actually holds.
  function formatNumber(spec, v) {
    const decimals = (String(spec.step).split('.')[1] || '').length;
    return decimals ? Number(v).toFixed(decimals) : String(v);
  }

  // Mock 2's slider fill is a gradient over the FILLED portion only, unfilled
  // remainder flat grey — not achievable in pure CSS for a native <input
  // type=range> (no fill-percentage selector exists), so render() also
  // writes this custom property every time a value changes, human-dragged or
  // gate-driven, and the two-stop `background-size` trick in PANEL_CSS reads it.
  function setRangeFill(input, spec, v) {
    const pct = spec.max > spec.min ? ((v - spec.min) / (spec.max - spec.min)) * 100 : 0;
    input.style.setProperty('--lf-pct', `${pct}%`);
  }

  // Mock 2's "(•) Solid ( ) Gradient" radio pair, without a second real
  // <input> in colorMode's row: the row's one real control stays the
  // <select> buildRow already built (kept in the DOM, driven exactly the way
  // test-interactions.mjs dispatches a real DOM `input` event), visually
  // hidden, with a composite pair of buttons layered in front of it that
  // call setValue the same way any other control does. This is the
  // registration hook, not a second write path: the buttons never touch
  // `values` themselves.
  function enhanceColorModeToggle(row, select, spec) {
    select.classList.add('lf-visually-hidden');
    const seg = document.createElement('div');
    seg.className = 'lf-segmented';
    const buttons = {};
    for (const opt of spec.options) {
      const btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'lf-seg-btn';
      btn.textContent = opt.charAt(0).toUpperCase() + opt.slice(1);
      btn.addEventListener('click', () => setValue(spec.name, opt));
      buttons[opt] = btn;
      seg.appendChild(btn);
    }
    row.insertBefore(seg, select);
    const baseRender = controllers[spec.name].render;
    controllers[spec.name].render = (v) => {
      baseRender(v);
      for (const [opt, btn] of Object.entries(buttons)) btn.classList.toggle('lf-seg-btn-active', opt === v);
    };
    controllers[spec.name].render(values[spec.name]);
  }

  function buildRow(spec) {
    // 'hidden' (hue/hueB) is not a control — no row, no input, no DOM at all.
    // It stays in allSpecs/defaults/values so the rest of the machinery
    // (defaults composition, presets, persistence) treats it like any other
    // value; it is simply never rendered or driven directly.
    if (spec.type === 'hidden') return;

    const row = document.createElement('div');
    row.className = 'lf-row';
    let input;
    let readoutEl = null;
    let hexEl = null;

    if (spec.type === 'checkbox') {
      // Compact single line — label and box side by side, matching mock 2's
      // "Invert [ ]" — rather than the label-above-control layout every
      // other control below uses.
      row.classList.add('lf-row-checkbox');
      const label = document.createElement('label');
      label.textContent = spec.label;
      input = document.createElement('input');
      input.type = 'checkbox';
      input.checked = !!values[spec.name];
      row.append(label, input);
    } else {
      const head = document.createElement('div');
      head.className = 'lf-row-head';
      const label = document.createElement('label');
      label.textContent = spec.label;
      head.appendChild(label);

      if (spec.type === 'color') {
        input = document.createElement('input');
        input.type = 'color';
        input.value = values[spec.name];
        row.appendChild(head);
        const colorRow = document.createElement('div');
        colorRow.className = 'lf-color-row';
        hexEl = document.createElement('span');
        hexEl.className = 'lf-hex';
        hexEl.textContent = values[spec.name];
        colorRow.append(input, hexEl);
        row.appendChild(colorRow);
      } else if (spec.type === 'select') {
        input = document.createElement('select');
        for (const opt of spec.options) {
          const o = document.createElement('option');
          o.value = opt;
          o.textContent = opt;
          input.appendChild(o);
        }
        input.value = values[spec.name];
        row.append(head, input);
      } else {
        readoutEl = document.createElement('span');
        readoutEl.className = 'lf-readout';
        readoutEl.textContent = formatNumber(spec, values[spec.name]);
        head.appendChild(readoutEl);
        input = document.createElement('input');
        input.type = 'range';
        input.min = spec.min;
        input.max = spec.max;
        input.step = spec.step;
        input.value = values[spec.name];
        row.append(head, input);
        setRangeFill(input, spec, values[spec.name]);
      }
    }

    // Thin adapter: read the raw DOM value and hand it to setValue. It must
    // not touch values/onChange/persistence itself — setValue is the only
    // write path (see above).
    input.addEventListener('input', () => {
      const v = spec.type === 'checkbox' ? input.checked
        : (spec.type === 'color' || spec.type === 'select') ? input.value
        : parseFloat(input.value);
      setValue(spec.name, v);
    });

    controllers[spec.name] = {
      render(v) {
        if (spec.type === 'checkbox') { input.checked = v; return; }
        input.value = v;
        if (readoutEl) readoutEl.textContent = formatNumber(spec, v);
        if (hexEl) hexEl.textContent = v;
        if (spec.type !== 'color' && spec.type !== 'select') setRangeFill(input, spec, v);
      },
      setRowVisible(visible) {
        row.style.display = visible ? '' : 'none';
      },
    };

    if (spec.name === 'colorMode') enhanceColorModeToggle(row, input, spec);

    sectionOf(spec).appendChild(row);
  }

  // Presets are the same operation the reset button already performed: write
  // every control, update its input, fire onChange, persist. The only
  // difference is which map is written. Composing over `defaults` is what
  // makes a partial preset safe — a control the preset omits lands on the
  // piece's own default rather than keeping the previous preset's value.
  function applyValues(map) {
    const next = { ...defaults, ...map };
    for (const spec of allSpecs) setValue(spec.name, next[spec.name], { persist: false });
    // setValue(colorA/colorB, ...) above may have just overwritten hue/hueB
    // with a lossy hex decode — order-dependent otherwise, since 'hidden'
    // specs are plain entries in the same allSpecs array. The exact value
    // `next` already carries always wins on a programmatic write (preset,
    // Reset, ?preset= on load): reassert it directly, no side effects, so
    // these paths render at exactly the declared number, never an
    // approximation of it.
    for (const spec of allSpecs) {
      if (spec.kind === 'hidden') values[spec.name] = next[spec.name];
    }
    persist();
  }

  const presetNames = Object.keys(presets);
  let chipRow = null;
  const chips = {};

  function setActiveChip(name) {
    for (const [n, el] of Object.entries(chips)) {
      el.setAttribute('aria-pressed', String(n === name));
    }
  }

  if (presetNames.length) {
    chipRow = document.createElement('div');
    chipRow.className = 'lf-presets';
    for (const name of presetNames) {
      const chip = document.createElement('button');
      chip.type = 'button';
      chip.className = 'lf-chip';
      chip.dataset.preset = name;
      chip.textContent = name;
      chip.setAttribute('aria-pressed', 'false');
      chip.addEventListener('click', () => {
        applyValues(presets[name]);
        setActiveChip(name);
      });
      chips[name] = chip;
      chipRow.appendChild(chip);
    }
    // Presets sit above every section, ahead of the two tiers built earlier
    // in this function — insertBefore rather than appendChild, since the
    // section containers are already in `body` by this point.
    body.insertBefore(chipRow, secInteraction.el);
  }

  for (const spec of allSpecs) buildRow(spec);
  // colorB's row only makes sense in gradient mode; setValue toggles it on
  // every subsequent change, this sets the correct initial state.
  controllers.colorB?.setRowVisible?.(values.colorMode === 'gradient');

  // Reset is a sticky footer (fix round 1, finding 1): a sibling of `body`,
  // not a child of it, so the flex layout in PANEL_CSS keeps it pinned to
  // the panel's bottom edge regardless of how far `body` is scrolled. Still
  // inside `panel`, which carries `data-lf-panel` — the hard constraint is
  // about that attribute, not about which direct child holds a row.
  const resetBtn = document.createElement('button');
  resetBtn.className = 'lf-reset';
  resetBtn.textContent = 'Reset to defaults';
  resetBtn.addEventListener('click', () => {
    applyValues(defaults);
    setActiveChip(null);

// frame doesn't fling particles across the canvas. Ported from
// cc-webgl/src/core/FrameScheduler.ts's DT_CLAMP_SECONDS.
const ANIM_DT_CLAMP_SECONDS = 0.1;

function createLoop({ onFrame, speed = 1 }) {
  let running = false;
  let paused = false;
  let lastTime = 0;
  let elapsed = 0;
  let rafId = null;
  let currentSpeed = speed;

  function tick(now) {
    if (!running || paused) return;
    const rawDt = lastTime ? (now - lastTime) / 1000 : 0;
    const clampedDt = Math.min(Math.max(rawDt, 0), ANIM_DT_CLAMP_SECONDS);
    lastTime = now;
    const scaledDt = clampedDt * currentSpeed;
    elapsed += scaledDt;
    onFrame(scaledDt, elapsed);
    rafId = requestAnimationFrame(tick);
  }

  function handleVisibilityChange() {
    if (typeof document === 'undefined') return;
    if (document.hidden) {
      paused = true;
      if (rafId) {
        cancelAnimationFrame(rafId);
        rafId = null;
      }
    } else if (running && paused) {
      paused = false;
      // Reset the sentinel instead of computing a real dt, so resume doesn't
      // produce a giant catch-up frame — same reasoning as start()'s reset.
      lastTime = 0;
      rafId = requestAnimationFrame(tick);
    }
  }

  return {
    start() {
      if (running) return;
      running = true;
      paused = false;
      lastTime = 0;
      if (typeof document !== 'undefined') {
        document.addEventListener('visibilitychange', handleVisibilityChange);
      }
      rafId = requestAnimationFrame(tick);
    },
    stop() {
      running = false;
      paused = false;
      if (rafId) cancelAnimationFrame(rafId);
      rafId = null;

      }

    get isRunning() {
      return running;

// Scanning only the piece script is exactly the hand-maintained-list failure
// this function's own comment already warns about, one level removed: a
// shared module's OWN imports were invisible to it, so a new cross-shared-
// module import survived verbatim into a classic (non-module) inline script.
//
// BFS discovery order is not enough once a shared module reads another
// shared module's binding at TOP LEVEL (module-evaluation time), not just
// inside a function body called later. controls.js is always a piece's
// first import, so BFS always placed it first in the concatenated output —
// fine for `hexToHue` (from color.js), which is only called inside
// `setValue`, deferred to call time. A shared module that reads an imported
// binding at top level instead must have that dependency emitted first.
//
// A post-order DFS guarantees every module's dependencies appear before it
// in the emitted output, independent of whether the consumer reads the
// dependency's binding at top level or lazily inside a function — the
// general fix, not a per-call-site workaround. See
// skills/building-generative-backgrounds/SKILL.md, "Inlining and bundling".
async function inlineSharedModules(pieceScriptSrc) {
  const strippedPieceSrc = pieceScriptSrc.replace(SHARED_IMPORT_RE, '');
  const initial = [...pieceScriptSrc.matchAll(SHARED_IMPORT_RE)].map((m) => m[1]);
  if (!initial.length) {

  const done = new Set();

  async function visit(path) {

    if (!res.ok) throw new Error(`bakeHtml: could not fetch ${path} (${res.status})`);
    const src = await res.text();

    // '../../shared/foo.js' form the piece-level regex produces, so a module
    // reached both ways (e.g. color.js: directly by the piece, and via
    // controls.js) is only ever inlined once.
    const inner = [...src.matchAll(INNER_SHARED_IMPORT_RE)].map((m) => `../../shared/${m[1]}`);

      if (res.stuck) continue;
      const pts = res.pts.map((q) => shape(q[0], q[1]));
      if (res.closed) night.push({ pts: resampleStep(pts, 2.4 / DS), L });
      else if (res.pts[res.pts.length - 1][0] > lim.x1 - 1) lobe.push({ rs: resampleN(pts, P.M), yEnd: pts[pts.length - 1][1] });
    }
    lobe.sort((a, b) => b.yEnd - a.yEnd);                                      // outer lobe first, sheet last
    // conveyor jitter per hemisphere slot: (jitter, brightness)
    const conv = { 1: [], '-1': [] };
    for (const hemi of [1, -1]) for (let k = 0; k < P.nLobe; k++) conv[hemi].push([r(), 0.6 + 0.4 * r()]);
    const rxOne = (q) => ({ u: Math.abs(q() + q() + q() - 1.5) * P.rxU, v: (q() + q() + q() - 1.5) * P.rxV, ph: q(), dir: q() < P.rxEarth ? -1 : 1, sp: 0.4 + q(), a: 0.3 + 0.7 * q() });
    const rx = [];
    for (let i = 0; i < P.nRx; i++) rx.push(rxOne(r));
    // solar wind: straight and undisturbed until it meets the bow shock, then turned to slide (slower) along it
    const b = P.bow, wind = [], xL = WIND_X0, dt = P.windDt;
    const rS = (f) => b * (f < 1e-4 ? 1 : f / Math.sin(f));                 // shock radius at angle f from the sunward axis
    while (wind.length < P.nWind) {
      const y0 = (r() + r() + r() + r() - 2) * P.windSig;                     // a stream aimed at the body, not a sheet
      if (r() > 0.4 + 0.6 * (0.5 + 0.5 * nz(y0 / 9, 0.3))) continue;          // gusty, uneven stream
      const sg = y0 < 0 ? -1 : 1, f0 = Math.max(1e-3, Math.abs(y0) / b);    // the half-body shock satisfies |y| = b * f
      const xh = -b * f0 / Math.tan(f0), pts = [];
      for (let x = xL; x < Math.min(xh, P.windOut[1] + 4); x += dt) pts.push(x, y0);
      const iHit = pts.length / 2, d = (r() - 0.3) * P.rideW;
      if (xh < P.windOut[1]) {
        let f = f0;
        for (let i = 0; i < 3000 && f < Math.PI - 0.3; i++) {
          const rr = rS(f) - d * Math.min(1, i / 10), x = -rr * Math.cos(f);
          if (x > P.windOut[1] + 4) break;
          pts.push(x, sg * rr * Math.sin(f));
          const dsdf = Math.hypot((rS(f + 0.01) - rS(f)) / 0.01, rS(f));
          f += P.rideV * dt / dsdf;
        }
      }
      wind.push({ pts: Float32Array.from(pts), iHit, ph: r(), len: 2 + Math.floor(r() * r() * P.windLen), a: 0.3 + 0.7 * r(), dot: r() < P.windDot });
    }
    for (const hemi of [1, -1]) for (let k = P.nLobe; k < MAX_LOBE; k++) conv[hemi].push([r2(), 0.6 + 0.4 * r2()]);
    for (let i = 0; i < P.nRx; i++) rx.push(rxOne(r2));
    const MX = 4096;
    const nightSel = P.nightLs.map((L) => night.reduce((a, n) => (Math.abs(n.L - L) < Math.abs(a.L - L) ? n : a)));
    return { day, night: nightSel, lobe, conv, rx, wind, X: new Float32Array(MX), Y: new Float32Array(MX), A: new Float32Array(MX) };
  }

  // polyline runs bucketed by (group, alpha level): neighbours stay in separate strokes so 'lighter' still adds
  function RunBuckets(G, NQ, amax) {
    const b = Array.from({ length: G * NQ }, () => []);
    const qOf = (a) => (a <= 0.004 ? -1 : Math.min(NQ - 1, Math.floor(Math.sqrt(a / amax) * NQ)));
    return {
      poly(g, X, Y, A, n) {
        let i = 0;
        while (i < n - 1) {
          const q = qOf(A[i]); let j = i + 1;
          while (j < n - 1 && qOf(A[j]) === q) j++;
          if (q >= 0) { const run = []; for (let k = i; k <= j; k++) run.push(X[k], Y[k]); b[(g % G) * NQ + q].push(run); }
          i = j;
        }
      },
      // Glow: a wider, dimmer underlay under every level bright enough to show
      // (from level 4 up), so it follows the lines' own falloff without bands.
      flush(w, mul, glow = 0) {
        ctx.lineCap = 'butt'; ctx.lineJoin = 'round';
        for (let i = 0; i < b.length; i++) {
          const runs = b[i]; if (!runs.length) continue;
          ctx.beginPath();
          for (const r of runs) { ctx.moveTo(r[0], r[1]); for (let k = 2; k < r.length; k += 2) ctx.lineTo(r[k], r[k + 1]); }
          const a = amax * ((i % NQ + 0.5) / NQ) ** 2 * mul;
          if (glow > 0 && i % NQ >= 4) {
            ctx.lineWidth = w * (3 + 4 * glow); ctx.globalAlpha = Math.min(1, a * 0.13 * glow); ctx.stroke();
          }
          ctx.lineWidth = w; ctx.globalAlpha = Math.min(1, a); ctx.stroke(); runs.length = 0;
        }
        ctx.globalAlpha = 1;
      }
    };
  }

  const S = build();
  const rb = RunBuckets(16, 16, P.amax);

  // SVG capture (filled only while exporting, never per frame)
  let capture = false;
  let paths = [];
  let circles = [];
  const CAP_LINE_A = 0.03;
  const CAP_DOTS = 1500;
  function capRuns(X, Y, A, n) {
    let run = null;
    for (let i = 0; i < n; i++) {
      if (A[i] > CAP_LINE_A) (run ||= []).push([X[i], Y[i]]);
      else if (run) { if (run.length > 1) paths.push(run); run = null; }
    }
    if (run && run.length > 1) paths.push(run);
  }

  const PRESETS = {
    whisper: { opacity: 0.7, stroke: 0.75, density: 0.6, wind: 0.6, scale: 0.9, glow: 0 },
    ink:     { opacity: 1, stroke: 1.6, density: 1.1, wind: 1.2, saturation: 0, glow: 0 },
    neon:    { opacity: 0.95, stroke: 1, density: 1.2, saturation: 0.85, glow: 1.1 },
    drift:   { opacity: 0.85, density: 0.8, speed: 0.4, motion: 1.8, phase: 0.6, scale: 1.25, wind: 0.8 },
    dense:   { opacity: 0.95, stroke: 0.85, density: 2, wind: 1.4, scale: 1.4, glow: 0 },
  };

  const baked = window.__LF_BAKED_VALUES__;
  const panel = baked ? null : createControlPanel({
    pieceId: PIECE_ID,
    presets: PRESETS,
    onChange: () => {},
    extraControls: [
      // Strength and density of the solar-wind stream and its bow shock; at 0
      // only the field remains. It also leans gently on the dayside loops.
      { name: 'wind', label: 'Wind', type: 'range', min: 0, max: 2, step: 0.01, default: 1, category: 'form' },
    ],
    defaults: { hue: 175, hueB: 290, saturation: 0, scale: 1, colorMode: 'gradient', colorA: '#00ffea', colorB: '#d400ff' },
  });
  const currentValues = baked || panel.values;

  let clock = CLOCK0;

  // ---- draw one frame; everything is periodic in P.period ----
  function drawFrame(dt, values) {
    clock += dt * values.speed;
    const W = canvas.width, H = canvas.height, inv = values.invert;
    const ph = ((clock / P.period + values.phase * 0.5) % 1 + 1) % 1;

    // Model -> design frame (the 1280x800 composition, fitted to the canvas)
    // -> screen (Scale and Angle about the canvas centre), folded into one affine.
    const s = DS * Math.min(W / DW, H / DH), ca = Math.cos(P.tilt), sa = Math.sin(P.tilt);
    const k = 0.4 + 0.5 * values.scale + 0.1 * values.scale * values.scale;   // 0.4 contained .. 1 prototype .. 1.8 bleeding
    const an = values.angle * Math.PI / 180, cA = Math.cos(an) * k, sA = Math.sin(an) * k;
    const dx0 = DCX * W - W / 2, dy0 = DCY * H - H / 2;
    const ax = s * (cA * ca + sA * sa), bx = s * (sA * ca - cA * sa), ex = W / 2 + cA * dx0 - sA * dy0;
    const ay = s * (sA * ca - cA * sa), by = -s * (sA * sa + cA * ca), ey = H / 2 + sA * dx0 + cA * dy0;
    const mapX = (x, y) => ax * x + bx * y + ex, mapY = (x, y) => ay * x + by * y + ey;
    // Soft canvas edges: the tail fades off the frame, the wind fades in.
    const vig = (Xp, Yp, l) => sstep(0, l, Xp) * (1 - sstep(W - 40, W, Xp)) * sstep(0, 40, Yp) * (1 - sstep(H - 40, H, Yp));
    const tailEnd = (x) => 1 - sstep(P.tailA, P.tailB, x);                   // the traced tail's own end, seen at low Scale
    const windStart = 1 - sstep(0.75, 1, k);                                  // ditto for the wind's upstream end

    // ink
    // Saturated stops drop a little lightness so 'lighter' doesn't wash them to white.
    const L = inv ? 0.12 : 0.9 - 0.25 * values.saturation;
    let paint;
    if (values.saturation > 0) {
      paint = ctx.createLinearGradient(mapX(-15, 0), mapY(-15, 0), mapX(70, 0), mapY(70, 0));
      for (let i = 0; i <= 4; i++) {
        const { h, s: sat } = paletteHsl(values, i / 4);
        const [r, g, b] = hslToRgb(h, sat, L);
        paint.addColorStop(i / 4, `rgb(${r},${g},${b})`);
      }
    } else {
      const [r, g, b] = hslToRgb(values.hue, 0, L);
      paint = `rgb(${r},${g},${b})`;
    }
    const op = values.opacity;
    const sw = 0.3 + 0.7 * values.stroke;
    const glowAmt = inv ? 0 : values.glow;

    ctx.globalCompositeOperation = 'source-over'; ctx.globalAlpha = 1;
    ctx.fillStyle = inv ? '#f2f2f4' : '#0a0a0d'; ctx.fillRect(0, 0, W, H);
    ctx.globalCompositeOperation = inv ? 'source-over' : 'lighter';
    ctx.strokeStyle = paint; ctx.fillStyle = paint;

    const mo = values.motion, burst = Math.min(0.95, P.burst * mo);
    const press = 0.5 - 0.5 * Math.cos(TAU * ph);                            // dayside breathing
    const g = ph + (burst / TAU) * Math.sin(TAU * ph);                        // conveyor phase: bursty, loops at P
    const flareRaw = Math.pow((1 + burst * Math.cos(TAU * ph)) / (1 + burst), 2);
    const flare = mo >= 1 ? flareRaw : 0.45 + (flareRaw - 0.45) * mo;
    const breath = P.breath * mo, flap = P.flap * mo;
    const wv = values.wind, push = P.windPush * (wv - 1);
    const X = S.X, Y = S.Y, A = S.A, xX = P.F.xX;
    let wx = 0, wy = 0, wr = 0;
    const warp = (x, y) => {
      wr = Math.hypot(x, y);
      if (x < 0) { const f = 1 - (breath * press + push) * sstep(2, 9, wr) * (-x / wr); x *= f; y *= f; }
      else y += flap * sstep(6, 40, x) * Math.sin(TAU * ph * P.flapN - x / P.flapK) / (1 + (y / P.flapY) ** 2);
      wx = x; wy = y;
    };
    const rxGlow = (x, y) => 1 + P.rxBoost * (0.3 + 0.7 * flare) * gauss(x - xX, P.rxW) * gauss(y, P.rxH);
    let gi = 0;
    const dip = P.dip * mo * (flare - 0.3);
    const emit = (pts, aBase, contract) => {
      let n = 0;
      for (let i = 0; i < pts.length; i++) {
        let x0 = pts[i][0];
        const tip = contract ? 1 - 0.75 * sstep(14, 27, x0) : 1;             // far tips dissolve into the sheet
        if (contract && x0 > 0) x0 *= 1 - dip * sstep(6, 30, x0);             // stretched loops snap earthward in the burst
        warp(x0, pts[i][1]);
        X[n] = mapX(wx, wy); Y[n] = mapY(wx, wy);
        A[n] = aBase * tip * sstep(P.f0, P.f1, wr) * rxGlow(wx, wy) * vig(X[n], Y[n], 80); n++;
      }
      rb.poly(gi++, X, Y, A, n);
      if (capture) capRuns(X, Y, A, n);
    };
    for (const d of S.day) emit(d.pts, P.dayA * sstep(P.Lmin, P.Lmin + 8, d.L), false);
    for (const d of S.night) emit(d.pts, P.nightA * sstep(P.Lmin, P.Lmin + 8, d.L), true);
    const LB = S.lobe, nL = LB.length, M = P.M;
    const nConv = Math.max(4, Math.min(MAX_LOBE, Math.round(P.nLobe * values.density)));
    for (const hemi of [1, -1]) {
      const pool = S.conv[hemi];
      for (let c = 0; c < nConv; c++) {
        const u0 = (c + (pool[c][0] - 0.5) * P.jit) / nConv + (hemi < 0 ? 0.37 : 0), ca0 = pool[c][1];
        const v = ((u0 + g) % 1 + 1) % 1, jf = v * (nL - 1), j = Math.min(nL - 2, Math.floor(jf)), f = jf - j;
        const a0 = LB[j].rs, a1 = LB[j + 1].rs;
        const aB = P.lobeA * ca0 * sstep(0, P.fadeIn, v) * (1 + P.sheetBoost * v * v), out = 1 - sstep(1 - P.fadeOut, 1, v), endV = 1 - sstep(0.97, 1, v);
        for (let m = 0; m < M; m++) {
          warp(a0[2 * m] + (a1[2 * m] - a0[2 * m]) * f, (a0[2 * m + 1] + (a1[2 * m + 1] - a0[2 * m + 1]) * f) * hemi);
          X[m] = mapX(wx, wy); Y[m] = mapY(wx, wy);
          const gx = gauss(wx - xX, P.rxW * 1.3);                             // arriving lines stay lit only at the X
          A[m] = aB * (out + (endV - out) * gx) * sstep(P.f0 * 1.6, P.f1 * 1.6, wr) * rxGlow(wx, wy) * vig(X[m], Y[m], 80) * tailEnd(wx);
        }
        rb.poly(gi++, X, Y, A, M);
        if (capture) capRuns(X, Y, A, M);
      }
    }
    rb.flush(P.lw * sw, op, glowAmt);
    // reconnection stipple: fine dots jetting both ways along the sheet from the X, flaring with the burst
    const nRx = Math.max(200, Math.min(S.rx.length, Math.round(P.nRx * values.density))), hd = 0.5 * sw;
    for (let q = 0; q < nRx; q++) {
      const p = S.rx[q], age = (ph * P.rxN + p.ph) % 1;
      const x = xX + p.dir * (p.u + age * P.rxRun * p.sp);
      warp(x, p.v * (1 + 0.8 * age) * (1 - 0.55 * waist(x)));
      const a = p.a * P.rxA * (0.25 + 0.75 * flare) * Math.sin(Math.PI * age) ** 2 * ((wx > xX ? P.rxFloorT : P.rxFloor) + gauss(wx - xX, P.rxSpread)) * sstep(10, 22, wx) * tailEnd(wx);
      const Xp = mapX(wx, wy), Yp = mapY(wx, wy);
      X[0] = Xp - hd; Y[0] = Yp; X[1] = Xp + hd; Y[1] = Yp; A[0] = a * vig(Xp, Yp, 80); rb.poly(q, X, Y, A, 2);
    }
    rb.flush(1.0 * sw, op);
    // solar wind: Wind thins it by prefix below 1, reuses paths at other phases above 1
    const wc = wv <= 1 ? wv : 1 + 0.6 * (wv - 1);
    const wa = Math.sqrt(Math.min(1, wv)) * (1 + 0.35 * Math.max(0, wv - 1));
    const nWp = S.wind.length, nW = Math.round(nWp * values.density * wc);
    const dotH = 0.6 * sw;
    for (let q = 0; q < nW; q++) {
      const w = S.wind[q % nWp], rep = (q / nWp) | 0;
      const fr = (ph * P.windN + w.ph + 0.618034 * rep) % 1, i = Math.floor(fr * P.windTw / P.windDt);
      if (i >= w.pts.length / 2) continue;
      const x = w.pts[2 * i], y = w.pts[2 * i + 1], Xp = mapX(x, y), Yp = mapY(x, y);
      let a = w.a * P.windA * wa * vig(Xp, Yp, 80) * (1 - sstep(0.85, 1, fr)) * (1 - sstep(P.windOut[0], P.windOut[1], x));
      if (windStart > 0) a *= 1 - windStart * (1 - sstep(WIND_X0, WIND_X0 + 14, x));
      const ride = i >= w.iHit;
      if (ride) {                                                             // deflected: brighter, then fading down the wings
        const f = Math.PI - Math.abs(Math.atan2(y, x));
        a *= (P.rideA + P.flash * Math.exp(-(i - w.iHit) * P.windDt / P.flashT)) * gauss(f, P.wingW);
      }
      if (a <= 0.004) continue;
      if (w.dot) { X[0] = Xp - dotH; X[1] = Xp + dotH; Y[0] = Y[1] = Yp; }
      else { const j = Math.max(0, i - w.len); X[0] = mapX(w.pts[2 * j], w.pts[2 * j + 1]); Y[0] = mapY(w.pts[2 * j], w.pts[2 * j + 1]); X[1] = Xp; Y[1] = Yp; }
      A[0] = a; rb.poly(q, X, Y, A, 2);
      if (capture && ride && a > 0.02 && circles.length < CAP_DOTS) {
        circles.push({ cx: Xp, cy: Yp, r: 0.6 * sw, fill: 'black', opacity: Math.min(1, 3 * a * op) });
      }
    }
    rb.flush(0.6 * sw, op);
    // bow shock: barely there, fading along its wings
    const bowA = P.bowA * Math.min(1, wv) * (1 + 0.35 * Math.max(0, wv - 1));
    if (bowA > 0) {
      let n = 0;
      for (let i = 0; i <= 120; i++) {
        const dth = (i / 120 * 2 - 1) * 1.9, ad = Math.abs(dth), rr = P.bow * (ad < 1e-4 ? 1 : ad / Math.sin(ad));
        const x = -Math.cos(ad) * rr, y = Math.sign(dth) * Math.sin(ad) * rr;
        X[n] = mapX(x, y); Y[n] = mapY(x, y); A[n] = bowA * gauss(ad, 0.6); n++;
      }
      rb.poly(0, X, Y, A, n); rb.flush(0.6 * sw, op);
    }
    // the body: tiny and quiet
    ctx.globalAlpha = 0.5 * op;
    ctx.beginPath(); ctx.arc(mapX(0, 0), mapY(0, 0), 1.6 * Math.sqrt(k), 0, TAU); ctx.fill();
    ctx.globalAlpha = 1;
    ctx.globalCompositeOperation = 'source-over';
  }

  const loop = createLoop({
    onFrame(dt) {
      drawFrame(dt, currentValues);
    },
  });
  loop.start();

  // Re-render the current frame (no clock advance) with capture on, then export.
  function exportCurrentSvg() {
    paths = []; circles = []; capture = true;
    try { drawFrame(0, currentValues); } finally { capture = false; }
    exportSvg(paths, { width: canvas.width, height: canvas.height, circles });
  }

  document.getElementById('btn-png-2x')?.addEventListener('click', () => exportPng(canvas, { multiplier: 2 }));
  document.getElementById('btn-png-4x')?.addEventListener('click', () => exportPng(canvas, { multiplier: 4 }));
  document.getElementById('btn-svg')?.addEventListener('click', exportCurrentSvg);
  document.getElementById('btn-baked')?.addEventListener('click', () => {
    bakeHtml({ sourceHtml: document.documentElement.outerHTML, values: panel.values }).catch((err) => console.error('bakeHtml failed', err));
  });
  document.getElementById('btn-source')?.addEventListener('click', () => {
    exportSource().catch((err) => console.error('exportSource failed', err));
  });
  document.getElementById('btn-prompt')?.addEventListener('click', () => {
    describeForAI({ pieceName: PIECE_ID, values: panel.values });
  });
</script></body></html>
