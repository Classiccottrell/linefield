function kindOf(spec) {

function createControlPanel({ pieceId, onChange, extraControls = [], defaults: defaultOverrides = {}, presets = {} }) {

  // of its defaults. Under this flag we neither read nor write it. A piece

  }

  // resolved default, keeping the rendered select and values in sync.

  // Mobile-sheet collapse is a separate, unpersisted flag: it starts
  // collapsed every load (handle-only, per the brief) and is scoped to the

  // affected by) the desktop `collapsed` state above.

function createLoop({ onFrame, speed = 1 }) {

  let paused = false;
  let lastTime = 0;
  let elapsed = 0;
  let rafId = null;
  let currentSpeed = speed;

  function tick(now) {
    if (!running || paused) return;
    const rawDt = lastTime ? (now - lastTime) / 1000 : 0;
    const clampedDt = Math.min(Math.max(rawDt, 0), ANIM_DT_CLAMP_SECONDS);

    if (typeof document === 'undefined') return;
    if (document.hidden) {

      if (rafId) {

        rafId = null;
      }

      // produce a giant catch-up frame — same reasoning as start()'s reset.
      lastTime = 0;
      rafId = requestAnimationFrame(tick);
    }
  }

  return {
    start() {
      if (running) return;
      running = true;
      paused = false;
      lastTime = 0;
      if (typeof document !== 'undefined') {
        document.addEventListener('visibilitychange', handleVisibilityChange);
      }
      rafId = requestAnimationFrame(tick);
    },
    stop() {
      running = false;
      paused = false;

// list is a silent-failure surface: omit an entry and the baked file is
// valid, loads without error, and renders nothing. That shipped once.
const SHARED_IMPORT_RE =

// Scanning only the piece script is exactly the hand-maintained-list failure
// this function's own comment already warns about, one level removed: a
// shared module's OWN imports were invisible to it, so a new cross-shared-
// module import survived verbatim into a classic (non-module) inline script.
//
// BFS discovery order is not enough once a shared module reads another
// shared module's binding at TOP LEVEL (module-evaluation time), not just
// inside a function body called later. controls.js is always a piece's
// first import, so BFS always placed it first in the concatenated output —
// fine for `hexToHue` (from color.js), which is only called inside
// `setValue`, deferred to call time. A shared module that reads an imported
// binding at top level instead must have that dependency emitted first.
//
// A post-order DFS guarantees every module's dependencies appear before it
// in the emitted output, independent of whether the consumer reads the
// dependency's binding at top level or lazily inside a function — the
// general fix, not a per-call-site workaround. See
// skills/building-generative-backgrounds/SKILL.md, "Inlining and bundling".
async function inlineSharedModules(pieceScriptSrc) {
  const strippedPieceSrc = pieceScriptSrc.replace(SHARED_IMPORT_RE, '');
  const initial = [...pieceScriptSrc.matchAll(SHARED_IMPORT_RE)].map((m) => m[1]);
  if (!initial.length) {
    throw new Error('bakeHtml: the piece imports no shared modules — refusing to bake a file that would render blank');
  }

  const srcByPath = new Map();
  const order = []; // post-order: a module's dependencies land before it
  const done = new Set();
  const visiting = new Set(); // cycle guard — a real cycle would recurse forever otherwise

  async function visit(path) {
    if (done.has(path)) return;
    if (visiting.has(path)) {
      throw new Error(`bakeHtml: circular shared-module import detected at ${path}`);
    }
    visiting.add(path);
    const res = await fetch(path);
    if (!res.ok) throw new Error(`bakeHtml: could not fetch ${path} (${res.status})`);
    const src = await res.text();
    srcByPath.set(path, src);
    // Normalise './foo.js' found INSIDE a shared module to the same
    // '../../shared/foo.js' form the piece-level regex produces, so a module
    // reached both ways (e.g. color.js: directly by the piece, and via
    // controls.js) is only ever inlined once.
    const inner = [...src.matchAll(INNER_SHARED_IMPORT_RE)].map((m) => `../../shared/${m[1]}`);

    visiting.delete(path);
    done.add(path);
    order.push(path);

    const src = srcByPath.get(path);

  });

}

      wedgeJ = delta * sigma * toB;
    }
    const xf = cells.map((cell, i) => {
      const [sx, sy] = seeds[i];
      const pa = sx * ca + sy * sa;
      const pb = -sx * sa + sy * ca;
      let dx = (pa * e1) * ca - (pb * e2) * sa;
      let dy = (pa * e1) * sa + (pb * e2) * ca;
      if (anchor) {
        const rx = sx - anchor.mx, ry = sy - anchor.my;
        const across = rx * nax + ry * nay;
        const along = rx * anchor.ex + ry * anchor.ey;
        const f = push * Math.tanh(across / tau) * Math.exp(-((along / lam) ** 2));
        dx += f * nax; dy += f * nay;
      }
      const p = POOL[i];
      // A little life of its own: a small wander and a slight turn.
      const wob = Math.sin((clock / BREATH_PERIOD) * Math.PI * 2 * 0.6 + p.ph);
      const jit = unit * 0.0016 * values.motion * wob;
      let rot = (p.rot * (0.6 * amt + 0.2 * values.motion * wob) * Math.PI) / 180;
      if (anchor && i === anchor.i) rot += wedgeI * amt;
      if (anchor && i === anchor.j) rot += wedgeJ * amt;
      return {
        cx: cell.c[0], cy: cell.c[1],
        cos: Math.cos(rot), sin: Math.sin(rot),
        dx: dx * amt + p.jx * jit, dy: dy * amt + p.jy * jit,
      };
    });
    const T = (t, x, y) => [
      t.cx + t.cos * (x - t.cx) - t.sin * (y - t.cy) + t.dx,
      t.cy + t.sin * (x - t.cx) + t.cos * (y - t.cy) + t.dy,
    ];

    // How far apart two shards have drifted at a point of their shared edge,
    // measured across that edge. Negative (a touch of overlap) reads as shut.
    const opening = (i, j, x, y) => {
      const a = T(xf[i], x, y), b = T(xf[j], x, y);
      const si = seeds[i], sj = seeds[j];
      const l = Math.hypot(sj[0] - si[0], sj[1] - si[1]) || 1;
      return Math.max(0, ((b[0] - a[0]) * (sj[0] - si[0]) + (b[1] - a[1]) * (sj[1] - si[1])) / l);
    };
    const oRef = unit * 0.01;
    const lit = (o) => 1 - Math.exp(-o / oRef);
    // Seam light keeps growing past `lit`'s knee, so the widest crack is
    // also the brightest one rather than tying with every open crack.
    const gain = (o) => Math.min(1.7, (o / (oRef * 1.2)) ** 0.8);

    // buckets[band * LEVELS + level] collects segments drawn at that alpha
    // and colour, so each costs one stroke however many feed it.
    const buckets = Array.from({ length: BANDS * LEVELS }, () => []);
    const seams = [];
    // Alpha past the top bucket is laid down again, so under `lighter` it
    // keeps adding light instead of clipping at one stroke's worth.
    const put = (alpha, band, x0, y0, x1, y1) => {
      while (alpha > 0) {
        const lv = Math.min(LEVELS, Math.round((Math.min(alpha, A_TOP) / A_TOP) * LEVELS));
        if (lv <= 0) return;
        buckets[band * LEVELS + lv - 1].push(x0, y0, x1, y1);
        alpha -= A_TOP;
      }
    };
    const bandOf = (x) => Math.max(0, Math.min(BANDS - 1, Math.floor(((x + hw) / (2 * hw)) * BANDS)));

    const spacing = Math.max(5, Math.min(34, (unit * 0.0135) / values.density));
    const offset = 0.37 * spacing;
    const BASE = 0.5;   // a line's alpha away from any crack
    const RAMP = 0.5;   // each of the three stacked layers at a crack
    const SEAM = 1;      // a seam line at the middle of a fully open crack

    for (let i = 0; i < n; i++) {
      const { pts, labs } = cells[i];
      if (pts.length < 3) continue;
      const t = xf[i];
      let lo = Infinity, hi = -Infinity;
      for (const p of pts) {
        const q = p[0] * kx + p[1] * ky;
        lo = Math.min(lo, q); hi = Math.max(hi, q);
      }
      const m0 = Math.ceil((lo - offset) / spacing);
      const m1 = Math.floor((hi - offset) / spacing);
      for (let m = m0; m <= m1; m++) {
        const o = offset + m * spacing;
        const hits = [];
        for (let k = 0; k < pts.length; k++) {
          const a = pts[k], b = pts[(k + 1) % pts.length];
          const fa = a[0] * kx + a[1] * ky - o;
          const fb = b[0] * kx + b[1] * ky - o;
          if ((fa < 0) === (fb < 0)) continue;
          const u = fa / (fa - fb);
          const x = a[0] + (b[0] - a[0]) * u, y = a[1] + (b[1] - a[1]) * u;
          const ex = b[0] - a[0], ey = b[1] - a[1];
          const steep = Math.abs(ex * hy - ey * hx) / (Math.hypot(ex, ey) || 1);
          hits.push({ x, y, s: x * hx + y * hy, lab: labs[k], steep });
        }
        if (hits.length < 2) continue;
        hits.sort((p, q) => p.s - q.s);
        const h0 = hits[0], h1 = hits[hits.length - 1];
        const len = h1.s - h0.s;
        if (len < 0.5) continue;
        const [x0, y0] = T(t, h0.x, h0.y);
        const [x1, y1] = T(t, h1.x, h1.y);
        const band = bandOf((h0.x + h1.x) / 2);
        put(BASE, band, x0, y0, x1, y1);
        paths.push([[cx + x0, cy + y0], [cx + x1, cy + y1]]);

        // Brighten toward each end that meets a crack, by how far that crack
        // has opened there: three stacked layers at lengths L, L/2, L/4.
        for (const [h, sx, sy, ex, ey] of [[h0, x0, y0, x1, y1], [h1, x1, y1, x0, y0]]) {
          if (h.lab < 0) continue;
          const op = opening(i, h.lab, h.x, h.y);
          const b = 0.3 + 0.7 * lit(op);
          const D = unit * 0.014 + 1.2 * op;
          let L = Math.min(len, D / Math.max(0.5, h.steep));
          for (let r = 0; r < 3; r++, L *= 0.5) {
            const f = L / len;
            put(RAMP * b, band, sx, sy, sx + (ex - sx) * f, sy + (ey - sy) * f);
          }
        }
      }
    }

    // The cracks themselves: hairlines laid along the gap between the two
    // facing edges, packed tighter than a line's width so they add up into a
    // seam of light, brightest at its middle and where the crack has opened
    // widest. Each runs in short pieces so its alpha can follow the gap,
    // which is how the anchor's wedge is bright at its mouth, not its tip.
    const SUB = 10;
    // No other crack may outshine the anchor, whatever the layout.
    let cap = Infinity;
    if (anchor) {
      const g = Math.max(opening(anchor.i, anchor.j, anchor.ax, anchor.ay), opening(anchor.i, anchor.j, anchor.bx, anchor.by));
      cap = 0.6 * gain(g);
    }
    for (let i = 0; i < n; i++) {
      const { pts, labs } = cells[i];
      for (let k = 0; k < pts.length; k++) {
        const j = labs[k];
        if (j <= i) continue;
        const a = pts[k], b = pts[(k + 1) % pts.length];
        if (Math.hypot(b[0] - a[0], b[1] - a[1]) < 2) continue;
        const g0 = opening(i, j, a[0], a[1]);
        const g1 = opening(i, j, b[0], b[1]);
        const gMax = Math.max(g0, g1);
        if (lit(gMax) < 0.03) continue;
        const isAnchor = anchor && anchor.i === i && anchor.j === j;
        const A0 = T(xf[i], a[0], a[1]), A1 = T(xf[i], b[0], b[1]);
        const B0 = T(xf[j], a[0], a[1]), B1 = T(xf[j], b[0], b[1]);
        const count = Math.max(2, Math.min(36, Math.ceil(gMax / 0.7) + 1));
        const band = bandOf((a[0] + b[0]) / 2);
        const every = Math.max(1, Math.floor(count / 4));
        for (let q = 0; q < count; q++) {
          const f = q / (count - 1);
          const prof = 1 - 0.7 * Math.abs(2 * f - 1);
          const x0 = A0[0] + (B0[0] - A0[0]) * f, y0 = A0[1] + (B0[1] - A0[1]) * f;
          const x1 = A1[0] + (B1[0] - A1[0]) * f, y1 = A1[1] + (B1[1] - A1[1]) * f;
          for (let u = 0; u < SUB; u++) {
            const g = g0 + (g1 - g0) * ((u + 0.5) / SUB);
            const gn = isAnchor ? gain(g) : Math.min(cap, gain(g));
            const alpha = SEAM * gn * prof * Math.min(1, g / (count - 1) / 0.7);
            const fa = u / SUB, fb = (u + 1) / SUB;
            put(alpha, band, x0 + (x1 - x0) * fa, y0 + (y1 - y0) * fa, x0 + (x1 - x0) * fb, y0 + (y1 - y0) * fb);
          }
          seams.push([x0, y0, x1, y1, lit(gMax) * prof, band]);
          if (q % every === 0 || q === count - 1) paths.push([[cx + x0, cy + y0], [cx + x1, cy + y1]]);
        }
      }
    }

    const light = values.invert ? 0.12 : 0.86 - 0.24 * values.saturation;
    const lineWidth = 0.3 + 0.45 * values.stroke;
    const inkAlpha = values.opacity * (values.invert ? 0.85 : 1);
    const rgb = [];
    for (let bd = 0; bd < BANDS; bd++) {
      const { h, s } = paletteHsl(values, (bd + 0.5) / BANDS);
      rgb.push(hslToRgb(h, s, light));
    }
    // Additive on the dark ground so stacked layers brighten on their own;
    // plain alpha on the light (inverted) ground, where `lighter` would clip.
    ctx.globalCompositeOperation = values.invert ? 'source-over' : 'lighter';
    ctx.lineCap = 'butt'; // round caps stack into bright beads under `lighter`

    // Glow, off by default: a wide dim underlay along the open cracks.
    if (values.glow > 0) {
      // Batched per colour band and brightness step, like the main strokes.
      const GL = 6;
      const glowB = Array.from({ length: BANDS * GL }, () => []);
      for (const [x0, y0, x1, y1, br, bd] of seams) {
        const lv = Math.min(GL - 1, Math.floor(br * GL));
        glowB[bd * GL + lv].push(x0, y0, x1, y1);
      }
      ctx.lineWidth = lineWidth + values.glow * 3;
      for (let bd = 0; bd < BANDS; bd++) {
        const [r, g, b] = rgb[bd];
        for (let lv = 0; lv < GL; lv++) {
          const segs = glowB[bd * GL + lv];
          if (!segs.length) continue;
          ctx.beginPath();
          for (let q = 0; q < segs.length; q += 4) {
            ctx.moveTo(cx + segs[q], cy + segs[q + 1]);
            ctx.lineTo(cx + segs[q + 2], cy + segs[q + 3]);
          }
          ctx.strokeStyle = `rgba(${r},${g},${b},${Math.min(1, 0.025 * values.glow * ((lv + 0.5) / GL) * inkAlpha)})`;
          ctx.stroke();
        }
      }
    }

    ctx.lineWidth = lineWidth;
    for (let bd = 0; bd < BANDS; bd++) {
      const [r, g, b] = rgb[bd];
      for (let lv = 0; lv < LEVELS; lv++) {
        const segs = buckets[bd * LEVELS + lv];
        if (!segs.length) continue;
        ctx.beginPath();
        for (let q = 0; q < segs.length; q += 4) {
          ctx.moveTo(cx + segs[q], cy + segs[q + 1]);
          ctx.lineTo(cx + segs[q + 2], cy + segs[q + 3]);
        }
        ctx.strokeStyle = `rgba(${r},${g},${b},${Math.min(1, (A_TOP * (lv + 1) / LEVELS) * inkAlpha)})`;
        ctx.stroke();
      }
    }

    // ...and a soft bloom on the anchor crack.
    if (values.glow > 0 && anchor) {
      const p = T(xf[anchor.i], anchor.mx, anchor.my);
      const q = T(xf[anchor.j], anchor.mx, anchor.my);
      const gx = cx + (p[0] + q[0]) / 2, gy = cy + (p[1] + q[1]) / 2;
      const [r, g, b] = rgb[bandOf(anchor.mx)];
      const gr = unit * 0.07 * (0.6 + 0.4 * values.glow) * zoom;
      const grad = ctx.createRadialGradient(gx, gy, 0, gx, gy, gr);
      grad.addColorStop(0, `rgba(${r},${g},${b},${Math.min(1, 0.22 * values.glow * inkAlpha)})`);
      grad.addColorStop(1, `rgba(${r},${g},${b},0)`);
      ctx.fillStyle = grad;
      ctx.fillRect(gx - gr, gy - gr, gr * 2, gr * 2);
    }
    ctx.globalCompositeOperation = 'source-over';
  }

  const loop = createLoop({
    onFrame(dt, elapsed) {
      drawFrame(dt, elapsed, currentValues);
    },
  });
  loop.start();

  document.getElementById('btn-png-2x')?.addEventListener('click', () => exportPng(canvas, { multiplier: 2 }));
  document.getElementById('btn-png-4x')?.addEventListener('click', () => exportPng(canvas, { multiplier: 4 }));
  document.getElementById('btn-svg')?.addEventListener('click', () => exportSvg(paths, { width: canvas.width, height: canvas.height }));
  document.getElementById('btn-baked')?.addEventListener('click', () => {
    bakeHtml({ sourceHtml: document.documentElement.outerHTML, values: panel.values })
      .catch((err) => console.error('bakeHtml failed', err));
  });
  document.getElementById('btn-source')?.addEventListener('click', () => {
    exportSource().catch((err) => console.error('exportSource failed', err));
  });
  document.getElementById('btn-prompt')?.addEventListener('click', () => {
    describeForAI({ pieceName: PIECE_ID, values: panel.values });
  });
</script></body></html>
