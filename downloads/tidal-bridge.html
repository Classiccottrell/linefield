<!--
  tidal-bridge — a torn, C-shaped stream of stippled stars arcing between two
  galaxies that sit off-frame, with smaller knots condensing along it, a torn
  neck, a short fork and faint debris feathers peeling off its outer side.

  Anchor: the lumpy knot mid-stream, just right of centre. It rides the
  stream's slow breathing and swells and settles a little on the 20 s loop
  while stars flow through it. Scale and Angle carry it about the frame's
  centre.
  Text-safe zone: the top-left, inside the arc's bow. It narrows as Scale
  rises.

  Technique (the stipple material): about 175k stars are precomputed once in
  a fixed 1280x800 design space, and rebuilt only when Density or Tear
  changes. Each star lives on a frac(phase) cycle and fades in and out at its
  ends, so the loop is seamless. Per frame one affine (fit x Scale x Angle,
  about the centre) maps them to the screen, where they splat into a float
  luminance buffer. A soft-knee tone curve then writes opaque pixels, so the
  anchor never flattens to a white disc and the faint halo still reads.

  Controls: Stroke sets the star dot size, Density the star count, and Tear
  how far the stream is torn and clumped (low: a smooth, continuous stream;
  high: a ragged one with a second tear and stronger knots).

  SVG export: the piece has no line geometry, and its stars can't go into an
  SVG whole. The SVG carries a capped, representative sample of the current
  frame (at most 20,000 stars) as <circle>s in screen space, with Angle
  applied, each circle's opacity scaled by the sampling stride. Use PNG for
  the full stipple.
-->

const ANIM_DT_CLAMP_SECONDS = 0.1;

function createLoop({ onFrame, speed = 1 }) {

  let paused = false;
  let lastTime = 0;
  let elapsed = 0;
  let rafId = null;
  let currentSpeed = speed;

  function tick(now) {
    if (!running || paused) return;
    const rawDt = lastTime ? (now - lastTime) / 1000 : 0;
    const clampedDt = Math.min(Math.max(rawDt, 0), ANIM_DT_CLAMP_SECONDS);
    lastTime = now;
    const scaledDt = clampedDt * currentSpeed;
    elapsed += scaledDt;

    rafId = requestAnimationFrame(tick);

    if (typeof document === 'undefined') return;
    if (document.hidden) {
      paused = true;
      if (rafId) {
        cancelAnimationFrame(rafId);
        rafId = null;
      }

      paused = false;
      // Reset the sentinel instead of computing a real dt, so resume doesn't
      // produce a giant catch-up frame — same reasoning as start()'s reset.
      lastTime = 0;
      rafId = requestAnimationFrame(tick);
    }
  }

  return {
    start() {
      if (running) return;
      running = true;
      paused = false;
      lastTime = 0;
      if (typeof document !== 'undefined') {
        document.addEventListener('visibilitychange', handleVisibilityChange);
      }
      rafId = requestAnimationFrame(tick);
    },
    stop() {
      running = false;
      paused = false;

// module import survived verbatim into a classic (non-module) inline script.

// inside a function body called later. controls.js is always a piece's
// first import, so BFS always placed it first in the concatenated output —

// `setValue`, deferred to call time. A shared module that reads an imported
// binding at top level instead must have that dependency emitted first.
//
// A post-order DFS guarantees every module's dependencies appear before it
// in the emitted output, independent of whether the consumer reads the
// dependency's binding at top level or lazily inside a function — the
// general fix, not a per-call-site workaround. See
// skills/building-generative-backgrounds/SKILL.md, "Inlining and bundling".
async function inlineSharedModules(pieceScriptSrc) {

    const inner = [...src.matchAll(INNER_SHARED_IMPORT_RE)].map((m) => `../../shared/${m[1]}`);

      }
    }
    for (let pass = 0; pass < 2; pass++) {
      for (let y = 0; y < gh; y++) for (let x = 0; x < gw; x++) {
        let s = 0, c = 0;
        for (let dy = -1; dy <= 1; dy++) for (let dx = -1; dx <= 1; dx++) {
          const xx = x + dx, yy = y + dy;
          if (xx < 0 || yy < 0 || xx >= gw || yy >= gh) continue;
          s += glowBuf[yy * gw + xx]; c++;
        }
        glowTmp[y * gw + x] = s / c;
      }
      glowBuf.set(glowTmp);
    }
    const flat = values.saturation === 0 || values.colorMode === 'solid';
    const { gx, gy, g0 } = gradientRamp();
    const gain = values.glow * 0.9 / (GLOW_CELL * GLOW_CELL);
    for (let y = 0; y < gh; y++) for (let x = 0; x < gw; x++) {
      const j = y * gw + x;
      const al = Math.min(1, glowBuf[j] * gain);
      if (al < 0.004) { glowPx[j] = 0; continue; }
      let bk = 0;
      if (!flat) {
        const fb = g0 + gx * (x + 0.5) * GLOW_CELL + gy * (y + 0.5) * GLOW_CELL;
        bk = fb < 0 ? 0 : fb >= HB - 1 ? HB - 1 : fb | 0;
      }
      const ink = inkRgb[bk];
      glowPx[j] = pack(ink[0], ink[1], ink[2], Math.round(al * 255));
    }
    glowCtx.putImageData(glowImg, 0, 0);
    ctx.save();
    ctx.globalCompositeOperation = values.invert ? 'source-over' : 'lighter';
    ctx.imageSmoothingEnabled = true;
    ctx.drawImage(glowCanvas, 0, 0, gw * GLOW_CELL, gh * GLOW_CELL);
    ctx.restore();
  }

  let clock = 0;
  function drawFrame(dt, values) {
    clock += dt * values.speed;
    ensureBridge(values);
    buildPalette(values);
    layout(values, clock);
    splat();
    composite(values);
    drawGlow(values);
  }

  // A capped, representative sample of the current frame, as circles.
  function svgCircles(values) {
    const b = bridge, n = b.n;
    const { ph, mot, vsc, aMul, w } = frame;
    const stride = Math.max(1, Math.ceil(n / SVG_CAP));
    const flat = values.saturation === 0 || values.colorMode === 'solid';
    const { gx, gy, g0 } = gradientRamp();
    const hex = inkRgb.map(([r, g, bl]) => `#${[r, g, bl].map((c) => c.toString(16).padStart(2, '0')).join('')}`);
    const out = [];
    for (let p = 0; p < n; p += stride) {
      const life = frac(ph * b.MM[p] + b.PH[p]);
      let f = life < 0.22 ? life / 0.22 : life > 0.78 ? (1 - life) / 0.22 : 1;
      f = f * f * (3 - 2 * f);
      const t = (life - 0.5) * mot;
      let fi = (b.S[p] + b.DS[p] * t) * (N - 1);
      if (fi < 0) fi = 0; else if (fi > N - 1.001) fi = N - 1.001;
      const i = fi | 0, fr = fi - i;
      const a = b.A0[p] * f * aMul * EF[i] * stride * 0.5;
      if (a < 0.02) continue;
      let u = b.U0[p] + b.DU[p] * t, v = b.V0[p] + b.DV[p] * t;
      const kn = b.KN[p];
      if (kn >= 0) { u *= ks[kn]; v = b.kv0[kn] + (v - b.kv0[kn]) * ks[kn]; }
      v = v * vsc + breathe[i];
      const x = SX[i] + (SX[i + 1] - SX[i]) * fr + STX[i] * u + SNX[i] * v;
      const y = SY[i] + (SY[i + 1] - SY[i]) * fr + STY[i] * u + SNY[i] * v;
      if (x < 0 || y < 0 || x > W || y > H) continue;
      const fb = g0 + gx * x + gy * y;
      const bk = flat ? 0 : fb < 0 ? 0 : fb >= HB - 1 ? HB - 1 : fb | 0;
      out.push({ cx: x + w / 2, cy: y + w / 2, r: w / 2, fill: hex[bk], opacity: Math.min(1, a) });
    }
    return out;
  }

  const loop = createLoop({
    onFrame(dt) {
      drawFrame(dt, currentValues);
    },
  });
  loop.start();

  document.getElementById('btn-png-2x')?.addEventListener('click', () => exportPng(canvas, { multiplier: 2 }));
  document.getElementById('btn-png-4x')?.addEventListener('click', () => exportPng(canvas, { multiplier: 4 }));
  document.getElementById('btn-svg')?.addEventListener('click', () => {
    if (bridge) exportSvg([], { width: canvas.width, height: canvas.height, circles: svgCircles(currentValues) });
  });
  document.getElementById('btn-baked')?.addEventListener('click', () => {
    bakeHtml({ sourceHtml: document.documentElement.outerHTML, values: panel.values }).catch((err) => console.error('bakeHtml failed', err));
  });
  document.getElementById('btn-source')?.addEventListener('click', () => {
    exportSource().catch((err) => console.error('exportSource failed', err));
  });
  document.getElementById('btn-prompt')?.addEventListener('click', () => {
    describeForAI({ pieceName: PIECE_ID, values: panel.values });
  });
</script></body></html>
