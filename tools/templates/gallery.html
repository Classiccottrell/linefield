<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>linefield — generative line-art backgrounds</title>
<style>
  :root{
    --ground:#0a0a0d;
    --surface:#131319;
    --line:#26262f;
    --text:#e8e8ec;
    --muted:#7c7c8c;
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{
    background:var(--ground);color:var(--text);
    font:16px/1.6 -apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;
    -webkit-font-smoothing:antialiased;padding:0 24px 96px;
  }
  .wrap{max-width:1180px;margin:0 auto}

  header{padding:80px 0 40px}
  h1{font-size:clamp(32px,5vw,46px);font-weight:600;letter-spacing:-.02em;margin:0 0 14px}
  .lede{color:var(--muted);font-size:18px;margin:0;max-width:60ch}
  .lede code{font-size:15px;background:var(--surface);padding:2px 6px;border-radius:3px}

  .chips{display:flex;flex-wrap:wrap;gap:8px;padding:24px 0 32px;border-bottom:1px solid var(--line)}
  .chip{
    font:500 12px/1 ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.06em;
    color:var(--muted);background:transparent;border:1px solid var(--line);
    padding:8px 13px;border-radius:2px;cursor:pointer;text-transform:uppercase;
  }
  .chip:hover{color:var(--text);border-color:#3a3a46}
  .chip[aria-pressed="true"]{color:var(--ground);background:var(--text);border-color:var(--text)}
  .chip:focus-visible{outline:2px solid #6fb4c9;outline-offset:2px}

  .grid{
    display:grid;gap:28px;padding:36px 0 0;
    grid-template-columns:repeat(auto-fill,minmax(320px,1fr));
  }
  .card{display:flex;flex-direction:column;gap:0}
  .card[hidden]{display:none}

  .frame{
    position:relative;aspect-ratio:16/10;overflow:hidden;border-radius:3px;
    background:var(--ground);border:1px solid var(--line);display:block;
    text-decoration:none;
  }
  .frame img,.frame iframe{
    position:absolute;inset:0;width:100%;height:100%;border:0;display:block;
  }
  .frame img{object-fit:cover}
  .frame:focus-visible{outline:2px solid var(--accent,#6fb4c9);outline-offset:3px}

  .meta{padding:14px 2px 0}
  .name{
    display:flex;align-items:baseline;gap:10px;margin:0 0 4px;
    font-size:17px;font-weight:600;letter-spacing:-.01em;
  }
  .swatch{width:22px;height:3px;border-radius:2px;flex:none}
  .blurb{color:var(--muted);font-size:14.5px;margin:0 0 12px}

  .tags{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 14px}
  .tag{
    font:12px/1 ui-monospace,SFMono-Regular,Menlo,monospace;color:#9a9aa8;
    border:1px solid var(--line);padding:4px 8px;border-radius:2px;
  }

  .actions{display:flex;flex-wrap:wrap;gap:8px}
  .btn{
    font:500 12.5px/1 -apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;
    color:#c6c6d0;background:var(--surface);border:1px solid var(--line);
    padding:8px 12px;border-radius:3px;cursor:pointer;text-decoration:none;
  }
  .btn:hover{color:var(--text);border-color:#3a3a46}
  .btn:focus-visible{outline:2px solid #6fb4c9;outline-offset:2px}

  .note{color:var(--muted);font-size:12.5px;margin:10px 0 0}

  footer{padding:72px 0 0;color:var(--muted);font-size:14px;border-top:1px solid var(--line);margin-top:72px}
  footer a{color:#9fd0dd}

  @media (prefers-reduced-motion: reduce){
    *{animation:none!important;transition:none!important}
  }
</style>
</head>
<body>
<div class="wrap">

<header>
  <h1>linefield</h1>
  <p class="lede">Eleven generative line-art backgrounds. Every piece is one self-contained file with no dependencies — tune it, then export a standalone <code>.html</code> you can paste into any site.</p>
</header>

<div class="chips" id="chips" role="group" aria-label="Filter pieces by category"></div>

<div class="grid" id="grid">
<!--CARDS-->
</div>

<footer>
  <p>MIT licensed. Canvas 2D, no dependencies, no build step — for the pieces themselves.</p>
</footer>

</div>

<script>
const PIECES = /*PIECES*/[];

/* ---- Filtering ---------------------------------------------------------- */
const grid = document.getElementById('grid');
const chipRow = document.getElementById('chips');
const allTags = [...new Set(PIECES.flatMap(p => p.tags))].sort();
let active = null;

function renderChips(){
  // Built once. apply() only ever toggles aria-pressed on these same
  // buttons — replacing them on every click would drop keyboard focus
  // back to <body> on each filter change, which is the same class of
  // defect as a hover-only preview.
  const mk = (label, value) => {
    const b = document.createElement('button');
    b.className = 'chip';
    b.type = 'button';
    b.textContent = label;
    b.dataset.value = value === null ? '' : value;
    b.setAttribute('aria-pressed', String(active === value));
    b.addEventListener('click', () => { active = value; apply(); });
    return b;
  };
  chipRow.replaceChildren(mk('All', null), ...allTags.map(t => mk(t, t)));
}

function apply(){
  for (const card of grid.children){
    const tags = card.dataset.tags.split(' ');
    card.hidden = active !== null && !tags.includes(active);
  }
  for (const chip of chipRow.children){
    const value = chip.dataset.value || null;
    chip.setAttribute('aria-pressed', String(active === value));
  }
}

/* ---- Live preview on hover and keyboard focus ---------------------------
   Exactly one iframe exists at a time. A stale iframe keeps its animation
   loop running, and eleven concurrent loops is the whole reason the grid
   uses stills. Touch devices never reach this code — see the media query
   below — so tapping a card just opens the piece.                          */
const canHover = window.matchMedia('(hover: hover)').matches;
let liveFrame = null;
let liveTimer = null;

function goLive(frame){
  if (!canHover || liveFrame === frame) return;
  clearTimeout(liveTimer);
  liveTimer = setTimeout(() => {
    clearLive();
    const iframe = document.createElement('iframe');
    iframe.src = frame.dataset.src;
    iframe.setAttribute('tabindex', '-1');
    iframe.setAttribute('aria-hidden', 'true');
    iframe.setAttribute('loading', 'eager');
    frame.appendChild(iframe);
    liveFrame = frame;
  }, 120);
}

function clearLive(){
  clearTimeout(liveTimer);
  if (!liveFrame) return;
  const iframe = liveFrame.querySelector('iframe');
  if (iframe) iframe.remove();
  liveFrame = null;
}

for (const frame of grid.querySelectorAll('.frame')){
  frame.addEventListener('mouseenter', () => goLive(frame));
  frame.addEventListener('mouseleave', clearLive);
  // Keyboard users get the same preview. Hover-only interactivity is
  // invisible to them, and this is one extra event pair.
  frame.addEventListener('focus', () => goLive(frame));
  frame.addEventListener('blur', clearLive);
}

/* ---- Copy embed --------------------------------------------------------- */
for (const btn of document.querySelectorAll('[data-embed]')){
  btn.addEventListener('click', async () => {
    const url = new URL(btn.dataset.embed, location.href).href;
    const snippet = '<iframe src="' + url + '" style="border:0;width:100%;height:100%"></iframe>';
    try {
      await navigator.clipboard.writeText(snippet);
      const original = btn.textContent;
      btn.textContent = 'Copied';
      setTimeout(() => { btn.textContent = original; }, 1400);
    } catch {
      btn.textContent = 'Copy failed';
    }
  });
}

renderChips();
</script>
</body>
</html>
