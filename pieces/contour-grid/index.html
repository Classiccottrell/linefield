<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>linefield — contour-grid</title>
<style>
  html, body { margin: 0; height: 100%; background: #0a0a0d; overflow: hidden; }
  canvas { display: block; width: 100vw; height: 100vh; }
  .lf-export-row { position: fixed; top: 12px; right: 12px; display: flex; gap: 6px; z-index: 9999; }
  .lf-export-row button { background: #222; color: #eee; border: 1px solid #444; border-radius: 4px;
    padding: 4px 8px; font: 11px -apple-system, sans-serif; cursor: pointer; }
</style>
</head>
<body>
<canvas id="canvas"></canvas>

<div class="lf-export-row" data-lf-panel>
  <button id="btn-baked">Baked HTML</button>
  <button id="btn-png-2x">PNG 2x</button>
  <button id="btn-png-4x">PNG 4x</button>
  <button id="btn-svg">SVG</button>
  <button id="btn-prompt">Copy AI Prompt</button>
</div>

<script type="module">
  import { createControlPanel } from '../../shared/controls.js';
  import { createLoop } from '../../shared/anim.js';
  import { hslToRgb } from '../../shared/color.js';
  import { simplex2 } from '../../shared/noise.js';
  import { exportPng, exportSvg, bakeHtml, describeForAI } from '../../shared/export.js';

  const PIECE_ID = 'contour-grid';
  const canvas = document.getElementById('canvas');
  const ctx = canvas.getContext('2d');

  function resize() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
  }
  window.addEventListener('resize', resize);
  resize();

  // Band count is derived per frame from density — no persistent array, so no re-seed.
  const BASE_BANDS = 26;
  const STEP_PX = 6;
  let paths = [];

  const PRESETS = {
    whisper: { opacity: 0.2, stroke: 0.5, density: 0.5, saturation: 0.06, glow: 0 },
    ink:     { opacity: 1, stroke: 1.8, density: 0.8, saturation: 0, glow: 0 },
    neon:    { opacity: 0.95, stroke: 1, density: 1.2, saturation: 0.9, glow: 1 },
    drift:   { opacity: 0.5, stroke: 0.9, density: 0.7, speed: 0.3, motion: 1.6 },
    dense:   { opacity: 0.6, stroke: 0.6, density: 2, speed: 0.8, glow: 0 },
  };

  const baked = window.__LF_BAKED_VALUES__;
  const panel = baked ? null : createControlPanel({
    pieceId: PIECE_ID,
    presets: PRESETS,
    onChange: () => {},
    extraControls: [
      { name: 'relief', label: 'Relief', type: 'range', min: 0, max: 2, step: 0.01, default: 1 },
    ],
    defaults: { hue: 35, hueB: 15, saturation: 0.5 },
  });
  const currentValues = baked || panel.values;

  function drawFrame(dt, elapsed, values) {
    ctx.fillStyle = values.invert ? '#f2f2f4' : '#0a0a0d';
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    paths = [];
    const bands = Math.max(2, Math.round(BASE_BANDS * values.density));
    const noiseScale = 0.0016 * (0.25 + values.scale);
    // relief sets the static terrain height; motion layers a second,
    // independently-amplitude'd wobble on top; speed is purely the rate that
    // wobble evolves at (not its size) — the three no longer collapse to one knob.
    const baseAmp = 30 * values.relief;
    const moveAmp = 16 * values.motion;
    const t = elapsed * values.speed * 0.12;

    const lineWidth = 0.4 + values.stroke * 1.1;
    ctx.lineWidth = lineWidth;

    ctx.save();
    ctx.translate(canvas.width / 2, canvas.height / 2);
    ctx.rotate((values.angle * Math.PI) / 180);
    ctx.translate(-canvas.width / 2, -canvas.height / 2);

    // Overdraw horizontally so rotation never reveals the canvas edge.
    const margin = Math.max(canvas.width, canvas.height) * 0.4;

    for (let b = 0; b < bands; b++) {
      const f = b / (bands - 1 || 1);
      const baseY = -margin + f * (canvas.height + margin * 2);

      const [r, g, bl] = hslToRgb(
        values.hue + (values.hueB - values.hue) * f,
        values.saturation,
        values.invert ? 0.35 : 0.6
      );
      ctx.strokeStyle = `rgba(${r},${g},${bl},${values.opacity})`;

      const pts = [];
      ctx.beginPath();
      for (let x = -margin; x <= canvas.width + margin; x += STEP_PX) {
        const n1 = simplex2(x * noiseScale + values.phase, baseY * noiseScale);
        const n2 = simplex2(x * noiseScale + values.phase + 137, baseY * noiseScale + t);
        const y = baseY + n1 * baseAmp + n2 * moveAmp;
        if (x === -margin) ctx.moveTo(x, y);
        else ctx.lineTo(x, y);
        pts.push([x, y]);
      }
      if (values.glow > 0) {
        ctx.lineWidth = lineWidth + values.glow * 3;
        ctx.globalAlpha = values.glow * 0.25;
        ctx.stroke();
        ctx.lineWidth = lineWidth;
        ctx.globalAlpha = 1;
      }
      ctx.stroke();
      paths.push(pts);
    }

    ctx.restore();
  }

  const loop = createLoop({
    onFrame(dt, elapsed) {
      drawFrame(dt, elapsed, currentValues);
    },
  });
  loop.start();

  document.getElementById('btn-png-2x')?.addEventListener('click', () => exportPng(canvas, { multiplier: 2 }));
  document.getElementById('btn-png-4x')?.addEventListener('click', () => exportPng(canvas, { multiplier: 4 }));
  document.getElementById('btn-svg')?.addEventListener('click', () => exportSvg(paths, { width: canvas.width, height: canvas.height }));
  document.getElementById('btn-baked')?.addEventListener('click', () => {
    bakeHtml({ sourceHtml: document.documentElement.outerHTML, values: panel.values }).catch((err) => console.error('bakeHtml failed', err));
  });
  document.getElementById('btn-prompt')?.addEventListener('click', () => {
    describeForAI({ pieceName: PIECE_ID, values: panel.values });
  });
</script>
</body>
</html>
