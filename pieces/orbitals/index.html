<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<!-- Without this a phone uses a ~980px layout viewport, so the panel's
     max-width:640px sheet rule never matches and the page renders zoomed
     out — the controls become an unusable corner card. -->
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>linefield — orbitals</title>
<style>
  html, body { margin: 0; height: 100%; background: #0a0a0d; overflow: hidden; }
  canvas { display: block; width: 100vw; height: 100vh; }
  .lf-export-row { position: fixed; top: 12px; right: 12px; display: flex; gap: 6px; z-index: 9999; }
  .lf-export-row button { background: #222; color: #eee; border: 1px solid #444; border-radius: 4px;
    padding: 4px 8px; font: 11px -apple-system, sans-serif; cursor: pointer; }
</style>
</head>
<body>
<canvas id="canvas"></canvas>

<div class="lf-export-row" data-lf-panel>
  <button id="btn-baked">Baked HTML</button>
  <button id="btn-source">Source</button>
  <button id="btn-png-2x">PNG 2x</button>
  <button id="btn-png-4x">PNG 4x</button>
  <button id="btn-svg">SVG</button>
  <button id="btn-prompt">Copy AI Prompt</button>
</div>

<script type="module">
  import { createControlPanel } from '../../shared/controls.js';
  import { createLoop } from '../../shared/anim.js';
  import { hslToRgb, paletteHsl } from '../../shared/color.js';
  import { exportPng, exportSvg, bakeHtml, exportSource, describeForAI } from '../../shared/export.js';

  // orbitals — many hairline arcs turning at different rates around one
  // centre, whose overlaps gather into one bright crescent that travels
  // slowly round.
  //
  // The arcs share one centre and fill a band of radii on a tilted orbit
  // plane. Each is centred near a common crest angle and slides about it at
  // its own rate, so they overlap most at the crest; mid-band arcs are the
  // longest, so the lit region is thickest in the middle and thins toward
  // both horns. The far side of the ring stays faint, carried only by the
  // arcs' tapered ends. The sliding is bounded, so the crowd never disperses
  // the way free differential rotation would.
  //
  // Text-safe zone: the left third of the frame. The ring sits in the
  // central square, nudged right, and its left edge stays clear of the
  // third wherever the crescent is.
  // Anchor: the middle of the crescent, starting on the ring's near (lower)
  // side and travelling slowly round it. It emerges from the arcs
  // overlapping, not from a drawn glow.
  const PIECE_ID = 'orbitals';
  const canvas = document.getElementById('canvas');
  const ctx = canvas.getContext('2d');

  function resize() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
  }
  window.addEventListener('resize', resize);
  resize();

  // Arc count derives per frame from density — no persistent array. Per-arc
  // character comes from a hash of its index, so it's stable at any count.
  const BASE_ARCS = 120;
  const SEG = 96;              // segments per full turn
  const R_IN = 0.66;           // inner edge of the arcs' band, as a fraction of the orb
  const DRIFT = 0.06;          // how far an arc drifts in radius along its length
  const ASPECT = 0.68;         // the orbit plane, seen tilted
  const TRAVEL_PERIOD = 32;    // seconds per crescent revolution at speed 1
  const START = 1.05;          // crescent's opening angle (radians, 0 = right, down is +)
  const BUCKETS = 7;
  let paths = [];

  const hash = (i) => {
    const x = Math.sin(i * 127.1 + 311.7) * 43758.5453;
    return x - Math.floor(x);
  };

  const PRESETS = {
    whisper: { opacity: 1, stroke: 0.7, density: 0.45, sweep: 0.45, glow: 0 },
    ink:     { opacity: 1, stroke: 1.5, density: 0.75, glow: 0, sweep: 0.8 },
    neon:    { opacity: 0.9, stroke: 0.9, density: 1.05, saturation: 0.9, glow: 1.1 },
    drift:   { opacity: 0.9, stroke: 0.8, density: 0.8, speed: 0.4, motion: 1.8, sweep: 1, phase: 1.3 },
    dense:   { opacity: 0.9, stroke: 0.85, density: 1.6, glow: 0.4, sweep: 0.75 },
  };

  const baked = window.__LF_BAKED_VALUES__;
  const panel = baked ? null : createControlPanel({
    pieceId: PIECE_ID,
    presets: PRESETS,
    onChange: () => {},
    extraControls: [
      { name: 'sweep', label: 'Sweep', type: 'range', min: 0.05, max: 1, step: 0.01, default: 0.78, category: 'form' },
    ],
    // Monochrome by default (house look §1). The hue pair is what the neon
    // preset and the colour pickers light up.
    defaults: { hue: 265, hueB: 330, saturation: 0, scale: 1.6, colorMode: 'gradient', colorA: '#6a00ff', colorB: '#ff0080' },
  });
  const currentValues = baked || panel.values;

  function strokeRuns(runs, alpha, lineWidth, rgb) {
    if (!runs.length || alpha <= 0) return;
    ctx.beginPath();
    for (const run of runs) {
      ctx.moveTo(run[0][0], run[0][1]);
      for (let i = 1; i < run.length; i++) ctx.lineTo(run[i][0], run[i][1]);
    }
    ctx.strokeStyle = `rgba(${rgb[0]},${rgb[1]},${rgb[2]},${Math.min(1, alpha)})`;
    ctx.lineWidth = lineWidth;
    ctx.stroke();
  }

  function drawFrame(dt, elapsed, values) {
    const W = canvas.width;
    const H = canvas.height;
    ctx.globalCompositeOperation = 'source-over';
    ctx.fillStyle = values.invert ? '#f2f2f4' : '#0a0a0d';
    ctx.fillRect(0, 0, W, H);
    // Additive on the dark ground, so the crowded side brightens on its own.
    // On the light ground `lighter` would clip to white, so dark ink layers
    // with plain alpha there.
    ctx.globalCompositeOperation = values.invert ? 'source-over' : 'lighter';
    // Butt caps: runs split at shared points (alpha buckets), and round caps
    // would overlap there and add up to beads under 'lighter'.
    ctx.lineCap = 'butt';

    paths = [];
    const S = Math.min(W, H);
    const size = 0.35 + 0.65 * values.scale;
    const R = S * 0.32 * size;
    const cx = W / 2 + 0.07 * S;
    const cy = H / 2;
    const arcs = Math.max(12, Math.round(BASE_ARCS * values.density));
    const light = values.invert ? 0.14 : 0.88 - 0.26 * values.saturation;
    const lineWidth = 0.5 + values.stroke * 0.4;
    const peak = values.opacity * (values.invert ? 0.45 : 0.26);

    // Speed is the tempo of everything (Speed 0 is a still frame): the
    // crescent travels once per TRAVEL_PERIOD. Motion is the amount of
    // differential turning, each arc about its own centre, inner arcs
    // fastest, so Motion 0 keeps the crescent travelling with the arcs
    // locked to it.
    const t = elapsed * values.speed;
    const crest = START + (t / TRAVEL_PERIOD) * Math.PI * 2;
    const ux = Math.cos(crest), uy = Math.sin(crest);
    const roll = (values.angle * Math.PI) / 180;
    const cr = Math.cos(roll), sr = Math.sin(roll);
    const sweep = Math.PI * 2 * values.sweep;

    for (let i = 0; i < arcs; i++) {
      const u = arcs === 1 ? 0.5 : i / (arcs - 1);
      const r = R * (R_IN + (1 - R_IN) * u);
      // Mid-band arcs are the longest, so the lit region is thickest at its
      // middle and thins toward both horns: a crescent.
      const band = 1 - Math.pow(Math.abs(2 * u - 1), 1.6);
      const span = Math.max(0.2, sweep * (0.3 + 0.7 * band));
      // Differential turning: each arc slides about the crest at its own
      // rate (inner arcs fastest), bounded so the crowd never disperses.
      // Phase shears the crescent across the radii.
      const rate = 0.2 + 0.4 * (1 - u) + 0.1 * hash(i + 5);
      const slide = values.motion * 0.5 * Math.sin(t * rate + hash(i + 9) * Math.PI * 2);
      const mid = crest + (hash(i + 17) - 0.5) * 0.9 + slide + values.phase * (u - 0.5) * 1.4;
      const start = mid - span / 2;
      // Each arc drifts a little in radius along its length, so neighbours
      // cross and their overlaps add up.
      const drift = (hash(i + 29) - 0.5) * DRIFT * R;
      const steps = Math.max(4, Math.ceil((SEG * span) / (Math.PI * 2)));

      const pts = [];
      const weights = [];
      for (let s = 0; s <= steps; s++) {
        const k = s / steps;
        const a = start + k * span;
        const rr = r + drift * (k - 0.5) * 2;
        const px = Math.cos(a) * rr;
        const py = Math.sin(a) * rr * ASPECT;
        pts.push([cx + px * cr - py * sr, cy + px * sr + py * cr]);
        // Brighter toward the crest, and each arc fades out at both ends.
        const toward = (1 + Math.cos(a - crest)) / 2;
        const taper = Math.pow(Math.sin(Math.PI * k), 0.7);
        weights.push((0.3 + 0.7 * toward * toward) * taper);
      }
      paths.push(pts);

      const buckets = Array.from({ length: BUCKETS }, () => []);
      let run = [];
      let runB = -1;
      for (let s = 0; s < steps; s++) {
        const w = (weights[s] + weights[s + 1]) / 2;
        const b = Math.min(BUCKETS - 1, Math.floor(w * BUCKETS));
        if (b !== runB) {
          if (run.length >= 2) buckets[runB].push(run);
          run = [pts[s]];
          runB = b;
        }
        run.push(pts[s + 1]);
      }
      if (run.length >= 2) buckets[runB].push(run);

      const { h, s } = paletteHsl(values, u);
      const rgb = hslToRgb(h, s, light);
      for (let b = 0; b < BUCKETS; b++) {
        const alpha = peak * ((b + 0.5) / BUCKETS);
        if (values.glow > 0 && b >= BUCKETS - 2) {
          strokeRuns(buckets[b], alpha * values.glow * 0.3, lineWidth + values.glow * 2.2, rgb);
        }
        strokeRuns(buckets[b], alpha, lineWidth, rgb);
      }
    }

    // The anchor is the crest's middle, halfway across the band.
    const ar = R * (R_IN + (1 - R_IN) * 0.5);
    const ax = ux * ar, ay = uy * ar * ASPECT;
    const anchor = [cx + ax * cr - ay * sr, cy + ax * sr + ay * cr];

    // Glow is a fallback for the anchor, off by default: the crescent is
    // already the brightest place from the crowded arcs alone.
    if (values.glow > 0) {
      const { h, s } = paletteHsl(values, 1);
      const [r, g, b] = hslToRgb(h, s, light);
      const gr = (20 + 44 * values.glow) * size;
      const grad = ctx.createRadialGradient(anchor[0], anchor[1], 0, anchor[0], anchor[1], gr);
      grad.addColorStop(0, `rgba(${r},${g},${b},${Math.min(1, 0.3 * values.glow * values.opacity)})`);
      grad.addColorStop(1, `rgba(${r},${g},${b},0)`);
      ctx.fillStyle = grad;
      ctx.beginPath();
      ctx.arc(anchor[0], anchor[1], gr, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.globalCompositeOperation = 'source-over';
  }

  const loop = createLoop({
    onFrame(dt, elapsed) {
      drawFrame(dt, elapsed, currentValues);
    },
  });
  loop.start();

  document.getElementById('btn-png-2x')?.addEventListener('click', () => exportPng(canvas, { multiplier: 2 }));
  document.getElementById('btn-png-4x')?.addEventListener('click', () => exportPng(canvas, { multiplier: 4 }));
  document.getElementById('btn-svg')?.addEventListener('click', () => exportSvg(paths, { width: canvas.width, height: canvas.height }));
  document.getElementById('btn-baked')?.addEventListener('click', () => {
    bakeHtml({ sourceHtml: document.documentElement.outerHTML, values: panel.values }).catch((err) => console.error('bakeHtml failed', err));
  });
  document.getElementById('btn-source')?.addEventListener('click', () => {
    exportSource().catch((err) => console.error('exportSource failed', err));
  });
  document.getElementById('btn-prompt')?.addEventListener('click', () => {
    describeForAI({ pieceName: PIECE_ID, values: panel.values });
  });
</script>
</body>
</html>
