<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />

<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>linefield — dust-lane</title>
<style>
  html, body { margin: 0; height: 100%; background: #0a0a0d; overflow: hidden; }
  canvas { display: block; width: 100vw; height: 100vh; }
  .lf-export-row { position: fixed; top: 12px; right: 12px; display: flex; gap: 6px; z-index: 9999; }
  .lf-export-row button { background: #222; color: #eee; border: 1px solid #444; border-radius: 4px;
    padding: 4px 8px; font: 11px -apple-system, sans-serif; cursor: pointer; }
</style>
</head>
<body>
<canvas id="canvas"></canvas>

<!--
  dust-lane — a disc galaxy seen almost edge-on in fine stipple, its bright
  bulge cut by a ragged dark lane of dust that the turning disc carries along.

  Anchor: the bulge, just above and right of centre, behind the lane. It
  stays in place; the disc turns through it, and the lane rises and settles
  across it as the tilt rocks.
  Text-safe zone: the bottom third of the frame, and the top band above the
  bulge (about the top fifth). Both are clear at the default framing and
  close as Scale rises.

  Technique (stipple / lit volume): stars and dust are sampled once in 3D
  (X along the major axis, Y depth, Z out of the disc), tilted a few degrees
  and projected. Light is summed into a float buffer by hand and written
  through ImageData via a tone table. A star is dimmed only by dust in front
  of it: the static, clumpy dust is binned into depth slabs and cumulated
  front to back, precomputed at tilt steps of 0.34 deg and the two nearest
  steps blended while the tilt rocks. Moving dust (clumps, tendrils) and
  young clusters are rigid groups carried round with the disc, fading in and
  out over their life; their depth sits in moment grids rebuilt each frame.

  Motion: a seamless 30 s loop at Speed 1. Stars ride fixed orbits as
  "necklaces": a ring of n identical beads turns m/n of a turn per loop, so
  every bead ends on its neighbour's start and no star ever fades. The near
  side of the disc runs one way across the frame and the far side the other.
  The tilt rocks once per loop, 3.5 to 7.0 deg at Rock 1.

  Controls: Scale sizes the galaxy (projection zoom; star count follows the
  projected area, so the grain holds, coarsening a little past Scale 1 to
  cap the cost). Density sets the star count,
  Stroke the dot size, Opacity the exposure, Angle the position angle on
  screen. Motion scales the secondary drift (dust groups, clusters, the
  background twinkle); Speed the loop rate; Phase where in the loop it is.
  Glow adds a bloom from the light buffer itself. Rock (0-2) sets how far the
  tilt rocks: 0 holds it at 6.3 deg, 1 is 3.5-7.0 deg, 2 opens it to
  2.2-7.0 deg. The top end never passes 7.0 deg.
  Nothing rebuilds on a control change: the dust steps are built once (the
  four below 3.5 deg the first time Rock asks for them), and Density and
  Scale draw a prefix of one growing star list, cut on whole necklaces.

  SVG export: stipple of several hundred thousand dots can't go into an SVG
  whole. The SVG carries a capped, uniform sample of the current frame's dots
  (at most 16,000 disc stars plus the clusters and background stars) as
  <circle>s in screen space with Angle applied, each at its own brightness
  after the dust in front of it, so the lane still reads. Use PNG for the
  full grain.
-->

<div class="lf-export-row" data-lf-panel>
  <button id="btn-baked">Baked HTML</button>
  <button id="btn-source">Source</button>
  <button id="btn-png-2x">PNG 2x</button>
  <button id="btn-png-4x">PNG 4x</button>
  <button id="btn-svg">SVG</button>
  <button id="btn-prompt">Copy AI Prompt</button>
</div>

<script type="module">
  import { createControlPanel } from '../../shared/controls.js';
  import { createLoop } from '../../shared/anim.js';
  import { hslToRgb, paletteHsl } from '../../shared/color.js';
  import { exportPng, exportSvg, bakeHtml, exportSource, describeForAI } from '../../shared/export.js';

  const PIECE_ID = 'dust-lane';
  const canvas = document.getElementById('canvas');
  const ctx = canvas.getContext('2d');

  const TAU = Math.PI * 2;
  const LOOP = 30; // seconds per seamless loop at Speed 1
  // The loop's key frame (tilt 6.3 deg) sits this far in, which is
  // where the gallery's still and thumbnail are taken.
  const T0 = 4;
  // The galaxy is built once in base units: 1 unit = 1 px at 1280x800
  // and Scale 1. Scale and the canvas size only change the projection.
  const BASE_W = 1280, BASE_H = 800;
  const M = {
    seed: 11, pa: -0.1, cx: 0.5, cy: 0.47,
    Rd: 210, Rmax: 570, hz: 7, hzThick: 20, thickFrac: 0.2, thin: 0.6, warpA: 28, warpR: 330,
    nDisc: 230000, nBulge: 110000, bulgeA: 115, bulgeQ: 0.7, bulgeCap: 2.6, bulgeSpin: 0.6,
    nBg: 1100, bgA: 0.95, twinkle: 0.05,
    clusters: 12, clusterN: 140, clusterSig: 3.2, clusterLum: 1.25, farClusters: 3,
    dustN: 70000, dustRd: 420, dustHole: 30, dustRmax: 600, hd: 3.2, dustTau: 4,
    dustLam: 70, dustClump: 1.9, corrug: 1.2,
    clumps: 160, clumpN: 60, clumpMass: 1.35, fils: 40, filN: 70, filH: 55, filMass: 1.7, filNear: 2.2,
    groupFade: 0.25,
    vmax: 14, vR1: 45, vR2: 120,
    peak: 0.76, gamma: 0.85, toe0: 0.03, toe1: 0.19,
    depthK: 1, depthW: 12,
    slabs: [-0.6, -0.3, -0.13, -0.05, 0, 0.05, 0.13, 0.3, 0.6], baseV: 100,
    minA: 0.002, // per-dot floor: fainter dots are skipped
  };
  const NBASE = M.nDisc + M.nBulge; // stars at Density 1, Scale 1

  // Tilt in radians; negative tips the near side down, so the lane sits
  // below the bulge. Rock 1 swings between TOP (7.0 deg) and LOW1 (3.55 deg)
  // and passes KEY (6.3 deg) at t = 0; Rock 2 opens the low end to LOW2.
  const TILT_TOP = -0.122, TILT_KEY = -0.110, TILT_LOW1 = -0.062, TILT_LOW2 = -0.038;
  const ROCK_PH = -0.6435; // sin(ROCK_PH) = -0.6
  const KF_STEP = 0.006; // one dust step, 0.34 deg
  const KF_N = Math.round((TILT_LOW2 - TILT_TOP) / KF_STEP) + 1; // 15
  const KF_UP_FRONT = Math.round((TILT_LOW1 - TILT_TOP) / KF_STEP) + 1; // 11

  function rng(seed) {
    return () => {
      seed |= 0; seed = seed + 0x6D2B79F5 | 0;
      let t = Math.imul(seed ^ seed >>> 15, 1 | seed);
      t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
      return ((t ^ t >>> 14) >>> 0) / 4294967296;
    };
  }
  // Value-noise fbm: less stripy than summed sines; it clumps the dust.
  function makeFbm(r, oct) {
    const N = 256, tab = new Float32Array(N * N);
    for (let i = 0; i < tab.length; i++) tab[i] = r() * 2 - 1;
    const n = (x, y) => {
      const xi = Math.floor(x), yi = Math.floor(y), xf = x - xi, yf = y - yi;
      const x0 = xi & 255, y0 = yi & 255, x1 = (x0 + 1) & 255, y1 = (y0 + 1) & 255;
      const a = tab[y0 * N + x0], b = tab[y0 * N + x1], c = tab[y1 * N + x0], d = tab[y1 * N + x1];
      const u = xf * xf * (3 - 2 * xf), v = yf * yf * (3 - 2 * yf);
      return a + (b - a) * u + (c - a) * v + (a - b - c + d) * u * v;
    };
    return (x, y) => {
      let s = 0, amp = 1, f = 1, norm = 0;
      for (let i = 0; i < oct; i++) { s += amp * n(x * f + i * 17.3, y * f + i * 9.1); norm += amp; amp *= 0.55; f *= 2.03; }
      return s / norm;
    };
  }
  const smooth = (a, b, x) => { const t = Math.max(0, Math.min(1, (x - a) / (b - a))); return t * t * (3 - 2 * t); };

  // ---------- the model ----------
  // One stream for the dust and the moving dust groups; stars, clusters and
  // the background each have their own, so growing one never moves another.
  const r = rng(M.seed * 9973 + 1);
  const fbm = makeFbm(r, 4), fbm2 = makeFbm(r, 3);
  const Rmax = M.Rmax, A = M.bulgeA;
  const speedAt = (R) => M.vmax * (1 - Math.exp(-R / M.vR1)) * Math.sqrt(M.vR2 / (M.vR2 + R)) * 1.25;
  const warpAt = (R) => M.warpA * Math.pow(Math.max(0, (R - M.warpR) / (Rmax - M.warpR)), 2);

  // Moving-dust grid in band coords: interleaved [mass, mass*depth, mass*depth^2].
  const DU = 2, DV = 1;
  const U0 = Math.ceil(Rmax + 30), V0 = Math.ceil(0.17 * BASE_H);
  const GU = Math.ceil((2 * U0) / DU) + 2, GV = Math.ceil((2 * V0) / DV) + 2;
  const grid = new Float32Array(GU * GV * 3);
  function splatM(u, v, m, z) {
    const gx = (u + U0) / DU, gy = (v + V0) / DV;
    const ix = gx | 0, iy = gy | 0;
    if (ix < 1 || iy < 1 || ix >= GU - 2 || iy >= GV - 2) return;
    const g = grid, fx = gx - ix, fy = gy - iy, o = (iy * GU + ix) * 3, z2 = z * z;
    let w = m * (1 - fx) * (1 - fy); g[o] += w; g[o + 1] += w * z; g[o + 2] += w * z2;
    w = m * fx * (1 - fy); g[o + 3] += w; g[o + 4] += w * z; g[o + 5] += w * z2;
    const o2 = o + GU * 3;
    w = m * (1 - fx) * fy; g[o2] += w; g[o2 + 1] += w * z; g[o2 + 2] += w * z2;
    w = m * fx * fy; g[o2 + 3] += w; g[o2 + 4] += w * z; g[o2 + 5] += w * z2;
  }

  // Static dust: a clumpy, corrugated sheet, kept as 3D points so it can be
  // projected at any tilt.
  const hd = M.hd, dRd = M.dustRd, dRmax = M.dustRmax, lam = M.dustLam;
  const bX = new Float32Array(M.dustN), bY = new Float32Array(M.dustN), bZ = new Float32Array(M.dustN);
  let nB = 0;
  {
    let guard = 0;
    while (nB < M.dustN && guard++ < M.dustN * 40) {
      const R = -dRd * Math.log(r() * r());
      if (R > dRmax * (0.85 + 0.3 * r())) continue;
      if (r() > 1 - Math.exp(-(R * R) / (M.dustHole * M.dustHole))) continue;
      const ph = r() * TAU, X = R * Math.cos(ph), Y = R * Math.sin(ph);
      const c = Math.max(0, 0.3 + M.dustClump * fbm(X / lam, Y / lam));
      if (r() * 1.6 > c) continue;
      const lap = (r() < 0.5 ? -1 : 1) * Math.log(1 - r() * 0.98);
      bX[nB] = X; bY[nB] = Y;
      bZ[nB] = M.corrug * hd * 2.2 * fbm2(X / (lam * 1.6), Y / (lam * 1.6)) + hd * (0.7 + 0.6 * c) * lap + warpAt(R) * (X / R);
      nB++;
    }
  }
  // Depth slabs; a branch-free slab lookup for the star loop (the bounds are
  // multiples of 0.005 Rmax).
  const bounds = M.slabs.map((s) => s * Rmax), NS = bounds.length + 1;
  const slabOf = (zc) => { let s = 0; while (s < bounds.length && zc > bounds[s]) s++; return s; };
  const SL = new Uint8Array(301);
  for (let i = 0; i <= 300; i++) SL[i] = slabOf((i / 200 - 0.75 + 0.0025) * Rmax);
  const SLK = 200 / Rmax;
  const BV0 = Math.ceil(M.baseV), BGV = Math.ceil((2 * BV0) / DV) + 2, BGN = GU * BGV;
  const slabTmp = [];
  for (let s = 0; s < NS; s++) slabTmp.push(new Float32Array(BGN));
  const tmp1 = new Float32Array(BGN);
  function blur1(g) {
    for (let y = 0; y < BGV; y++) for (let x = 1; x < GU - 1; x++) { const o = y * GU + x; tmp1[o] = 0.25 * g[o - 1] + 0.5 * g[o] + 0.25 * g[o + 1]; }
    for (let y = 1; y < BGV - 1; y++) for (let x = 0; x < GU; x++) { const o = y * GU + x; g[o] = 0.25 * tmp1[o - GU] + 0.5 * tmp1[o] + 0.25 * tmp1[o + GU]; }
  }
  function projectSlabs(tl) {
    const ce = Math.cos(tl), se = Math.sin(tl);
    for (let s = 0; s < NS; s++) slabTmp[s].fill(0);
    for (let i = 0; i < nB; i++) {
      const X = bX[i], Y = bY[i], Z = bZ[i], v = Z * ce - Y * se, g = slabTmp[slabOf(Y * ce + Z * se)];
      const gx = (X + U0) / DU, gy = (v + BV0) / DV, ix = gx | 0, iy = gy | 0;
      if (ix < 1 || iy < 1 || ix >= GU - 2 || iy >= BGV - 2) continue;
      const fx = gx - ix, fy = gy - iy, o = iy * GU + ix;
      g[o] += (1 - fx) * (1 - fy); g[o + 1] += fx * (1 - fy); g[o + GU] += (1 - fx) * fy; g[o + GU + 1] += fx * fy;
    }
    for (let s = 0; s < NS; s++) blur1(slabTmp[s]);
  }
  // Normalise at the key tilt so the darkest column reaches dustTau.
  let bMass = 1;
  {
    projectSlabs(TILT_KEY);
    const tot = new Float32Array(BGN);
    let n = 0;
    for (let i = 0; i < BGN; i++) { let s2 = 0; for (let s = 0; s < NS; s++) s2 += slabTmp[s][i]; if (s2 > 0) tot[n++] = s2; }
    const sorted = tot.subarray(0, n).sort();
    bMass = M.dustTau / (sorted[Math.floor(n * 0.995)] || 1);
  }
  // Dust steps: per band cell and slab, the optical depth in front of that
  // slab's middle, in 1/32 steps. Step k is the dust at tilt TOP + k * KF_STEP.
  const kf = new Array(KF_N).fill(null);
  function ensureKF(k) {
    if (kf[k]) return;
    projectSlabs(TILT_TOP + k * KF_STEP);
    const out = new Uint8Array(BGN * NS);
    for (let i = 0; i < BGN; i++) {
      let run = 0;
      const o = i * NS;
      for (let s = 0; s < NS; s++) {
        const here = slabTmp[s][i] * bMass;
        out[o + s] = Math.min(255, Math.round((run + 0.5 * here) * 32));
        run += here;
      }
    }
    kf[k] = out;
  }
  for (let k = 0; k < KF_UP_FRONT; k++) ensureKF(k);
  const work = new Uint8Array(BGN * NS); // the blended step the frame reads
  let lastA = -1, lastB = -1;
  const blobScale = bMass * 0.9;

  // Moving dust: rigid clumps and tendrils carried round with the disc,
  // each living one loop and fading in and out, so any drift is seamless.
  const lifeTurns = (R, v) => (v / Math.max(R, 1)) * LOOP / TAU; // turns per loop at linear speed v
  const groups = [];
  function addGroup(kind) {
    let R, ph;
    for (;;) {
      R = -dRd * Math.log(r() * r()) * 0.9;
      if (R < M.dustHole * 0.8 || R > dRmax * 0.9) continue;
      ph = r() * TAU;
      if (kind === 'fil' && Math.sin(ph) > -0.15) continue;
      if (kind === 'fil' && r() < 0.8 && Math.abs(R * Math.cos(ph)) > M.filNear * A * (0.5 + r())) continue;
      break;
    }
    const g = { R, ph0: ph, turns: lifeTurns(R, speedAt(R)), off: 0, blobs: [] };
    const tx = -Math.sin(ph), ty = Math.cos(ph);
    if (kind === 'clump') {
      const len = 14 + 30 * r(), wid = 3 + 4 * r();
      for (let i = 0; i < M.clumpN; i++) {
        const a = (r() + r() + r() - 1.5) * len, b = (r() + r() - 1) * wid;
        g.blobs.push(a * tx + b * Math.cos(ph), a * ty + b * Math.sin(ph), (r() + r() - 1) * hd * 1.4, M.clumpMass * (0.5 + r()));
      }
    } else {
      // A tendril lifts out of the plane, mostly upward into the bulge.
      const hgt = M.filH * (0.4 + 0.9 * r()) * (1 - 0.5 * R / dRmax), sgn = r() < 0.72 ? 1 : -1;
      const bend = (r() * 2 - 1) * 0.9, wob = r() * 6;
      for (let i = 0; i < M.filN; i++) {
        const s = Math.pow(r(), 0.8);
        const lat = (bend * s * s + 0.15 * Math.sin(s * 7 + wob)) * hgt * 0.8 + (r() - 0.5) * (1.5 + 3 * s);
        g.blobs.push(lat * tx, lat * ty + (r() - 0.5) * 6, sgn * s * hgt, M.filMass * Math.pow(1 - s, 0.6) * (0.5 + r()));
      }
    }
    g.blobs = new Float32Array(g.blobs);
    groups.push(g);
  }
  for (let i = 0; i < M.clumps; i++) addGroup('clump');
  for (let i = 0; i < M.fils; i++) addGroup('fil');
  groups.forEach((g, i) => { g.off = (i * 0.618034) % 1; });

  // Young clusters: rigid knots carried round, fading slowly in and out.
  const rC = rng(M.seed * 9973 + 3);
  const clusters = [];
  for (let c = 0; c < M.clusters; c++) {
    const R = (0.22 + 0.62 * rC()) * Rmax;
    const far = c < M.farClusters;
    const ph = far ? Math.PI * (0.15 + 0.7 * rC()) : Math.PI * (1.05 + 0.9 * rC());
    const sig = M.clusterSig * (0.6 + 0.8 * rC()), n = Math.round(M.clusterN * (0.5 + rC()));
    const mem = new Float32Array(n * 4);
    for (let i = 0; i < n; i++) {
      mem[i * 4] = (rC() + rC() + rC() - 1.5) * sig * 2.2; mem[i * 4 + 1] = (rC() + rC() + rC() - 1.5) * sig * 2;
      mem[i * 4 + 2] = (rC() - 0.5) * 4 + (rC() + rC() + rC() - 1.5) * sig; mem[i * 4 + 3] = M.clusterLum * (0.3 + 0.6 * rC() * rC());
    }
    clusters.push({ R, ph0: ph, turns: lifeTurns(R, speedAt(R)), off: (c * 0.381966 + 0.13) % 1, mem });
  }

  // Stars on necklaces. A ring (radius, height, brightness) carries n
  // identical beads; over one loop it turns m/n of a turn, so every bead
  // lands exactly on a neighbour's start: seamless, with no fades. Disc and
  // bulge are drawn from one stream in proportion, so any prefix of the list
  // is a fair sample; Density and Scale draw a prefix, cut on whole rings.
  function beads(R, v) {
    const x = (TAU * R) / (Math.max(v, 1e-3) * LOOP); // n/m wanted
    let best = null;
    for (let m = 1; m <= 6; m++) {
      const n = Math.max(1, Math.round(m * x));
      const err = Math.abs(n / m - x) / x;
      if (!best || err < best.err - 0.02) best = { n, m, err };
    }
    return best;
  }
  const rS = rng(M.seed * 9973 + 2);
  const DISC_SHARE = M.nDisc / NBASE;
  let cap = 0, N = 0;
  let sR, sZ, sW, sA, sQ, sT, sFirst;
  function growTo(n) {
    const c = Math.max(n, Math.ceil(cap * 1.6), 1 << 16);
    const fresh = [new Float32Array(c), new Float32Array(c), new Float32Array(c), new Float32Array(c),
      new Float64Array(c), new Float64Array(c), new Uint8Array(c)];
    if (cap) [sR, sZ, sW, sA, sQ, sT, sFirst].forEach((a, i) => fresh[i].set(a.subarray(0, N)));
    [sR, sZ, sW, sA, sQ, sT, sFirst] = fresh;
    cap = c;
  }
  function addRing(R, Z, wc, a, ph, v) {
    const { n, m } = beads(R, v);
    if (rS() * n > 1) return; // keep the expected bead count at one per sample
    if (N + n > cap) growTo(N + n);
    for (let j = 0; j < n; j++) {
      sR[N] = R; sZ[N] = Z; sW[N] = wc; sA[N] = a;
      sQ[N] = ph / TAU + j / n; sT[N] = m / n; sFirst[N] = j === 0 ? 1 : 0; N++;
    }
  }
  function sampleStar() {
    if (rS() < DISC_SHARE) {
      for (;;) {
        const thick = rS() < M.thickFrac;
        const R = -M.Rd * (thick ? 1.15 : 1) * Math.log(rS() * rS() + 1e-9);
        if (rS() > 1 / (1 + Math.exp((R - Rmax) / (0.06 * Rmax)))) continue;
        const hz = (thick ? M.hzThick : M.hz) * (1 - M.thin * smooth(0.35 * Rmax, Rmax, R));
        const z = Math.atanh(Math.min(0.995, Math.max(-0.995, 2 * rS() - 1)));
        const a = (0.35 + 0.65 * rS() * rS()) * (rS() < 0.004 ? 3 : 1);
        addRing(R, hz * z, warpAt(R) / Math.max(R, 1), a, rS() * TAU, speedAt(R));
        return;
      }
    }
    for (;;) {
      const rr = A / Math.sqrt(Math.pow(rS(), -2 / 3) - 1);
      if (rr > M.bulgeCap * A * (0.8 + 0.4 * rS())) continue;
      const ct = 2 * rS() - 1, st = Math.sqrt(1 - ct * ct);
      const R = rr * st, a = 0.35 + 0.65 * rS() * rS();
      addRing(R, rr * ct * M.bulgeQ, 0, a, rS() * TAU, M.bulgeSpin * speedAt(R));
      return;
    }
  }
  // The longest whole-ring prefix of at most n stars (growing the list if needed).
  function starPrefix(n) {
    while (N < n) sampleStar();
    let c = n;
    while (c > 0 && c < N && !sFirst[c]) c--;
    return c;
  }

  // ---------- tables ----------
  const TN = 16384, COS = new Float32Array(TN), SIN = new Float32Array(TN);
  for (let i = 0; i < TN; i++) { COS[i] = Math.cos(TAU * i / TN); SIN[i] = Math.sin(TAU * i / TN); }
  const ENV = new Float32Array(1025);
  for (let i = 0; i <= 1024; i++) { const f = i / 1024; ENV[i] = smooth(0, M.groupFade, f) * smooth(1, 1 - M.groupFade, f); }
  const EXPL = new Float32Array(16 * 256 + 1);
  for (let i = 0; i < EXPL.length; i++) EXPL[i] = Math.exp(-(i + 0.5) / 256);
  const WZ = M.depthW;
  const LUTN = 4096, LUTMAX = 6, TONE_M = 0.95;
  const toneOf = (a) => TONE_M * Math.pow(1 - Math.exp(-a / TONE_M), M.gamma);

  // Extinction of a point at band coords (u, v) and depth zc: the static
  // dust from the blended step, the moving dust from the moment grid (spread
  // evenly over mean +- sqrt(3) sigma in depth).
  function ext(u, v, zc, behindAll) {
    const gx = (u + U0) / DU;
    if (!(gx > 0 && gx < GU - 1)) return 1;

  // only depends on stars per projected area.
  let gain0 = 1;
  {
    const W = BASE_W, H = BASE_H, rk = rockOf(1);
    const V = { W, H, acc: new Float32Array(W * H), k: 1, CX: M.cx * W, CY: M.cy * H,
      ca: Math.cos(M.pa), sa: Math.sin(M.pa), sharp: 1, nS: starPrefix(NBASE), gS: 1, gC: 1, gB: 0, bgN: 0,
      motion: 1, tc: rk.c, ta: rk.a };

  // ---------- canvas, buffers, background ----------
  let W = 0, H = 0, acc, blurTmp, image, pix;
  let gw = 0, gh = 0, small, smallTmp, rowBuf, glowX0, glowWX;
  let bgX, bgY, bgA, bgK, bgPh, bgBig, bgMax = 0;

    canvas.height = window.innerHeight;

  // colour shows instead of washing out to white.

  let clock = 0, lastT = 0;

    ctx.putImageData(image, 0, 0);
  }

  const loop = createLoop({
    onFrame(dt) {
      drawFrame(dt, currentValues);
    },
  });
  loop.start();

  // SVG: a capped, uniform sample of the current frame's dots (see header).
  const SVG_STARS = 16000;
  function svgCircles(values) {
    const V = view, t = lastT, tl = tiltAt(V, t), ce = Math.cos(tl), se = Math.sin(tl);
    const kca = V.k * V.ca, ksa = V.k * V.sa, op = values.opacity;
    const rad = 0.35 + 0.35 * values.stroke;

      const gx = c.R * Math.cos(ph), gy = c.R * Math.sin(ph), rc = Math.cos(rot), rs = Math.sin(rot), wr = warpAt(c.R) / c.R;
      for (let i = 0; i < c.mem.length; i += 4) {
        const m = c.mem, X = gx + m[i] * rc - m[i + 1] * rs, Y = gy + m[i] * rs + m[i + 1] * rc, Z = m[i + 2] + wr * X;
        const v = Z * ce - Y * se;
        push(V.CX + X * kca + v * ksa, V.CY + X * ksa - v * kca, m[i + 3] * env * V.gC * ext(X, v, Y * ce + Z * se), rad);
      }
    }
    for (let i = 0; i < V.bgN; i++) {
      const dx = bgX[i] - V.CX, dy = bgY[i] - V.CY;
      const u = (dx * V.ca + dy * V.sa) / V.k, v = (dx * V.sa - dy * V.ca) / V.k;
      push(bgX[i], bgY[i], bgA[i] * V.gB * ext(u, v, 1e9, true), bgBig[i] ? rad * 1.6 : rad);
    }
    return out;
  }

  document.getElementById('btn-png-2x')?.addEventListener('click', () => exportPng(canvas, { multiplier: 2 }));
  document.getElementById('btn-png-4x')?.addEventListener('click', () => exportPng(canvas, { multiplier: 4 }));
  document.getElementById('btn-svg')?.addEventListener('click', () => exportSvg([], { width: canvas.width, height: canvas.height, circles: svgCircles(currentValues) }));
  document.getElementById('btn-baked')?.addEventListener('click', () => {
    bakeHtml({ sourceHtml: document.documentElement.outerHTML, values: panel.values }).catch((err) => console.error('bakeHtml failed', err));
  });
  document.getElementById('btn-source')?.addEventListener('click', () => {
    exportSource().catch((err) => console.error('exportSource failed', err));
  });
  document.getElementById('btn-prompt')?.addEventListener('click', () => {
    describeForAI({ pieceName: PIECE_ID, values: panel.values });
  });
</script>
