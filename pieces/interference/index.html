<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>linefield — interference</title>
<style>
  html, body { margin: 0; height: 100%; background: #0a0a0d; overflow: hidden; }
  canvas { display: block; width: 100vw; height: 100vh; }
  .lf-export-row { position: fixed; top: 12px; right: 12px; display: flex; gap: 6px; z-index: 9999; }
  .lf-export-row button { background: #222; color: #eee; border: 1px solid #444; border-radius: 4px;
    padding: 4px 8px; font: 11px -apple-system, sans-serif; cursor: pointer; }
</style>
</head>
<body>
<canvas id="canvas"></canvas>

<div class="lf-export-row" data-lf-panel>
  <button id="btn-baked">Baked HTML</button>
  <button id="btn-png">PNG</button>
  <button id="btn-svg">SVG</button>
  <button id="btn-prompt">Copy AI Prompt</button>
</div>

<script type="module">
  import { createControlPanel } from '../../shared/controls.js';
  import { createLoop } from '../../shared/anim.js';
  import { hslToRgb } from '../../shared/color.js';
  import { exportPng, exportSvg, bakeHtml, describeForAI } from '../../shared/export.js';

  const PIECE_ID = 'interference';
  const canvas = document.getElementById('canvas');
  const ctx = canvas.getContext('2d');

  function resize() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
  }
  window.addEventListener('resize', resize);
  resize();

  // Ring count is derived per frame from density — no persistent array.
  const BASE_RINGS = 60;
  const SEG = 64; // polygon segments per ring, for SVG export fidelity
  let paths = [];

  const baked = window.__LF_BAKED_VALUES__;
  const panel = baked ? null : createControlPanel({
    pieceId: PIECE_ID,
    onChange: () => {},
    extraControls: [
      { name: 'split', label: 'Split', type: 'range', min: 0, max: 2, step: 0.01, default: 1 },
    ],
  });
  const currentValues = baked || panel.values;

  // One family of concentric rings, centred at (cx, cy).
  function drawFamily(cx, cy, rings, spacing, rgb, values) {
    const [r, g, b] = rgb;
    ctx.strokeStyle = `rgba(${r},${g},${b},${values.opacity})`;
    if (values.glow > 0) ctx.shadowColor = `rgba(${r},${g},${b},0.6)`;

    for (let i = 1; i <= rings; i++) {
      const radius = i * spacing;
      const pts = [];
      ctx.beginPath();
      for (let s = 0; s <= SEG; s++) {
        const a = (s / SEG) * Math.PI * 2;
        const x = cx + Math.cos(a) * radius;
        const y = cy + Math.sin(a) * radius;
        if (s === 0) ctx.moveTo(x, y);
        else ctx.lineTo(x, y);
        pts.push([x, y]);
      }
      ctx.stroke();
      paths.push(pts);
    }
  }

  function drawFrame(dt, elapsed, values) {
    ctx.fillStyle = values.invert ? '#f2f2f4' : '#0a0a0d';
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    paths = [];
    const rings = Math.max(4, Math.round(BASE_RINGS * values.density));
    // Tight spacing is what makes the moiré appear; scale tunes it.
    const spacing = 6 + 14 * values.scale;
    const t = elapsed * values.speed * 0.4 * values.motion;

    ctx.lineWidth = 0.4 + values.stroke * 0.9;
    ctx.shadowBlur = values.glow > 0 ? values.glow * 7 : 0;

    const cx = canvas.width / 2;
    const cy = canvas.height / 2;
    // The two centres drift apart and back; their separation drives the moiré.
    const sep = (60 + Math.sin(t + values.phase * Math.PI) * 55) * values.split;
    const dir = (values.angle * Math.PI) / 180;
    const dx = Math.cos(dir) * sep;
    const dy = Math.sin(dir) * sep;

    const light = values.invert ? 0.35 : 0.6;
    drawFamily(cx - dx, cy - dy, rings, spacing,
      hslToRgb(values.hue, values.saturation, light), values);
    drawFamily(cx + dx, cy + dy, rings, spacing,
      hslToRgb(values.hueB, values.saturation, light), values);
  }

  const loop = createLoop({
    onFrame(dt, elapsed) {
      drawFrame(dt, elapsed, currentValues);
    },
  });
  loop.start();

  document.getElementById('btn-png')?.addEventListener('click', () => exportPng(canvas, { multiplier: 2 }));
  document.getElementById('btn-svg')?.addEventListener('click', () => exportSvg(paths, { width: canvas.width, height: canvas.height }));
  document.getElementById('btn-baked')?.addEventListener('click', () => {
    bakeHtml({ sourceHtml: document.documentElement.outerHTML, values: panel.values });
  });
  document.getElementById('btn-prompt')?.addEventListener('click', () => {
    describeForAI({ pieceName: PIECE_ID, values: panel.values });
  });
</script>
</body>
</html>
