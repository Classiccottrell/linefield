<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<!-- Without this a phone uses a ~980px layout viewport, so the panel's
     max-width:640px sheet rule never matches and the page renders zoomed
     out — the controls become an unusable corner card. -->
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>linefield — interference</title>
<style>
  html, body { margin: 0; height: 100%; background: #0a0a0d; overflow: hidden; }
  canvas { display: block; width: 100vw; height: 100vh; }
  .lf-export-row { position: fixed; top: 12px; right: 12px; display: flex; gap: 6px; z-index: 9999; }
  .lf-export-row button { background: #222; color: #eee; border: 1px solid #444; border-radius: 4px;
    padding: 4px 8px; font: 11px -apple-system, sans-serif; cursor: pointer; }
</style>
</head>
<body>
<canvas id="canvas"></canvas>

<div class="lf-export-row" data-lf-panel>
  <button id="btn-baked">Baked HTML</button>
  <button id="btn-source">Source</button>
  <button id="btn-png-2x">PNG 2x</button>
  <button id="btn-png-4x">PNG 4x</button>
  <button id="btn-svg">SVG</button>
  <button id="btn-prompt">Copy AI Prompt</button>
</div>

<script type="module">
  import { createControlPanel } from '../../shared/controls.js';
  import { createLoop } from '../../shared/anim.js';
  import { hslToRgb, paletteHsl } from '../../shared/color.js';
  import { exportPng, exportSvg, bakeHtml, exportSource, describeForAI } from '../../shared/export.js';
  import { createPointer } from '../../shared/pointer.js';
  import { createCursorOverlay, modeFactor } from '../../shared/cursor-modes.js';
  import { rotatePoint } from '../../shared/project.js';

  const PIECE_ID = 'interference';
  const canvas = document.getElementById('canvas');
  const ctx = canvas.getContext('2d');

  function resize() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
  }
  window.addEventListener('resize', resize);
  resize();

  // Ring count is derived per frame from density — no persistent array.
  const BASE_RINGS = 60;
  const SEG = 64; // polygon segments per ring, for SVG export fidelity
  let paths = [];

  const PRESETS = {
    whisper: { opacity: 0.16, stroke: 0.6, density: 0.35, saturation: 0.08, glow: 0 },
    ink:     { opacity: 0.9, stroke: 1.2, density: 0.5, saturation: 0, glow: 0 },
    neon:    { opacity: 0.85, stroke: 0.7, density: 1, saturation: 1, glow: 1.2 },
    drift:   { opacity: 0.28, stroke: 0.5, density: 0.4, speed: 0.25, motion: 1.7, saturation: 0.25 },
    dense:   { opacity: 0.8, stroke: 0.6, density: 1.8, speed: 0.7, saturation: 0.6, glow: 0 },
  };

  const baked = window.__LF_BAKED_VALUES__;
  const panel = baked ? null : createControlPanel({
    pieceId: PIECE_ID,
    presets: PRESETS,
    onChange: () => {},
    extraControls: [
      { name: 'split', label: 'Split', type: 'range', min: 0, max: 2, step: 0.01, default: 1, category: 'visual' },
    ],
    defaults: { hue: 185, hueB: 320, saturation: 0.75, colorMode: 'gradient', colorA: '#00eaff', colorB: '#ff00aa' },
  });
  const currentValues = baked || panel.values;
  const pointer = createPointer({ canvas });
  const overlay = createCursorOverlay();

  // Every ring is one continuous stroked path, so per-mark scaling isn't
  // available. No canvas rotation transform is applied here (unlike
  // contour-grid/meridian/tether), so pointer.x/y are usable directly —
  // no un-rotate step needed.
  const SWELL_MAG = 34;
  const SWELL_RADIUS = 200;

  // One family of concentric rings, centred at (cx, cy).
  function drawFamily(cx, cy, rings, spacing, rgb, values, k) {
    const [r, g, b] = rgb;
    ctx.strokeStyle = `rgba(${r},${g},${b},${values.opacity})`;
    const lineWidth = ctx.lineWidth;
    const mode = values.cursorInteraction;

    for (let i = 1; i <= rings; i++) {
      const radius = i * spacing;
      const pts = [];
      ctx.beginPath();
      for (let s = 0; s <= SEG; s++) {
        const a = (s / SEG) * Math.PI * 2;
        let x = cx + Math.cos(a) * radius;
        let y = cy + Math.sin(a) * radius;
        if (k && (mode === 'Grow' || mode === 'Shrink' || mode === 'Vortex')) {
          const amp = mode === 'Shrink' ? 1 / (1 + k * 1.5) : 1 + k * 1.5;
          const swellRadius = SWELL_RADIUS * amp;
          const f = Math.max(0, 1 - Math.hypot(x - pointer.x, y - pointer.y) / swellRadius);
          if (f) {
            if (mode === 'Vortex') {
              // True tangential rotation about the pointer, not an offset
              // toward/away from it.
              const rp = rotatePoint(x - pointer.x, y - pointer.y, 0, { roll: f * k * 1.1 });
              x = pointer.x + rp.x;
              y = pointer.y + rp.y;
            } else {
              // Radial swell, always outward: Grow amplifies the magnitude
              // and radius by amp; Shrink is the identical formula with
              // amp < 1, so the bulge contracts to a smaller, weaker dimple
              // rather than reversing direction.
              const dx = x - pointer.x, dy = y - pointer.y;
              const d = Math.hypot(dx, dy) || 1;
              const push = f * SWELL_MAG * amp;
              x += (dx / d) * push;
              y += (dy / d) * push;
            }
          }
        }
        if (s === 0) ctx.moveTo(x, y);
        else ctx.lineTo(x, y);
        pts.push([x, y]);
      }
      if (values.glow > 0) {
        ctx.lineWidth = lineWidth + values.glow * 3;
        ctx.globalAlpha = values.glow * 0.25;
        ctx.stroke();
        ctx.lineWidth = lineWidth;
        ctx.globalAlpha = 1;
      }
      ctx.stroke();
      paths.push(pts);
    }
  }

  function drawFrame(dt, elapsed, values) {
    ctx.fillStyle = values.invert ? '#f2f2f4' : '#0a0a0d';
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    paths = [];
    const rings = Math.max(4, Math.round(BASE_RINGS * values.density));
    // Tight spacing is what makes the moiré appear; scale tunes it.
    const spacing = 6 + 14 * values.scale;
    const t = elapsed * values.speed * 0.4 * values.motion;

    ctx.lineWidth = 0.4 + values.stroke * 0.9;

    const cx = canvas.width / 2;
    const cy = canvas.height / 2;
    // The two centres drift apart and back; their separation drives the moiré.
    const sep = (60 + Math.sin(t + values.phase * Math.PI) * 55) * values.split;
    const dir = (values.angle * Math.PI) / 180;
    const dx = Math.cos(dir) * sep;
    const dy = Math.sin(dir) * sep;

    const light = values.invert ? 0.35 : 0.6;
    // Off at pointer 0, off when cursorInteraction is 'None', eased by
    // influence. No term routed through values.speed or values.split (both
    // user-zeroable).
    const k = modeFactor(values, pointer);

    const stopA = paletteHsl(values, 0);
    drawFamily(cx - dx, cy - dy, rings, spacing,
      hslToRgb(stopA.h, stopA.s, light), values, k);

    // Second family's centre eases toward the pointer: Attract only — this
    // was the piece's one existing pointer response, now scoped to the mode
    // it matches rather than firing for every mode. Clamp the EASE FRACTION,
    // not k: k can reach 2 (pointer control's max), and a lerp factor above
    // 1 overshoots the pointer and reflects past it.
    let cx2 = cx + dx, cy2 = cy + dy;
    if (k && values.cursorInteraction === 'Attract') {
      const ease = Math.min(k, 1);
      cx2 = (cx + dx) + (pointer.x - (cx + dx)) * ease;
      cy2 = (cy + dy) + (pointer.y - (cy + dy)) * ease;
    }
    const stopB = paletteHsl(values, 1);
    drawFamily(cx2, cy2, rings, spacing,
      hslToRgb(stopB.h, stopB.s, light), values, k);

    const [ovR, ovG, ovB] = hslToRgb(stopA.h, stopA.s, light);
    overlay.draw(ctx, `rgb(${ovR},${ovG},${ovB})`, k);
  }

  const loop = createLoop({
    onFrame(dt, elapsed) {
      pointer.step();
      const k = modeFactor(currentValues, pointer);
      overlay.step(currentValues.cursorInteraction, k, pointer);
      drawFrame(dt, elapsed, currentValues);
    },
  });
  loop.start();

  document.getElementById('btn-png-2x')?.addEventListener('click', () => exportPng(canvas, { multiplier: 2 }));
  document.getElementById('btn-png-4x')?.addEventListener('click', () => exportPng(canvas, { multiplier: 4 }));
  document.getElementById('btn-svg')?.addEventListener('click', () => exportSvg(paths, { width: canvas.width, height: canvas.height }));
  document.getElementById('btn-baked')?.addEventListener('click', () => {
    bakeHtml({ sourceHtml: document.documentElement.outerHTML, values: panel.values }).catch((err) => console.error('bakeHtml failed', err));
  });
  document.getElementById('btn-source')?.addEventListener('click', () => {
    exportSource().catch((err) => console.error('exportSource failed', err));
  });
  document.getElementById('btn-prompt')?.addEventListener('click', () => {
    describeForAI({ pieceName: PIECE_ID, values: panel.values });
  });
</script>
</body>
</html>
