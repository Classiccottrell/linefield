<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<!-- Without this a phone uses a ~980px layout viewport, so the panel's
     max-width:640px sheet rule never matches and the page renders zoomed
     out — the controls become an unusable corner card. -->
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>linefield — louvre</title>
<style>
  html, body { margin: 0; height: 100%; background: #0a0a0d; overflow: hidden; }
  canvas { display: block; width: 100vw; height: 100vh; }
  .lf-export-row { position: fixed; top: 12px; right: 12px; display: flex; gap: 6px; z-index: 9999; }
  .lf-export-row button { background: #222; color: #eee; border: 1px solid #444; border-radius: 4px;
    padding: 4px 8px; font: 11px -apple-system, sans-serif; cursor: pointer; }
</style>
</head>
<body>
<canvas id="canvas"></canvas>

<!--
  louvre — a blind of tilted hairline slats crossed by one slow diagonal
  beam of light, which brightens the band of slats it passes and carries a
  few motes drifting in it. No frame: at low Scale the slats fade out
  softly, from about Scale 1.8 they run edge to edge.
  Text-safe zone: the lower left, below and left of the beam, clear through
  the whole sweep.
  Anchor: where the beam crosses the slats, its brightest stretch just above
  and right of centre.
-->

<div class="lf-export-row" data-lf-panel>
  <button id="btn-baked">Baked HTML</button>
  <button id="btn-source">Source</button>
  <button id="btn-png-2x">PNG 2x</button>
  <button id="btn-png-4x">PNG 4x</button>
  <button id="btn-svg">SVG</button>
  <button id="btn-prompt">Copy AI Prompt</button>
</div>

<script type="module">
  import { createControlPanel } from '../../shared/controls.js';
  import { createLoop } from '../../shared/anim.js';
  import { hslToRgb, paletteHsl } from '../../shared/color.js';
  import { exportPng, exportSvg, bakeHtml, exportSource, describeForAI } from '../../shared/export.js';

  const PIECE_ID = 'louvre';
  const canvas = document.getElementById('canvas');
  const ctx = canvas.getContext('2d');

  function resize() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
  }
  window.addEventListener('resize', resize);
  resize();

  // Geometry lives in field coordinates (origin at the frame's centre, x
  // right, y down) and is rotated into screen space by hand, so SVG export
  // carries Angle exactly as the canvas draws it.
  const BASE_MOTES = 64;
  const MOTE_POOL = 320;
  const SLAT_TILT = -Math.tan((2.2 * Math.PI) / 180); // right end slightly higher
  const BEAM_DIR = (60 * Math.PI) / 180;              // falls from upper left to lower right
  const SWEEP_PERIOD = 22;                            // seconds per back-and-forth at Speed 1
  // Where in the sweep the clock starts: a still taken a few seconds in
  // shows the beam just right of centre, moving left.
  const SWEEP_START = 1.48;
  const FACE_LINES = 9;                               // extra hairlines on a lit slat's face
  const STOP_PX = 9;                                  // gradient stop spacing along a lit run
  const BASE_STOP_PX = 28;                            // coarser stops for the faint base runs

  // One fixed pool of mote parameters, drawn once; Density takes a prefix,
  // so no reseed is needed when it changes. Positions are in beam terms
  // (along: fraction of the beam's run; across: in beam sigmas), so motes
  // stay inside the beam wherever it sweeps.
  const motes = Array.from({ length: MOTE_POOL }, () => ({
    along: Math.random() * 2 - 1,
    across: (Math.random() + Math.random() - 1) * 1.5,
    vel: 0.004 + Math.random() * 0.012,               // fraction of unit per second
    wob: 0.15 + Math.random() * 0.35,
    wf: 0.15 + Math.random() * 0.35,
    wp: Math.random() * Math.PI * 2,
    r: 0.5 + Math.random() * 0.7,
    bright: 0.45 + Math.random() * 0.55,
    tw: 0.4 + Math.random() * 0.9,
  }));

  let paths = [];
  let circles = [];

  const PRESETS = {
    whisper: { opacity: 0.6, stroke: 0.7, density: 0.6, beam: 0.8 },
    ink:     { opacity: 1, stroke: 1.4, density: 1, saturation: 0, glow: 0, beam: 0.75 },
    neon:    { opacity: 0.9, stroke: 1, density: 1.1, saturation: 0.9, glow: 1.1 },
    drift:   { opacity: 0.8, density: 0.8, speed: 0.4, motion: 1.8, beam: 1.6, scale: 1.62 },
    dense:   { opacity: 0.85, stroke: 0.8, density: 1.8, beam: 0.85, scale: 1.98 },
  };

  const baked = window.__LF_BAKED_VALUES__;
  const panel = baked ? null : createControlPanel({
    pieceId: PIECE_ID,
    presets: PRESETS,
    onChange: () => {},
    extraControls: [
      // Width of the beam across its own axis; the motes spread with it.
      { name: 'beam', label: 'Beam width', type: 'range', min: 0.2, max: 2, step: 0.01, default: 1, category: 'form' },
    ],
    defaults: { hue: 18, hueB: 52, saturation: 0, scale: 1.8, colorMode: 'gradient', colorA: '#ff4d00', colorB: '#ffdd00' },
  });
  const currentValues = baked || panel.values;

  let clock = 0;

  const smooth = (e0, e1, v) => {
    const t = Math.min(1, Math.max(0, (v - e0) / (e1 - e0)));
    return t * t * (3 - 2 * t);
  };

  function drawFrame(dt, elapsed, values) {
    const W = canvas.width, H = canvas.height;
    ctx.globalCompositeOperation = 'source-over';
    ctx.fillStyle = values.invert ? '#f2f2f4' : '#0a0a0d';
    ctx.fillRect(0, 0, W, H);
    clock += dt * values.speed;

    paths = [];
    circles = [];
    const unit = Math.min(W, H);
    const halfDiag = 0.5 * Math.hypot(W, H);
    // Scale frames the blind: a soft-edged patch at low Scale, the whole
    // canvas from about 1.8, bleeding past every edge at 2. The patch has
    // no outline; its slats simply fade out (a rounded, superelliptic
    // falloff), so there is never a hard rectangle.
    const k = 0.1 + 0.5 * values.scale;
    const RX = Math.max(1, W * k), RY = Math.max(1, H * k);
    const fieldAt = (x, y) => {
      const d = Math.cbrt(Math.abs(x / RX) ** 3 + Math.abs(y / RY) ** 3);
      return 1 - smooth(0.6, 1, d);
    };
    // The beam and its sweep scale with the visible patch, up to the frame.
    const size = unit * Math.min(1, 0.15 + 0.47 * values.scale);
    const fx = W * 0.5, fy = H * 0.5;
    const th = (values.angle * Math.PI) / 180;
    const ca = Math.cos(th), sa = Math.sin(th);
    const toScreen = (x, y) => [fx + x * ca - y * sa, fy + x * sa + y * ca];

    // The sweep, as a sum so the three stay independent: Phase sets where
    // the beam rests, Motion how far it swings either side of that (easing
    // off above 1), Speed how fast. Bounded, so it never reverses mid-swing.
    const swing = Math.sin((Math.PI * 2 * clock) / SWEEP_PERIOD + SWEEP_START);
    const reach = (2 * values.motion) / (1 + values.motion);
    const bp = size * (0.12 + 0.1 * Math.sin(values.phase * Math.PI) + 0.17 * reach * swing);
    const beta = BEAM_DIR + 0.3 * (bp / size - 0.12); // the beam leans a little as it travels
    const dx = Math.cos(beta), dy = Math.sin(beta);
    const nx = -dy, ny = dx;
    const sigma = size * 0.04 * values.beam;
    const sHot = -0.1 * size;
    const sSpread = 0.22 * size;
    // Beam intensity at a field point: Gaussian across the beam, with a
    // gentler swell along it so one stretch, not the whole stripe, is the
    // brightest. A wide, dim halo keeps the slats near the beam faintly
    // present; far from it they fall to a trace.
    const along = (x, y) => (x - bp) * dx + y * dy;
    const across = (x, y) => (x - bp) * nx + y * ny;
    function lightAt(x, y) {
      const a = across(x, y) / sigma;
      const s = (along(x, y) - sHot) / sSpread;
      return Math.exp(-0.5 * a * a) * (0.12 + 0.88 * Math.exp(-0.5 * s * s));
    }
    // A smaller patch can carry brighter idle slats, so its soft edge
    // reads; at full canvas they drop to a trace to keep the ink down.
    const haloW = sigma * 2 + size * 0.1;
    const idle = 0.024 + 0.026 * (1 - smooth(0.3, 1, values.scale));
    function ambientAt(x, y) {
      const a = across(x, y) / haloW;
      return idle + 0.04 * Math.exp(-0.5 * a * a);
    }

    const light = values.invert ? 0.12 : 0.86 - 0.26 * values.saturation;
    const op = values.opacity;
    const ambGain = values.invert ? 1.6 : 1;
    ctx.lineWidth = 0.3 + 0.5 * values.stroke;
    ctx.lineCap = 'butt';
    ctx.lineJoin = 'round';
    ctx.globalCompositeOperation = values.invert ? 'source-over' : 'lighter';

    const rgbAt = (f) => {
      const { h, s } = paletteHsl(values, f);
      return hslToRgb(h, s, light);
    };

    // A run with its alpha sampled along it, as one gradient stroke.
    // `level(x, y)` gives the alpha at a field point; `step` the spacing.
    function strokeRun(ax, ay, bx, by, rgb, level, step) {
      const len = Math.hypot(bx - ax, by - ay);
      if (len < 0.5) return;
      const p0 = toScreen(ax, ay), p1 = toScreen(bx, by);
      const grad = ctx.createLinearGradient(p0[0], p0[1], p1[0], p1[1]);
      const n = Math.max(2, Math.ceil(len / step) + 1);
      let peak = 0;
      for (let q = 0; q < n; q++) {
        const t = q / (n - 1);
        const alpha = Math.min(1, level(ax + (bx - ax) * t, ay + (by - ay) * t));
        peak = Math.max(peak, alpha);
        grad.addColorStop(t, `rgba(${rgb[0]},${rgb[1]},${rgb[2]},${alpha.toFixed(4)})`);
      }
      if (peak < 0.004) return;
      ctx.strokeStyle = grad;
      ctx.beginPath();
      ctx.moveTo(p0[0], p0[1]);
      ctx.lineTo(p1[0], p1[1]);
      ctx.stroke();
      paths.push([p0, p1]);
    }

    // The stretch of one slat inside the beam (within 3 sigma of its centre
    // line), lit by it: its two edges, then the hairlines across its face,
    // so the brightest crossing builds by overlap. The lines are parallel,
    // so one gradient per gain serves them all; each is its own stroke so
    // the 'lighter' overlap still adds up.
    function litSlat(x0, y0, x1, y1, rgb) {
      const a0 = across(x0, y0), a1 = across(x1, y1);
      const cut = 3 * sigma + gap;
      let t0 = 0, t1 = 1;
      if (Math.abs(a1 - a0) > 1e-6) {
        const ta = (-cut - a0) / (a1 - a0), tb = (cut - a0) / (a1 - a0);
        t0 = Math.max(0, Math.min(ta, tb));
        t1 = Math.min(1, Math.max(ta, tb));
      } else if (Math.abs(a0) > cut) return;
      if (t1 <= t0) return;
      const ax = x0 + (x1 - x0) * t0, ay = y0 + (y1 - y0) * t0;
      const bx = x0 + (x1 - x0) * t1, by = y0 + (y1 - y0) * t1;
      const len = Math.hypot(bx - ax, by - ay);
      if (len < 0.5) return;
      const n = Math.max(2, Math.ceil(len / STOP_PX) + 1);
      const lit = new Float32Array(n);
      let peak = 0;
      for (let q = 0; q < n; q++) {
        const t = q / (n - 1);
        const x = ax + (bx - ax) * t, y = ay + (by - ay) * t;
        lit[q] = lightAt(x, y) * fieldAt(x, y) * op;
        peak = Math.max(peak, lit[q]);
      }
      if (peak < 0.004) return;
      const c0 = toScreen(ax, ay), c1 = toScreen(bx, by);
      const gradFor = (gain) => {
        const grad = ctx.createLinearGradient(c0[0], c0[1], c1[0], c1[1]);
        for (let q = 0; q < n; q++) {
          grad.addColorStop(q / (n - 1), `rgba(${rgb[0]},${rgb[1]},${rgb[2]},${Math.min(1, gain * lit[q]).toFixed(4)})`);
        }
        return grad;
      };
      const line = (o) => {
        const p0 = toScreen(ax, ay + o), p1 = toScreen(bx, by + o);
        ctx.beginPath();
        ctx.moveTo(p0[0], p0[1]);
        ctx.lineTo(p1[0], p1[1]);
        ctx.stroke();
        paths.push([p0, p1]);
      };
      ctx.strokeStyle = gradFor(1.4);
      line(-0.5 * gap);
      line(0.5 * gap);
      ctx.strokeStyle = gradFor(0.85);
      for (let q = 1; q <= FACE_LINES; q++) line((q / (FACE_LINES + 1) - 0.5) * gap);
    }

    // Liang-Barsky: the [t0, t1] stretch of screen segment p0-p1 inside the
    // frame (grown by `m`), or null if it misses.
    function clipToFrame(p0, p1, m) {
      let t0 = 0, t1 = 1;
      const ddx = p1[0] - p0[0], ddy = p1[1] - p0[1];
      const edges = [[-ddx, p0[0] + m], [ddx, W + m - p0[0]], [-ddy, p0[1] + m], [ddy, H + m - p0[1]]];
      for (const [pp, qq] of edges) {
        if (Math.abs(pp) < 1e-9) { if (qq < 0) return null; continue; }
        const r = qq / pp;
        if (pp < 0) t0 = Math.max(t0, r);
        else t1 = Math.min(t1, r);
      }
      return t0 < t1 ? [t0, t1] : null;
    }

    // Slats: evenly spaced pairs of close hairlines across the whole patch,
    // each one only as long as the patch and the frame allow.
    const pitch = unit * 0.028 * (0.6 + 0.25 * values.scale) / Math.sqrt(values.density);
    const gap = Math.max(1.5, pitch * 0.3);
    const yMax = Math.min(RY, halfDiag + pitch);
    const rows = Math.floor(yMax / pitch);
    const base = (x, y) => ambGain * ambientAt(x, y) * fieldAt(x, y) * op;
    for (let j = -rows; j <= rows; j++) {
      const yMid = j * pitch;
      const xs = Math.min(RX, Math.sqrt(Math.max(0, halfDiag * halfDiag - yMid * yMid)) + pitch);
      if (xs < 1) continue;
      // Trim the slat to the part that lands on screen, at any Angle.
      const span = clipToFrame(toScreen(-xs, yMid - SLAT_TILT * xs), toScreen(xs, yMid + SLAT_TILT * xs), gap + 4);
      if (!span) continue;
      const xa = -xs + 2 * xs * span[0], xb = -xs + 2 * xs * span[1];
      const rgb = rgbAt(0.5 + 0.5 * (yMid / yMax));
      const yl = yMid + SLAT_TILT * xa, yr = yMid + SLAT_TILT * xb;
      for (const e of [-0.5, 0.5]) {
        strokeRun(xa, yl + e * gap, xb, yr + e * gap, rgb, base, BASE_STOP_PX);
      }
      litSlat(xa, yl, xb, yr, rgb);
    }

    // Motes: fine and soft, riding the beam, densest around its brightest
    // stretch and fading with the patch.
    const moteCount = Math.min(MOTE_POOL, Math.max(8, Math.round(BASE_MOTES * values.density)));
    const runHalf = 0.75 * size;
    const moteR = 0.5 + 0.5 * values.stroke;
    for (let i = 0; i < moteCount; i++) {
      const m = motes[i];
      let s = m.along * runHalf + values.motion * m.vel * unit * clock;
      s = ((s + runHalf) % (2 * runHalf) + 2 * runHalf) % (2 * runHalf) - runHalf;
      s += sHot;
      const a = (m.across + values.motion * m.wob * Math.sin(clock * m.wf + m.wp)) * sigma;
      const x = bp + s * dx + a * nx;
      const y = s * dy + a * ny;
      const I = lightAt(x, y) * fieldAt(x, y) * m.bright * (0.7 + 0.3 * Math.sin(clock * m.tw + m.wp));
      if (I < 0.03) continue;
      const [px, py] = toScreen(x, y);
      if (px < -4 || py < -4 || px > W + 4 || py > H + 4) continue;
      const rgb = rgbAt(Math.min(1, Math.max(0, 0.5 + 0.5 * (y / yMax))));
      const r = m.r * moteR;
      const alpha = Math.min(1, 1.15 * I * op);
      ctx.fillStyle = `rgba(${rgb[0]},${rgb[1]},${rgb[2]},${(alpha * 0.16).toFixed(4)})`;
      ctx.beginPath();
      ctx.arc(px, py, r * 2.8, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = `rgba(${rgb[0]},${rgb[1]},${rgb[2]},${alpha.toFixed(4)})`;
      ctx.beginPath();
      ctx.arc(px, py, r, 0, Math.PI * 2);
      ctx.fill();
      circles.push({ cx: px, cy: py, r, fill: 'black', opacity: alpha });
    }

    // Optional bloom on the anchor. Off by default: the crossing already
    // brightens from the lit faces overlapping there.
    if (values.glow > 0) {
      const [gx, gy] = toScreen(bp + sHot * dx, sHot * dy);
      const rgb = rgbAt(0.5 + 0.5 * ((sHot * dy) / yMax));
      const gr = size * 0.09 * (0.6 + 0.4 * values.glow);
      const grad = ctx.createRadialGradient(gx, gy, 0, gx, gy, gr);
      grad.addColorStop(0, `rgba(${rgb[0]},${rgb[1]},${rgb[2]},${0.28 * values.glow * op})`);
      grad.addColorStop(1, `rgba(${rgb[0]},${rgb[1]},${rgb[2]},0)`);
      ctx.fillStyle = grad;
      ctx.fillRect(gx - gr, gy - gr, gr * 2, gr * 2);
    }
    ctx.globalCompositeOperation = 'source-over';
  }

  const loop = createLoop({
    onFrame(dt, elapsed) {
      drawFrame(dt, elapsed, currentValues);
    },
  });
  loop.start();

  document.getElementById('btn-png-2x')?.addEventListener('click', () => exportPng(canvas, { multiplier: 2 }));
  document.getElementById('btn-png-4x')?.addEventListener('click', () => exportPng(canvas, { multiplier: 4 }));
  document.getElementById('btn-svg')?.addEventListener('click', () => exportSvg(paths, { width: canvas.width, height: canvas.height, circles }));
  document.getElementById('btn-baked')?.addEventListener('click', () => {
    bakeHtml({ sourceHtml: document.documentElement.outerHTML, values: panel.values })
      .catch((err) => console.error('bakeHtml failed', err));
  });
  document.getElementById('btn-source')?.addEventListener('click', () => {
    exportSource().catch((err) => console.error('exportSource failed', err));
  });
  document.getElementById('btn-prompt')?.addEventListener('click', () => {
    describeForAI({ pieceName: PIECE_ID, values: panel.values });
  });
</script>
</body>
</html>
