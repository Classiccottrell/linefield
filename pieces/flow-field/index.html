<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<!-- Without this a phone uses a ~980px layout viewport, so the panel's
     max-width:640px sheet rule never matches and the page renders zoomed
     out — the controls become an unusable corner card. -->
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>linefield — flow-field</title>
<style>
  html, body { margin: 0; height: 100%; background: #0a0a0d; overflow: hidden; }
  canvas { display: block; width: 100vw; height: 100vh; }
  .lf-export-row { position: fixed; top: 12px; right: 12px; display: flex; gap: 6px; z-index: 9999; }
  .lf-export-row button { background: #222; color: #eee; border: 1px solid #444; border-radius: 4px;
    padding: 4px 8px; font: 11px -apple-system, sans-serif; cursor: pointer; }
</style>
</head>
<body>
<canvas id="canvas"></canvas>

<div class="lf-export-row" data-lf-panel>
  <button id="btn-baked">Baked HTML</button>
  <button id="btn-source">Source</button>
  <button id="btn-png-2x">PNG 2x</button>
  <button id="btn-png-4x">PNG 4x</button>
  <button id="btn-svg">SVG</button>
  <button id="btn-prompt">Copy AI Prompt</button>
</div>

<script type="module">
  import { createControlPanel } from '../../shared/controls.js';
  import { createLoop } from '../../shared/anim.js';
  import { hslToRgb, paletteHsl } from '../../shared/color.js';
  import { simplex2 } from '../../shared/noise.js';
  import { exportPng, exportSvg, bakeHtml, exportSource, describeForAI } from '../../shared/export.js';
  import { createResizeBatcher } from '../../shared/resize.js';

  // flow-field — particles confined to one soft organic region around a
  // quiet central void, trailing hairlines that gather brightness only
  // where their paths happen to cross.
  //
  // Text-safe zone: the left third of the frame. The region sits right of
  // centre, inside the central square.
  // Anchor: the band's inner edge, upper right of the void — checked by
  // measuring the rendered brightest cluster, not assumed from the field's
  // formula, since the noise-driven current doesn't distribute evenly.
  const PIECE_ID = 'flow-field';
  const canvas = document.getElementById('canvas');
  const ctx = canvas.getContext('2d');

  // Base count deliberately modest — Density (up to 2x) is the loud knob.
  // House-look ink 0.03-0.15 needed a real cut from the old 280/56-point-
  // trail/0.045-fade version (which measured 0.27): fewer particles,
  // shorter trails, and a full clear each frame (see drawFrame) so trails
  // never accumulate brightness across frames under `lighter`, only within
  // one frame where paths actually cross.
  const BASE_COUNT = 580;
  const TRAIL_MAX = 40; // points captured per particle; also the ink budget
  let particles = [];
  let paths = [];

  // Composition: one soft organic ring around a quiet central void — not a
  // filled disc. Particles respawn the moment they drift into the void or
  // off the ring's outer edge, so the hole in the middle stays genuinely
  // empty instead of just thin.
  const FOCUS = { x: 0.58, y: 0.46 };
  const VOID_R = 0.10;   // true zero inside this normalized radius (the void)
  const RING_PEAK = 0.22; // mask reaches 1 here
  const RING_OUTER = 0.36; // true zero at/beyond this radius

  function smoothstep(a, b, x) {
    const t = Math.max(0, Math.min(1, (x - a) / (b - a)));
    return t * t * (3 - 2 * t);
  }

  function maskValue(x, y, width, height) {
    const r = Math.min(width, height);
    const dx = (x - width * FOCUS.x) / r;
    const dy = (y - height * FOCUS.y) / r;
    const d = Math.sqrt(dx * dx + dy * dy);
    if (d <= VOID_R) return 0;
    if (d <= RING_PEAK) return smoothstep(VOID_R, RING_PEAK, d);
    if (d <= RING_OUTER) return 1 - smoothstep(RING_PEAK, RING_OUTER, d);
    return 0;
  }

  function sampleFocusPoint(width, height) {
    const r = Math.min(width, height);
    for (let i = 0; i < 8; i++) {
      const ang = Math.random() * Math.PI * 2;
      const rad = Math.sqrt(Math.random()) * RING_OUTER * r;
      const x = width * FOCUS.x + Math.cos(ang) * rad;
      const y = height * FOCUS.y + Math.sin(ang) * rad;
      if (x >= 0 && x <= width && y >= 0 && y <= height && maskValue(x, y, width, height) > 0) {
        return { x, y };
      }
    }
    return { x: width * FOCUS.x, y: height * (FOCUS.y - RING_PEAK) };
  }

  function seedParticles(count) {
    particles = Array.from({ length: count }, () => {
      const spot = sampleFocusPoint(canvas.width, canvas.height);
      return { x: spot.x, y: spot.y, trail: [] };
    });
  }

  const PRESETS = {
    whisper: { opacity: 0.9, stroke: 0.55, density: 0.4, glow: 0 },
    ink:     { opacity: 1, stroke: 1.2, density: 0.9, glow: 0 },
    neon:    { opacity: 0.9, stroke: 0.9, density: 1, saturation: 0.85, glow: 1.2 },
    drift:   { opacity: 0.8, stroke: 0.75, density: 0.75, speed: 0.4, motion: 1.8 },
    dense:   { opacity: 0.85, stroke: 0.9, density: 1.7, glow: 0.6 },
  };

  const baked = window.__LF_BAKED_VALUES__;
  const panel = baked ? null : createControlPanel({
    pieceId: PIECE_ID,
    presets: PRESETS,
    onChange: (name, value, values) => {
      if (name === 'density') seedParticles(Math.round(BASE_COUNT * values.density));
    },
    extraControls: [
      // Off by default: full trails are this piece's identity. On, each
      // particle draws only its bright head — a sparser, dottier read.
      { name: 'mode', label: 'Particle mode', type: 'checkbox', default: false, category: 'visual' },
    ],
    // Pinned deliberately, not inherited — keeps flow-field's hue TAKEN to
    // the next contributor even if the shared defaults ever move.
    // saturation: 0 per house look §1; colour lives in the neon preset.
    defaults: { hue: 200, hueB: 280, saturation: 0, colorMode: 'gradient', colorA: '#00aaff', colorB: '#aa00ff' },
  });
  const currentValues = baked || panel.values;

  function applyResize({ width, height }) {
    canvas.width = width;
    canvas.height = height;
    seedParticles(Math.round(BASE_COUNT * currentValues.density));
  }
  // dpr fixed at 1: flow-field draws in CSS-pixel space (canvas.width ===
  // window.innerWidth), and particle coords / exportPng's multiplier both
  // assume that — a real devicePixelRatio backing store would break both.
  const resizeBatcher = createResizeBatcher(document.body, applyResize, 1);
  resizeBatcher.evaluate(); // sizes the canvas + seeds particles before the first frame

  function fieldAngle(x, y, elapsed, values) {
    const noiseScale = 0.002 * (0.2 + values.scale);
    const n = simplex2(
      x * noiseScale + elapsed * 0.05 * values.motion,
      y * noiseScale + values.phase
    );
    // Give the noise a shared travelling current. Without it the field's
    // local directions close into a vortex, which overlaps funnel's
    // orbital read; this keeps the ribbons moving through the frame.
    const wave = Math.sin(
      (y / canvas.height) * Math.PI * 2.2 +
      (x / canvas.width) * 1.4 +
      elapsed * 0.05 * values.motion
    );
    const current = 0.45 + wave * 0.55;
    return current + n * 0.9 + (values.angle * Math.PI) / 180;
  }

  function drawFrame(dt, elapsed, values) {
    const W = canvas.width, H = canvas.height;
    const light = values.invert ? 0.14 : 0.86 - 0.24 * values.saturation;
    const stopA = paletteHsl(values, 0);
    const [r, g, b] = hslToRgb(stopA.h, stopA.s, light);
    const stopB = paletteHsl(values, 1);
    const [rB, gB, bB] = hslToRgb(stopB.h, stopB.s, light);

    // Full clear, not a low-alpha fade: under `lighter` compositing (below)
    // a partial fade would re-stroke nearly the same trail geometry on top
    // of itself every frame and blow out to white. A full clear means ink
    // coverage is exactly what this frame draws, not an unbounded
    // accumulation across frames — reset to source-over for it regardless
    // of what the previous frame left the context in.
    ctx.globalCompositeOperation = 'source-over';
    ctx.fillStyle = values.invert ? '#f2f2f4' : '#0a0a0d';
    ctx.fillRect(0, 0, W, H);
    ctx.globalCompositeOperation = values.invert ? 'source-over' : 'lighter';
    ctx.lineCap = 'round';

    paths = [];
    // Hairline floor 0.4-0.9px at stroke:1; slower than the old 260px/s —
    // that number was tuned for a 2.5px stroke, and at this hairline width
    // 90px/s already clears displacement-over-stroke-width by a wide margin.
    const lineWidth = 0.4 + values.stroke * 0.5;
    const baseAlpha = values.opacity * (values.invert ? 0.42 : 0.32);

    for (const p of particles) {
      // Mask read at the pre-move position: this frame's stroke belongs to
      // where the particle currently is, not where it's about to land.
      const m = maskValue(p.x, p.y, W, H);
      const angle = fieldAngle(p.x, p.y, elapsed, values);
      const speed = 90 * values.speed * (dt || 0.016);
      const nx = p.x + Math.cos(angle) * speed;
      const ny = p.y + Math.sin(angle) * speed;

      if (m > 0) p.trail.push([p.x, p.y]);
      if (p.trail.length > TRAIL_MAX) p.trail.shift();

      p.x = nx;
      p.y = ny;

      // Respawn on leaving the canvas OR the mask (not the canvas alone) —
      // otherwise the field advects particles back out to uniform coverage
      // within a few seconds and the void/negative space collapses.
      const outOfMask = maskValue(p.x, p.y, W, H) <= 0;
      if (p.x < 0 || p.x > W || p.y < 0 || p.y > H || outOfMask) {
        const spot = sampleFocusPoint(W, H);
        p.x = spot.x;
        p.y = spot.y;
        p.trail = [];
        continue;
      }

      if (p.trail.length < 2) continue;

      // Tied to the field's own local direction instead of an arbitrary
      // position/time sine — the colour is the flow, a compass rather than
      // decorative banding unrelated to what's moving.
      const mix = (Math.sin(angle) + 1) / 2;
      const cr = (r + (rB - r) * mix) | 0;
      const cg = (g + (gB - g) * mix) | 0;
      const cb = (b + (bB - b) * mix) | 0;

      const drawPoly = (pts) => {
        ctx.beginPath();
        ctx.moveTo(pts[0][0], pts[0][1]);
        for (let i = 1; i < pts.length; i++) ctx.lineTo(pts[i][0], pts[i][1]);
        ctx.stroke();
      };

      ctx.lineWidth = lineWidth;
      if (values.mode) {
        // Particle mode: only the bright head, a sparser dotty read.
        const head = p.trail.slice(-4);
        if (values.glow > 0) {
          ctx.lineWidth = lineWidth + values.glow * 2.5;
          ctx.strokeStyle = `rgba(${cr},${cg},${cb},${Math.min(1, baseAlpha * m * values.glow * 0.3)})`;
          drawPoly(head);
          ctx.lineWidth = lineWidth;
        }
        ctx.strokeStyle = `rgba(${cr},${cg},${cb},${Math.min(1, baseAlpha * m * 1.8)})`;
        drawPoly(head);
        paths.push(head);
      } else {
        if (values.glow > 0) {
          ctx.lineWidth = lineWidth + values.glow * 2.5;
          ctx.strokeStyle = `rgba(${cr},${cg},${cb},${Math.min(1, baseAlpha * m * values.glow * 0.3)})`;
          drawPoly(p.trail);
          ctx.lineWidth = lineWidth;
        }
        ctx.strokeStyle = `rgba(${cr},${cg},${cb},${Math.min(1, baseAlpha * m)})`;
        drawPoly(p.trail);
        // Brighter head on the last few points, so motion reads as a
        // travelling mark rather than a static line.
        const head = p.trail.slice(-6);
        if (head.length > 1) {
          ctx.strokeStyle = `rgba(${cr},${cg},${cb},${Math.min(1, baseAlpha * m * 1.6)})`;
          drawPoly(head);
        }
        paths.push(p.trail.slice());
      }
    }

    ctx.globalCompositeOperation = 'source-over';
  }

  const loop = createLoop({
    onFrame(dt, elapsed) {
      resizeBatcher.evaluate();
      drawFrame(dt, elapsed, currentValues);
    },
  });
  loop.start();

  document.getElementById('btn-png-2x')?.addEventListener('click', () => exportPng(canvas, { multiplier: 2 }));
  document.getElementById('btn-png-4x')?.addEventListener('click', () => exportPng(canvas, { multiplier: 4 }));
  document.getElementById('btn-svg')?.addEventListener('click', () => exportSvg(paths, { width: canvas.width, height: canvas.height }));
  document.getElementById('btn-baked')?.addEventListener('click', () => {
    bakeHtml({ sourceHtml: document.documentElement.outerHTML, values: panel.values }).catch((err) => console.error('bakeHtml failed', err));
  });
  document.getElementById('btn-source')?.addEventListener('click', () => {
    exportSource().catch((err) => console.error('exportSource failed', err));
  });
  document.getElementById('btn-prompt')?.addEventListener('click', () => {
    describeForAI({ pieceName: PIECE_ID, values: panel.values });
  });
</script>
</body>
</html>
