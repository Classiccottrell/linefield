<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>linefield - flow-field</title>
<style>
  html, body { margin: 0; height: 100%; background: #0a0a0d; overflow: hidden; }
  canvas { display: block; width: 100vw; height: 100vh; }
  .lf-export-row { position: fixed; top: 12px; right: 12px; display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 6px; max-width: calc(100vw - 24px); z-index: 9999; }
  .lf-export-row button { background: #222; color: #eee; border: 1px solid #444; border-radius: 4px;
    padding: 4px 8px; font: 11px -apple-system, sans-serif; cursor: pointer; }
</style>
</head>
<body>
<canvas id="canvas" role="img" aria-label="Animated flow field background"></canvas>

<div class="lf-export-row" data-lf-panel>
  <button id="btn-baked">Baked HTML</button>
  <button id="btn-source">Source</button>
  <button id="btn-png-2x">PNG 2x</button>
  <button id="btn-png-4x">PNG 4x</button>
  <button id="btn-svg">SVG</button>
  <button id="btn-prompt">Copy AI Prompt</button>
</div>

<script type="module">
  import { createControlPanel } from '../../shared/controls.js';
  import { createLoop } from '../../shared/anim.js';
  import { hslToRgb, paletteHsl } from '../../shared/color.js';
  import { simplex2 } from '../../shared/noise.js';
  import { exportPng, exportSvg, bakeHtml, exportSource, describeForAI } from '../../shared/export.js';
  import { createResizeBatcher } from '../../shared/resize.js';

  const PIECE_ID = 'flow-field';
  const canvas = document.getElementById('canvas');
  const ctx = canvas.getContext('2d');
  const BASE_RIBBONS = 15;
  const SAMPLES = 72;
  let paths = [];

  const PRESETS = {
    whisper: { opacity: 0.2, stroke: 0.45, density: 0.38, saturation: 0.12, glow: 0, mode: false, scale: 0.82 },
    ink:     { opacity: 0.9, stroke: 1.35, density: 0.7, saturation: 0.08, glow: 0, mode: false, scale: 1.1 },
    neon:    { opacity: 0.84, stroke: 0.7, density: 0.95, saturation: 0.9, glow: 1.55, mode: true, angle: 14, scale: 1.18 },
    drift:   { opacity: 0.48, stroke: 0.62, density: 0.58, saturation: 0.35, glow: 0.15, mode: false, speed: 0.32, motion: 1.75, phase: 0.75, scale: 1.32 },
    dense:   { opacity: 0.62, stroke: 0.62, density: 1.65, saturation: 0.25, glow: 0.35, mode: true, speed: 0.88, motion: 0.7, phase: 0.15, scale: 1.48 },
  };

  const baked = window.__LF_BAKED_VALUES__;
  const panel = baked ? null : createControlPanel({
    pieceId: PIECE_ID,
    presets: PRESETS,
    onChange() {},
    extraControls: [
      { name: 'mode', label: 'Particle mode', type: 'checkbox', default: false, category: 'visual' },
    ],
    defaults: { hue: 34, hueB: 168, saturation: 0.48, colorMode: 'gradient', colorA: '#f2a65a', colorB: '#53c7a5' },
  });
  const currentValues = baked || panel.values;

  function resize({ width, height }) {
    canvas.width = width;
    canvas.height = height;
  }
  const resizeBatcher = createResizeBatcher(document.body, resize, 1);
  resizeBatcher.evaluate();

  function rotatePoint(x, y, cx, cy, theta) {
    const dx = x - cx;
    const dy = y - cy;
    const cos = Math.cos(theta);
    const sin = Math.sin(theta);
    return [cx + dx * cos - dy * sin, cy + dx * sin + dy * cos];
  }

  function transformPoints(points, theta, cx, cy) {
    return points.map(([x, y]) => rotatePoint(x, y, cx, cy, theta));
  }

  function paletteColor(values, f, light) {
    const { h, s } = paletteHsl(values, f);
    const [baseR, baseG, baseB] = hslToRgb(h, s, light);
    return values.invert ? [255 - baseR, 255 - baseG, 255 - baseB] : [baseR, baseG, baseB];
  }

  function circlePoints(x, y, radius, theta, cx, cy) {
    const points = [];
    for (let i = 0; i <= 16; i++) {
      const a = i / 16 * Math.PI * 2;
      points.push(rotatePoint(x + Math.cos(a) * radius, y + Math.sin(a) * radius, cx, cy, theta));
    }
    return points;
  }

  function laneSeed(index, count) {
    const topCount = Math.ceil(count / 2);
    if (index < topCount) {
      return 0.1 + (topCount <= 1 ? 0.12 : index / (topCount - 1) * 0.3);
    }
    const lowerIndex = index - topCount;
    const lowerCount = count - topCount;
    return 0.9 - (lowerCount <= 1 ? 0.12 : lowerIndex / (lowerCount - 1) * 0.3);
  }

  function streamPoint(u, seed, index, elapsed, values) {
    const t = elapsed * values.motion * 0.13;
    const travel = elapsed * values.speed * 0.1;
    const gapSide = seed < 0.5 ? -1 : 1;
    const distanceFromGap = Math.max(0.05, Math.abs(seed - 0.5) * 2);
    const voidWidth = 0.18 + values.scale * 0.045;
    const voidShape = Math.exp(-Math.pow((u - 0.43) / voidWidth, 2));
    const voidPush = gapSide * voidShape * (0.065 + distanceFromGap * 0.045) * (0.8 + values.scale * 0.18);
    const currentWave = Math.sin(u * Math.PI * 2.1 - travel * 2.4 + seed * 7.1 + values.phase * Math.PI * 2);
    const secondaryWave = Math.sin(u * Math.PI * 4.3 + t + index * 0.8) * 0.014 * values.motion;
    const quietBend = Math.sin((u - 0.43) * Math.PI * 1.3) * 0.018 * values.motion;
    const grain = simplex2(u * 2.2 + index * 0.31, t * 0.35 + seed * 4) * 0.012 * values.motion;
    const y = seed + currentWave * (0.026 + values.scale * 0.012) * (0.5 + values.motion * 0.25)
      + secondaryWave + quietBend + grain + voidPush;
    const x = (u - 0.04) / 0.92;
    return [x * canvas.width, y * canvas.height];
  }

  function pathFor(seed, index, values, elapsed, start = 0, end = 1) {
    const points = [];
    const from = Math.max(0, start);
    const to = Math.min(1, end);
    const sampleCount = Math.max(2, Math.ceil((to - from) * SAMPLES));
    for (let i = 0; i <= sampleCount; i++) {
      const u = from + (to - from) * (i / sampleCount);
      points.push(streamPoint(u, seed, index, elapsed, values));
    }
    return points;
  }

  function drawPath(points) {
    ctx.beginPath();
    ctx.moveTo(points[0][0], points[0][1]);
    for (let i = 1; i < points.length; i++) ctx.lineTo(points[i][0], points[i][1]);
    ctx.stroke();
  }

  function drawFrame(dt, elapsed, values) {
    const W = canvas.width;
    const H = canvas.height;
    const cx = W / 2;
    const cy = H / 2;
    const theta = values.angle * Math.PI / 180;
    const count = Math.max(4, Math.round(BASE_RIBBONS * values.density));
    const lineWidth = 0.35 + values.stroke * 1.35;
    const bg = values.invert ? '#f1f2ee' : '#0a0a0d';
    const light = values.invert ? 0.34 : 0.66;

    ctx.fillStyle = bg;
    ctx.fillRect(0, 0, W, H);
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    paths = [];

    ctx.save();
    ctx.translate(cx, cy);
    ctx.rotate(theta);
    ctx.translate(-cx, -cy);

    for (let i = 0; i < count; i++) {
      const seed = laneSeed(i, count);
      const quietBias = Math.abs(seed - 0.5) * 2;
      const hierarchy = 0.55 + quietBias * 0.45 + (i % 4 === 0 ? 0.22 : 0);
      const colorMix = 0.12 + seed * 0.76;
      const [r, g, b] = paletteColor(values, colorMix, light);
      const alpha = Math.min(1, values.opacity * hierarchy * (0.72 + quietBias * 0.2));
      const width = lineWidth * (0.72 + hierarchy * 0.48);
      const fullPath = pathFor(seed, i, values, elapsed);

      ctx.strokeStyle = `rgba(${r},${g},${b},${alpha})`;
      ctx.lineWidth = width;

      if (!values.mode) {
        if (values.glow > 0) {
          ctx.lineWidth = width + values.glow * 3.2;
          ctx.globalAlpha = values.glow * 0.15 * alpha;
          drawPath(fullPath);
          ctx.globalAlpha = 1;
          ctx.lineWidth = width;
        }
        drawPath(fullPath);
        paths.push(transformPoints(fullPath, theta, cx, cy));

        const pulseU = (elapsed * values.speed * 0.075 + i / Math.max(1, count) + values.phase * 0.13) % 1;
        const pulse = pathFor(seed, i, values, elapsed, Math.max(0, pulseU - 0.075), Math.min(1, pulseU + 0.035));
        ctx.strokeStyle = `rgba(${r},${g},${b},${Math.min(1, alpha * 1.65)})`;
        ctx.lineWidth = width * 1.25;
        drawPath(pulse);
        paths.push(transformPoints(pulse, theta, cx, cy));
      } else {
        const particleCount = Math.max(1, Math.round(1 + values.density * 0.7));
        for (let p = 0; p < particleCount; p++) {
          const headU = (elapsed * values.speed * 0.11 + i / Math.max(1, count) + p / particleCount * 0.5 + values.phase * 0.15) % 1;
          const tail = pathFor(seed, i, values, elapsed, Math.max(0, headU - 0.065), headU);
          ctx.strokeStyle = `rgba(${r},${g},${b},${Math.min(1, alpha * 1.45)})`;
          ctx.lineWidth = width * 1.2;
          if (values.glow > 0) {
            ctx.lineWidth = width * 1.2 + values.glow * 3;
            ctx.globalAlpha = values.glow * 0.18 * alpha;
            drawPath(tail);
            ctx.globalAlpha = 1;
            ctx.lineWidth = width * 1.2;
          }
          drawPath(tail);
          const head = tail[tail.length - 1];
          const radius = 1.1 + values.stroke * 1.15;
          ctx.fillStyle = `rgba(${r},${g},${b},${Math.min(1, alpha * 1.8)})`;
          ctx.beginPath();
          ctx.arc(head[0], head[1], radius, 0, Math.PI * 2);
          ctx.fill();
          paths.push(transformPoints(tail, theta, cx, cy));
          paths.push(circlePoints(head[0], head[1], radius, theta, cx, cy));
        }
      }
    }

    ctx.restore();
  }

  const loop = createLoop({
    onFrame(dt, elapsed) {
      resizeBatcher.evaluate();
      drawFrame(dt, elapsed, currentValues);
    },
  });
  loop.start();

  document.getElementById('btn-png-2x')?.addEventListener('click', () => exportPng(canvas, { multiplier: 2 }));
  document.getElementById('btn-png-4x')?.addEventListener('click', () => exportPng(canvas, { multiplier: 4 }));
  document.getElementById('btn-svg')?.addEventListener('click', () => exportSvg(paths, { width: canvas.width, height: canvas.height }));
  document.getElementById('btn-baked')?.addEventListener('click', () => bakeHtml({ sourceHtml: document.documentElement.outerHTML, values: panel.values }).catch((err) => console.error('bakeHtml failed', err)));
  document.getElementById('btn-source')?.addEventListener('click', () => exportSource().catch((err) => console.error('exportSource failed', err)));
  document.getElementById('btn-prompt')?.addEventListener('click', () => describeForAI({ pieceName: PIECE_ID, values: panel.values }));
</script>
</body>
</html>
