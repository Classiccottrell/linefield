<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>linefield — flow-field</title>
<style>
  html, body { margin: 0; height: 100%; background: #0a0a0d; overflow: hidden; }
  canvas { display: block; width: 100vw; height: 100vh; }
  .lf-export-row { position: fixed; top: 12px; right: 12px; display: flex; gap: 6px; z-index: 9999; }
  .lf-export-row button { background: #222; color: #eee; border: 1px solid #444; border-radius: 4px;
    padding: 4px 8px; font: 11px -apple-system, sans-serif; cursor: pointer; }
</style>
</head>
<body>
<canvas id="canvas"></canvas>

<div class="lf-export-row" data-lf-panel>
  <button id="btn-baked">Baked HTML</button>
  <button id="btn-png">PNG</button>
  <button id="btn-svg">SVG</button>
  <button id="btn-prompt">Copy AI Prompt</button>
</div>

<script type="module">
  import { createControlPanel } from '../../shared/controls.js';
  import { createLoop } from '../../shared/anim.js';
  import { hslToRgb } from '../../shared/color.js';
  import { simplex2 } from '../../shared/noise.js';
  import { exportPng, exportSvg, bakeHtml, describeForAI } from '../../shared/export.js';

  const PIECE_ID = 'flow-field';
  const canvas = document.getElementById('canvas');
  const ctx = canvas.getContext('2d');

  function resize() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
  }
  window.addEventListener('resize', resize);
  resize();

  const PARTICLE_COUNT = 800;
  let particles = [];
  let paths = [];

  function seedParticles() {
    particles = Array.from({ length: PARTICLE_COUNT }, () => ({
      x: Math.random() * canvas.width,
      y: Math.random() * canvas.height,
      trail: [],
    }));
  }
  seedParticles();
  window.addEventListener('resize', seedParticles);

  const panel = createControlPanel({
    pieceId: PIECE_ID,
    onChange: () => {},
    extraControls: [
      { name: 'mode', label: 'Particle mode', type: 'checkbox', default: true },
    ],
  });

  function fieldAngle(x, y, elapsed, values) {
    const noiseScale = 0.002 * (0.2 + values.scale);
    const n = simplex2(
      x * noiseScale + elapsed * 0.05 * values.motion,
      y * noiseScale + values.phase
    );
    return n * Math.PI * 2 + (values.angle * Math.PI) / 180;
  }

  function drawFrame(dt, elapsed, values) {
    const [r, g, b] = hslToRgb(values.hue, values.saturation, 0.55);
    const [rB, gB, bB] = hslToRgb(values.hueB, values.saturation, 0.55);

    ctx.fillStyle = values.invert ? 'rgba(255,255,255,0.08)' : 'rgba(10,10,13,0.08)';
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    paths = [];
    const lineWidth = 0.5 + values.stroke * 2;

    for (const p of particles) {
      const angle = fieldAngle(p.x, p.y, elapsed, values);
      const speed = 40 * values.speed * (dt || 0.016);
      const nx = p.x + Math.cos(angle) * speed;
      const ny = p.y + Math.sin(angle) * speed;

      const mix = (Math.sin(elapsed * 0.1 + p.x * 0.001) + 1) / 2;
      const cr = r + (rB - r) * mix;
      const cg = g + (gB - g) * mix;
      const cb = b + (bB - b) * mix;
      const [fr, fg, fb] = values.invert ? [255 - cr, 255 - cg, 255 - cb] : [cr, cg, cb];

      ctx.strokeStyle = `rgba(${fr | 0},${fg | 0},${fb | 0},${values.opacity})`;
      ctx.lineWidth = lineWidth;
      if (values.glow > 0) {
        ctx.shadowBlur = values.glow * 8;
        ctx.shadowColor = `rgba(${fr | 0},${fg | 0},${fb | 0},0.6)`;
      } else {
        ctx.shadowBlur = 0;
      }

      if (values.mode) {
        ctx.beginPath();
        ctx.moveTo(p.x, p.y);
        ctx.lineTo(nx, ny);
        ctx.stroke();
        paths.push([[p.x, p.y], [nx, ny]]);
      }

      p.x = nx;
      p.y = ny;

      if (p.x < 0 || p.x > canvas.width || p.y < 0 || p.y > canvas.height) {
        p.x = Math.random() * canvas.width;
        p.y = Math.random() * canvas.height;
        p.trail = [];
      }

      if (!values.mode) {
        p.trail.push([p.x, p.y]);
        if (p.trail.length > 40) p.trail.shift();

        if (p.trail.length > 1) {
          ctx.beginPath();
          ctx.moveTo(p.trail[0][0], p.trail[0][1]);
          for (let i = 1; i < p.trail.length; i++) {
            ctx.lineTo(p.trail[i][0], p.trail[i][1]);
          }
          ctx.stroke();
          paths.push(p.trail.slice());
        }
      }
    }
  }

  const loop = createLoop({
    onFrame(dt, elapsed) {
      drawFrame(dt, elapsed, panel.values);
    },
  });
  loop.start();

  document.getElementById('btn-png').addEventListener('click', () => exportPng(canvas, { multiplier: 2 }));
  document.getElementById('btn-svg').addEventListener('click', () => exportSvg(paths, { width: canvas.width, height: canvas.height }));
  document.getElementById('btn-baked').addEventListener('click', () => {
    bakeHtml({ sourceHtml: document.documentElement.outerHTML, values: panel.values });
  });
  document.getElementById('btn-prompt').addEventListener('click', () => {
    describeForAI({ pieceName: PIECE_ID, values: panel.values });
  });
</script>
</body>
</html>
