<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>linefield — flow-field</title>
<style>
  html, body { margin: 0; height: 100%; background: #0a0a0d; overflow: hidden; }
  canvas { display: block; width: 100vw; height: 100vh; }
  .lf-export-row { position: fixed; top: 12px; right: 12px; display: flex; gap: 6px; z-index: 9999; }
  .lf-export-row button { background: #222; color: #eee; border: 1px solid #444; border-radius: 4px;
    padding: 4px 8px; font: 11px -apple-system, sans-serif; cursor: pointer; }
</style>
</head>
<body>
<canvas id="canvas"></canvas>

<div class="lf-export-row" data-lf-panel>
  <button id="btn-baked">Baked HTML</button>
  <button id="btn-png-2x">PNG 2x</button>
  <button id="btn-png-4x">PNG 4x</button>
  <button id="btn-svg">SVG</button>
  <button id="btn-prompt">Copy AI Prompt</button>
</div>

<script type="module">
  import { createControlPanel } from '../../shared/controls.js';
  import { createLoop } from '../../shared/anim.js';
  import { hslToRgb } from '../../shared/color.js';
  import { simplex2 } from '../../shared/noise.js';
  import { exportPng, exportSvg, bakeHtml, describeForAI } from '../../shared/export.js';

  const PIECE_ID = 'flow-field';
  const canvas = document.getElementById('canvas');
  const ctx = canvas.getContext('2d');

  function resize() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
  }
  window.addEventListener('resize', resize);
  resize();

  // Base count is deliberately modest so the default reads as a background;
  // the Density slider is what makes it loud (up to 2x).
  const BASE_COUNT = 500;
  let particles = [];
  let paths = [];

  function seedParticles(count) {
    particles = Array.from({ length: count }, () => ({
      x: Math.random() * canvas.width,
      y: Math.random() * canvas.height,
      trail: [],
    }));
  }

  const PRESETS = {
    whisper: { opacity: 0.16, stroke: 0.5, density: 0.4, saturation: 0.05, glow: 0 },
    ink:     { opacity: 1, stroke: 1.9, density: 0.7, saturation: 0, glow: 0 },
    neon:    { opacity: 0.9, stroke: 0.9, density: 1.3, saturation: 0.95, glow: 1.1 },
    drift:   { opacity: 0.45, stroke: 0.8, density: 0.6, speed: 0.3, motion: 1.7 },
    dense:   { opacity: 0.55, stroke: 0.6, density: 2, speed: 0.9, saturation: 0.7 },
  };

  const baked = window.__LF_BAKED_VALUES__;
  const panel = baked ? null : createControlPanel({
    pieceId: PIECE_ID,
    presets: PRESETS,
    onChange: (name, value, values) => {
      if (name === 'density') seedParticles(Math.round(BASE_COUNT * values.density));
    },
    extraControls: [
      // Defaults off: continuous mode's long ribbons are this piece's identity.
      // In particle mode it renders short dashes that read too much like grain-field.
      { name: 'mode', label: 'Particle mode', type: 'checkbox', default: false },
    ],
    // Pinned deliberately, not inherited. These happen to equal the shared
    // control defaults, but stating them here is what makes 200/280 visible as
    // TAKEN to the next contributor grepping pieces' `defaults` blocks for a
    // free hue — and keeps flow-field's violet if the shared defaults ever move.
    defaults: { hue: 200, hueB: 280, saturation: 0.6 },
  });
  const currentValues = baked || panel.values;

  seedParticles(Math.round(BASE_COUNT * currentValues.density));
  window.addEventListener('resize', () =>
    seedParticles(Math.round(BASE_COUNT * currentValues.density))
  );

  function fieldAngle(x, y, elapsed, values) {
    const noiseScale = 0.002 * (0.2 + values.scale);
    const n = simplex2(
      x * noiseScale + elapsed * 0.05 * values.motion,
      y * noiseScale + values.phase
    );
    return n * Math.PI * 2 + (values.angle * Math.PI) / 180;
  }

  function drawFrame(dt, elapsed, values) {
    const [r, g, b] = hslToRgb(values.hue, values.saturation, 0.55);
    const [rB, gB, bB] = hslToRgb(values.hueB, values.saturation, 0.55);

    // Low fade alpha: each frame only partially clears, so the streaks a
    // particle leaves behind persist long enough to read as flowing lines.
    ctx.fillStyle = values.invert ? 'rgba(255,255,255,0.045)' : 'rgba(10,10,13,0.045)';
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    paths = [];
    const lineWidth = 0.3 + values.stroke * 1.2;

    for (const p of particles) {
      const angle = fieldAngle(p.x, p.y, elapsed, values);
      // Base px/sec must stay well above lineWidth, or each frame's segment is
      // shorter than the stroke is wide and renders as a dot, not a line.
      const speed = 260 * values.speed * (dt || 0.016);
      const nx = p.x + Math.cos(angle) * speed;
      const ny = p.y + Math.sin(angle) * speed;

      const mix = (Math.sin(elapsed * 0.1 + p.x * 0.001) + 1) / 2;
      const cr = r + (rB - r) * mix;
      const cg = g + (gB - g) * mix;
      const cb = b + (bB - b) * mix;
      const [fr, fg, fb] = values.invert ? [255 - cr, 255 - cg, 255 - cb] : [cr, cg, cb];

      ctx.strokeStyle = `rgba(${fr | 0},${fg | 0},${fb | 0},${values.opacity})`;
      ctx.lineWidth = lineWidth;

      if (values.mode) {
        ctx.beginPath();
        ctx.moveTo(p.x, p.y);
        ctx.lineTo(nx, ny);
        if (values.glow > 0) {
          // Underlay pass: wider, dimmer stroke approximates bloom cheaply
          // (canvas shadowBlur costs 5-10x per draw call at this element count).
          ctx.lineWidth = lineWidth + values.glow * 3;
          ctx.globalAlpha = values.glow * 0.25;
          ctx.stroke();
          ctx.lineWidth = lineWidth;
          ctx.globalAlpha = 1;
        }
        ctx.stroke();
        paths.push([[p.x, p.y], [nx, ny]]);
      }

      p.x = nx;
      p.y = ny;

      if (p.x < 0 || p.x > canvas.width || p.y < 0 || p.y > canvas.height) {
        p.x = Math.random() * canvas.width;
        p.y = Math.random() * canvas.height;
        p.trail = [];
      }

      if (!values.mode) {
        p.trail.push([p.x, p.y]);
        if (p.trail.length > 40) p.trail.shift();

        if (p.trail.length > 1) {
          ctx.beginPath();
          ctx.moveTo(p.trail[0][0], p.trail[0][1]);
          for (let i = 1; i < p.trail.length; i++) {
            ctx.lineTo(p.trail[i][0], p.trail[i][1]);
          }
          if (values.glow > 0) {
            ctx.lineWidth = lineWidth + values.glow * 3;
            ctx.globalAlpha = values.glow * 0.25;
            ctx.stroke();
            ctx.lineWidth = lineWidth;
            ctx.globalAlpha = 1;
          }
          ctx.stroke();
          paths.push(p.trail.slice());
        }
      }
    }
  }

  const loop = createLoop({
    onFrame(dt, elapsed) {
      drawFrame(dt, elapsed, currentValues);
    },
  });
  loop.start();

  document.getElementById('btn-png-2x')?.addEventListener('click', () => exportPng(canvas, { multiplier: 2 }));
  document.getElementById('btn-png-4x')?.addEventListener('click', () => exportPng(canvas, { multiplier: 4 }));
  document.getElementById('btn-svg')?.addEventListener('click', () => exportSvg(paths, { width: canvas.width, height: canvas.height }));
  document.getElementById('btn-baked')?.addEventListener('click', () => {
    bakeHtml({ sourceHtml: document.documentElement.outerHTML, values: panel.values }).catch((err) => console.error('bakeHtml failed', err));
  });
  document.getElementById('btn-prompt')?.addEventListener('click', () => {
    describeForAI({ pieceName: PIECE_ID, values: panel.values });
  });
</script>
</body>
</html>
