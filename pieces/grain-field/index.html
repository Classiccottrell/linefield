<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<!-- Without this a phone uses a ~980px layout viewport, so the panel's
     max-width:640px sheet rule never matches and the page renders zoomed
     out — the controls become an unusable corner card. -->
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>linefield — grain-field</title>
<style>
  html, body { margin: 0; height: 100%; background: #0a0a0d; overflow: hidden; }
  canvas { display: block; width: 100vw; height: 100vh; }
  .lf-export-row { position: fixed; top: 12px; right: 12px; display: flex; gap: 6px; z-index: 9999; }
  .lf-export-row button { background: #222; color: #eee; border: 1px solid #444; border-radius: 4px;
    padding: 4px 8px; font: 11px -apple-system, sans-serif; cursor: pointer; }
</style>
</head>
<body>
<canvas id="canvas"></canvas>

<div class="lf-export-row" data-lf-panel>
  <button id="btn-baked">Baked HTML</button>
  <button id="btn-source">Source</button>
  <button id="btn-png-2x">PNG 2x</button>
  <button id="btn-png-4x">PNG 4x</button>
  <button id="btn-svg">SVG</button>
  <button id="btn-prompt">Copy AI Prompt</button>
</div>

<script type="module">
  import { createControlPanel } from '../../shared/controls.js';
  import { createLoop } from '../../shared/anim.js';
  import { hslToRgb, paletteHsl } from '../../shared/color.js';
  import { simplex2 } from '../../shared/noise.js';
  import { exportPng, exportSvg, bakeHtml, exportSource, describeForAI } from '../../shared/export.js';
  import { createPointer } from '../../shared/pointer.js';
  import { createCursorOverlay, modeFactor } from '../../shared/cursor-modes.js';

  const PIECE_ID = 'grain-field';
  const canvas = document.getElementById('canvas');
  const ctx = canvas.getContext('2d');

  function resize() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
  }
  window.addEventListener('resize', resize);
  resize();

  // Persistent particle array — must re-seed when density changes.
  // Count is high because each mark is tiny and low-contrast: at 1400 the field
  // read as sparse dust rather than grain. Density still scales it down to 0.1x.
  const BASE_COUNT = 3200;
  let grains = [];
  let paths = [];

  function seedGrains(count) {
    grains = Array.from({ length: count }, () => ({
      x: Math.random() * canvas.width,
      y: Math.random() * canvas.height,
      // Per-grain jitter so they don't all move in lockstep.
      j: Math.random() * Math.PI * 2,
    }));
  }

  const PRESETS = {
    whisper: { opacity: 0.37, stroke: 1.8, density: 1.15, grain: 1.2, saturation: 0.03, glow: 0 },
    ink:     { opacity: 1, stroke: 2, density: 0.7, grain: 3.2, saturation: 0, glow: 0 },
    neon:    { opacity: 0.8, stroke: 0.8, density: 1.3, saturation: 0.9, glow: 1 },
    drift:   { opacity: 0.5, stroke: 0.75, density: 1.0, speed: 0.15, motion: 2, grain: 2.5 },
    dense:   { opacity: 0.85, stroke: 0.8, density: 1.8, grain: 1, glow: 0 },
  };

  const baked = window.__LF_BAKED_VALUES__;
  const panel = baked ? null : createControlPanel({
    pieceId: PIECE_ID,
    presets: PRESETS,
    onChange: (name, value, values) => {
      if (name === 'density') seedGrains(Math.round(BASE_COUNT * values.density));
    },
    extraControls: [
      { name: 'grain', label: 'Grain length', type: 'range', min: 0.5, max: 6, step: 0.1, default: 2.2, category: 'ink' },
    ],
    defaults: { hue: 30, hueB: 210, saturation: 0.12, colorMode: 'gradient', colorA: '#ff8000', colorB: '#007fff' },
  });
  const currentValues = baked || panel.values;
  const pointer = createPointer({ canvas });
  const overlay = createCursorOverlay();

  seedGrains(Math.round(BASE_COUNT * currentValues.density));
  window.addEventListener('resize', () =>
    seedGrains(Math.round(BASE_COUNT * currentValues.density))
  );

  function drawFrame(dt, elapsed, values) {
    // Full repaint each frame — grain should not smear into trails.
    ctx.fillStyle = values.invert ? '#f2f2f4' : '#0a0a0d';
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    paths = [];
    const noiseScale = 0.004 * (0.3 + values.scale);
    const t = elapsed * 0.25 * values.motion;
    const drift = 14 * values.speed * (dt || 0.016);
    const len = values.grain;
    const light = values.invert ? 0.4 : 0.62;
    const stopA = paletteHsl(values, 0);
    const [ovR, ovG, ovB] = hslToRgb(stopA.h, stopA.s, light);

    const lineWidth = 0.3 + values.stroke * 0.9;
    ctx.lineWidth = lineWidth;

    // The only gate: off at pointer 0, off when cursorInteraction is 'None',
    // eased by influence.
    const k = modeFactor(values, pointer);

    for (const gr of grains) {
      const n = simplex2(gr.x * noiseScale + values.phase, gr.y * noiseScale + t);
      const a = n * Math.PI * 2 + (values.angle * Math.PI) / 180 + gr.j * 0.15;

      gr.x += Math.cos(a) * drift;
      gr.y += Math.sin(a) * drift;

      let lw = lineWidth;
      if (k) {
        // Uses only dt (real frame time), never values.speed, so the
        // response survives Speed 0.
        const f = pointer.falloff(gr.x, gr.y, 200);
        if (f) {
          if (values.cursorInteraction === 'Attract') {
            const toward = Math.atan2(pointer.y - gr.y, pointer.x - gr.x);
            const push = f * k * 140 * (dt || 0.016);
            gr.x += Math.cos(toward) * push;
            gr.y += Math.sin(toward) * push;
          } else if (values.cursorInteraction === 'Vortex') {
            const away = Math.atan2(gr.y - pointer.y, gr.x - pointer.x);
            const tangent = away + Math.PI / 2;
            const push = f * k * 140 * (dt || 0.016);
            gr.x += Math.cos(tangent) * push;
            gr.y += Math.sin(tangent) * push;
          } else if (values.cursorInteraction === 'Grow') {
            lw = lineWidth * (1 + f * k * 1.6);
          } else if (values.cursorInteraction === 'Shrink') {
            lw = Math.max(lineWidth * 0.15, lineWidth / (1 + f * k * 1.6));
          }
        }
      }

      // Wrap rather than respawn, so the field stays evenly populated.
      if (gr.x < 0) gr.x += canvas.width;
      if (gr.x > canvas.width) gr.x -= canvas.width;
      if (gr.y < 0) gr.y += canvas.height;
      if (gr.y > canvas.height) gr.y -= canvas.height;

      const mix = (Math.sin(gr.j + elapsed * 0.15) + 1) / 2;
      const { h, s } = paletteHsl(values, mix);
      const [r, g, b] = hslToRgb(h, s, light);
      ctx.strokeStyle = `rgba(${r},${g},${b},${values.opacity})`;
      ctx.lineWidth = lw;

      const ex = gr.x + Math.cos(a) * len;
      const ey = gr.y + Math.sin(a) * len;
      ctx.beginPath();
      ctx.moveTo(gr.x, gr.y);
      ctx.lineTo(ex, ey);
      if (values.glow > 0) {
        ctx.lineWidth = lw + values.glow * 3;
        ctx.globalAlpha = values.glow * 0.25;
        ctx.stroke();
        ctx.lineWidth = lw;
        ctx.globalAlpha = 1;
      }
      ctx.stroke();
      paths.push([[gr.x, gr.y], [ex, ey]]);
    }

    overlay.draw(ctx, `rgb(${ovR},${ovG},${ovB})`, k);
  }

  const loop = createLoop({
    onFrame(dt, elapsed) {
      pointer.step();
      const k = modeFactor(currentValues, pointer);
      overlay.step(currentValues.cursorInteraction, k, pointer);
      drawFrame(dt, elapsed, currentValues);
    },
  });
  loop.start();

  document.getElementById('btn-png-2x')?.addEventListener('click', () => exportPng(canvas, { multiplier: 2 }));
  document.getElementById('btn-png-4x')?.addEventListener('click', () => exportPng(canvas, { multiplier: 4 }));
  document.getElementById('btn-svg')?.addEventListener('click', () => exportSvg(paths, { width: canvas.width, height: canvas.height }));
  document.getElementById('btn-baked')?.addEventListener('click', () => {
    bakeHtml({ sourceHtml: document.documentElement.outerHTML, values: panel.values }).catch((err) => console.error('bakeHtml failed', err));
  });
  document.getElementById('btn-source')?.addEventListener('click', () => {
    exportSource().catch((err) => console.error('exportSource failed', err));
  });
  document.getElementById('btn-prompt')?.addEventListener('click', () => {
    describeForAI({ pieceName: PIECE_ID, values: panel.values });
  });
</script>
</body>
</html>
