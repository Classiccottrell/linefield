<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<!-- Without this a phone uses a ~980px layout viewport, so the panel's
     max-width:640px sheet rule never matches and the page renders zoomed
     out — the controls become an unusable corner card. -->
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>linefield — grain-field</title>
<style>
  html, body { margin: 0; height: 100%; background: #0a0a0d; overflow: hidden; }
  canvas { display: block; width: 100vw; height: 100vh; }
  .lf-export-row { position: fixed; top: 12px; right: 12px; display: flex; gap: 6px; z-index: 9999; }
  .lf-export-row button { background: #222; color: #eee; border: 1px solid #444; border-radius: 4px;
    padding: 4px 8px; font: 11px -apple-system, sans-serif; cursor: pointer; }
</style>
</head>
<body>
<canvas id="canvas"></canvas>

<div class="lf-export-row" data-lf-panel>
  <button id="btn-baked">Baked HTML</button>
  <button id="btn-source">Source</button>
  <button id="btn-png-2x">PNG 2x</button>
  <button id="btn-png-4x">PNG 4x</button>
  <button id="btn-svg">SVG</button>
  <button id="btn-prompt">Copy AI Prompt</button>
</div>

<script type="module">
  import { createControlPanel } from '../../shared/controls.js';
  import { createLoop } from '../../shared/anim.js';
  import { hslToRgb, paletteHsl } from '../../shared/color.js';
  import { simplex2 } from '../../shared/noise.js';
  import { exportPng, exportSvg, bakeHtml, exportSource, describeForAI } from '../../shared/export.js';

  // grain-field — fine grain gathered into one soft drifting cloud with a
  // long falloff, leaving a clear text-safe side.
  //
  // Text-safe zone: the left ~60% of the frame (home/quiet-drift's hero
  // copy runs to max-width:760px + 7vw padding, wider than a literal left
  // third). The cloud's home is well right of that, with a short tail back
  // toward it so the fade-off is gradual, not a hard edge.
  // Anchor: the cloud's own centre, right of frame-centre — the one spot
  // its exponential falloff piles up the most grains.
  // HOME-PAGE HERO: loaded by home/quiet-drift at ?preset=whisper. Ink must
  // stay <= 0.035 at defaults (aim ~0.025); whisper must stay text-safe too.
  const PIECE_ID = 'grain-field';
  const canvas = document.getElementById('canvas');
  const ctx = canvas.getContext('2d');

  function resize() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
  }
  window.addEventListener('resize', resize);
  resize();

  // Few, short, fairly bright grains — not many faint ones. Each grain's
  // position is `home + wander(t)`, both computed fresh every frame, so
  // resize never needs a reseed; only a change in grain COUNT (Density, or
  // Scale above 1) does, and the fixed seed makes a larger count a superset
  // of a smaller one.
  const BASE_COUNT = 5600;
  // Cloud anchor, normalized to the frame. Right of centre, clear of the
  // hero copy's wider-than-a-third reach.
  const CLOUD = { x: 0.74, y: 0.48 };
  const SPREAD = 0.2;       // mean radius of the exponential falloff, * S
  const TEXT_TAIL = 0.42;   // how far the tail toward the text side is cut
  let grains = [];
  let paths = [];

  // mulberry32: a seeded PRNG so the cloud's shape is the same every load,
  // not a fresh scatter each time (matters for a hero — Math.random() also
  // gets pinned by the deterministic capture harness, but this keeps a
  // live page's first paint identical to the thumbnail).
  function mulberry32(a) {
    return () => {
      a = (a + 0x6d2b79f5) | 0;
      let t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  function seedGrains(count) {
    const rnd = mulberry32(0x9e3779b1);
    grains = Array.from({ length: count }, () => {
      const ang = rnd() * Math.PI * 2;
      // Exponential radius: most grains sit near home, a long tail strays
      // far — the "long falloff" the brief asks for, not a hard-edged disc.
      const r = -Math.log(1 - rnd()) * SPREAD;
      let hx = Math.cos(ang) * r;
      const hy = Math.sin(ang) * r * 0.8;
      // Short tail back toward the text side (negative x = toward the
      // hero copy): compress it instead of cutting it off outright, so the
      // edge fades rather than snaps.
      if (hx < 0) hx *= TEXT_TAIL;
      return { hx, hy, j: rnd() * Math.PI * 2 };
    });
  }

  // Above Scale 1 the field covers more of the frame, so it carries more
  // grain (x2.5 at Scale 2); at or below 1 the count is Density's alone.
  function grainCount(values) {
    return Math.round(BASE_COUNT * values.density * (1 + Math.max(0, values.scale - 1) * 1.5));
  }

  const PRESETS = {
    whisper: { opacity: 0.9, stroke: 1.2, density: 1.4, grain: 1.6, glow: 0 },
    ink:     { opacity: 1, stroke: 1.6, density: 0.8, grain: 2.8, glow: 0 },
    neon:    { opacity: 0.85, stroke: 0.9, density: 1.1, saturation: 0.85, glow: 1 },
    drift:   { opacity: 0.6, stroke: 0.85, density: 0.9, speed: 0.4, motion: 1.8, grain: 2.2 },
    dense:   { opacity: 0.8, stroke: 0.9, density: 1.7, grain: 1.4, glow: 0.4 },
  };

  const baked = window.__LF_BAKED_VALUES__;
  const panel = baked ? null : createControlPanel({
    pieceId: PIECE_ID,
    presets: PRESETS,
    onChange: (name, value, values) => {
      if (name === 'density') seedGrains(grainCount(values));
    },
    extraControls: [
      { name: 'grain', label: 'Grain length', type: 'range', min: 0.5, max: 6, step: 0.1, default: 1.8, category: 'ink' },
    ],
    // saturation: 0 per house look §1; colour lives in the neon preset.
    defaults: { hue: 30, hueB: 210, saturation: 0, colorMode: 'gradient', colorA: '#ff8000', colorB: '#007fff' },
  });
  const currentValues = baked || panel.values;

  seedGrains(grainCount(currentValues));

  function drawFrame(dt, elapsed, values) {
    const W = canvas.width, H = canvas.height, S = Math.min(W, H);
    // Full repaint, not a fade — grain should not smear into trails, and
    // a full clear keeps ink exactly what this frame draws.
    ctx.globalCompositeOperation = 'source-over';
    ctx.fillStyle = values.invert ? '#f2f2f4' : '#0a0a0d';
    ctx.fillRect(0, 0, W, H);
    ctx.globalCompositeOperation = values.invert ? 'source-over' : 'lighter';

    paths = [];
    // Framing: up to Scale 1 the cloud only grows about its own centre.
    // Above 1 it slides to frame-centre, its text-side tail uncompresses,
    // it stretches toward the frame's aspect, and its exponential core
    // softens (radius r -> SPREAD * (r/SPREAD)^0.7 at 2, still densest at
    // the anchor), so at 2 the grain runs off every edge instead of a bigger
    // blob. Every term is zero at Scale 1: the default render is unchanged.
    const hi = Math.max(0, values.scale - 1);
    const cx = W * (CLOUD.x + hi * (0.5 - CLOUD.x)), cy = H * (CLOUD.y + hi * (0.5 - CLOUD.y));
    const scaleMul = 0.5 + 0.5 * values.scale;
    const sx = 1 + hi * 2.6, sy = 1 + hi * 1.7;
    const untail = 1 + hi * (1 / TEXT_TAIL - 1);
    // More grain over the wider field. The seed is fixed, so a larger count
    // keeps every existing grain and only appends new ones: no visible pop.
    const want = grainCount(values);
    if (grains.length !== want) seedGrains(want);
    const len = values.grain;
    const light = values.invert ? 0.16 : 0.86 - 0.24 * values.saturation;
    const lineWidth = 0.4 + values.stroke * 0.45;
    const baseAlpha = values.opacity * (values.invert ? 0.32 : 0.24);
    const angleRad = (values.angle * Math.PI) / 180;
    // Speed is the wander's rate; Motion is purely its amplitude — the
    // two stay independent, as do both from Phase, which offsets every
    // grain's cycle uniformly.
    const rate = elapsed * 0.6 * values.speed;
    const amp = (0.006 + 0.02 * values.motion) * S;

    for (const gr of grains) {
      const ph = rate + gr.j + values.phase * Math.PI * 2;
      const wx = Math.sin(ph) * amp;
      const wy = Math.cos(ph * 0.83 + gr.j * 1.3) * amp;
      let hx = gr.hx, hy = gr.hy;
      if (hi > 0) {
        if (hx < 0) hx *= untail;
        const flat = Math.pow(Math.max(1e-3, Math.hypot(hx, hy / 0.8) / SPREAD), -0.15 * hi);
        hx *= flat;
        hy *= flat;
      }
      const x = cx + hx * S * scaleMul * sx + wx;
      const y = cy + hy * S * scaleMul * sy + wy;
      const a = ph * 0.5 + angleRad;

      const mix = (Math.sin(gr.j + elapsed * 0.1) + 1) / 2;
      const { h, s } = paletteHsl(values, mix);
      const [r, g, b] = hslToRgb(h, s, light);
      ctx.strokeStyle = `rgba(${r},${g},${b},${Math.min(1, baseAlpha)})`;
      ctx.lineWidth = lineWidth;

      const ex = x + Math.cos(a) * len;
      const ey = y + Math.sin(a) * len;
      ctx.beginPath();
      ctx.moveTo(x, y);
      ctx.lineTo(ex, ey);
      if (values.glow > 0) {
        ctx.lineWidth = lineWidth + values.glow * 2.5;
        ctx.strokeStyle = `rgba(${r},${g},${b},${Math.min(1, baseAlpha * values.glow * 0.3)})`;
        ctx.stroke();
        ctx.lineWidth = lineWidth;
        ctx.strokeStyle = `rgba(${r},${g},${b},${Math.min(1, baseAlpha)})`;
      }
      ctx.stroke();
      paths.push([[x, y], [ex, ey]]);
    }

    // Glow is a fallback for the anchor, off by default: one soft radial
    // wash at the cloud's centre.
    if (values.glow > 0) {
      const { h, s } = paletteHsl(values, 0);
      const [r, g, b] = hslToRgb(h, s, light);
      const gr2 = (18 + 30 * values.glow) * scaleMul;
      const grad = ctx.createRadialGradient(cx, cy, 0, cx, cy, gr2);
      grad.addColorStop(0, `rgba(${r},${g},${b},${Math.min(1, 0.3 * values.glow * values.opacity)})`);
      grad.addColorStop(1, `rgba(${r},${g},${b},0)`);
      ctx.fillStyle = grad;
      ctx.beginPath();
      ctx.arc(cx, cy, gr2, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.globalCompositeOperation = 'source-over';
  }

  const loop = createLoop({
    onFrame(dt, elapsed) {
      drawFrame(dt, elapsed, currentValues);
    },
  });
  loop.start();

  document.getElementById('btn-png-2x')?.addEventListener('click', () => exportPng(canvas, { multiplier: 2 }));
  document.getElementById('btn-png-4x')?.addEventListener('click', () => exportPng(canvas, { multiplier: 4 }));
  document.getElementById('btn-svg')?.addEventListener('click', () => exportSvg(paths, { width: canvas.width, height: canvas.height }));
  document.getElementById('btn-baked')?.addEventListener('click', () => {
    bakeHtml({ sourceHtml: document.documentElement.outerHTML, values: panel.values }).catch((err) => console.error('bakeHtml failed', err));
  });
  document.getElementById('btn-source')?.addEventListener('click', () => {
    exportSource().catch((err) => console.error('exportSource failed', err));
  });
  document.getElementById('btn-prompt')?.addEventListener('click', () => {
    describeForAI({ pieceName: PIECE_ID, values: panel.values });
  });
</script>
</body>
</html>
