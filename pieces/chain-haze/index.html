<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<!-- Without this a phone uses a ~980px layout viewport, so the panel's
     max-width:640px sheet rule never matches and the page renders zoomed
     out — the controls become an unusable corner card. -->
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>linefield — chain haze</title>
<style>
  html, body { margin: 0; height: 100%; background: #0a0a0d; overflow: hidden; }
  canvas { display: block; width: 100vw; height: 100vh; }
  .lf-export-row { position: fixed; top: 12px; right: 12px; display: flex; gap: 6px; z-index: 9999; }
  .lf-export-row button { background: #222; color: #eee; border: 1px solid #444; border-radius: 4px;
    padding: 4px 8px; font: 11px -apple-system, sans-serif; cursor: pointer; }
</style>
</head>
<body>
<canvas id="canvas"></canvas>

<div class="lf-export-row" data-lf-panel>
  <button id="btn-baked">Baked HTML</button>
  <button id="btn-source">Source</button>
  <button id="btn-png-2x">PNG 2x</button>
  <button id="btn-png-4x">PNG 4x</button>
  <button id="btn-svg">SVG</button>
  <button id="btn-prompt">Copy AI Prompt</button>
</div>

<script type="module">
  import { createControlPanel } from '../../shared/controls.js';
  import { createLoop } from '../../shared/anim.js';
  import { hslToRgb, paletteHsl } from '../../shared/color.js';
  import { exportPng, exportSvg, bakeHtml, exportSource, describeForAI } from '../../shared/export.js';
  import { createPointer } from '../../shared/pointer.js';
  import { createCursorOverlay, modeFactor } from '../../shared/cursor-modes.js';
  import { rotatePoint } from '../../shared/project.js';

  const PIECE_ID = 'chain-haze';
  const canvas = document.getElementById('canvas');
  const ctx = canvas.getContext('2d');

  function resize() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
  }
  window.addEventListener('resize', resize);
  resize();

  // Element-based, not a path piece: each chain is a sequence of discrete
  // linked marks (stroked ovals) walking a straight line toward a per-chain
  // vanishing point, not one continuous stroke — the structural difference
  // from `tether`. No Math.random() anywhere and no persistent array —
  // every link's position is a pure function of (chain index, link index,
  // elapsed) recomputed each frame, same discipline as `matrix-code`, so
  // there is no density re-seed trap and thumbnail capture stays
  // byte-identical against a pinned clock.
  const BASE_CHAINS = 7;
  const BASE_LINKS = 24;
  const FOV = 520; // perspective divisor strength — see persp() below
  const MARCH_RATE = 90; // world-depth units/sec a chain advances at speed=1
  const MIN_SCALE = 0.38; // hard floor: below this an oval reads as a dot,
                            // which is exactly the "dashed line pretending
                            // to be chain" failure this piece exists to avoid
  let paths = [];

  // Sparse, heavy-stroked territory (`meridian`/`tether`) is already the
  // library's weakest pair per ROADMAP.md's collection-constraints table.
  // Many links per chain across several chains pushes ink coverage into the
  // empty 0.11-0.19 band rather than adding to that cluster.
  const PRESETS = {
    whisper: { opacity: 0.28, stroke: 0.4, density: 0.6, saturation: 0.08, glow: 0 },
    ink:     { opacity: 1, stroke: 1.7, density: 0.9, saturation: 0, glow: 0 },
    neon:    { opacity: 0.92, stroke: 1, density: 1.2, saturation: 0.9, glow: 1.2 },
    drift:   { opacity: 0.55, stroke: 0.8, density: 0.85, speed: 0.35, motion: 1.7 },
    dense:   { opacity: 0.7, stroke: 0.6, density: 1.8, speed: 1.1 },
  };

  const baked = window.__LF_BAKED_VALUES__;
  const panel = baked ? null : createControlPanel({
    pieceId: PIECE_ID,
    presets: PRESETS,
    onChange: () => {},
    extraControls: [
      { name: 'linkAspect', label: 'Link aspect', type: 'range', min: 0.3, max: 0.9, step: 0.01, default: 0.55, category: 'form' },
    ],
    // 96/108: the last open slice below `puddle` (112/138) and
    // `matrix-code` (132/145) in the 95-135 band ROADMAP.md flags as the
    // only open one — picked deliberately, not measured, same caveat those
    // two record. Low saturation reads as cold, oxidised steel, which also
    // happens to suit chain links thematically.
    defaults: { hue: 96, hueB: 108, saturation: 0.22, colorMode: 'gradient', colorA: '#8fae9e', colorB: '#7fa0c2' },
  });
  const currentValues = baked || panel.values;
  const pointer = createPointer({ canvas });
  const overlay = createCursorOverlay();

  // Perspective divisor (see CONTRIBUTING.md "3D pieces" for the shared
  // camera — deliberately NOT used here: a straight receding line needs
  // only a scalar divisor, not full pitch/yaw/orbit, and pulling in
  // createCamera/createOrbit would drag rotX/rotY persistence and
  // test-interactions coverage this piece doesn't need). Saturates toward 0
  // as z grows, which both shrinks and bunches distant links together —
  // the correct perspective read for evenly-spaced world depth.
  function persp(z) {
    return FOV / (FOV + Math.max(0, z));
  }

  // Samples an ellipse (rotated, centred) into a polyline so SVG export has
  // real geometry — `exportSvg` only understands point arrays, and unlike
  // `matrix-code`'s glyph marks (which have a `texts` escape hatch) an oval
  // mark has no equivalent; it must be sampled.
  const ELLIPSE_SEG = 14;
  function sampleEllipse(cx, cy, rx, ry, rot) {
    const cosR = Math.cos(rot), sinR = Math.sin(rot);
    const pts = [];
    for (let k = 0; k <= ELLIPSE_SEG; k++) {
      const a = (k / ELLIPSE_SEG) * Math.PI * 2;
      const ex = rx * Math.cos(a), ey = ry * Math.sin(a);
      pts.push([cx + ex * cosR - ey * sinR, cy + ex * sinR + ey * cosR]);
    }
    return pts;
  }

  function drawFrame(dt, elapsed, values) {
    ctx.fillStyle = values.invert ? '#f2f2f4' : '#0a0a0d';
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    paths = [];
    const W = canvas.width;
    const H = canvas.height;
    const light = values.invert ? 0.32 : 0.66;

    const chains = Math.max(2, Math.round(BASE_CHAINS * values.density));
    const linksPerChain = Math.max(6, Math.round(BASE_LINKS * values.density));

    const aspect = values.linkAspect;
    const linkLen = 30 * values.scale; // world-space link length (pre-perspective)
    const step = linkLen * 1.5; // ~30% overlap between consecutive links — abutting
                                  // links read as beads on a string, not chain
    const zSpan = step * linksPerChain;

    const k = modeFactor(values, pointer);
    const theta = (values.angle * Math.PI) / 180;
    const cosT = Math.cos(-theta), sinT = Math.sin(-theta);
    const pdx = pointer.x - W / 2, pdy = pointer.y - H / 2;
    const plx = W / 2 + pdx * cosT - pdy * sinT;
    const ply = H / 2 + pdx * sinT + pdy * cosT;

    ctx.save();
    ctx.translate(W / 2, H / 2);
    ctx.rotate(theta);
    ctx.translate(-W / 2, -H / 2);

    // `phase` offsets the whole link sequence along the path (a static
    // shift, independent of the marching driven by `speed`); `speed`
    // marches links toward the vanishing point over time; `motion` drives
    // an independent lateral sway distinct from both — none gates the
    // others out at zero.
    const marchOffset = elapsed * values.speed * MARCH_RATE + values.phase * zSpan * 0.5;

    for (let c = 0; c < chains; c++) {
      const cf = chains === 1 ? 0.5 : c / (chains - 1);
      const anchorX = W * (0.06 + 0.88 * cf);
      const anchorY = H * (0.94 + 0.02 * Math.sin(c * 2.1));
      // Each chain's own vanishing point drifts slightly so the whole
      // library of lines doesn't converge on one identical pixel.
      const vanishX = W * (0.46 + 0.08 * Math.sin(c * 1.7 + 0.6));
      const vanishY = H * (0.08 + 0.05 * Math.cos(c * 1.3));
      const tangent = Math.atan2(vanishY - anchorY, vanishX - anchorX);
      const perpX = -Math.sin(tangent), perpY = Math.cos(tangent);

      const chainSeed = c * 12.9898;
      const chainPhase = ((c / chains) * zSpan) % zSpan;

      const { h, s } = paletteHsl(values, cf);

      for (let i = 0; i < linksPerChain; i++) {
        let z = ((i * step - marchOffset + chainPhase) % zSpan + zSpan) % zSpan;
        const p = persp(z);

        let cx = vanishX + (anchorX - vanishX) * p;
        let cy = vanishY + (anchorY - vanishY) * p;

        // Lateral sway, perpendicular to the chain's own path direction —
        // `motion` scales it, `speed`/`density` play no part, so it
        // survives Speed 0 (a frozen-but-non-degenerate chain, same
        // precedent as `globe`'s wobble).
        const sway = Math.sin(elapsed * 0.9 + chainSeed + i * 0.35) * 6 * values.motion * p;
        cx += perpX * sway;
        cy += perpY * sway;

        let linkScale = Math.max(MIN_SCALE, p);
        const depthAlpha = Math.max(0.22, Math.min(1, p * 0.95));

        if (k) {
          const mode = values.cursorInteraction;
          const f = pointer.falloff(cx, cy, 260);
          if (f) {
            if (mode === 'Grow') {
              linkScale *= 1 + f * k * 1.4;
            } else if (mode === 'Shrink') {
              linkScale = Math.max(0.12, linkScale / (1 + f * k * 1.4));
            } else if (mode === 'Attract') {
              const ease = Math.min(f * k, 1);
              cx += (plx - cx) * ease;
              cy += (ply - cy) * ease;
            } else if (mode === 'Vortex') {
              const r = rotatePoint(cx - plx, cy - ply, 0, { roll: f * k * 1.1 });
              cx = plx + r.x;
              cy = ply + r.y;
            }
          }
        }

        const rx = (linkLen / 2) * linkScale;
        // Alternating orientation: even links read face-on (full width),
        // odd links read edge-on (squashed to ~35% width) — the same
        // ellipse major axis (rx, along the chain's tangent), alternating
        // minor axis, is what reads as interlocking links rather than a
        // dotted/dashed line pretending to be chain.
        const ryFull = (linkLen / 2) * aspect * linkScale;
        const ry = i % 2 === 0 ? ryFull : ryFull * 0.35;

        const [r, g, b] = hslToRgb(h, s, light);
        const alpha = values.opacity * depthAlpha;

        ctx.lineWidth = 1 + values.stroke * 3;
        if (values.glow > 0) {
          ctx.strokeStyle = `rgba(${r},${g},${b},${values.glow * 0.3 * depthAlpha})`;
          ctx.lineWidth = (1 + values.stroke * 3) + values.glow * 3;
          ctx.beginPath();
          ctx.ellipse(cx, cy, rx, ry, tangent, 0, Math.PI * 2);
          ctx.stroke();
          ctx.lineWidth = 1 + values.stroke * 3;
        }
        ctx.strokeStyle = `rgba(${r},${g},${b},${alpha})`;
        ctx.beginPath();
        ctx.ellipse(cx, cy, rx, ry, tangent, 0, Math.PI * 2);
        ctx.stroke();

        paths.push(sampleEllipse(cx, cy, rx, ry, tangent));
      }
    }

    ctx.restore();

    const stopA = paletteHsl(values, 0);
    const [ovR, ovG, ovB] = hslToRgb(stopA.h, stopA.s, values.invert ? 0.32 : 0.66);
    overlay.draw(ctx, `rgb(${ovR},${ovG},${ovB})`, k);
  }

  const loop = createLoop({
    onFrame(dt, elapsed) {
      pointer.step();
      const k = modeFactor(currentValues, pointer);
      overlay.step(currentValues.cursorInteraction, k, pointer);
      drawFrame(dt, elapsed, currentValues);
    },
  });
  loop.start();

  document.getElementById('btn-png-2x')?.addEventListener('click', () => exportPng(canvas, { multiplier: 2 }));
  document.getElementById('btn-png-4x')?.addEventListener('click', () => exportPng(canvas, { multiplier: 4 }));
  document.getElementById('btn-svg')?.addEventListener('click', () => exportSvg(paths, { width: canvas.width, height: canvas.height }));
  document.getElementById('btn-baked')?.addEventListener('click', () => {
    bakeHtml({ sourceHtml: document.documentElement.outerHTML, values: panel.values })
      .catch((err) => console.error('bakeHtml failed', err));
  });
  document.getElementById('btn-source')?.addEventListener('click', () => {
    exportSource().catch((err) => console.error('exportSource failed', err));
  });
  document.getElementById('btn-prompt')?.addEventListener('click', () => {
    describeForAI({ pieceName: PIECE_ID, values: panel.values });
  });
</script>
</body>
</html>
