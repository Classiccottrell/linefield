<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>linefield — meridian</title>
<style>
  html, body { margin: 0; height: 100%; background: #0a0a0d; overflow: hidden; }
  canvas { display: block; width: 100vw; height: 100vh; }
  .lf-export-row { position: fixed; top: 12px; right: 12px; display: flex; gap: 6px; z-index: 9999; }
  .lf-export-row button { background: #222; color: #eee; border: 1px solid #444; border-radius: 4px;
    padding: 4px 8px; font: 11px -apple-system, sans-serif; cursor: pointer; }
</style>
</head>
<body>
<canvas id="canvas"></canvas>

<div class="lf-export-row" data-lf-panel>
  <button id="btn-baked">Baked HTML</button>
  <button id="btn-source">Source</button>
  <button id="btn-png-2x">PNG 2x</button>
  <button id="btn-png-4x">PNG 4x</button>
  <button id="btn-svg">SVG</button>
  <button id="btn-prompt">Copy AI Prompt</button>
</div>

<script type="module">
  import { createControlPanel } from '../../shared/controls.js';
  import { createLoop } from '../../shared/anim.js';
  import { hslToRgb } from '../../shared/color.js';
  import { simplex2 } from '../../shared/noise.js';
  import { exportPng, exportSvg, bakeHtml, exportSource, describeForAI } from '../../shared/export.js';
  import { createPointer } from '../../shared/pointer.js';

  const PIECE_ID = 'meridian';
  const canvas = document.getElementById('canvas');
  const ctx = canvas.getContext('2d');

  function resize() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
  }
  window.addEventListener('resize', resize);
  resize();

  // Deliberately sparse: seven enormous ribbons, derived per frame.
  const BASE_RIBBONS = 7;
  const STEP_PX = 8;
  let paths = [];

  const PRESETS = {
    whisper: { opacity: 0.22, stroke: 0.6, density: 0.5, saturation: 0.06, glow: 0 },
    ink:     { opacity: 1, stroke: 1.9, density: 0.8, saturation: 0, glow: 0 },
    neon:    { opacity: 0.95, stroke: 1.1, density: 1.2, saturation: 0.95, glow: 1.2 },
    drift:   { opacity: 0.5, stroke: 1, density: 0.7, speed: 0.25, motion: 1.6 },
    dense:   { opacity: 0.6, stroke: 0.7, density: 2, speed: 0.8, glow: 0 },
  };

  const baked = window.__LF_BAKED_VALUES__;
  const panel = baked ? null : createControlPanel({
    pieceId: PIECE_ID,
    presets: PRESETS,
    onChange: () => {},
    extraControls: [
      { name: 'sweep', label: 'Sweep', type: 'range', min: 0, max: 2, step: 0.01, default: 1 },
    ],
    defaults: { hue: 150, hueB: 180, saturation: 0.5 },
  });
  const currentValues = baked || panel.values;
  const pointer = createPointer({ canvas });

  function drawFrame(dt, elapsed, values) {
    ctx.fillStyle = values.invert ? '#f2f2f4' : '#0a0a0d';
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    paths = [];
    const ribbons = Math.max(3, Math.round(BASE_RIBBONS * values.density));
    const noiseScale = 0.0009 * (0.25 + values.scale);
    const t = elapsed * values.speed * 0.12;
    // sweep owns the ribbon's signature broad excursion; motion owns a
    // separate, independently-scaled flutter layer — no longer the same term.
    const sweepAmp = canvas.height * 0.165 * values.sweep;
    const flutterAmp = canvas.height * 0.055 * values.motion;
    const light = values.invert ? 0.35 : 0.6;
    const lineWidth = 2.2 + values.stroke * 3.6; // heavy; only tether is heavier

    // Gate: off at pointer 0, eased by influence, local via falloff. No term
    // routed through values.speed, so deflection survives Speed 0.
    const k = values.pointer * pointer.influence;

    // Drawing below happens in the pre-rotation local space that ctx.rotate
    // maps to screen space, but pointer.x/y are screen (canvas-pixel) space.
    // Un-rotate the pointer about the same centre/angle the canvas transform
    // uses, so falloff is evaluated in the same space the geometry is drawn
    // in — otherwise deflection drifts away from the visible cursor as soon
    // as Angle leaves 0.
    const rcx = canvas.width / 2, rcy = canvas.height / 2;
    const theta = (values.angle * Math.PI) / 180;
    const cosT = Math.cos(-theta), sinT = Math.sin(-theta);
    const pdx = pointer.x - rcx, pdy = pointer.y - rcy;
    const plx = rcx + pdx * cosT - pdy * sinT;
    const ply = rcy + pdx * sinT + pdy * cosT;

    ctx.save();
    ctx.translate(rcx, rcy);
    ctx.rotate(theta);
    ctx.translate(-rcx, -rcy);

    // Overdraw horizontally so rotation never exposes a ribbon end.
    const margin = canvas.width * 0.4;

    for (let i = 0; i < ribbons; i++) {
      const f = ribbons === 1 ? 0.5 : i / (ribbons - 1);
      const baseY = canvas.height * (0.12 + f * 0.76);

      const [r, g, b] = hslToRgb(
        values.hue + (values.hueB - values.hue) * f,
        values.saturation,
        light
      );
      ctx.strokeStyle = `rgba(${r},${g},${b},${values.opacity})`;

      const pts = [];
      ctx.beginPath();
      for (let x = -margin; x <= canvas.width + margin; x += STEP_PX) {
        // Two octaves so the sweep is broad but not mechanical.
        const n1 = simplex2(x * noiseScale + values.phase, f * 3 + t);
        const n2 = simplex2(x * noiseScale * 2.7 + values.phase, f * 3 + t * 1.4);
        let y = baseY + n1 * sweepAmp + n2 * flutterAmp;
        if (k) {
          // Ribbons deflect around the pointer as they sweep past it: pushed
          // away vertically, weighted by falloff. Falloff and direction both
          // computed against the un-rotated pointer (plx, ply), not
          // pointer.x/y directly — see note above ctx.save().
          const dist = Math.max(0, 1 - Math.hypot(x - plx, y - ply) / 240);
          if (dist) {
            // Direction keyed off baseY (constant per ribbon), not the
            // wobbled y — keying off y flips sign at STEP_PX granularity
            // wherever a ribbon crosses the pointer's y, spiking instead of
            // bowing.
            const dir = baseY >= ply ? 1 : -1;
            y += dir * dist * k * 90;
          }
        }
        if (x === -margin) ctx.moveTo(x, y);
        else ctx.lineTo(x, y);
        pts.push([x, y]);
      }

      if (values.glow > 0) {
        ctx.lineWidth = lineWidth + values.glow * 4;
        ctx.globalAlpha = values.glow * 0.25;
        ctx.stroke();
        ctx.globalAlpha = 1;
      }
      ctx.lineWidth = lineWidth;
      ctx.stroke();
      paths.push(pts);
    }

    ctx.restore();
  }

  const loop = createLoop({
    onFrame(dt, elapsed) {
      pointer.step();
      drawFrame(dt, elapsed, currentValues);
    },
  });
  loop.start();

  document.getElementById('btn-png-2x')?.addEventListener('click', () => exportPng(canvas, { multiplier: 2 }));
  document.getElementById('btn-png-4x')?.addEventListener('click', () => exportPng(canvas, { multiplier: 4 }));
  document.getElementById('btn-svg')?.addEventListener('click', () => exportSvg(paths, { width: canvas.width, height: canvas.height }));
  document.getElementById('btn-baked')?.addEventListener('click', () => {
    bakeHtml({ sourceHtml: document.documentElement.outerHTML, values: panel.values })
      .catch((err) => console.error('bakeHtml failed', err));
  });
  document.getElementById('btn-source')?.addEventListener('click', () => {
    exportSource().catch((err) => console.error('exportSource failed', err));
  });
  document.getElementById('btn-prompt')?.addEventListener('click', () => {
    describeForAI({ pieceName: PIECE_ID, values: panel.values });
  });
</script>
</body>
</html>
