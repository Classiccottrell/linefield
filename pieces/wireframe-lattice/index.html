<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>linefield — wireframe-lattice</title>
<style>
  html, body { margin: 0; height: 100%; background: #0a0a0d; overflow: hidden; }
  canvas { display: block; width: 100vw; height: 100vh; }
  .lf-export-row { position: fixed; top: 12px; right: 12px; display: flex; gap: 6px; z-index: 9999; }
  .lf-export-row button { background: #222; color: #eee; border: 1px solid #444; border-radius: 4px;
    padding: 4px 8px; font: 11px -apple-system, sans-serif; cursor: pointer; }
</style>
</head>
<body>
<canvas id="canvas"></canvas>

<div class="lf-export-row" data-lf-panel>
  <button id="btn-baked">Baked HTML</button>
  <button id="btn-source">Source</button>
  <button id="btn-png-2x">PNG 2x</button>
  <button id="btn-png-4x">PNG 4x</button>
  <button id="btn-svg">SVG</button>
  <button id="btn-prompt">Copy AI Prompt</button>
</div>

<script type="module">
  import { createControlPanel } from '../../shared/controls.js';
  import { createLoop } from '../../shared/anim.js';
  import { hslToRgb } from '../../shared/color.js';
  import { simplex2 } from '../../shared/noise.js';
  import { createCamera } from '../../shared/project.js';
  import { exportPng, exportSvg, bakeHtml, exportSource, describeForAI } from '../../shared/export.js';
  import { createOrbit, createPointer } from '../../shared/pointer.js';

  const PIECE_ID = 'wireframe-lattice';
  const canvas = document.getElementById('canvas');
  const ctx = canvas.getContext('2d');

  function resize() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
  }
  window.addEventListener('resize', resize);
  resize();

  // Grid resolution is derived per frame from density — no persistent array.
  const BASE_STEPS = 24;
  const SPAN = 900; // world-space width/depth of the sheet
  let paths = [];

  const PRESETS = {
    whisper: { opacity: 0.3, stroke: 1.1, density: 0.6, saturation: 0.05, glow: 0 },
    ink:     { opacity: 1, stroke: 1.7, density: 0.8, saturation: 0, glow: 0 },
    neon:    { opacity: 0.9, stroke: 0.9, density: 1.1, saturation: 0.95, glow: 1.1 },
    drift:   { opacity: 0.5, stroke: 0.8, density: 0.7, speed: 0.35, motion: 1.8 },
    dense:   { opacity: 0.6, stroke: 0.6, density: 1.8, speed: 0.8, glow: 0 },
  };

  const baked = window.__LF_BAKED_VALUES__;
  const panel = baked ? null : createControlPanel({
    pieceId: PIECE_ID,
    presets: PRESETS,
    onChange: () => {},
    extraControls: [
      { name: 'rotX', label: 'Pitch', type: 'range', min: -90, max: 90, step: 1, default: 32 },
      { name: 'rotY', label: 'Yaw', type: 'range', min: -180, max: 180, step: 1, default: 0 },
    ],
    defaults: { hue: 190, hueB: 205, saturation: 0.35 },
  });
  const currentValues = baked || panel.values;
  const pointer = createPointer({ canvas });
  const clampDeg = (n, min, max) => Math.max(min, Math.min(max, n));
  // In panel mode the drag writes straight into rotX/rotY through setValue —
  // the only write path — so the Pitch/Yaw sliders and the rendered camera
  // never disagree. A baked export has no panel to write through, so it
  // mutates currentValues directly, clamped to the same ranges the panel
  // would have enforced.
  const orbit = createOrbit({
    canvas,
    onOrbit: (dPitch, dYaw) => {
      const dPitchDeg = (dPitch * 180) / Math.PI;
      const dYawDeg = (dYaw * 180) / Math.PI;
      if (panel) {
        panel.setValue('rotX', panel.values.rotX + dPitchDeg, { persist: false });
        panel.setValue('rotY', panel.values.rotY + dYawDeg, { persist: false });
      } else {
        currentValues.rotX = clampDeg(currentValues.rotX + dPitchDeg, -90, 90);
        currentValues.rotY = clampDeg(currentValues.rotY + dYawDeg, -180, 180);
      }
    },
    onSettle: () => {
      if (!panel) return;
      panel.setValue('rotX', panel.values.rotX, { persist: true });
      panel.setValue('rotY', panel.values.rotY, { persist: true });
    },
  });

  const camera = createCamera({ fov: 620 });

  function strokePath(pts, values, lineWidth, rgb) {
    // pts: array of {x, y, scale}. Walk in order and break the run at any
    // point behind the camera (scale <= 0) instead of filtering — a skipped
    // interior point must start a new subpath, not get bridged over.
    let anyRun = false;
    ctx.beginPath();
    let run = [];
    const flushRun = () => {
      if (run.length >= 2) {
        anyRun = true;
        ctx.moveTo(run[0].x, run[0].y);
        for (let i = 1; i < run.length; i++) ctx.lineTo(run[i].x, run[i].y);
        paths.push(run.map((p) => [p.x, p.y]));
      }
      run = [];
    };
    for (const p of pts) {
      if (p.scale > 0) run.push(p);
      else flushRun();
    }
    flushRun();
    if (!anyRun) return;

    const [r, g, b] = rgb;
    ctx.strokeStyle = `rgba(${r},${g},${b},${values.opacity})`;
    if (values.glow > 0) {
      ctx.lineWidth = lineWidth + values.glow * 3;
      ctx.globalAlpha = values.glow * 0.25;
      ctx.stroke();
      ctx.globalAlpha = 1;
    }
    ctx.lineWidth = lineWidth;
    ctx.stroke();
  }

  function drawFrame(dt, elapsed, values) {
    ctx.fillStyle = values.invert ? '#f2f2f4' : '#0a0a0d';
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    paths = [];
    const steps = Math.max(4, Math.round(BASE_STEPS * values.density));
    const t = elapsed * values.speed * 0.5;
    const noiseScale = 0.0035 * (0.3 + values.scale);
    const amp = 45 * values.motion;
    const light = values.invert ? 0.35 : 0.62;

    camera.set({
      tilt: (values.rotX * Math.PI) / 180,
      yaw: (values.rotY * Math.PI) / 180,
      roll: (values.angle * Math.PI) / 180,
      cx: canvas.width / 2,
      cy: canvas.height / 2,
    });

    // Gate: off at pointer 0, eased by influence, local via falloff.
    const k = values.pointer * pointer.influence;

    // World-space height of the sheet at (x, z). The lift term projects the
    // (unlifted) point to screen space first to find its distance from the
    // pointer, then adds a falloff-weighted Z — no term routed through
    // values.speed, so it survives Speed 0.
    const heightAt = (x, z) => {
      const base = simplex2(x * noiseScale + values.phase, z * noiseScale + t) * amp;
      if (!k) return base;
      const approx = camera.project(x, 0, z);
      if (approx.scale <= 0) return base;
      const f = pointer.falloff(approx.x, approx.y, 220);
      return base - f * k * 70;
    };

    const half = SPAN / 2;
    const step = SPAN / steps;
    const baseWidth = 0.3 + values.stroke * 1.0;

    // Rows (constant z), then columns (constant x).
    for (let i = 0; i <= steps; i++) {
      const f = i / steps;
      const [r, g, b] = hslToRgb(
        values.hue + (values.hueB - values.hue) * f,
        values.saturation,
        light
      );

      const rowPts = [];
      const colPts = [];
      const a = -half + i * step;
      for (let j = 0; j <= steps; j++) {
        const c = -half + j * step;
        rowPts.push([c, heightAt(c, a), a]);
        colPts.push([a, heightAt(a, c), c]);
      }
      strokePath(camera.projectPath(rowPts), values, baseWidth, [r, g, b]);
      strokePath(camera.projectPath(colPts), values, baseWidth, [r, g, b]);
    }
  }

  const loop = createLoop({
    onFrame(dt, elapsed) {
      pointer.step();
      drawFrame(dt, elapsed, currentValues);
    },
  });
  loop.start();

  document.getElementById('btn-png-2x')?.addEventListener('click', () => exportPng(canvas, { multiplier: 2 }));
  document.getElementById('btn-png-4x')?.addEventListener('click', () => exportPng(canvas, { multiplier: 4 }));
  document.getElementById('btn-svg')?.addEventListener('click', () => exportSvg(paths, { width: canvas.width, height: canvas.height }));
  document.getElementById('btn-baked')?.addEventListener('click', () => {
    bakeHtml({ sourceHtml: document.documentElement.outerHTML, values: panel.values })
      .catch((err) => console.error('bakeHtml failed', err));
  });
  document.getElementById('btn-source')?.addEventListener('click', () => {
    exportSource().catch((err) => console.error('exportSource failed', err));
  });
  document.getElementById('btn-prompt')?.addEventListener('click', () => {
    describeForAI({ pieceName: PIECE_ID, values: panel.values });
  });
</script>
</body>
</html>
