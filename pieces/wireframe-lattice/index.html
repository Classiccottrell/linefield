<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<!-- Without this a phone uses a ~980px layout viewport, so the panel's
     max-width:640px sheet rule never matches and the page renders zoomed
     out — the controls become an unusable corner card. -->
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>linefield — wireframe-lattice</title>
<style>
  html, body { margin: 0; height: 100%; background: #0a0a0d; overflow: hidden; }
  canvas { display: block; width: 100vw; height: 100vh; }
  .lf-export-row { position: fixed; top: 12px; right: 12px; display: flex; gap: 6px; z-index: 9999; }
  .lf-export-row button { background: #222; color: #eee; border: 1px solid #444; border-radius: 4px;
    padding: 4px 8px; font: 11px -apple-system, sans-serif; cursor: pointer; }
</style>
</head>
<body>
<canvas id="canvas"></canvas>

<div class="lf-export-row" data-lf-panel>
  <button id="btn-baked">Baked HTML</button>
  <button id="btn-source">Source</button>
  <button id="btn-png-2x">PNG 2x</button>
  <button id="btn-png-4x">PNG 4x</button>
  <button id="btn-svg">SVG</button>
  <button id="btn-prompt">Copy AI Prompt</button>
</div>

<script type="module">
  import { createControlPanel } from '../../shared/controls.js';
  import { createLoop } from '../../shared/anim.js';
  import { hslToRgb, paletteHsl } from '../../shared/color.js';
    import { createCamera, rotatePoint } from '../../shared/project.js';
  import { exportPng, exportSvg, bakeHtml, exportSource, describeForAI } from '../../shared/export.js';
  import { createOrbit } from '../../shared/pointer.js';

  // wireframe-lattice — one finite lattice sheet with crisp edges, floating
  // tilted in space and flexing slowly, brightest along its fold's crest.
  //
  // The sheet is a square of hairline rows and columns, not a plane running
  // to the horizon: its four edges draw brighter so it reads as one object.
  //
  // Text-safe zone (default framing): the left quarter and the top band of the frame; the left
  // third at Scale 1. The sheet sits in the
  // central square, nudged right of centre.
  // Anchor: the travelling fold where it turns most nearly edge-on, centre
  // right. Its lines close up in projection and brighten with the grazing
  // angle, so it emerges from line density, not from a drawn glow.
  const PIECE_ID = 'wireframe-lattice';
  const canvas = document.getElementById('canvas');
  const ctx = canvas.getContext('2d');

  function resize() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
  }
  window.addEventListener('resize', resize);
  resize();

  // Line counts derive per frame from density — no persistent array.
  const BASE_LINES = 56;     // lines each way, edges included
  const SEG = 72;            // segments per line
  const FLEX_PERIOD = 12;    // seconds per flex-wave cycle at speed 1
  const FLOAT_PERIOD = 17;   // seconds per rocking cycle at speed 1
  const BUCKETS = 6;
  let paths = [];

  const PRESETS = {
    whisper: { opacity: 1, stroke: 0.75, density: 0.5, motion: 0.9, glow: 0 },
    ink:     { opacity: 1, stroke: 1.5, density: 0.7, glow: 0, rotX: 30 },
    neon:    { opacity: 0.9, stroke: 0.9, density: 1.05, saturation: 0.9, glow: 1.1 },
    drift:   { opacity: 0.85, stroke: 0.8, density: 0.8, speed: 0.4, motion: 1.8, phase: 0.7 },
    dense:   { opacity: 0.9, stroke: 0.85, density: 1.6, glow: 0.4, motion: 1.3 },
  };

  const baked = window.__LF_BAKED_VALUES__;
  const panel = baked ? null : createControlPanel({
    pieceId: PIECE_ID,
    presets: PRESETS,
    onChange: () => {},
    extraControls: [
      { name: 'rotX', label: 'Pitch', type: 'range', min: -90, max: 90, step: 1, default: 36, category: 'interaction' },
      { name: 'rotY', label: 'Yaw', type: 'range', min: -180, max: 180, step: 1, default: -28, category: 'interaction' },
    ],
    // Monochrome by default (house look §1). The hue pair is what the neon
    // preset and the colour pickers light up.
    defaults: { hue: 190, hueB: 205, saturation: 0, scale: 1.8, colorMode: 'gradient', colorA: '#00d4ff', colorB: '#0095ff' },
  });
  const currentValues = baked || panel.values;
  const clampDeg = (n, min, max) => Math.max(min, Math.min(max, n));
  // In panel mode the drag writes straight into rotX/rotY through setValue —
  // the only write path — so the Pitch/Yaw sliders and the rendered camera
  // never disagree. A baked export has no panel to write through, so it
  // mutates currentValues directly, clamped to the same ranges the panel
  // would have enforced.
  const orbit = createOrbit({
    canvas,
    onOrbit: (dPitch, dYaw) => {
      const dPitchDeg = (dPitch * 180) / Math.PI;
      const dYawDeg = (dYaw * 180) / Math.PI;
      if (panel) {
        panel.setValue('rotX', panel.values.rotX + dPitchDeg, { persist: false });
        panel.setValue('rotY', panel.values.rotY + dYawDeg, { persist: false });
      } else {
        currentValues.rotX = clampDeg(currentValues.rotX + dPitchDeg, -90, 90);
        currentValues.rotY = clampDeg(currentValues.rotY + dYawDeg, -180, 180);
      }
    },
    onSettle: () => {
      if (!panel) return;
      panel.setValue('rotX', panel.values.rotX, { persist: true });
      panel.setValue('rotY', panel.values.rotY, { persist: true });
    },
  });

  const camera = createCamera({ fov: 1200 });

  function strokeRuns(runs, alpha, lineWidth, rgb) {
    if (!runs.length || alpha <= 0) return;
    ctx.beginPath();
    for (const run of runs) {
      ctx.moveTo(run[0].x, run[0].y);
      for (let i = 1; i < run.length; i++) ctx.lineTo(run[i].x, run[i].y);
    }
    ctx.strokeStyle = `rgba(${rgb[0]},${rgb[1]},${rgb[2]},${Math.min(1, alpha)})`;
    ctx.lineWidth = lineWidth;
    ctx.stroke();
  }

  function drawFrame(dt, elapsed, values) {
    const W = canvas.width;
    const H = canvas.height;
    ctx.globalCompositeOperation = 'source-over';
    ctx.fillStyle = values.invert ? '#f2f2f4' : '#0a0a0d';
    ctx.fillRect(0, 0, W, H);
    // Additive on the dark ground, so wherever the sheet folds away and its
    // lines close up the image brightens on its own. On the light ground
    // `lighter` would clip to white, so dark ink layers with plain alpha.
    ctx.globalCompositeOperation = values.invert ? 'source-over' : 'lighter';
    // Butt caps: runs split at shared points (alpha buckets), and round caps
    // would overlap there and add up to beads under 'lighter'.
    ctx.lineCap = 'butt';

    paths = [];
    const S = Math.min(W, H);
    const size = 0.5 + 0.5 * values.scale;
    const half = S * 0.25 * size;
    // fov tracks the frame so the perspective reads the same at any size.
    // The sheet's half-diagonal plus its flex stays under 0.8 * fov even at
    // Scale 2, so no pitch ever reaches shared/project.js's near plane.
    const fov = S * 1.6;
    const lines = Math.max(10, Math.round(BASE_LINES * values.density));
    const light = values.invert ? 0.14 : 0.88 - 0.26 * values.saturation;
    const lineWidth = 0.5 + values.stroke * 0.4;
    const peak = values.opacity * (values.invert ? 0.5 : 0.38);
    const edgeAlpha = values.opacity * (values.invert ? 0.7 : 0.45);

    // Speed is the tempo of everything (Speed 0 is a still frame): the flex
    // wave travels across the sheet once per FLEX_PERIOD, and the sheet
    // floats, rocking slowly once per FLOAT_PERIOD. Motion is the depth of
    // the flex, so Motion 0 leaves a flat sheet that still floats. Phase
    // moves where the fold sits.
    const t = elapsed * values.speed;
    const wave = (t / FLEX_PERIOD) * Math.PI * 2 + values.phase * Math.PI + 3.2;
    const fl = (t / FLOAT_PERIOD) * Math.PI * 2;
    const amp = half * 0.42 * values.motion;
    const bob = S * 0.018 * Math.sin(fl);

    const view = {
      tilt: (values.rotX * Math.PI) / 180 + 0.06 * Math.sin(fl * 0.7),
      yaw: (values.rotY * Math.PI) / 180 + 0.14 * Math.sin(fl),
      roll: (values.angle * Math.PI) / 180,
    };
    camera.set({ ...view, fov, cx: W / 2 + 0.11 * S, cy: H / 2 });

    // Height of the sheet at normalised (u, v) in [-1, 1]: one broad fold
    // travelling diagonally, plus a slower cross-bend, so the sheet flexes
    // like a held card rather than rippling like water.
    const heightAt = (u, v) => {
      const fold = Math.sin(0.9 * u + 2.2 * v + wave);
      const cross = Math.cos(1.5 * u - 0.5 * v - wave * 0.6);
      return amp * (0.75 * fold + 0.35 * cross * (0.5 + 0.5 * u));
    };

    let bestW = -1;
    let anchor = null;
    // Rows (constant v), then columns (constant u). The first and last of
    // each are the sheet's edges.
    for (let dir = 0; dir < 2; dir++) {
      for (let i = 0; i < lines; i++) {
        const f = i / (lines - 1);
        const a = -1 + 2 * f;
        const edge = i === 0 || i === lines - 1;
        const model = [];
        const weights = [];
        for (let j = 0; j <= SEG; j++) {
          const b = -1 + (2 * j) / SEG;
          const u = dir === 0 ? b : a;
          const v = dir === 0 ? a : b;
          const h = heightAt(u, v);
          const x = u * half, y = h - bob, z = v * half;
          model.push([x, y, z]);
          // Where the fold turns the sheet edge-on to the eye, its lines
          // close up in projection; they brighten there too, so the fold
          // reads as a sheen. Measured against the true eye at z = -fov.
          const dx = (heightAt(u + 0.02, v) - heightAt(u - 0.02, v)) / (0.04 * half);
          const dz = (heightAt(u, v + 0.02) - heightAt(u, v - 0.02)) / (0.04 * half);
          const n = rotatePoint(-dx, 1, -dz, view);
          const q = rotatePoint(x, y, z, view);
          const vz = q.z + fov;
          const facing = (n.x * q.x + n.y * q.y + n.z * vz)
            / (Math.hypot(n.x, n.y, n.z) * Math.hypot(q.x, q.y, vz));
          const graze = 1 - Math.abs(facing);
          weights.push(0.28 + 0.72 * graze * graze * graze * graze);
        }
        const pts = camera.projectPath(model);
        for (let j = 0; j <= SEG; j++) {
          if (weights[j] > bestW && pts[j].scale > 0) { bestW = weights[j]; anchor = pts[j]; }
        }
        const { h, s } = paletteHsl(values, f);
        const rgb = hslToRgb(h, s, light);

        // Runs break at any point at or behind the near plane rather than
        // bridging it; buckets group runs by alpha.
        const buckets = Array.from({ length: BUCKETS }, () => []);
        let run = [];
        let svgRun = [];
        let runB = -1;
        const flushSvg = () => { if (svgRun.length >= 2) paths.push(svgRun); svgRun = []; };
        for (let j = 0; j < SEG; j++) {
          const p = pts[j], q = pts[j + 1];
          if (p.scale <= 0 || q.scale <= 0) {
            if (run.length >= 2) buckets[runB].push(run);
            run = []; runB = -1; flushSvg();
            continue;
          }
          const w = edge ? 1 : (weights[j] + weights[j + 1]) / 2;
          const bk = Math.min(BUCKETS - 1, Math.floor(w * BUCKETS));
          if (bk !== runB) {
            if (run.length >= 2) buckets[runB].push(run);
            run = [p];
            runB = bk;
          }
          run.push(q);
          if (!svgRun.length) svgRun.push([p.x, p.y]);
          svgRun.push([q.x, q.y]);
        }
        if (run.length >= 2) buckets[runB].push(run);
        flushSvg();

        for (let bk = 0; bk < BUCKETS; bk++) {
          const alpha = edge ? edgeAlpha : peak * ((bk + 0.5) / BUCKETS);
          if (values.glow > 0 && (edge || bk >= BUCKETS - 2)) {
            strokeRuns(buckets[bk], alpha * values.glow * 0.3, lineWidth + values.glow * 2.2, rgb);
          }
          strokeRuns(buckets[bk], alpha, lineWidth, rgb);
        }
      }
    }

    // Glow is a fallback for the anchor, off by default: the fold is
    // already the brightest place from its lines closing up. It sits on the
    // most nearly edge-on point of the sheet.
    if (values.glow > 0 && anchor) {
      const { h, s } = paletteHsl(values, 0.5);
      const [r, g, b] = hslToRgb(h, s, light);
      const gr = (16 + 36 * values.glow) * size;
      const grad = ctx.createRadialGradient(anchor.x, anchor.y, 0, anchor.x, anchor.y, gr);
      grad.addColorStop(0, `rgba(${r},${g},${b},${Math.min(1, 0.3 * values.glow * values.opacity)})`);
      grad.addColorStop(1, `rgba(${r},${g},${b},0)`);
      ctx.fillStyle = grad;
      ctx.beginPath();
      ctx.arc(anchor.x, anchor.y, gr, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.globalCompositeOperation = 'source-over';
  }

  const loop = createLoop({
    onFrame(dt, elapsed) {
      drawFrame(dt, elapsed, currentValues);
    },
  });
  loop.start();

  document.getElementById('btn-png-2x')?.addEventListener('click', () => exportPng(canvas, { multiplier: 2 }));
  document.getElementById('btn-png-4x')?.addEventListener('click', () => exportPng(canvas, { multiplier: 4 }));
  document.getElementById('btn-svg')?.addEventListener('click', () => exportSvg(paths, { width: canvas.width, height: canvas.height }));
  document.getElementById('btn-baked')?.addEventListener('click', () => {
    bakeHtml({ sourceHtml: document.documentElement.outerHTML, values: panel.values })
      .catch((err) => console.error('bakeHtml failed', err));
  });
  document.getElementById('btn-source')?.addEventListener('click', () => {
    exportSource().catch((err) => console.error('exportSource failed', err));
  });
  document.getElementById('btn-prompt')?.addEventListener('click', () => {
    describeForAI({ pieceName: PIECE_ID, values: panel.values });
  });
</script>
</body>
</html>
