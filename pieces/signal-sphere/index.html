<html lang="en">

<title>linefield — signal-sphere</title>
<style>

<body>
<canvas id="canvas"></canvas>

<!--
  signal-sphere — a night planet whose city-light network grows as it turns: a very large dark globe filling the
  bottom-right corner, its lights, links and a few undersea cables made along the edge that rolls into view, under a
  shimmering airglow limb with aurora curtains and a deep-space sky of stars, nebulae and galaxies, all in stipple.

  Text-safe zone: the open sky, upper left. Only faint stars sit there by default (with Nebula up, grainy nebulae and a
  few small galaxies too); the planet takes the lower right (Side mirrors both).
  Anchor: the growth front on the upper-left limb, brightest where it meets the bottom edge. The surface streams in
  over the whole visible limb, so new lights and links are always being made along it (a place's lights fade in over a
  few seconds, its links draw on from the first node over 5-14 s), and the lights crowd together toward the horizon.

  Technique (stipple): descends from terminator, same author. Every light, link and haze dot is a fixed point with a
  fixed random threshold; per frame the globe turns, each visible dot is placed on screen and a bilinear splat adds it
  into a float buffer of (light, light x colour class) per pixel. One pass turns that buffer into pixels through a
  look-up table of colour class x level, so Saturation, the hues, Color Mode and Invert make a new table, never a new
  render. The body, the nebulae and the galaxies are rendered once into a layer that seeds every frame (the sky with
  a whole-pixel drift); the stars are splatted per frame.

  The network is a pure function of the turn and the clock, so a paused, resized or still frame is always consistent.
  Growth front: every place has an age, the time since it rolled over the entering limb (counted at the unslowed turn
  rate, so the front rides the surface); behind the front the network is mature. Densification: links and nodes belong
  to tiers (arteries, regional, local) and later tiers switch on one by one over the first ~4 minutes of the clock,
  so it gets denser the longer you watch; a few local links re-draw on a slow cycle once it is mature, and a few
  faint packets walk finished links. There is no seamless loop: the globe turns once in 170 s at Speed 1, but the
  densification is a one-way ramp and the packets, the re-drawn links and the airglow waves share no period with the
  turn. Everything random comes from seeded generators (never Math.random), so the same clock draws the same frame.

  Build: the scene is built in slices of about 10 ms between frames, so the page never freezes (about a second at
  1440x900, then again a moment after Scale, Angle, Density, Side, Land, Nebula or Body settle). The old frame stays
  on screen until the new one is ready. The canvas is drawn at no more than 1.3 million pixels, capped at 30 fps, and
  upscaled by CSS. Reduced motion draws one still frame, 200 s into the growth, and redraws it only when a control moves.

  Controls: Scale zooms the camera about the frame's centre, from a half-size planet (0) to a close pass (2). Density
  sets the dot counts, Stroke the network's dot weight, Angle rolls the globe's axis (the direction the surface
  streams), Phase turns the globe by up to two whole turns. Speed runs the turn, the growth front, the densification
  and the packets; Motion runs the airglow waves, the aurora, the twinkle and the sky's drift. Glow is the airglow,
  the horizon bloom and the aurora. It is this piece's limb, so it ships at 0.9 rather than the house 0. Side puts the
  planet in the bottom-left corner. Land is the share of the surface that is land, Lights the network's gain, Body
  the planet's own faint tint, Stars the share of the starfield drawn and Nebula the gain of nebulae and galaxies.
  The ink band (house look: 0.03-0.15 of the frame marked at thumbnail size) is what holds Density, Land, Nebula,
  Stars, Body, Glow and Opacity below the full look by default; the dense preset puts it back.

  Colour: the palette is a two-stop hue pair, the lights at stop A and the airglow, nebulae and sky towards stop B.
  The default pair is 36 -> 214 (sodium orange to deep blue, shown by neon). Two more to try with Color A and B:
  216 -> 250 and 326 -> 262.

  SVG export: a capped, evenly sampled share of the dots in the current frame (at most 24,000: stars, lights, links,
  airglow, aurora) as circles in canvas space, coloured through the same table. The nebulae, the galaxies and the
  body's grain are raster, and so is the stipple's accumulated brightness: use PNG for those.
-->

<div class="lf-export-row" data-lf-panel>
  <button id="btn-baked">Baked HTML</button>
  <button id="btn-source">Source</button>
  <button id="btn-png-2x">PNG 2x</button>
  <button id="btn-png-4x">PNG 4x</button>
  <button id="btn-svg">SVG</button>
  <button id="btn-prompt">Copy AI Prompt</button>
</div>

<script type="module">
  import { createControlPanel } from '../../shared/controls.js';
  import { createLoop } from '../../shared/anim.js';
  import { hslToRgb, paletteHsl } from '../../shared/color.js';
  import { exportPng, exportSvg, bakeHtml, exportSource, describeForAI } from '../../shared/export.js';
  import { createResizeBatcher } from '../../shared/resize.js';
  import { prefersReducedMotion } from '../../shared/quality.js';

  const PIECE_ID = 'signal-sphere';
  const canvas = document.getElementById('canvas');
  const ctx = canvas.getContext('2d');

  // <core>

  // ---------- values: the shared control names plus the piece's own ------------------------------------
  // Read from the live `values` object; the ones that change what is built (scale, angle, density, side, land,
  // nebula, body) are watched by the page code below, which rebuilds the scene once they settle. The rest take
  // effect on the next frame.
  //   scale    build   camera zoom about the frame centre (1 = the designed framing)
  //   speed    frame   clock multiplier: the turn, the growth front, the densification and the packets all ride it
  //   stroke   frame   network dot weight (the dots stay one pixel, bilinear)
  //   opacity  frame   overall gain
  //   saturation, hue, hueB, colorMode, invert   the palette (paletteHsl) and the pale-ground variant
  //   glow     frame   airglow, horizon bloom and aurora strength
  //   angle    build   extra roll of the globe's axis, degrees
  //   motion   frame   rate of the secondary animation (limb waves, aurora, twinkle, sky drift)
  //   phase    frame   offset into the turn, 0..1 of a full turn
  //   density  build   dot counts
  //   side     build   which side of the frame the globe sits on ("right" or "left", mirrored)
  //   land     build   land fraction of the surface
  //   lights   frame   city-light / network gain
  //   stars    frame   share of the starfield drawn
  //   nebula   build   nebula + galaxy gain
  //   body     build   presence of the dark body (ground tint and rim falloff)

  // The two grounds: the house ground, and the pale one `invert` flips to.
  const GROUND_DARK = [10, 10, 13], GROUND_LIGHT = [242, 242, 244];

  // Colour classes. Every dot carries a coordinate c = index / (N - 1) on one ramp; a pixel's colour is the ramp at the
  // light-weighted mean of its dots' coordinates. Classes that overlap on screen sit next to each other on the ramp.
  // [name, f along hue -> hueB, saturation factor, lightness dark, lightness light]
  const ROLES = [
    ["ground", 1.0, 0.9, 0.5, 0.36],
    ["glowTop", 0.8, 0.85, 0.5, 0.5],
    ["glowMid", 0.55, 0.85, 0.46, 0.48],
    ["glowLo", 0.3, 0.7, 0.42, 0.46],
    ["aurora", 0.52, 1.0, 0.58, 0.48],
    ["lightHot", 0.0, 0.3, 0.95, 0.14],
    ["light", 0.0, 0.85, 0.72, 0.22],
    ["net", 0.05, 0.9, 0.62, 0.26],
    ["glowWarm", -0.12, 0.95, 0.6, 0.48],
    ["nebA", 1.0, 0.85, 0.52, 0.44],
    ["nebB", 0.78, 0.85, 0.52, 0.44],
    ["galaxy", 0.08, 0.4, 0.84, 0.34],
    ["starCool", 0.96, 0.4, 0.92, 0.2],
    ["starWhite", 0.5, 0.08, 0.96, 0.18],
    ["starWarm", 0.0, 0.55, 0.92, 0.2],
  ];
  const NR = ROLES.length;
  const roleC = (name) => ROLES.findIndex((r) => r[0] === name) / (NR - 1);
  const C_GROUND = roleC("ground"), C_AURORA = roleC("aurora"), C_HOT = roleC("lightHot"), C_LIGHT = roleC("light"), C_NET = roleC("net");
  const C_NEBA = roleC("nebA"), C_NEBB = roleC("nebB"), C_GALAXY = roleC("galaxy");
  const C_STAR0 = roleC("starCool"), C_STAR1 = roleC("starWarm");

  const CS = 64; // colour-coordinate steps in the LUT
  const LEVELS = 512, LMAX = 1.5; // light levels in the LUT; the top of the range is the overexposed (white-hot) end
  const SAT_DARK = 1.2; // the lighter ink on the dark ground needs more saturation to keep its tint
  const DARK_GAIN = 1.4, LIGHT_GAIN = 1.5; // the pass multiplies light by DARK_GAIN; the pale variant's LUT bakes in the difference so both share one pass

  // The look-up table that turns (colour class x light level) into a pixel: one pass of paint() serves every
  // palette and both grounds, so a colour change is a new table, never a new render.
  const INK = new Float64Array(NR * 3);
  function buildLut(v, lut) {
    for (let i = 0; i < NR; i++) {
      const [, f, sk, ld, ll] = ROLES[i];
      const { h, s } = paletteHsl(v, f);
      const rgb = hslToRgb(h, Math.min(1, s * sk * (v.invert ? 1 : SAT_DARK)), v.invert ? ll : ld);
      INK[i * 3] = rgb[0]; INK[i * 3 + 1] = rgb[1]; INK[i * 3 + 2] = rgb[2];
    }
    const ground = v.invert ? GROUND_LIGHT : GROUND_DARK;
    const g0 = ground[0], g1 = ground[1], g2 = ground[2], inv = v.invert, tone = inv ? LIGHT_GAIN / DARK_GAIN : 1;
    for (let ci = 0; ci < CS; ci++) {
      const k = (ci / (CS - 1)) * (NR - 1), i0 = Math.min(NR - 2, Math.floor(k)), t = k - i0;
      const r = INK[i0 * 3] + (INK[i0 * 3 + 3] - INK[i0 * 3]) * t, g = INK[i0 * 3 + 1] + (INK[i0 * 3 + 4] - INK[i0 * 3 + 1]) * t, b = INK[i0 * 3 + 2] + (INK[i0 * 3 + 5] - INK[i0 * 3 + 2]) * t;
      for (let li = 0; li < LEVELS; li++) {
        const a = (li / (LEVELS - 1)) * LMAX * tone * (inv ? 1 + 1.5 * Math.max(0, 1 - ci / 5) : 1), m = a > 1 ? 1 : a, hot = sstep(1.0, LMAX, a);
        let R, G, B;
        if (inv) { R = g0 + (r - g0) * m - r * 0.3 * hot; G = g1 + (g - g1) * m - g * 0.3 * hot; B = g2 + (b - g2) * m - b * 0.3 * hot; }
        else { R = g0 + r * m + (255 - r) * 0.5 * hot; G = g1 + g * m + (255 - g) * 0.5 * hot; B = g2 + b * m + (255 - b) * 0.5 * hot; }
        lut[ci * LEVELS + li] = (255 << 24) | ((B < 0 ? 0 : B > 255 ? 255 : (B + 0.5) | 0) << 16) | ((G < 0 ? 0 : G > 255 ? 255 : (G + 0.5) | 0) << 8) | (R < 0 ? 0 : R > 255 ? 255 : (R + 0.5) | 0);
      }
    }
  }

  // ---------- small helpers -----------------------------------------------------------------------------------
  function rng(seed) {
    return () => {
      seed |= 0; seed = seed + 0x6D2B79F5 | 0;
      let t = Math.imul(seed ^ seed >>> 15, 1 | seed);
      t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
      return ((t ^ t >>> 14) >>> 0) / 4294967296;
    };
  }
  const clamp01 = (v) => v < 0 ? 0 : v > 1 ? 1 : v;
  function sstep(a, b, v) { const t = clamp01((v - a) / (b - a)); return t * t * (3 - 2 * t); }
  const TAU = Math.PI * 2;
  const wrapPi = (x) => x - TAU * Math.round(x / TAU);
  const SIN = new Float32Array(256);
  for (let i = 0; i < 256; i++) SIN[i] = Math.sin((i / 256) * TAU);

  // Improved Perlin gradient noise in 3D, roughly -1..1.
  function noise3(r) {
    const perm = new Uint8Array(256);
    for (let i = 0; i < 256; i++) perm[i] = i;
    for (let i = 255; i > 0; i--) { const j = (r() * (i + 1)) | 0; const t = perm[i]; perm[i] = perm[j]; perm[j] = t; }
    const P = new Uint8Array(512);
    for (let i = 0; i < 512; i++) P[i] = perm[i & 255];
    const grad = (h, x, y, z) => {
      const g = h & 15, u = g < 8 ? x : y, v = g < 4 ? y : g === 12 || g === 14 ? x : z;
      return ((g & 1) === 0 ? u : -u) + ((g & 2) === 0 ? v : -v);
    };
    const fade = (t) => t * t * t * (t * (t * 6 - 15) + 10);
    return (x, y, z) => {
      const fx = Math.floor(x), fy = Math.floor(y), fz = Math.floor(z);
      const X = fx & 255, Y = fy & 255, Z = fz & 255;
      x -= fx; y -= fy; z -= fz;
      const u = fade(x), v = fade(y), w = fade(z);
      const A = P[X] + Y, AA = P[A] + Z, AB = P[A + 1] + Z, B = P[X + 1] + Y, BA = P[B] + Z, BB = P[B + 1] + Z;
      const l0 = grad(P[AA], x, y, z), l1 = grad(P[BA], x - 1, y, z), l2 = grad(P[AB], x, y - 1, z), l3 = grad(P[BB], x - 1, y - 1, z);
      const l4 = grad(P[AA + 1], x, y, z - 1), l5 = grad(P[BA + 1], x - 1, y, z - 1), l6 = grad(P[AB + 1], x, y - 1, z - 1), l7 = grad(P[BB + 1], x - 1, y - 1, z - 1);
      const a0 = l0 + (l1 - l0) * u, a1 = l2 + (l3 - l2) * u, a2 = l4 + (l5 - l4) * u, a3 = l6 + (l7 - l6) * u;
      const b0 = a0 + (a1 - a0) * v, b1 = a2 + (a3 - a2) * v;
      return b0 + (b1 - b0) * w;
    };
  }

  // ---------- tunables -----------------------------------------------------------------------------------
  const SEED = 20261019;
  const PERIOD = 119; // seconds per full turn of a globe of the design size (radius 0.56 of the frame height) at speed 1 and ROTATION_PACE 1
  // The turn rate is scaled by this: 0.7 = 30% slower, so a design-size globe takes PERIOD / 0.7 = 170 s per turn and the surface drifts about 15 px/s across the middle of the disc at 1440x900 at speed 1
  // (7.7 px/s at speed 0.5). The growth front rides the surface and slows with it (updateNet counts a place's age at the unslowed rate, so the front keeps its width in px and draws on 1 / 0.7 times slower).
  // What runs on the clock keeps its pace: densification, packets, airglow waves, aurora, twinkle, sky drift. Folded into OMEGA.
  const ROTATION_PACE = 0.7;
  const OMEGA = (TAU / PERIOD) * ROTATION_PACE; // a bigger globe turns slower by the same factor (see makeCamera's ang), so the surface speed in px/s does not depend on its size; sc.om / OMEGA stays = ang
  const START_TURN = 6.1; // radians into the turn at the start: a continent with a network in the right strip, and more along the bottom
  const TILT = (14 * Math.PI) / 180, TAN_T = Math.tan(TILT); // the axis tips this far toward the viewer
  const LEAN = (62 * Math.PI) / 180; // roll of the axis in the picture plane: the pole points off to the right, and the surface streams toward the lower right, in over the whole visible limb (fastest at its upper-left, a touch slower at both ends)
  const DESIGN_R = 448; // globe radius (px) of the design: 0.56 of an 800 px frame; sizes in px scale with R / DESIGN_R
  // Placement: radius as a share of the frame height (capped at rW of the width), centre this far in from the right edge
  // (in globe radii), and this far below the bottom edge (also in radii): the centre sits just beyond the bottom corner.
  const PLANET = { r: 0.95, rW: 1.0, inX: 0.37, belowY: 0.063 };
  const DESIGN_FRAME = { r: 0.56, rW: 0.62 }; // the framing the network was designed at: px sizes (lights, glow, sky) and the surface speed in px/s follow this, not the globe's size
  const LAT0 = (-76 * Math.PI) / 180, LAT1 = (76 * Math.PI) / 180; // latitude band of the land texture
  const SIN_N0 = Math.sin((-72 * Math.PI) / 180), SIN_N1 = Math.sin((72 * Math.PI) / 180); // network sits between these (sin lat)

  // network
  const HUBS_SR = 62.4, MINORS_SR = 343; // nodes requested per steradian of the visible latitude band at the design scale; a larger globe has more surface per screen pixel, so it gets more (x 1 / ang^2) to keep the same lights per pixel
  const HUB_SEP = (5 * Math.PI) / 180, MIN_SEP = (2.1 * Math.PI) / 180;
  const CUT_H = (20 * Math.PI) / 180, CUT_HM = (11 * Math.PI) / 180, CUT_M = (8.5 * Math.PI) / 180; // longest hub-hub, hub-minor and minor-minor link
  const LINK_STEP = 2.3; // px between the dots of a dotted link
  const LINK_A = 0.42;
  const NODE_SLOPE = 4, LINK_SLOPE = 10; // activation per unit of dot threshold: how soft the bloom-in (node) or the drawing head (link) is
  const TIER1 = [-100, 100], TIER2 = [-5, 190]; // seconds into the clock when regional and local nodes switch on (some regional ones are up from the start)
  const EPH_FRAC = 0.03; // share of local links that re-draw on a slow cycle once the network is mature
  const PK_MAX = 5, PK_A = 0.7; // at most this many packets alive at once, kept faint
  const PK_V = [5.8, 9.4]; // packet speed along a link, design px/s at speed 1 (it runs on the speed clock, so Speed scales it)
  const PK_GAP = [2.5, 5]; // seconds between packet spawns at speed 1
  const CABLES = 6; // undersea cables: a few dim long arcs

  // limb
  const NB = 720; // angle bins around the limb
  // Depth of the secondary effects, softened by about a fifth for a very subtle look (the old values are in the comments).
  const SHIM = 0.17; // grain shimmer, +/- of a dot's brightness (independent per dot, so it averages out; the waves do not). Was 0.22
  const WAVE_AMP = 0.78; // scale on the limb waves' amplitudes (BANDS[].amp). Was 1
  const TWINKLE = [0.11, 0.23]; // star twinkle depth, bright stars (soft blobs) and dim ones. Was 0.14 and 0.3
  // Each band's waves all travel one way (the bands alternate), at different speeds: m = waves around the circle, om = rad/s.
  const BANDS = [
    { n: 14000, d0: -1.2, tau: 2.2, sg: 0, a: 0.13, role: "glowLo", m: [9, 21, 47], amp: [0.14, 0.1, 0.06], om: [0.22, 0.46, 0.8], ph: [0.4, 2.1, 4.0] },
    { n: 12000, d0: 1.5, tau: 4.6, sg: 0, a: 0.1, role: "glowMid", m: [7, 17, 39], amp: [0.13, 0.11, 0.06], om: [-0.2, -0.38, -0.66], ph: [1.7, 0.2, 5.1] },
    { n: 11000, d0: 6, tau: 7, sg: 0, a: 0.1, role: "glowTop", m: [5, 13, 31], amp: [0.14, 0.1, 0.06], om: [0.16, 0.3, 0.55], ph: [3.3, 4.4, 1.0] },
    { n: 3600, d0: 19, tau: 0, sg: 3, a: 0.16, role: "glowWarm", m: [6, 15, 33], amp: [0.16, 0.08, 0.05], om: [-0.14, -0.26, -0.45], ph: [5.5, 1.1, 2.9] },
  ];
  const BLOOM_N = 16000, BLOOM_A = 0.15;
  const AUR_CURTAINS = 4, AUR_RAYS = 36, AUR_DOTS = 60, AUR_A = 0.1;

  // body
  const BODY_A = 0.022; // light of the ground at its brightest, at body = 1 (about 5% brightness)

  // sky
  const STARS = 4600;
  const DRIFT = [3, 6, 10]; // star-layer drift amplitude, design px (far layer slowest)
  const DRIFT_T = [260, 190, 140];
  const SKY_DRIFT = 7; // nebula/galaxy drift amplitude, design px

  // ---------- splatting into the interleaved (light, light x coordinate) accumulator ---------------------------
  // The SVG export sets `sink` to an array for one frame: every dot that lands on the canvas is also listed there.
  let sink = null;
  function splat(buf, W, H, x, y, a, c) {
    const x0 = Math.floor(x - 0.5), y0 = Math.floor(y - 0.5);
    if (x0 < 0 || y0 < 0 || x0 >= W - 1 || y0 >= H - 1) return;
    if (sink !== null) sink.push(x, y, a, c);
    const tx = x - 0.5 - x0, ty = y - 0.5 - y0;
    const k = (y0 * W + x0) * 2;
    const w00 = a * (1 - tx) * (1 - ty), w10 = a * tx * (1 - ty), w01 = a * (1 - tx) * ty, w11 = a * tx * ty;
    buf[k] += w00; buf[k + 1] += w00 * c; buf[k + 2] += w10; buf[k + 3] += w10 * c;
    const k2 = k + 2 * W;
    buf[k2] += w01; buf[k2 + 1] += w01 * c; buf[k2 + 2] += w11; buf[k2 + 3] += w11 * c;
  }
  // A soft round blob (centre plus four neighbours), total weight a.
  function blob(buf, W, H, x, y, a, c) {
    splat(buf, W, H, x, y, a * 0.46, c);
    splat(buf, W, H, x - 1, y, a * 0.135, c); splat(buf, W, H, x + 1, y, a * 0.135, c);
    splat(buf, W, H, x, y - 1, a * 0.135, c); splat(buf, W, H, x, y + 1, a * 0.135, c);
  }

  // ---------- camera -------------------------------------------------------------------------------------------

  // Planet frame: a point at longitude h, latitude phi is cos(phi)cos(h) L + cos(phi)sin(h) E + sin(phi) A; the globe turns
  // about A, so a surface point's world longitude is its own plus the turn. E points across the picture (the surface moves
  // along it: in over the left limb, out over the right), L toward the viewer, A is the pole, tipped TILT toward the viewer.
  function makeCamera(W, H, v) {
    const k = 0.5 + 0.5 * v.scale;
    const Rb = Math.min(PLANET.r * H, PLANET.rW * W);
    let cx = W - PLANET.inX * Rb, cy = H + PLANET.belowY * Rb; // centre just beyond the bottom corner
    const R = Rb * k;
    cx = W / 2 + (cx - W / 2) * k; cy = H / 2 + (cy - H / 2) * k;
    const sgn = v.side === "left" ? -1 : 1;
    if (sgn < 0) cx = W - cx;
    const th = LEAN + (v.angle * Math.PI) / 180, ca = Math.cos(th), sa = Math.sin(th);
    const sT = Math.sin(TILT), cT = Math.cos(TILT);
    const rot = (a) => [sgn * (a[0] * ca - a[1] * sa), a[0] * sa + a[1] * ca, a[2]];
    const E = rot([1, 0, 0]), L = rot([0, sT, cT]), A = rot([0, -cT, sT]);
    let sLo = 1, sHi = -1;
    for (let y = 0; y < H; y += 4) for (let x = 0; x < W; x += 4) {
      const px = (x - cx) / R, py = (y - cy) / R, rr = px * px + py * py;
      if (rr >= 1) continue;
      const pz = Math.sqrt(1 - rr), s = px * A[0] + py * A[1] + pz * A[2];
      if (s < sLo) sLo = s;
      if (s > sHi) sHi = s;
    }
    if (sHi < sLo) { sLo = -0.3; sHi = 0.9; }
    const R0 = Math.min(DESIGN_FRAME.r * H, DESIGN_FRAME.rW * W);
    return { cx, cy, R, zs: (R0 * k) / DESIGN_R, ang: R0 / Rb, L, E, A, sLo, sHi };
  }

  // ---------- world: land texture that does not depend on the canvas size ----------------------------------------

      if (cyc > 0) {
        const s = (ec + lkPh[e]) % cyc;
        let q = s / lkDur[e]; q = q > 1 ? 1 : q;
        if (q < p) p = q;
        m = 1 - sstep(cyc - 4, cyc, s);
      }
      act[nNodes + e] = p * p * (3 - 2 * p);
      omul[nNodes + e] = m;
    }
  }

  // The network dots: each dot is owned by a node or a link and is visible while the owner's activation exceeds the dot's
  // own t (cluster dots bloom in, link dots draw on from their first node, the head a little brighter). Dots near the limb
  // also feed the horizon bloom.
  function drawNet(sc, fr, ownFrom, ownTo) {
    const { W, H, cx, cy, R, L, E, A, nNodes, nX, nY, nZ, nT, nA, nC, ownStart, oX, oY, oZ, oS, oR, acc } = sc;
    const { cN, sN, act, omul, lights, gStroke, limbL } = fr;
    const Lz = L[2], Ez = E[2], Az = A[2];
    const RLx = R * L[0], RLy = R * L[1], REx = R * E[0], REy = R * E[1], RAx = R * A[0], RAy = R * A[1];
    const xMax = W - 2, yMax = H - 2, nbk = NB / TAU, gain = lights * gStroke;
    for (let o = ownFrom; o < ownTo; o++) {
      const a = act[o];
      if (a <= 0) continue; // an owner that is not lit yet costs one test, not one per dot
      const x0 = oX[o], y0 = oY[o], z0 = oZ[o], xc = x0 * cN - y0 * sN, yc = y0 * cN + x0 * sN;
      if (Lz * xc + Ez * yc + Az * z0 < -oS[o]) continue; // all of it is behind the limb
      const Xc = cx + RLx * xc + REx * yc + RAx * z0, Yc = cy + RLy * xc + REy * yc + RAy * z0, m = oR[o];
      if (Xc < -m || Xc > W + m || Yc < -m || Yc > H + m) continue; // or off the frame
      const link = o >= nNodes, slope = link ? LINK_SLOPE : NODE_SLOPE, mul = gain * omul[o], head = link && a < 0.999;
      for (let i = ownStart[o], end = ownStart[o + 1]; i < end; i++) {
        const d = a - nT[i];
        if (d <= 0) continue;
        let w = d * slope;
        if (w > 1) w = 1;
        if (head) { const hb = 1 - d * 14; if (hb > 0) w *= 1 + 1.4 * hb; }
        const x = nX[i], y = nY[i], z = nZ[i];
        const xr = x * cN - y * sN, yr = y * cN + x * sN;
        const X = cx + RLx * xr + REx * yr + RAx * z, Y = cy + RLy * xr + REy * yr + RAy * z;
        if (X < 1 || Y < 1 || X >= xMax || Y >= yMax) continue;
        const mu = Lz * xr + Ez * yr + Az * z;
        if (mu <= 0.02) continue;
        let wt = nA[i] * w * mul;
        if (mu < 0.5) {
          wt *= 1 + 0.9 * Math.exp(-mu * 8); // lights crowd together toward the horizon
          if (mu < 0.3) {
            wt *= mu > 0.08 ? 1 : (mu - 0.02) * 16.7; // and wink out into the haze right at the limb
            if (yr > 0) wt *= 0.65 + 0.35 * (mu / 0.3); // a little dimmer going out over the far limb
          }
        }
        splat(acc, W, H, X, Y, wt, nC[i]);
        if (mu < 0.3) {
          const bin = ((Math.atan2(Y - cy, X - cx) + Math.PI) * nbk) | 0;
          if (bin >= 0 && bin < NB) limbL[bin] += wt;
        }
      }
    }
  }

  // Wave tables for the airglow bands: a few sines per band around the limb, different wavelengths and speeds.
  function updateWaves(sc, fr, tm) {
    const { arcBins } = sc;
    const wave = fr.wave;
    for (let bi = 0; bi < BANDS.length; bi++) {
      const b = BANDS[bi], o = bi * NB;
      for (let j = 0; j < arcBins.length; j++) {
        const bin = arcBins[j], th = ((bin + 0.5) / NB) * TAU - Math.PI;
        wave[o + bin] = 1 + WAVE_AMP * (b.amp[0] * Math.sin(b.m[0] * th - b.om[0] * tm + b.ph[0]) + b.amp[1] * Math.sin(b.m[1] * th - b.om[1] * tm + b.ph[1]) + b.amp[2] * Math.sin(b.m[2] * th - b.om[2] * tm + b.ph[2]));
      }
    }
  }

  // Horizon bloom: smooth the lights that sit near the limb along the limb, so the haze above them follows.
  function updateBloom(sc, fr) {
    const { arcBins } = sc;
    const { limbL, bloomT, tmpL } = fr;
    for (let pass = 0; pass < 2; pass++) {
      const src = pass === 0 ? limbL : tmpL, dst = pass === 0 ? tmpL : bloomT;
      for (let j = 0; j < arcBins.length; j++) {
        const b = arcBins[j];
        let s = 0;
        for (let k = -4; k <= 4; k++) { const q = b + k; if (q >= 0 && q < NB) s += src[q]; }
        dst[b] = s / 9;
      }
    }
    for (let j = 0; j < arcBins.length; j++) { const b = arcBins[j]; bloomT[b] = 1 - Math.exp(-bloomT[b] * 3.2); }
  }

  function drawLimb(sc, fr) {
    const { W, H, cx, cy, R, nLimb, lBin, lCos, lSin, lD, lA, lC, lBand, lPh, acc } = sc;
    const { wave, glow, shA, shB } = fr;
    for (let i = 0; i < nLimb; i++) {
      const w = wave[lBand[i] * NB + lBin[i]], ph = lPh[i];
      const sh = 1 + SHIM * SIN[(ph + ((ph & 1) ? shA : shB)) & 255];
      const rr = R + lD[i] * (1 + 1.5 * (w - 1));
      splat(acc, W, H, cx + rr * lCos[i], cy + rr * lSin[i], lA[i] * w * sh * glow, lC[i]);
    }
  }

  function drawBloom(sc, fr) {
    const { W, H, cx, cy, R, nBloom, mBin, mCos, mSin, mD, mA, mC, acc } = sc;
    const { bloomT, glow } = fr;
    for (let i = 0; i < nBloom; i++) {
      const g = bloomT[mBin[i]];
      if (g < 0.02) continue;
      const rr = R + mD[i] * (1 + 0.35 * g);
      splat(acc, W, H, cx + rr * mCos[i], cy + rr * mSin[i], mA[i] * g * glow, mC[i]);
    }
  }

  function drawAurora(sc, fr, tm) {
    const { W, H, cx, cy, R, nRays, rayTh, rayPh, rayAmp, nAur, aRay, aS, aA, aJ, acc } = sc;
    const { rayC, rayS, rayB, glow } = fr;
    for (let q = 0; q < nRays; q++) {
      const th = rayTh[q] + 0.02 * Math.sin(tm * 0.31 + rayPh[q]) + 0.011 * Math.sin(tm * 0.67 + 2.3 * rayPh[q]);
      rayC[q] = Math.cos(th); rayS[q] = Math.sin(th);
      const f = 0.55 + 0.45 * Math.sin(tm * 0.43 + 1.9 * rayPh[q]);
      rayB[q] = rayAmp[q] * f * f;
    }
    for (let i = 0; i < nAur; i++) {
      const q = aRay[i], rr = R + aS[i];
      splat(acc, W, H, cx + rr * rayC[q] - aJ[i] * rayS[q], cy + rr * rayS[q] + aJ[i] * rayC[q], aA[i] * rayB[q] * glow, C_AURORA);
    }
  }

  // Stars: positions drift on slow bounded orbits (three depth layers), brightness twinkles on a hashed phase and one of
  // four rates, the brightest are soft round blobs. Hidden behind the planet.
  function drawStars(sc, fr) {
    const { W, H, cx, cy, R, nStars, sX, sY, sA, sC, sPh, sLy, acc } = sc;
    const { twIdx, dx, dy, stars } = fr;
    const n = Math.min(nStars, Math.floor(nStars * stars));
    const ro2 = (R - 1) * (R - 1);
    for (let i = 0; i < n; i++) {
      const ly = sLy[i], X = sX[i] + dx[ly], Y = sY[i] + dy[ly];
      const ddx = X - cx, ddy = Y - cy;
      if (ddx * ddx + ddy * ddy < ro2) continue;
      const a = sA[i], ph = sPh[i];
      const w = a * (1 + (a > 0.45 ? TWINKLE[0] : TWINKLE[1]) * SIN[(ph + twIdx[ph & 3]) & 255]);
      if (a > 0.45) blob(acc, W, H, X, Y, w, sC[i]);
      else splat(acc, W, H, X, Y, w, sC[i]);
    }
  }

  // Seed the accumulator: the pre-rendered layer outside the disc is shifted by a whole-pixel drift (the sky), inside it is
  // copied as is (the body). The three copies per row cover every pixel, so nothing needs clearing.
  function copyLayers(sc, ox, oy) {
    const { W, H, big, skyOff, segL, segR } = sc;
    const shift = (oy * W + ox) * 2;
    for (let y = 0; y < H; y++) {
      const row = y * W * 2, l = segL[y], rg = segR[y];
      if (l > 0) big.copyWithin(row, skyOff + row + shift, skyOff + row + shift + l * 2);
      if (rg > l) big.copyWithin(row + l * 2, skyOff + row + l * 2, skyOff + row + rg * 2);
      if (rg < W) big.copyWithin(row + rg * 2, skyOff + row + rg * 2 + shift, skyOff + row + W * 2 + shift);
    }
  }

  // ---------- paint: light -> pixels --------------------------------------------------------------------------------
  function paint(acc, u32, from, to, lut, ground, gain) {
    const lv = (LEVELS - 1) / LMAX, cs = CS - 1;
    for (let i = from, j = from * 2; i < to; i++, j += 2) {
      const t = acc[j];
      if (t < 0.0004) { u32[i] = ground; continue; }
      let vv = t * gain;
      if (vv > LMAX) vv = LMAX;
      u32[i] = lut[(((acc[j + 1] / t) * cs + 0.5) | 0) * LEVELS + ((vv * lv) | 0)];
    }
  }

  // ---------- renderer ------------------------------------------------------------------------------------------------
  // One renderer per scene. `v` is the live values object, read on every frame. The colour table is rebuilt only when
  // a palette value moves; there is no cross-fade, since the palette is a set of sliders and should land at once.

  function createRenderer(sc, out, v) {
    const lut = new Uint32Array(CS * LEVELS);
    let lutKey = '', ground = 0;
    const ensureLut = () => {
      const key = `${v.hue},${v.hueB},${v.saturation},${v.colorMode},${v.invert}`;
      if (key !== lutKey) { lutKey = key; buildLut(v, lut); ground = lut[0]; }
    };
    const nAct = sc.nNodes + sc.nLinks;
    const fr = {
      D: 0, ec: 0, cN: 1, sN: 0,
      gStroke: 1, glow: 1, lights: 1, stars: 1,
      wave: new Float32Array(BANDS.length * NB).fill(1), limbL: new Float32Array(NB), bloomT: new Float32Array(NB), tmpL: new Float32Array(NB),
      shA: 0, shB: 0, twIdx: new Int32Array(4), dx: new Float32Array(3), dy: new Float32Array(3),
      rayC: new Float32Array(sc.nRays), rayS: new Float32Array(sc.nRays), rayB: new Float32Array(sc.nRays),
      act: new Float32Array(nAct), omul: new Float32Array(nAct), ageN: new Float32Array(sc.nNodes), uN: new Float32Array(sc.nNodes),
    };

    // Packets: a few slow, dim pulses walking links that are fully drawn. State is preallocated.
    const pkRng = rng(SEED + 7);
    const pkOn = new Uint8Array(PK_MAX), pkDir = new Int8Array(PK_MAX), pkLink = new Uint16Array(PK_MAX);
    const pkS = new Float32Array(PK_MAX), pkV = new Float32Array(PK_MAX);
    let nextSpawn = PK_GAP[0], lastEc = -1;
    let cands = new Uint16Array(0);
    const spawnPacket = () => {
      let slot = -1;
      for (let k = 0; k < PK_MAX; k++) if (!pkOn[k]) { slot = k; break; }
      if (slot < 0 || sc.nLinks === 0) return;
      if (cands.length < sc.nLinks) cands = new Uint16Array(sc.nLinks);
      const { W, H, cx, cy, R, L, E, A, lkP, nNodes } = sc;
      const { cN, sN, act, omul } = fr;
      const minLen = sc.om / OMEGA; // = ang: the 2.6 degrees of the design-size globe, in this globe's angle
      let n = 0;
      for (let e = 0; e < sc.nLinks; e++) {
        if (act[nNodes + e] < 0.999 || omul[nNodes + e] < 0.95 || sc.lkOm[e] < 0.045 * minLen) continue; // finished links 23 px (design size) or longer: long enough to watch
        const x = lkP[e * 6] + lkP[e * 6 + 3], y = lkP[e * 6 + 1] + lkP[e * 6 + 4], z = lkP[e * 6 + 2] + lkP[e * 6 + 5], ml = Math.hypot(x, y, z) || 1;
        const xr = (x * cN - y * sN) / ml, yr = (y * cN + x * sN) / ml, zz = z / ml;
        const X = cx + R * (L[0] * xr + E[0] * yr + A[0] * zz), Y = cy + R * (L[1] * xr + E[1] * yr + A[1] * zz);
        if (L[2] * xr + E[2] * yr + A[2] * zz > 0.3 && X > 0.04 * W && X < 0.96 * W && Y > 0.04 * H && Y < 0.96 * H) cands[n++] = e;
      }
      if (!n) { nextSpawn = 0.5; return; }
      pkOn[slot] = 1; pkLink[slot] = cands[(pkRng() * n) | 0]; pkDir[slot] = pkRng() < 0.5 ? 1 : -1;
      pkS[slot] = 0; pkV[slot] = ((PK_V[0] + (PK_V[1] - PK_V[0]) * pkRng()) * sc.zs) / sc.R; // rad/s along the link
    };
    const stepPackets = (dt) => {
      for (let k = 0; k < PK_MAX; k++) {
        if (!pkOn[k]) continue;
        pkS[k] += (pkV[k] * dt) / sc.lkOm[pkLink[k]];
        if (pkS[k] >= 1 || fr.act[sc.nNodes + pkLink[k]] < 0.5 || fr.omul[sc.nNodes + pkLink[k]] < 0.6) pkOn[k] = 0;
      }
      nextSpawn -= dt;
      if (nextSpawn <= 0) { nextSpawn = PK_GAP[0] + (PK_GAP[1] - PK_GAP[0]) * pkRng(); spawnPacket(); }
    };
    const drawPackets = () => {
      const { W, H, cx, cy, R, L, E, A, lkP, lkOm, acc } = sc;
      const { cN, sN } = fr;
      for (let k = 0; k < PK_MAX; k++) {
        if (!pkOn[k]) continue;
        const e = pkLink[k], om = lkOm[e], so = Math.sin(om) || 1e-6;
        const f = pkDir[k] > 0 ? 0 : 3, g = pkDir[k] > 0 ? 3 : 0;
        const p = pkS[k], env = sstep(0, 0.14, p) * sstep(1, 0.86, p) * fr.omul[sc.nNodes + e];
        for (let j = 0; j < 8; j++) {
          const t = p - (j * 0.0075) / om;
          if (t < 0) break;
          const sa = Math.sin((1 - t) * om) / so, sb = Math.sin(t * om) / so;
          const x = sa * lkP[e * 6 + f] + sb * lkP[e * 6 + g], y = sa * lkP[e * 6 + f + 1] + sb * lkP[e * 6 + g + 1], z = sa * lkP[e * 6 + f + 2] + sb * lkP[e * 6 + g + 2];
          const xr = x * cN - y * sN, yr = y * cN + x * sN;
          const mu = L[2] * xr + E[2] * yr + A[2] * z;
          if (mu < 0.06) continue;
          const X = cx + R * (L[0] * xr + E[0] * yr + A[0] * z), Y = cy + R * (L[1] * xr + E[1] * yr + A[1] * z);
          blob(acc, W, H, X, Y, PK_A * env * Math.pow(0.62, j) * sstep(0.04, 0.3, mu) * fr.lights, C_HOT);
        }
      }
    };

    // ec: the clock the turn, growth and packets ride (seconds x Speed); tm: the clock of the secondary motion
    // (seconds x Motion). `turn` adds radians to the turn: only the reduced-motion still uses it.
    function* steps(ec, tm, chunks, turn) {
      ensureLut();
      const D = START_TURN + ec * sc.om + v.phase * TAU + turn;
      fr.D = D; fr.ec = ec; fr.cN = Math.cos(D); fr.sN = Math.sin(D);
      fr.gStroke = 0.55 + 0.45 * v.stroke; fr.glow = v.glow; fr.lights = v.lights; fr.stars = v.stars;
      fr.shA = (tm * 90) | 0; fr.shB = (tm * 150) | 0;
      fr.twIdx[0] = (tm * 73) | 0; fr.twIdx[1] = (tm * 56) | 0; fr.twIdx[2] = (tm * 43) | 0; fr.twIdx[3] = (tm * 35) | 0;
      for (let ly = 0; ly < 3; ly++) {
        fr.dx[ly] = DRIFT[ly] * sc.zs * Math.sin((TAU * tm) / DRIFT_T[ly] + ly * 1.7);
        fr.dy[ly] = DRIFT[ly] * 0.6 * sc.zs * Math.sin((TAU * tm) / (DRIFT_T[ly] * 1.37) + ly * 2.9 + 0.8);
      }
      const dt = lastEc < 0 ? 0 : Math.min(0.25, Math.max(0, ec - lastEc)); lastEc = ec;
      const ox = Math.round(SKY_DRIFT * sc.zs * 0.95 * Math.sin((TAU * tm) / 310 + 0.6)), oy = Math.round(SKY_DRIFT * sc.zs * 0.5 * Math.sin((TAU * tm) / 410 + 2.2));
      copyLayers(sc, ox, oy);
      fr.limbL.fill(0);
      drawStars(sc, fr);
      if (chunks) yield;
      updateNet(sc, fr);
      const nn = chunks ? 4 : 1;
      const nOwn = sc.nNodes + sc.nLinks;
      for (let k = 0; k < nn; k++) { drawNet(sc, fr, Math.floor((nOwn * k) / nn), Math.floor((nOwn * (k + 1)) / nn)); if (chunks) yield; }
      stepPackets(dt); drawPackets();
      updateWaves(sc, fr, tm); updateBloom(sc, fr);
      drawLimb(sc, fr); drawBloom(sc, fr); drawAurora(sc, fr, tm);
      if (chunks) yield;
      const n = sc.W * sc.H, np = chunks ? 4 : 1;
      for (let k = 0; k < np; k++) { paint(sc.acc, out, Math.floor((n * k) / np), Math.floor((n * (k + 1)) / np), lut, ground, v.opacity * DARK_GAIN); if (chunks) yield; }
    }
    return {
      /** The pixel (as r, g, b text) and light level the table gives a dot of colour class c and weight a. */
      pixel(c, a) {
        ensureLut();
        let l = a * v.opacity * DARK_GAIN; if (l > LMAX) l = LMAX;
        const p = lut[((c * (CS - 1) + 0.5) | 0) * LEVELS + ((l * (LEVELS - 1) / LMAX) | 0)];
        return { level: l, rgb: `rgb(${p & 255},${(p >> 8) & 255},${(p >> 16) & 255})` };
      },
      /** One frame at clocks (ec, tm), drawn into `out`. */
      frame(ec, tm, turn = 0) { steps(ec, tm, false, turn).next(); },
      /** The same frame as a generator that pauses between pieces of work (each a few ms), for a cold first frame. */
      frameChunks(ec, tm, turn = 0) { return steps(ec, tm, true, turn); },
    };
  }
  // </core>

  // <page>

  // ---------- controls ---------------------------------------------------------------------------------------------
  // The five presets, tuned by eye with `node tools/preset-sheet.mjs signal-sphere`. Build-time values (scale, density,
  // land, nebula, body) rebuild the scene a moment after they land; the rest apply on the next frame.
  const PRESETS = {
    whisper: { opacity: 0.75, stroke: 0.7, density: 0.5, lights: 0.55, stars: 0.5, nebula: 0.15, glow: 0.45 },
    ink:     { opacity: 1, stroke: 1.5, lights: 1.5, glow: 0.2, body: 0, nebula: 0.25, saturation: 0 },
    neon:    { saturation: 0.8, glow: 1.25, lights: 1.2, nebula: 0.8 },
    drift:   { speed: 0.4, motion: 1.8, density: 0.7, lights: 0.8, scale: 1.25, nebula: 0.5, phase: 0.6 },
    dense:   { opacity: 1, density: 1, land: 0.36, lights: 1.15, nebula: 1, stars: 1, body: 1, glow: 1 },
  };

  let dirty = true; // a value moved: redraw (the reduced-motion still only draws when this is set)
  const baked = window.__LF_BAKED_VALUES__;
  const panel = baked ? null : createControlPanel({
    pieceId: PIECE_ID,
    presets: PRESETS,
    onChange: () => { dirty = true; },
    extraControls: [
      // Which bottom corner the planet takes; the open sky is the other side.
      { name: 'side', label: 'Side', type: 'select', options: ['right', 'left'], default: 'right', category: 'form' },
      // Land fraction of the surface: more continents, more places for the network to grow.
      { name: 'land', label: 'Land', type: 'range', min: 0.1, max: 0.6, step: 0.01, default: 0.28, category: 'form' },
      // City-light and link gain (the dots are the same, only brighter or fainter).
      { name: 'lights', label: 'Lights', type: 'range', min: 0, max: 2, step: 0.01, default: 1, category: 'ink' },
      // The planet's own faint tint and rim haze. From about 0.8 the tint is bright enough to count as ink over the whole disc.
      { name: 'body', label: 'Body', type: 'range', min: 0, max: 2, step: 0.01, default: 0.15, category: 'ink' },
      // Share of the starfield drawn.
      { name: 'stars', label: 'Stars', type: 'range', min: 0, max: 1, step: 0.01, default: 0.45, category: 'ink' },
      // Nebula and galaxy gain.
      { name: 'nebula', label: 'Nebula', type: 'range', min: 0, max: 2, step: 0.01, default: 0.2, category: 'ink' },
    ],
    // City lights: sodium orange to deep blue. Saturation 0 hides the pair until someone raises it or picks neon.
    // Two more pairs from the same design, to try with Color A / Color B: 216 -> 250 (blue hour), 326 -> 262 (violet).
    defaults: { hue: 36, hueB: 214, saturation: 0, scale: 1, opacity: 0.85, density: 0.5, glow: 0.9, colorMode: 'gradient', colorA: '#ff9900', colorB: '#006eff' },
  });
  const currentValues = baked || panel.values;

  // ---------- the page: build in slices, draw, follow the window ---------------------------------------------------------
  const PIXEL_CAP = 1.3e6; // canvas px: a larger viewport renders smaller and the CSS upscales it
  const MAX_FPS = 30;
  const SLICE_MS = 10; // longest stretch of scene-build work before yielding back to the browser
  const HOLD_MS = 150; // how long a build-time value must hold before the scene is rebuilt
  const STILL_T = 200; // reduced motion: seconds into the growth the single frame is taken at

  let world = null; // the land texture: independent of the canvas size, built once per page
  let scene = null, renderer = null, img = null, liveKey = ''; // what is on the canvas
  let build = null; // the scene being built, in slices: { key, gen }
  let hold = { key: '', since: 0 };
  let want = { W: 0, H: 0 }; // the canvas size the viewport asks for
  let ec = 0, tm = 0, sinceDraw = 0; // the two clocks (see steps()), and time since the last frame drawn
  let reduced = prefersReducedMotion();
  window.matchMedia?.('(prefers-reduced-motion: reduce)').addEventListener?.('change', (e) => { reduced = e.matches; dirty = true; });

  // Canvas px per CSS px: sharp on a dense display, never below 1 (a zoomed-out page or a half-scale capture builds the
  // same scene), and capped so a very large window renders smaller.
  function sizeFor({ width, height, dpr }) {
    const k = Math.min(Math.max(1, dpr), 1.5, Math.sqrt(PIXEL_CAP / (width * height)));
    want = { W: Math.max(2, Math.round(width * k)), H: Math.max(2, Math.round(height * k)) };
  }
  const resizer = createResizeBatcher(document.body, sizeFor, 1.5);
  resizer.evaluate();

  // What forces a new scene: the canvas size and the build-time values.
  const keyOf = (v) => [want.W, want.H, v.scale, v.angle, v.density, v.side, v.land, v.nebula, v.body].join();

  // The clocks a frame is drawn at. Reduced motion pins them, so there is one still frame, grown in; the turn is put
  // back by what ROTATION_PACE takes off, so the still shows the face a full-pace turn would have reached by then.
  function clocksFor(sc) {
    const v = currentValues;
    if (!reduced) return [ec, tm, 0];
    const e = STILL_T * v.speed;
    return [e, STILL_T * v.motion, e * sc.om * (1 / ROTATION_PACE - 1)];
  }

  // Everything a new scene needs, in slices: the texture (once), the scene, the renderer and a first frame (itself drawn
  // in pieces, since a cold first frame is the slowest). Swapping it in afterwards is cheap.
  function* buildAll(key, W, H, snap) {
    const w = world || (yield* buildWorld());
    const sc = yield* buildScene(w, W, H, snap);
    yield;
    const image = new ImageData(W, H);
    const rd = createRenderer(sc, new Uint32Array(image.data.buffer), currentValues);
    yield;
    yield* rd.frameChunks(...clocksFor(sc));
    return { key, W, H, world: w, scene: sc, renderer: rd, img: image };
  }

  // Swap a finished scene in within one task: resizing the canvas clears it, so the prepared frame goes up at once and
  // no blank frame shows. Until then the old scene keeps drawing, stretched by the CSS.
  function adopt(p) {
    canvas.width = p.W; canvas.height = p.H;
    ctx.putImageData(p.img, 0, 0);
    world = p.world; scene = p.scene; renderer = p.renderer; img = p.img; liveKey = p.key;
    sinceDraw = 0; dirty = true;
  }

  // Resume the build for about SLICE_MS. Called from every frame, which is also what steps it under a manual clock; a
  // message keeps it going between frames, so a cold build isn't limited to one slice per frame. One message at a time,
  // so the frames' own calls never stack up a queue of slices that would starve input.
  let chan = null, queued = false;
  function kick() {
    if (queued) return;
    if (!chan) { chan = new MessageChannel(); chan.port1.onmessage = () => { queued = false; pump(); }; }
    queued = true;
    chan.port2.postMessage(0);
  }
  function pump() {
    const b = build;
    if (!b) return;
    const t0 = performance.now();
    for (;;) {
      const step = b.gen.next();
      if (step.done) { build = null; adopt(step.value); return; }
      if (performance.now() - t0 >= SLICE_MS) break;
    }
    kick();
  }

  // Which scene should be on screen: the first one at once, later ones once the value that asked for them has held.
  function steer(v) {
    const key = keyOf(v), coming = build ? build.key : liveKey;
    if (key === coming) { hold.key = ''; return; }
    if (build && key === liveKey) { build = null; hold.key = ''; return; } // asked for what is already showing
    const now = performance.now();
    if (scene || build) {
      if (hold.key !== key) { hold = { key, since: now }; return; }
      if (now - hold.since < HOLD_MS) return;
    }
    build = { key, gen: buildAll(key, want.W, want.H, { ...v }) };
    hold.key = '';
  }

  function drawNow() {
    renderer.frame(...clocksFor(scene));
    ctx.putImageData(img, 0, 0);
    sinceDraw = 0; dirty = false;
  }

  function onFrame(dt) {
    resizer.evaluate();
    const v = currentValues;
    if (want.W >= 2) steer(v);
    if (build) pump();
    if (!scene) return;
    if (reduced) { if (dirty) drawNow(); return; }
    // The clocks run only while a scene is on screen, so every run starts its growth from the first frame.
    ec += dt * v.speed; tm += dt * v.motion;
    sinceDraw += dt;
    if (sinceDraw >= 1 / MAX_FPS - 0.002) drawNow();
  }

  const loop = createLoop({ onFrame });
  loop.start();

  // SVG export: a capped, evenly sampled share of the dots in the current frame (stars, lights, links, airglow, aurora)
  // as circles in canvas space, coloured through the same table. The nebulae, the galaxies and the body's grain are
  // raster, and so is the stipple's accumulated brightness: use PNG for those.
  const SVG_CAP = 24000;
  function svgCircles() {
    if (!renderer) return [];
    const got = [];
    sink = got;
    try { renderer.frame(...clocksFor(scene)); } finally { sink = null; }
    const lit = [];
    for (let i = 0; i < got.length; i += 4) {
      const px = renderer.pixel(got[i + 3], got[i + 2]);
      if (px.level >= 0.04) lit.push(got[i], got[i + 1], px.rgb);
    }
    const n = lit.length / 3, stride = Math.max(1, Math.ceil(n / SVG_CAP)), out = [];
    for (let i = 0; i < n; i += stride) out.push({ cx: lit[i * 3], cy: lit[i * 3 + 1], r: 0.55, fill: lit[i * 3 + 2], opacity: 1 });
    return out;
  }

  document.getElementById('btn-png-2x')?.addEventListener('click', () => exportPng(canvas, { multiplier: 2 }));
  document.getElementById('btn-png-4x')?.addEventListener('click', () => exportPng(canvas, { multiplier: 4 }));
  document.getElementById('btn-svg')?.addEventListener('click', () => exportSvg([], { width: canvas.width, height: canvas.height, circles: svgCircles() }));
  document.getElementById('btn-baked')?.addEventListener('click', () => {
    bakeHtml({ sourceHtml: document.documentElement.outerHTML, values: panel.values }).catch((err) => console.error('bakeHtml failed', err));
  });
  document.getElementById('btn-source')?.addEventListener('click', () => {
    exportSource().catch((err) => console.error('exportSource failed', err));
  });
  document.getElementById('btn-prompt')?.addEventListener('click', () => {
    describeForAI({ pieceName: PIECE_ID, values: panel.values });
  });
</script>
</body>
</html>
