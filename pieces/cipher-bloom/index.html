<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<!-- Without this a phone uses a ~980px layout viewport, so the panel's
     max-width:640px sheet rule never matches and the page renders zoomed
     out — the controls become an unusable corner card. -->
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>linefield — cipher bloom</title>
<style>
  html, body { margin: 0; height: 100%; background: #0a0a0d; overflow: hidden; }
  canvas { display: block; width: 100vw; height: 100vh; }
  .lf-export-row { position: fixed; top: 12px; right: 12px; display: flex; gap: 6px; z-index: 9999; }
  .lf-export-row button { background: #222; color: #eee; border: 1px solid #444; border-radius: 4px;
    padding: 4px 8px; font: 11px -apple-system, sans-serif; cursor: pointer; }
</style>
</head>
<body>
<canvas id="canvas"></canvas>

<div class="lf-export-row" data-lf-panel>
  <button id="btn-baked">Baked HTML</button>
  <button id="btn-source">Source</button>
  <button id="btn-png-2x">PNG 2x</button>
  <button id="btn-png-4x">PNG 4x</button>
  <button id="btn-svg">SVG</button>
  <button id="btn-prompt">Copy AI Prompt</button>
</div>

<script type="module">
  import { createControlPanel } from '../../shared/controls.js';
  import { createLoop } from '../../shared/anim.js';
  import { hslToRgb, paletteHsl } from '../../shared/color.js';
  import { exportPng, exportSvg, bakeHtml, exportSource, describeForAI } from '../../shared/export.js';

  const PIECE_ID = 'cipher-bloom';
  const canvas = document.getElementById('canvas');
  const ctx = canvas.getContext('2d');

  function resize() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
  }
  window.addEventListener('resize', resize);
  resize();

  const GLYPHS = ['·', '+', '×', '∷', '∧', '⌁', '░', '▒', '╱', '╲'];
  const FONT_STACK = 'ui-monospace, "SF Mono", Menlo, Consolas, monospace';
  let texts = [];
  let travel = 0;
  let identities = 0;

  function hash(a, b, t = 0) {
    let h = (a * 374761393 + b * 668265263 + t * 2246822519) | 0;
    h = Math.imul(h ^ (h >>> 13), 1274122517);
    return ((h ^ (h >>> 16)) >>> 0) / 4294967296;
  }

  const PRESETS = {
    whisper: { opacity: 0.35, stroke: 0.2, density: 0.5, scale: 0.75, saturation: 0.08, motion: 0.4, phase: 0.4 },
    ink:     { opacity: 0.9, stroke: 1.2, density: 0.75, scale: 1.2, saturation: 0, angle: 352, phase: 0.6 },
    neon:    { opacity: 0.86, stroke: 0.75, density: 1.15, scale: 0.8, saturation: 0.65, glow: 0.8, angle: 335, phase: 0.2 },
    drift:   { opacity: 0.6, stroke: 0.45, density: 0.68, scale: 1.35, speed: 0.25, motion: 0.6, phase: 1.2, angle: 355 },
    dense:   { opacity: 0.8, stroke: 0.7, density: 1.65, scale: 0.9, speed: 0.6, angle: 340, phase: 0.75 },
  };

  const baked = window.__LF_BAKED_VALUES__;
  const panel = baked ? null : createControlPanel({
    pieceId: PIECE_ID,
    presets: PRESETS,
    onChange: () => {},
    defaults: { hue: 42, hueB: 76, saturation: 0.22, colorMode: 'gradient', colorA: '#d3a565', colorB: '#e7d9a6', opacity: 0.88, stroke: 0.55, angle: 347, speed: 0.5, motion: 0.55 },
  });
  const currentValues = baked || panel.values;

  function drawFrame(dt, elapsed, values) {
    ctx.fillStyle = values.invert ? '#f2f2f4' : '#0a0a0d';
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    texts = [];
    const W = canvas.width;
    const H = canvas.height;
    const unit = Math.min(W / 1280, H / 800);
    const size = (8 + values.scale * 12) * unit;
    const cols = Math.max(18, Math.round(86 * Math.sqrt(values.density)));
    const rows = Math.max(8, Math.round(30 * Math.sqrt(values.density)));
    const theta = values.angle * Math.PI / 180;
    const c = Math.cos(theta), s = Math.sin(theta);
    const cx = W * 0.58, cy = H * 0.54;
    const breadth = H * (0.07 + values.scale * 0.12);
    const strokeWidth = values.stroke * size * 0.038;
    travel += dt * values.speed * 0.025;
    identities += dt * values.motion * 1.4;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    for (let row = 0; row < rows; row++) for (let col = 0; col < cols; col++) {
      const u = ((col + 0.5) / cols + travel) % 1;
      const v = ((row + 0.5 + (hash(col, row, 1) - 0.5) * 0.8) / rows) * 2 - 1;
      const core = Math.exp(-v * v / 0.09);
      const shoulder = Math.exp(-v * v / 0.42);
      const edge = Math.pow(Math.sin(u * Math.PI), 0.8);
      // Occupancy and jitter stay attached to each mark. Motion changes
      // its identity, not its presence, avoiding whole-band flicker.
      if (hash(col, row, 2) > (0.13 + core * 0.78) * edge) continue;
      const rawX = W * (0.13 + u) + (hash(col, row, 3) - 0.5) * size * 0.6;
      const center = H * (0.59 + Math.sin(u * 5 + values.phase * 1.4) * 0.045 + Math.sin(travel * 1.2) * 0.03);
      const rawY = center + v * breadth * (0.45 + 0.55 * edge);
      const dx = rawX - cx, dy = rawY - cy;
      const x = cx + dx * c - dy * s, y = cy + dx * s + dy * c;
      if (x < -size || x > W + size || y < -size || y > H + size) continue;
      const stop = paletteHsl(values, u);
      const light = values.invert ? 0.3 : 0.43 + core * 0.4;
      const [r, g, b] = hslToRgb(stop.h, stop.s, light);
      const alpha = values.opacity * edge * shoulder * (0.23 + core * 0.77);
      const bucket = Math.floor(identities + hash(col, row, 4) * 3);
      const ch = GLYPHS[Math.floor(hash(col + 11, row + 7, bucket) * GLYPHS.length)];
      // Three type sizes retain irregular texture without churning the
      // browser's font cache with hundreds of unique fonts every frame.
      const glyphSize = size * (0.7 + Math.floor(hash(col, row, 5) * 3) * 0.2);
      const rotation = values.angle + (hash(col, row, 6) - 0.5) * 14;
      const turn = rotation * Math.PI / 180;
      ctx.setTransform(Math.cos(turn), Math.sin(turn), -Math.sin(turn), Math.cos(turn), x, y);
      ctx.font = `${glyphSize}px ${FONT_STACK}`;
      ctx.fillStyle = `rgba(${r},${g},${b},${alpha})`;
      ctx.strokeStyle = ctx.fillStyle;
      ctx.lineWidth = strokeWidth;
      ctx.shadowColor = `rgb(${r},${g},${b})`;
      ctx.shadowBlur = values.glow * core * 7 * unit;
      ctx.fillText(ch, 0, 0);
      if (strokeWidth > 0) ctx.strokeText(ch, 0, 0);
      texts.push({ x, y, ch, size: glyphSize, fontFamily: FONT_STACK, anchor: 'middle', baseline: 'central', rotation, strokeWidth });
    }
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.shadowBlur = 0;
  }

  const loop = createLoop({
    onFrame(dt, elapsed) {
      drawFrame(dt, elapsed, currentValues);
    },
  });
  loop.start();

  document.getElementById('btn-png-2x')?.addEventListener('click', () => exportPng(canvas, { multiplier: 2 }));
  document.getElementById('btn-png-4x')?.addEventListener('click', () => exportPng(canvas, { multiplier: 4 }));
  document.getElementById('btn-svg')?.addEventListener('click', () => exportSvg([], { width: canvas.width, height: canvas.height, texts }));
  document.getElementById('btn-baked')?.addEventListener('click', () => {
    bakeHtml({ sourceHtml: document.documentElement.outerHTML, values: panel.values }).catch((err) => console.error('bakeHtml failed', err));
  });
  document.getElementById('btn-source')?.addEventListener('click', () => {
    exportSource().catch((err) => console.error('exportSource failed', err));
  });
  document.getElementById('btn-prompt')?.addEventListener('click', () => {
    describeForAI({ pieceName: PIECE_ID, values: panel.values });
  });
</script>
</body>
</html>
