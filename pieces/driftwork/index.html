<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<!-- Without this a phone uses a ~980px layout viewport, so the panel's
     max-width:640px sheet rule never matches and the page renders zoomed
     out — the controls become an unusable corner card. -->
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>linefield — driftwork</title>
<style>
  html, body { margin: 0; height: 100%; background: #0a0a0d; overflow: hidden; }
  canvas { display: block; width: 100vw; height: 100vh; }
  .lf-export-row { position: fixed; top: 12px; right: 12px; display: flex; gap: 6px; z-index: 9999; }
  .lf-export-row button { background: #222; color: #eee; border: 1px solid #444; border-radius: 4px;
    padding: 4px 8px; font: 11px -apple-system, sans-serif; cursor: pointer; }
</style>
</head>
<body>
<canvas id="canvas"></canvas>

<!--
  driftwork — tangent-aligned ellipse links following two crossing
  currents, brightening by accumulation where the currents cross.
  Text-safe zone: left third, clear of the bounded span.
  Anchor: the crossing, centre of the frame.
-->

<div class="lf-export-row" data-lf-panel>
  <button id="btn-baked">Baked HTML</button>
  <button id="btn-source">Source</button>
  <button id="btn-png-2x">PNG 2x</button>
  <button id="btn-png-4x">PNG 4x</button>
  <button id="btn-svg">SVG</button>
  <button id="btn-prompt">Copy AI Prompt</button>
</div>

<script type="module">
  import { createControlPanel } from '../../shared/controls.js';
  import { createLoop } from '../../shared/anim.js';
  import { hslToRgb, paletteHsl } from '../../shared/color.js';
  import { exportPng, exportSvg, bakeHtml, exportSource, describeForAI } from '../../shared/export.js';

  const PIECE_ID = 'driftwork';
  const canvas = document.getElementById('canvas');
  const ctx = canvas.getContext('2d');

  function resize() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
  }
  window.addEventListener('resize', resize);
  resize();

  let paths = [];
  let travel = 0;
  let evolution = 0;

  const PRESETS = {
    whisper: { opacity: 0.45, stroke: 0.7, density: 0.7, scale: 0.7, motion: 0.5 },
    ink:     { opacity: 1, stroke: 1.1, density: 0.7, scale: 1.2, saturation: 0, glow: 0, angle: 350, phase: 0.3 },
    neon:    { opacity: 0.82, stroke: 0.8, density: 1.1, scale: 0.85, saturation: 0.85, glow: 1, phase: 0.65 },
    drift:   { opacity: 0.65, stroke: 0.75, density: 0.72, scale: 1.3, speed: 0.22, motion: 1.6, phase: 1.1 },
    dense:   { opacity: 0.76, stroke: 0.8, density: 1.65, scale: 0.85, speed: 0.5, angle: 346, phase: 0.45, glow: 0.4 },
  };

  const baked = window.__LF_BAKED_VALUES__;
  const panel = baked ? null : createControlPanel({
    pieceId: PIECE_ID,
    presets: PRESETS,
    onChange: () => {},
    defaults: { hue: 250, hueB: 278, saturation: 0, colorMode: 'gradient', colorA: '#a6a1b8', colorB: '#beb3c6', opacity: 0.88, stroke: 0.9, speed: 0.55 },
  });
  const currentValues = baked || panel.values;

  function drawFrame(dt, elapsed, values) {
    ctx.globalCompositeOperation = 'source-over';
    ctx.fillStyle = values.invert ? '#f2f2f4' : '#0a0a0d';
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    paths = [];
    const W = canvas.width;
    const H = canvas.height;
    const cx = W * 0.5;
    const cy = H * 0.5;
    const theta = values.angle * Math.PI / 180;
    const ct = Math.cos(theta), st = Math.sin(theta);
    const lanes = Math.max(3, Math.round(12 * Math.sqrt(values.density)));
    const links = Math.max(16, Math.round(72 * Math.sqrt(values.density)));
    const unit = Math.min(W / 1280, H / 800);
    // One object: the currents span a fixed fraction of the frame, not
    // edge to edge, so the whole knot sits inside the central square.
    const L = Math.min(W, H) * (0.36 + 0.28 * values.scale);
    const FREQ = Math.PI * 1.05; // one shallow crossing of the currents, not several
    const separation = H * (0.1 + values.scale * 0.105);
    travel += dt * values.speed * 0.038;
    evolution += dt * values.motion * 0.12;

    const light = values.invert ? 0.14 : 0.86 - 0.26 * values.saturation;
    ctx.globalCompositeOperation = values.invert ? 'source-over' : 'lighter';

    for (let stream = 0; stream < 2; stream++) {
      const side = stream === 0 ? -1 : 1;
      const offset = stream * 0.7 + side * values.phase * 0.55;
      for (let lane = 0; lane < lanes; lane++) {
        const across = (lane + 0.5) / lanes - 0.5;
        for (let link = 0; link < links; link++) {
          const u = (link + lane * 0.37) / links;
          const a = u * FREQ + offset - 0.5 + travel;
          const sway = Math.sin(evolution + u * 4) * H * 0.035 * values.motion;
          const x0 = cx + (u - 0.5) * L;
          const y0 = cy + (u - 0.5) * H * 0.1 + side * Math.sin(a) * separation + sway;
          const dy = -H * 0.08 + side * Math.cos(a) * FREQ * separation
            + Math.cos(evolution + u * 4) * H * 0.14 * values.motion;
          const tangent = Math.atan2(dy, L);
          const ca = Math.cos(tangent), sa = Math.sin(tangent);
          const depth = 0.5 + 0.5 * Math.sin(a + stream * 1.4);
          const spread = H * (0.085 + values.scale * 0.06) * (0.65 + depth * 0.35);
          const px = x0 - sa * across * spread;
          const py = y0 + ca * across * spread;
          const size = unit * (3.5 + values.scale * 5.5) * (0.65 + depth * 0.5);
          const rx = size * (link % 2 === 0 ? 1.1 : 0.85);
          const ry = size * (link % 2 === 0 ? 0.42 : 0.18);
          const points = [];
          // Closed, tangent-aligned ellipses use the same mathematical
          // corners on canvas and in the existing SVG polyline exporter.
          for (let point = 0; point < 16; point++) {
            const t = point / 16 * Math.PI * 2;
            const lx = Math.cos(t) * rx, ly = Math.sin(t) * ry;
            const x = px + lx * ca - ly * sa - cx;
            const y = py + lx * sa + ly * ca - cy;
            points.push([cx + x * ct - y * st, cy + x * st + y * ct]);
          }
          points.push(points[0]);
          const fade = Math.pow(Math.sin(u * Math.PI), 1.2);
          const quiet = Math.min(1, Math.max(0, (px / W - 0.02) / 0.31));
          // Low per-link alpha: overlapping strokes under 'lighter' brighten
          // on their own where the currents converge, not from lightness.
          const alpha = 0.42 * values.opacity * fade * quiet * (0.4 + depth * 0.6) * (1 - Math.abs(across) * 0.75);
          const stop = paletteHsl(values, (stream + depth) / 2);
          const [r, g, b] = hslToRgb(stop.h, stop.s, light);
          ctx.beginPath();
          ctx.moveTo(...points[0]);
          for (let i = 1; i < points.length; i++) ctx.lineTo(...points[i]);
          ctx.lineWidth = unit * (0.35 + values.stroke * 0.5) * (0.75 + depth * 0.35);
          ctx.strokeStyle = `rgba(${r},${g},${b},${alpha})`;
          ctx.stroke();
          paths.push(points);
        }
      }
    }

    // One soft glow at the crossing, drawn once instead of per ellipse — a
    // per-mark shadowBlur here would cost a blur pass per link.
    if (values.glow > 0) {
      const stop = paletteHsl(values, 0.5);
      const [r, g, b] = hslToRgb(stop.h, stop.s, 0.88);
      const gr = Math.min(W, H) * 0.05 * (0.6 + values.glow * 0.4);
      ctx.globalCompositeOperation = 'lighter';
      const grad = ctx.createRadialGradient(cx, cy, 0, cx, cy, gr);
      grad.addColorStop(0, `rgba(${r},${g},${b},${0.3 * values.glow * values.opacity})`);
      grad.addColorStop(1, `rgba(${r},${g},${b},0)`);
      ctx.fillStyle = grad;
      ctx.fillRect(cx - gr, cy - gr, gr * 2, gr * 2);
    }
    ctx.globalCompositeOperation = 'source-over';
  }

  const loop = createLoop({
    onFrame(dt, elapsed) {
      drawFrame(dt, elapsed, currentValues);
    },
  });
  loop.start();

  document.getElementById('btn-png-2x')?.addEventListener('click', () => exportPng(canvas, { multiplier: 2 }));
  document.getElementById('btn-png-4x')?.addEventListener('click', () => exportPng(canvas, { multiplier: 4 }));
  document.getElementById('btn-svg')?.addEventListener('click', () => exportSvg(paths, { width: canvas.width, height: canvas.height }));
  document.getElementById('btn-baked')?.addEventListener('click', () => {
    bakeHtml({ sourceHtml: document.documentElement.outerHTML, values: panel.values }).catch((err) => console.error('bakeHtml failed', err));
  });
  document.getElementById('btn-source')?.addEventListener('click', () => {
    exportSource().catch((err) => console.error('exportSource failed', err));
  });
  document.getElementById('btn-prompt')?.addEventListener('click', () => {
    describeForAI({ pieceName: PIECE_ID, values: panel.values });
  });
</script>
</body>
</html>
