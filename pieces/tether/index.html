<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>linefield — tether</title>
<style>
  html, body { margin: 0; height: 100%; background: #0a0a0d; overflow: hidden; }
  canvas { display: block; width: 100vw; height: 100vh; }
  .lf-export-row { position: fixed; top: 12px; right: 12px; display: flex; gap: 6px; z-index: 9999; }
  .lf-export-row button { background: #222; color: #eee; border: 1px solid #444; border-radius: 4px;
    padding: 4px 8px; font: 11px -apple-system, sans-serif; cursor: pointer; }
</style>
</head>
<body>
<canvas id="canvas"></canvas>

<div class="lf-export-row" data-lf-panel>
  <button id="btn-baked">Baked HTML</button>
  <button id="btn-source">Source</button>
  <button id="btn-png-2x">PNG 2x</button>
  <button id="btn-png-4x">PNG 4x</button>
  <button id="btn-svg">SVG</button>
  <button id="btn-prompt">Copy AI Prompt</button>
</div>

<script type="module">
  import { createControlPanel } from '../../shared/controls.js';
  import { createLoop } from '../../shared/anim.js';
  import { hslToRgb } from '../../shared/color.js';
  import { simplex2 } from '../../shared/noise.js';
  import { exportPng, exportSvg, bakeHtml, exportSource, describeForAI } from '../../shared/export.js';
  import { createPointer } from '../../shared/pointer.js';

  const PIECE_ID = 'tether';
  const canvas = document.getElementById('canvas');
  const ctx = canvas.getContext('2d');

  function resize() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
  }
  window.addEventListener('resize', resize);
  resize();

  // Deliberately the sparsest piece in the library.
  const BASE_COUNT = 6;
  const SAMPLES = 48; // points along each cable
  let cables = [];
  let paths = [];

  function seedCables(count) {
    cables = Array.from({ length: count }, (_, i) => ({
      // Anchors live in normalised space so a resize doesn't restring them.
      ax: 0.02 + Math.random() * 0.2,
      ay: 0.1 + Math.random() * 0.8,
      bx: 0.78 + Math.random() * 0.2,
      by: 0.1 + Math.random() * 0.8,
      j: (i / Math.max(1, count)) * Math.PI * 2 + Math.random(),
    }));
  }

  // Only 6 heavy cables at rest, so `whisper` has to drop stroke hard or it
  // still reads heavy. stroke's control max is 2 — `ink` is held at 1.9,
  // not the limit, so the preset isn't pinned to a ceiling.
  const PRESETS = {
    whisper: { opacity: 0.22, stroke: 0.3, density: 0.5, saturation: 0.05, glow: 0 },
    ink:     { opacity: 1, stroke: 1.9, density: 0.8, saturation: 0, glow: 0 },
    neon:    { opacity: 0.95, stroke: 1.2, density: 1.2, saturation: 0.95, glow: 1.2 },
    drift:   { opacity: 0.5, stroke: 1, density: 0.7, speed: 0.25, motion: 1.7 },
    dense:   { opacity: 0.6, stroke: 0.7, density: 1.8, speed: 0.8 },
  };

  const baked = window.__LF_BAKED_VALUES__;
  const panel = baked ? null : createControlPanel({
    pieceId: PIECE_ID,
    presets: PRESETS,
    onChange: (name, value, values) => {
      if (name === 'density') seedCables(Math.max(2, Math.round(BASE_COUNT * values.density)));
    },
    extraControls: [
      { name: 'slack', label: 'Slack', type: 'range', min: 0, max: 2, step: 0.01, default: 1 },
    ],
    defaults: { hue: 220, hueB: 250, saturation: 0.25 },
  });
  const currentValues = baked || panel.values;
  const pointer = createPointer({ canvas });

  seedCables(Math.max(2, Math.round(BASE_COUNT * currentValues.density)));

  function drawFrame(dt, elapsed, values) {
    ctx.fillStyle = values.invert ? '#f2f2f4' : '#0a0a0d';
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    paths = [];
    const W = canvas.width;
    const H = canvas.height;
    const t = elapsed * values.speed * 0.35;
    const light = values.invert ? 0.35 : 0.65;
    const lineWidth = 2.8 + values.stroke * 6.0; // heaviest strokes in the library — clearly heavier than meridian
    const noiseScale = 0.9 * (0.3 + values.scale);
    const k = values.pointer * pointer.influence;
    const theta = (values.angle * Math.PI) / 180;
    const cosT = Math.cos(-theta), sinT = Math.sin(-theta);
    const pdx = pointer.x - W / 2, pdy = pointer.y - H / 2;
    const plx = W / 2 + pdx * cosT - pdy * sinT;
    const ply = H / 2 + pdx * sinT + pdy * cosT;

    ctx.save();
    ctx.translate(W / 2, H / 2);
    ctx.rotate(theta);
    ctx.translate(-W / 2, -H / 2);

    for (let i = 0; i < cables.length; i++) {
      const c = cables[i];
      const f = cables.length === 1 ? 0.5 : i / (cables.length - 1);

      // Anchors drift slowly so the rig never looks static.
      const wobble = 0.012 * values.motion;
      const ax = (c.ax + simplex2(i * 1.7 + t * 0.3, 0.5) * wobble) * W;
      const ay = (c.ay + simplex2(i * 1.7 + t * 0.3, 3.5) * wobble * 3) * H;
      const bx = (c.bx + simplex2(i * 2.9 + t * 0.3, 7.5) * wobble) * W;
      const by = (c.by + simplex2(i * 2.9 + t * 0.3, 9.5) * wobble * 3) * H;

      // Sag: a parabola along the chord, swaying with a slow oscillation.
      const sway = Math.sin(t + c.j + values.phase * Math.PI);
      const sag = H * 0.16 * values.slack * (0.55 + 0.45 * sway);

      const [r, g, b] = hslToRgb(
        values.hue + (values.hueB - values.hue) * f,
        values.saturation,
        light
      );
      ctx.strokeStyle = `rgba(${r},${g},${b},${values.opacity})`;

      const pts = [];
      ctx.beginPath();
      for (let s = 0; s <= SAMPLES; s++) {
        const u = s / SAMPLES;
        const x = ax + (bx - ax) * u;
        const y = ay + (by - ay) * u;
        // 4*u*(1-u) peaks at 1 in the middle and is 0 at both anchors.
        const droop = 4 * u * (1 - u) * sag;
        // A little high-frequency shiver, like a plucked string.
        const shiver =
          simplex2(u * 3 * noiseScale + c.j, t * 1.6) * 32 * values.motion * (4 * u * (1 - u));
        let py = y + droop + shiver;
        if (k) {
          const f = Math.max(0, 1 - Math.hypot(x - plx, py - ply) / 240);
          py += (py >= ply ? 1 : -1) * f * k * 80 * (4 * u * (1 - u));
        }
        if (s === 0) ctx.moveTo(x, py);
        else ctx.lineTo(x, py);
        pts.push([x, py]);
      }

      if (values.glow > 0) {
        ctx.lineWidth = lineWidth + values.glow * 5;
        ctx.globalAlpha = values.glow * 0.25;
        ctx.stroke();
        ctx.globalAlpha = 1;
      }
      ctx.lineWidth = lineWidth;
      ctx.stroke();
      paths.push(pts);
    }

    ctx.restore();
  }

  const loop = createLoop({
    onFrame(dt, elapsed) {
      pointer.step();
      drawFrame(dt, elapsed, currentValues);
    },
  });
  loop.start();

  document.getElementById('btn-png-2x')?.addEventListener('click', () => exportPng(canvas, { multiplier: 2 }));
  document.getElementById('btn-png-4x')?.addEventListener('click', () => exportPng(canvas, { multiplier: 4 }));
  document.getElementById('btn-svg')?.addEventListener('click', () => exportSvg(paths, { width: canvas.width, height: canvas.height }));
  document.getElementById('btn-baked')?.addEventListener('click', () => {
    bakeHtml({ sourceHtml: document.documentElement.outerHTML, values: panel.values })
      .catch((err) => console.error('bakeHtml failed', err));
  });
  document.getElementById('btn-source')?.addEventListener('click', () => {
    exportSource().catch((err) => console.error('exportSource failed', err));
  });
  document.getElementById('btn-prompt')?.addEventListener('click', () => {
    describeForAI({ pieceName: PIECE_ID, values: panel.values });
  });
</script>
</body>
</html>
