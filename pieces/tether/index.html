<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>linefield - tether</title>
<style>
  html, body { margin: 0; height: 100%; background: #0a0a0d; overflow: hidden; }
  canvas { display: block; width: 100vw; height: 100vh; }
  .lf-export-row { position: fixed; top: 12px; right: 12px; display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 6px; max-width: calc(100vw - 24px); z-index: 9999; }
  .lf-export-row button { background: #222; color: #eee; border: 1px solid #444; border-radius: 4px;
    padding: 4px 8px; font: 11px -apple-system, sans-serif; cursor: pointer; }
</style>
</head>
<body>
<canvas id="canvas" role="img" aria-label="Animated tether background"></canvas>

<div class="lf-export-row" data-lf-panel>
  <button id="btn-baked">Baked HTML</button>
  <button id="btn-source">Source</button>
  <button id="btn-png-2x">PNG 2x</button>
  <button id="btn-png-4x">PNG 4x</button>
  <button id="btn-svg">SVG</button>
  <button id="btn-prompt">Copy AI Prompt</button>
</div>

<script type="module">
  import { createControlPanel } from '../../shared/controls.js';
  import { createLoop } from '../../shared/anim.js';
  import { hslToRgb, paletteHsl } from '../../shared/color.js';
  import { simplex2 } from '../../shared/noise.js';
  import { exportPng, exportSvg, bakeHtml, exportSource, describeForAI } from '../../shared/export.js';

  const PIECE_ID = 'tether';
  const canvas = document.getElementById('canvas');
  const ctx = canvas.getContext('2d');
  const BASE_COUNT = 7;
  const SAMPLES = 64;
  let paths = [];

  const PRESETS = {
    whisper: { opacity: 0.28, stroke: 0.4, density: 0.45, saturation: 0.08, glow: 0, slack: 0.55, scale: 0.8 },
    ink:     { opacity: 0.92, stroke: 1.25, density: 0.72, saturation: 0.08, glow: 0, slack: 1.35, scale: 1.1 },
    neon:    { opacity: 0.86, stroke: 0.8, density: 1.1, saturation: 0.9, glow: 1.5, slack: 0.95, angle: 348 },
    drift:   { opacity: 0.5, stroke: 0.7, density: 0.62, saturation: 0.32, glow: 0.2, speed: 0.32, motion: 1.8, phase: 0.7, slack: 1.7 },
    dense:   { opacity: 0.64, stroke: 0.55, density: 1.75, saturation: 0.2, glow: 0.45, speed: 0.82, motion: 0.75, slack: 0.38, scale: 1.45 },
  };

  const baked = window.__LF_BAKED_VALUES__;
  const panel = baked ? null : createControlPanel({
    pieceId: PIECE_ID,
    presets: PRESETS,
    onChange() {},
    extraControls: [
      { name: 'slack', label: 'Slack', type: 'range', min: 0, max: 2, step: 0.01, default: 1, category: 'visual' },
    ],
    defaults: { hue: 196, hueB: 224, saturation: 0.25, colorMode: 'gradient', colorA: '#00a8c6', colorB: '#6d7cff' },
  });
  const currentValues = baked || panel.values;

  function resize() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
  }
  window.addEventListener('resize', resize);
  resize();

  function rotatePoint(x, y, cx, cy, theta) {
    const dx = x - cx;
    const dy = y - cy;
    const cos = Math.cos(theta);
    const sin = Math.sin(theta);
    return [cx + dx * cos - dy * sin, cy + dx * sin + dy * cos];
  }

  function circlePoints(x, y, radius, theta, cx, cy) {
    const points = [];
    for (let i = 0; i <= 20; i++) {
      const a = (i / 20) * Math.PI * 2;
      points.push(rotatePoint(x + Math.cos(a) * radius, y + Math.sin(a) * radius, cx, cy, theta));
    }
    return points;
  }

  function addPath(points, theta, cx, cy) {
    paths.push(points.map(([x, y]) => rotatePoint(x, y, cx, cy, theta)));
  }

  function paletteColor(values, f, light) {
    const { h, s } = paletteHsl(values, f);
    const [baseR, baseG, baseB] = hslToRgb(h, s, light);
    return values.invert ? [255 - baseR, 255 - baseG, 255 - baseB] : [baseR, baseG, baseB];
  }

  function drawFrame(dt, elapsed, values) {
    const W = canvas.width;
    const H = canvas.height;
    const cx = W / 2;
    const cy = H / 2;
    const theta = values.angle * Math.PI / 180;
    const count = Math.max(2, Math.round(BASE_COUNT * values.density));
    const travel = elapsed * values.speed * 0.18;
    const rigMotion = elapsed * values.motion * 0.15 + values.phase * Math.PI;
    const span = Math.min(W, H);
    const arcScale = 0.72 + values.scale * 0.28;
    const lineWidth = 0.45 + values.stroke * 1.55;
    const bg = values.invert ? '#f1f2ee' : '#0a0a0d';

    ctx.fillStyle = bg;
    ctx.fillRect(0, 0, W, H);
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    paths = [];

    ctx.save();
    ctx.translate(cx, cy);
    ctx.rotate(theta);
    ctx.translate(-cx, -cy);

    for (let i = 0; i < count; i++) {
      const band = i < Math.ceil(count / 2) ? 1 : -1;
      const bandIndex = band === 1 ? i : i - Math.ceil(count / 2);
      const bandCount = band === 1 ? Math.ceil(count / 2) : Math.floor(count / 2);
      const spread = bandCount <= 1 ? 0.05 : bandIndex / (bandCount - 1) * 0.24;
      const baseY = band === 1 ? 0.15 + spread : 0.85 - spread;
      const phase = bandIndex * 1.7 + values.phase * Math.PI * 2;
      const anchorWobble = simplex2(i * 1.8, rigMotion * 0.16) * 0.012 * values.motion;
      const startY = (baseY + anchorWobble) * H;
      const endY = (baseY + Math.sin(rigMotion + phase) * 0.018 * values.motion) * H;
      const attachmentSpread = bandCount <= 1 ? 0 : (bandIndex / (bandCount - 1) - 0.5);
      const startX = W * (0.06 + attachmentSpread * 0.07);
      const endX = W * (0.9 + values.scale * 0.025 + attachmentSpread * 0.035);
      const sag = span * (0.025 + values.slack * 0.065) * arcScale;
      const direction = band === 1 ? 1 : -1;
      const points = [];

      for (let s = 0; s <= SAMPLES; s++) {
        const u = s / SAMPLES;
        const x = startX + (endX - startX) * u;
        const envelope = Math.pow(Math.sin(Math.PI * u), 1.15);
        const slowSway = Math.sin(rigMotion + phase + u * Math.PI * 1.4) * span * 0.012 * values.motion * envelope;
        const fineTension = simplex2(i * 0.9 + u * 2.4, rigMotion * 0.24) * span * 0.006 * values.motion * envelope;
        const y = startY + (endY - startY) * u + direction * sag * envelope + slowSway + fineTension;
        points.push([x, y]);
      }

      const depth = 0.72 + ((i * 5) % Math.max(2, count)) / Math.max(1, count) * 0.28;
      const f = count <= 1 ? 0.5 : i / (count - 1);
      const [r, g, b] = paletteColor(values, f, values.invert ? 0.34 : 0.68);
      const alpha = values.opacity * depth;

      ctx.strokeStyle = `rgba(${r},${g},${b},${alpha})`;
      ctx.lineWidth = lineWidth * (0.72 + depth * 0.52);
      ctx.beginPath();
      ctx.moveTo(points[0][0], points[0][1]);
      for (let p = 1; p < points.length; p++) ctx.lineTo(points[p][0], points[p][1]);
      if (values.glow > 0) {
        ctx.lineWidth += values.glow * 3.8;
        ctx.globalAlpha = values.glow * 0.16 * depth;
        ctx.stroke();
        ctx.globalAlpha = 1;
        ctx.lineWidth = lineWidth * (0.72 + depth * 0.52);
      }
      ctx.stroke();
      addPath(points, theta, cx, cy);

      const pulse = (travel + i / Math.max(1, count) + values.phase * 0.17) % 1;
      const pulseStart = Math.max(0, pulse - 0.075);
      const pulseEnd = Math.min(1, pulse + 0.045);
      const pulsePoints = [];
      for (let p = Math.floor(pulseStart * SAMPLES); p <= Math.ceil(pulseEnd * SAMPLES); p++) {
        pulsePoints.push(points[Math.min(SAMPLES, Math.max(0, p))]);
      }
      if (pulsePoints.length > 1) {
        ctx.strokeStyle = `rgba(${r},${g},${b},${Math.min(1, alpha * 1.45)})`;
        ctx.lineWidth = lineWidth * (0.95 + depth * 0.6);
        ctx.beginPath();
        ctx.moveTo(pulsePoints[0][0], pulsePoints[0][1]);
        for (let p = 1; p < pulsePoints.length; p++) ctx.lineTo(pulsePoints[p][0], pulsePoints[p][1]);
        ctx.stroke();
        addPath(pulsePoints, theta, cx, cy);
      }

      const anchorRadius = 1.2 + values.stroke * 1.35;
      const loadRadius = 2.1 + values.stroke * 2.1;
      ctx.fillStyle = `rgba(${r},${g},${b},${Math.min(1, alpha * 1.2)})`;
      ctx.beginPath();
      ctx.arc(startX, startY, anchorRadius, 0, Math.PI * 2);
      ctx.fill();
      ctx.beginPath();
      ctx.arc(endX, endY, loadRadius, 0, Math.PI * 2);
      ctx.fill();
      ctx.strokeStyle = `rgba(${r},${g},${b},${alpha * 0.72})`;
      ctx.lineWidth = Math.max(0.65, values.stroke * 0.7);
      ctx.beginPath();
      ctx.arc(endX, endY, loadRadius * 1.8, 0, Math.PI * 2);
      ctx.stroke();
      addPath(circlePoints(startX, startY, anchorRadius, theta, cx, cy), 0, 0, 0);
      addPath(circlePoints(endX, endY, loadRadius * 1.8, theta, cx, cy), 0, 0, 0);
    }

    ctx.restore();
  }

  const loop = createLoop({ onFrame(dt, elapsed) { drawFrame(dt, elapsed, currentValues); } });
  loop.start();

  document.getElementById('btn-png-2x')?.addEventListener('click', () => exportPng(canvas, { multiplier: 2 }));
  document.getElementById('btn-png-4x')?.addEventListener('click', () => exportPng(canvas, { multiplier: 4 }));
  document.getElementById('btn-svg')?.addEventListener('click', () => exportSvg(paths, { width: canvas.width, height: canvas.height }));
  document.getElementById('btn-baked')?.addEventListener('click', () => bakeHtml({ sourceHtml: document.documentElement.outerHTML, values: panel.values }).catch((err) => console.error('bakeHtml failed', err)));
  document.getElementById('btn-source')?.addEventListener('click', () => exportSource().catch((err) => console.error('exportSource failed', err)));
  document.getElementById('btn-prompt')?.addEventListener('click', () => describeForAI({ pieceName: PIECE_ID, values: panel.values }));
</script>
</body>
</html>
