<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<!-- Without this a phone uses a ~980px layout viewport, so the panel's
     max-width:640px sheet rule never matches and the page renders zoomed
     out — the controls become an unusable corner card. -->
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>linefield — tether</title>
<style>
  html, body { margin: 0; height: 100%; background: #0a0a0d; overflow: hidden; }
  canvas { display: block; width: 100vw; height: 100vh; }
  .lf-export-row { position: fixed; top: 12px; right: 12px; display: flex; gap: 6px; z-index: 9999; }
  .lf-export-row button { background: #222; color: #eee; border: 1px solid #444; border-radius: 4px;
    padding: 4px 8px; font: 11px -apple-system, sans-serif; cursor: pointer; }
</style>
</head>
<body>
<canvas id="canvas"></canvas>

<div class="lf-export-row" data-lf-panel>
  <button id="btn-baked">Baked HTML</button>
  <button id="btn-source">Source</button>
  <button id="btn-png-2x">PNG 2x</button>
  <button id="btn-png-4x">PNG 4x</button>
  <button id="btn-svg">SVG</button>
  <button id="btn-prompt">Copy AI Prompt</button>
</div>

<script type="module">
  import { createControlPanel } from '../../shared/controls.js';
  import { createLoop } from '../../shared/anim.js';
  import { hslToRgb, paletteHsl } from '../../shared/color.js';
  import { simplex2 } from '../../shared/noise.js';
  import { exportPng, exportSvg, bakeHtml, exportSource, describeForAI } from '../../shared/export.js';

  const PIECE_ID = 'tether';
  const canvas = document.getElementById('canvas');
  const ctx = canvas.getContext('2d');

  function resize() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
  }
  window.addEventListener('resize', resize);
  resize();

  // Deliberately the sparsest piece in the library.
  const BASE_COUNT = 6;
  const SAMPLES = 48; // points along each cable
  let cables = [];
  let paths = [];

  // Every cable now shares one converging anchor — the actual "tether"
  // point — instead of independent random pairs on each side. That's the
  // structural change: the old version was a field of crossing lines
  // spread edge-to-edge, which is exactly why it read as a hue-shifted
  // twin of meridian's field of parallel ribbons. A fan converging on one
  // point gives tether its own dominant gesture (a mooring, not a field)
  // and opens real negative space on the side away from the knot, at any
  // size including a gallery card.
  // Just inside the right edge so the bundle terminates at a visible eye
  // instead of reading as a cut stub of blunt line ends.
  const TETHER_X = 0.92;
  const TETHER_Y = 0.48;

  function seedCables(count) {
    cables = Array.from({ length: count }, (_, i) => ({
      // Anchors live in normalised space so a resize doesn't restring them.
      ax: -0.06 + Math.random() * 0.2,
      ay: -0.08 + Math.random() * 1.16,
      bx: TETHER_X + (Math.random() - 0.5) * 0.03,
      by: TETHER_Y + (Math.random() - 0.5) * 0.06,
      j: (i / Math.max(1, count)) * Math.PI * 2 + Math.random(),
    }));
  }

  // Only 6 heavy cables at rest, so `whisper` has to drop stroke hard or it
  // still reads heavy. stroke's control max is 2 — `ink` is held at 1.9,
  // not the limit, so the preset isn't pinned to a ceiling.
  // `slack` is now the composition-defining knob (the fan converges to one
  // point; how much each cable droops on the way there is the whole
  // silhouette), so presets vary it — not just intensity — alongside a
  // second structural axis (`angle` tilts the whole rig, `scale` widens
  // the shiver). `dense` in particular is checked against the knot at
  // TETHER_X not collapsing into a blob: slack is dropped there so more
  // cables stay taut and legible instead of piling up as droop.
  const PRESETS = {
    whisper: { opacity: 0.22, stroke: 0.3, density: 0.5, saturation: 0.05, glow: 0, slack: 0.4 },
    ink:     { opacity: 1, stroke: 1.9, density: 0.8, saturation: 0, glow: 0, slack: 1.4 },
    neon:    { opacity: 0.95, stroke: 1.2, density: 1.2, saturation: 0.95, glow: 1.2, slack: 0.9, angle: 352 },
    drift:   { opacity: 0.5, stroke: 1, density: 0.7, speed: 0.25, motion: 1.7, slack: 1.7 },
    dense:   { opacity: 0.6, stroke: 0.7, density: 1.8, speed: 0.8, slack: 0.35, scale: 1.3 },
  };

  const baked = window.__LF_BAKED_VALUES__;
  const panel = baked ? null : createControlPanel({
    pieceId: PIECE_ID,
    presets: PRESETS,
    onChange: (name, value, values) => {
      if (name === 'density') seedCables(Math.max(2, Math.round(BASE_COUNT * values.density)));
    },
    extraControls: [
      { name: 'slack', label: 'Slack', type: 'range', min: 0, max: 2, step: 0.01, default: 1, category: 'visual' },
    ],
    defaults: { hue: 220, hueB: 250, saturation: 0.25, colorMode: 'gradient', colorA: '#0055ff', colorB: '#2a00ff' },
  });
  const currentValues = baked || panel.values;

  seedCables(Math.max(2, Math.round(BASE_COUNT * currentValues.density)));

  function drawFrame(dt, elapsed, values) {
    ctx.fillStyle = values.invert ? '#f2f2f4' : '#0a0a0d';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.lineCap = 'round';

    paths = [];
    const W = canvas.width;
    const H = canvas.height;
    const t = elapsed * values.speed * 0.35;
    const light = values.invert ? 0.35 : 0.65;
    const lineWidth = 2.8 + values.stroke * 6.0; // heaviest strokes in the library — clearly heavier than meridian
    const noiseScale = 0.9 * (0.3 + values.scale);
    const theta = (values.angle * Math.PI) / 180;

    ctx.save();
    ctx.translate(W / 2, H / 2);
    ctx.rotate(theta);
    ctx.translate(-W / 2, -H / 2);

    // Knot glow: the convergence point was, until now, just where lines
    // stopped — the negative space Chunk 11 opened around it stayed
    // literally empty. A soft highlight gives that void something to point
    // at, like a lit mooring point the fan pulls toward. Centred on the
    // actual in-frame anchor so it reads as the thing being pulled toward.
    // Drawn underneath the cables
    // (before the loop) and inside the same rotate transform so it tracks
    // the bundle under `angle`, e.g. the `neon` preset.
    const glowX = TETHER_X * W;
    const glowY = TETHER_Y * H;
    const knotPulse = 0.7 + 0.3 * Math.sin(t * 1.3);
    const knotR = (55 + values.glow * 70) * knotPulse;
    const { h: kh, s: ks } = paletteHsl(values, 1);
    const [kr, kg, kb] = hslToRgb(kh, ks, Math.min(0.92, light + 0.3));
    const knotGrad = ctx.createRadialGradient(glowX, glowY, 0, glowX, glowY, knotR);
    knotGrad.addColorStop(0, `rgba(${kr},${kg},${kb},${0.4 * values.opacity})`);
    knotGrad.addColorStop(1, `rgba(${kr},${kg},${kb},0)`);
    ctx.fillStyle = knotGrad;
    ctx.beginPath();
    ctx.arc(glowX, glowY, knotR, 0, Math.PI * 2);
    ctx.fill();

    // The highlight alone read as atmosphere, not an object the cables were
    // tied to. A small eye gives the fan a literal point of attachment at
    // card size without turning the sparse piece into a logo.
    const eyeR = 3 + values.stroke * 1.5;
    ctx.strokeStyle = `rgba(${kr},${kg},${kb},${values.opacity * 0.9})`;
    ctx.lineWidth = Math.max(1, values.stroke * 1.2);
    ctx.beginPath();
    ctx.arc(glowX, glowY, eyeR, 0, Math.PI * 2);
    ctx.stroke();

    for (let i = 0; i < cables.length; i++) {
      const c = cables[i];
      const f = cables.length === 1 ? 0.5 : i / (cables.length - 1);
      // Three-tier depth hierarchy (same discrete-tier idiom as
      // parallax's `row % 4 / 3`) so cables read as a bundle with load-
      // bearing lines up front and slack ones behind, instead of six
      // identical-weight strands. Chunk 11 gave the fan real negative
      // space; this is what still read flat inside the fan itself.
      const depth = (i % 3) / 2;

      // Anchors drift slowly so the rig never looks static.
      const wobble = 0.012 * values.motion;
      const ax = (c.ax + simplex2(i * 1.7 + t * 0.3, 0.5) * wobble) * W;
      const ay = (c.ay + simplex2(i * 1.7 + t * 0.3, 3.5) * wobble * 3) * H;
      const bx = (c.bx + simplex2(i * 2.9 + t * 0.3, 7.5) * wobble) * W;
      const by = (c.by + simplex2(i * 2.9 + t * 0.3, 9.5) * wobble * 3) * H;

      // Sag: a parabola along the chord, swaying with a slow oscillation.
      const sway = Math.sin(t + c.j + values.phase * Math.PI);
      const sag = H * 0.16 * values.slack * (0.55 + 0.45 * sway);

      // Width and alpha both ride the same depth tier so the hierarchy
      // reads at a glance, not just up close.
      const cableWidth = lineWidth * (0.62 + depth * 0.72);
      const cableAlpha = values.opacity * (0.7 + depth * 0.3);

      const { h, s } = paletteHsl(values, f);
      const [r, g, b] = hslToRgb(h, s, light);
      ctx.strokeStyle = `rgba(${r},${g},${b},${cableAlpha})`;

      const pts = [];
      ctx.beginPath();
      for (let s = 0; s <= SAMPLES; s++) {
        const u = s / SAMPLES;
        const x = ax + (bx - ax) * u;
        const y = ay + (by - ay) * u;
        // 4*u*(1-u) peaks at 1 in the middle and is 0 at both anchors.
        const droop = 4 * u * (1 - u) * sag;
        // A little high-frequency shiver, like a plucked string.
        const shiver =
          simplex2(u * 3 * noiseScale + c.j, t * 1.6) * 32 * values.motion * (4 * u * (1 - u));
        let py = y + droop + shiver;
        let px = x;
          if (s === 0) ctx.moveTo(px, py);
        else ctx.lineTo(px, py);
        pts.push([px, py]);
      }

      if (values.glow > 0) {
        ctx.lineWidth = cableWidth + values.glow * 5;
        ctx.globalAlpha = values.glow * 0.25;
        ctx.stroke();
        ctx.globalAlpha = 1;
      }
      ctx.lineWidth = cableWidth;
      ctx.stroke();
      paths.push(pts);
    }

    ctx.restore();

  }

  const loop = createLoop({
    onFrame(dt, elapsed) {
      drawFrame(dt, elapsed, currentValues);
    },
  });
  loop.start();

  document.getElementById('btn-png-2x')?.addEventListener('click', () => exportPng(canvas, { multiplier: 2 }));
  document.getElementById('btn-png-4x')?.addEventListener('click', () => exportPng(canvas, { multiplier: 4 }));
  document.getElementById('btn-svg')?.addEventListener('click', () => exportSvg(paths, { width: canvas.width, height: canvas.height }));
  document.getElementById('btn-baked')?.addEventListener('click', () => {
    bakeHtml({ sourceHtml: document.documentElement.outerHTML, values: panel.values })
      .catch((err) => console.error('bakeHtml failed', err));
  });
  document.getElementById('btn-source')?.addEventListener('click', () => {
    exportSource().catch((err) => console.error('exportSource failed', err));
  });
  document.getElementById('btn-prompt')?.addEventListener('click', () => {
    describeForAI({ pieceName: PIECE_ID, values: panel.values });
  });
</script>
</body>
</html>
