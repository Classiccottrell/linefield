<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<!-- Without this a phone uses a ~980px layout viewport, so the panel's
     max-width:640px sheet rule never matches and the page renders zoomed
     out — the controls become an unusable corner card. -->
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>linefield — high-pass</title>
<style>
  html, body { margin: 0; height: 100%; background: #0a0a0d; overflow: hidden; }
  canvas { display: block; width: 100vw; height: 100vh; }
  .lf-export-row { position: fixed; top: 12px; right: 12px; display: flex; gap: 6px; z-index: 9999; }
  .lf-export-row button { background: #222; color: #eee; border: 1px solid #444; border-radius: 4px;
    padding: 4px 8px; font: 11px -apple-system, sans-serif; cursor: pointer; }
</style>
</head>
<body>
<canvas id="canvas"></canvas>

<!--
  high-pass — a jagged peak seen in cross-section with the wind from the
  left: ground drift creeps up its snowy windward face, and a plume of
  spindrift tears off the crest, sags into the lee and frays downwind in
  clumps.

  Text-safe zone: the sky over the windward slope, upper left (the left
  half above the ridge). Only faint ground drift moves near it.
  Anchor: the crest, right of centre, where the plume leaves the rock. It
  holds still; the plume streams off it, its clumps travel downwind and
  fray, and gusts swell and slacken (12 s apart, one strong and one weaker
  per seamless 24 s loop at Speed 1).

  Technique: every mark goes into float accumulators (the mountain in one,
  the moving snow in the other) that a LUT turns into pixels, the same as
  additive hairlines under 'lighter'. The mountain's marks (ridge line,
  snow skin, the ribs and gullies of its faces, the dark lee) are sampled
  once in a 1280x800 design frame, a growing prefix of one seeded stream,
  and only re-splatted when the framing changes. Each spindrift grain makes
  two trips a loop from the crest downwind; its release time fixes its gust
  and clump, so clumps and gust pulses travel with the snow. Positions are
  worked out in the design frame and mapped to the screen with Scale and
  Angle applied, so nothing is rotated with ctx.rotate.

  Controls: Scale sizes the peak about its foot on the bottom edge (a small
  peak at 0, the crest near the top and the plume bleeding off at 2); Angle
  turns it about the crest. Density sets how many marks there are, Stroke
  their weight, Motion how hard the plume billows and rolls, Gust the gust
  strength and how far the plume carries. Glow adds a soft bloom of the
  densest snow. In gradient mode the mountain takes Color A and the snow
  Color B.

  SVG export: the ridge line as a polyline, a capped sample of the current
  frame's snow streaks as short polylines, and a capped sample of the
  mountain's stipple as circles. The full field stays raster: use PNG.
-->

<div class="lf-export-row" data-lf-panel>
  <button id="btn-baked">Baked HTML</button>
  <button id="btn-source">Source</button>
  <button id="btn-png-2x">PNG 2x</button>
  <button id="btn-png-4x">PNG 4x</button>
  <button id="btn-svg">SVG</button>
  <button id="btn-prompt">Copy AI Prompt</button>
</div>

<script type="module">
  import { createControlPanel } from '../../shared/controls.js';
  import { createLoop } from '../../shared/anim.js';
  import { hslToRgb, paletteHsl } from '../../shared/color.js';
  import { exportPng, exportSvg, bakeHtml, exportSource, describeForAI } from '../../shared/export.js';

  const PIECE_ID = 'high-pass';
  const canvas = document.getElementById('canvas');
  const ctx = canvas.getContext('2d');

  function resize() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
  }
  window.addEventListener('resize', resize);
  resize();

  // The composition is authored in a 1280x800 design frame and fitted to
  // the canvas by cover. Scale holds the mountain's foot (FOOT) on the
  // bottom edge; Angle turns the scene about the crest.
  const W = 1280, H = 800;
  const FOOT = [0.55 * W, H];
  const PERIOD = 24;        // seconds per loop at Speed 1; every term is an integer harmonic
  const SEED = 4242;
  const TAU = Math.PI * 2;
  const HUE_STEPS = 8, LEVELS = 1024, A_MAX = 1.1;
  const INK_L = 0.895;      // grey 228 at saturation 0

  const PRESETS = {
    whisper: { opacity: 1, stroke: 0.7, density: 0.6, gust: 0.8, scale: 0.9, glow: 0 },
    ink:     { opacity: 1, stroke: 1.6, density: 1.1, gust: 1.1, scale: 1.1, saturation: 0, glow: 0 },
    neon:    { opacity: 1, stroke: 1.1, density: 1, gust: 1.2, saturation: 0.85, glow: 1.1 },
    drift:   { opacity: 0.9, stroke: 0.9, density: 0.8, speed: 0.4, motion: 1.8, phase: 0.7, gust: 1.5, scale: 1.25 },
    dense:   { opacity: 0.95, stroke: 1.1, density: 1.9, gust: 1.3, scale: 1.45, angle: 352 },
  };

  const baked = window.__LF_BAKED_VALUES__;
  const panel = baked ? null : createControlPanel({
    pieceId: PIECE_ID,
    presets: PRESETS,
    onChange: () => {},
    extraControls: [
      // Gust strength: how hard the gusts pulse, how high they lift the
      // snow and how far downwind the plume carries.
      { name: 'gust', label: 'Gust', type: 'range', min: 0, max: 2, step: 0.01, default: 1, category: 'motion' },
    ],
    defaults: { hue: 258, hueB: 192, saturation: 0, scale: 1, colorMode: 'gradient', colorA: '#824dff', colorB: '#4ddbff' },
  });
  const currentValues = baked || panel.values;

  // ---------- seeded noise ------------------------------------------------
  function rng(seed) {
    return () => {
      seed |= 0; seed = seed + 0x6D2B79F5 | 0;
      let t = Math.imul(seed ^ seed >>> 15, 1 | seed);
      t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
      return ((t ^ t >>> 14) >>> 0) / 4294967296;
    };
  }
  function perlin(seed) {
    const r = rng(seed), p = new Uint8Array(512), g = new Float32Array(512);
    const perm = [...Array(256).keys()];
    for (let i = 255; i > 0; i--) { const j = Math.floor(r() * (i + 1)); [perm[i], perm[j]] = [perm[j], perm[i]]; }
    for (let i = 0; i < 512; i++) p[i] = perm[i & 255];
    for (let i = 0; i < 256; i++) { const a = r() * TAU; g[2 * i] = Math.cos(a); g[2 * i + 1] = Math.sin(a); }
    const fade = (t) => t * t * t * (t * (t * 6 - 15) + 10);
    return (x, y) => {
      const xi = Math.floor(x), yi = Math.floor(y), xf = x - xi, yf = y - yi;
      const X = xi & 255, Y = yi & 255;
      const aa = p[p[X] + Y], ab = p[p[X] + Y + 1], ba = p[p[X + 1] + Y], bb = p[p[X + 1] + Y + 1];
      const daa = g[2 * aa] * xf + g[2 * aa + 1] * yf, dba = g[2 * ba] * (xf - 1) + g[2 * ba + 1] * yf;
      const dab = g[2 * ab] * xf + g[2 * ab + 1] * (yf - 1), dbb = g[2 * bb] * (xf - 1) + g[2 * bb + 1] * (yf - 1);
      const u = fade(xf), v = fade(yf);
      const x1 = daa + u * (dba - daa), x2 = dab + u * (dbb - dab);
      return x1 + v * (x2 - x1);
    };
  }
  function fbm(n, oct = 4) {
    return (x, y) => { let s = 0, a = 1, f = 1, nm = 0; for (let i = 0; i < oct; i++) { s += a * n(x * f + i * 17.3, y * f - i * 9.1); nm += a; a *= 0.5; f *= 2.03; } return s / nm; };
  }
  function ridged(n, oct = 4) {
    return (x, y) => { let s = 0, a = 1, f = 1, nm = 0; for (let i = 0; i < oct; i++) { const v = 1 - Math.abs(n(x * f + i * 31.7, y * f + i * 5.3)) * 1.4; s += a * v * v; nm += a; a *= 0.5; f *= 2.03; } return s / nm; };
  }
  const clamp = (v, a = 0, b = 1) => v < a ? a : v > b ? b : v;
  const gauss = (d, s) => Math.exp(-(d * d) / (2 * s * s));
  const smooth = (a, b, v) => { const t = clamp((v - a) / (b - a)); return t * t * (3 - 2 * t); };
  const gn = (r) => (r() + r() + r() + r() - 2) * 1.732;
  const frac = (v) => v - Math.floor(v);

  // ---------- the peak, in design px --------------------------------------
  const rd = ridged(perlin(41), 3), F = fbm(perlin(42), 4), rib = ridged(perlin(45), 3), rib2 = ridged(perlin(46), 3);
  const crestAmp = (x) => gauss(x - 0.55 * W, 130);
  // The profile runs on past the design frame, below its bottom edge, so a
  // small or turned peak never shows a cut end.
  const baseY = (x) => {
    if (x < 0) return H * 0.99 + 0.3 * -x;
    if (x < 0.5 * W) return H * (0.99 - 0.52 * Math.pow(x / (0.5 * W), 1.25));
    return Math.min(H * 0.47 + (x - 0.5 * W) ** 2 * 0.0042 + Math.max(0, x - 0.62 * W) * 1.15, H * 1.8);
  };
  const ground = (x) => baseY(x) - 30 * crestAmp(x) * rd((x - 9 * F(x / 40, 3)) / 44, 0.4) - 5 * rd(x / 15, 2.2) + 7 * F(x / 70, 1);
  const XMIN = -0.6 * W, XMAX = 1.9 * W, NG = XMAX - XMIN + 1;
  const gy = new Float32Array(NG);
  for (let i = 0; i < NG; i++) gy[i] = ground(XMIN + i);
  const G = (x) => { let i = Math.round(x) - XMIN; if (i < 0) i = 0; else if (i >= NG) i = NG - 1; return gy[i]; };
  let topX = 0; for (let x = 1; x <= W; x++) if (G(x) < G(topX)) topX = x;
  const ANCHOR = [topX, G(topX)];
  // Below the design frame's bottom edge the mountain dissolves.
  const footFade = (y) => 1 - smooth(H, 1.16 * H, y);

  // ---------- the mountain's marks: growing prefixes of seeded streams ----
  // Each family samples candidates in order from its own stream and keeps
  // the accepted marks (x, y, alpha) with a checkpoint every BLOCK
  // candidates, so the marks for any candidate count are an exact prefix.
  const BLOCK = 1024;
  function family(seed, base, cand) {
    return { r: rng(seed), base, cand, done: 0, n: 0, buf: new Float32Array(3 * 8192), at: [0] };
  }
  function keep(fam, x, y, a) {
    a *= footFade(y);
    if (a < 0.004) return;
    if (fam.n * 3 + 3 > fam.buf.length) { const b = new Float32Array(fam.buf.length * 2); b.set(fam.buf); fam.buf = b; }
    fam.buf[fam.n * 3] = x; fam.buf[fam.n * 3 + 1] = y; fam.buf[fam.n * 3 + 2] = a; fam.n++;
  }
  // Grows a family toward `want` candidates by at most `budget`.
  function grow(fam, want, budget) {
    const target = Math.min(want, fam.done + budget);
    while (fam.done + BLOCK <= target) {
      for (let i = 0; i < BLOCK; i++) fam.cand(fam.r, fam);
      fam.done += BLOCK;
      fam.at.push(fam.n);
    }
  }
  const marksFor = (fam, want) => fam.at[Math.min(fam.at.length - 1, Math.floor(want / BLOCK))];

  // Windward snow skin: marks hug the surface, lit from the windward (left) side.
  const skin = family(SEED + 1, 26000, (r, fam) => {
    const x = r() * 0.68 * W, dv = Math.abs(gn(r)) * (6 + 14 * crestAmp(x)), y = G(x) + dv;
    const sl = (G(x + 3) - G(x - 3)) / 6, lit = clamp(0.4 - sl * 0.8);
    if (r() > lit * (0.25 + 0.5 * crestAmp(x)) * gauss(dv, 9 + 8 * crestAmp(x))) return;
    keep(fam, x, y, 0.05 + 0.13 * lit * r());
  });
  // The faces below the crest: ribs and snow gullies running down the fall
  // line, lit on the windward side, barely caught on the lee; they dissolve
  // toward the foot.
  const body = family(SEED + 2, 700000, (r, fam) => {
    const x = r() * 0.74 * W, wind = x < topX, dv = Math.abs(gn(r)) * (wind ? 140 : 100), y = G(x) + dv;
    if (dv < 1) return;
    // Ribs are irregular, not a pleat: their slant fans with x, their
    // spacing is warped, each one has its own strength, and each breaks off
    // and starts again down its length, so they end at different depths.
    const side = wind ? -1 : 1, sh = 0.62 + 1.6 * F(x / 260 + 9, 2.1);
    const xw = x + 70 * F(x / 90 + 3, dv / 120 - 6);
    const u = (xw - side * sh * dv) / 26 + 0.9 * F(x / 140, dv / 110 + 5), v = dv / 95;
    const rv = (wind ? rib : rib2)(u, v), snow = rv ** 6;
    const own = smooth(-0.22, 0.22, F(u * 0.31 + 4.1, dv / 260 + 1.7));
    const runs = smooth(-0.12, 0.2, F(u * 0.9 + 7.7, dv / 45));
    const fall = gauss(dv, wind ? 55 + 85 * crestAmp(x) : 60);
    const field = smooth(-0.2, 0.3, F(x / 170 + 3, dv / 80 - 2)); // snowfields and bare rock
    const p = (wind ? 0.9 : 0.32) * snow * fall * (0.25 + 0.75 * field) * (0.3 + 0.7 * smooth(0.05 * W, 0.45 * W, x))
      * (0.2 + 0.8 * own) * (0.25 + 0.75 * runs) * 3.2;
    if (r() > p) return;
    keep(fam, x, y, wind ? 0.05 + 0.11 * r() * (0.5 + 0.5 * crestAmp(x)) : 0.045 + 0.06 * r());
  });
  // Lee face: dark rock, a few ribs catching nothing but sky.
  const lee = family(SEED + 3, 16000, (r, fam) => {
    const x = 0.55 * W + r() * 0.3 * W, dv = r() * 200, y = G(x) + dv; if (x < 0.6 * W) return;
    if (r() > 0.9 * rib((x + dv * 0.55) / 20, dv / 160) ** 4 * gauss(dv, 110)) return;
    keep(fam, x, y, 0.06 + 0.09 * r());
  });
  const FAMILIES = [skin, body, lee];
  // The ridge line, brighter toward the crest: design-space segments.
  const ridge = [];
  for (let x = XMIN; x < 0.8 * W; x += 2) {
    const y0 = G(x), y1 = G(x + 2), a = (0.12 + 0.3 * crestAmp(x) + 0.1 * (x < 0.6 * W)) * 0.6 * footFade(y0);
    if (a > 0.002) ridge.push(x, y0, x + 2, y1, a);
  }

  // ---------- spindrift, ground drift and loose flakes -------------------
  // Grains are a growing pool from one seeded stream; any prefix is an even
  // thinning. Each grain makes two trips per loop; psi is its release time
  // within the loop on each trip, and fixes that trip's gust and clump.
  const PLUME_N = 260000, ND = 5200, NL = 1300, MAXK = 6; // MAXK: the most Density x size can ask for
  const cx0 = 0.44 * W, cx1 = 0.68 * W;
  // Release-time clumps: seeded noise round a circle in release time (so it
  // loops), shifted by the grain's place across the plume and along the
  // crest. Blobs rather than waves, so no band of snow runs unbroken down
  // the plume beside another.
  const cn = perlin(47);
  const per = (psi, v, xc) => {
    const c = Math.cos(TAU * psi), s = Math.sin(TAU * psi);
    return 2 * (0.7 * cn(1.6 * c + 0.55 * v, 1.6 * s + xc / 70) + 0.3 * cn(3.3 * c - 0.9 * v + 11, 3.3 * s - xc / 45 + 5));
  };
  // Per grain: crest x, start y, loop offset, spread, threshold, clump x2,
  // gust x2, length, alpha, roll phase, width.
  const GF = 13;
  const plume = { r: rng(SEED + 4), n: 0, buf: new Float32Array(GF * 65536) };
  function growPlume(want, budget) {
    const target = Math.min(want, plume.n + budget), r = plume.r;
    if (target * GF > plume.buf.length) {
      const b = new Float32Array(Math.max(target, (plume.buf.length / GF * 1.5) | 0) * GF); b.set(plume.buf); plume.buf = b;
    }
    const P = plume.buf;
    while (plume.n < target) {
      const xc = cx0 + r() * (cx1 - cx0); if (r() > 0.55 + 0.45 * gauss(xc - 0.56 * W, 90)) continue;
      const u0 = r(), v = gn(r), j = plume.n * GF;
      P[j] = xc; P[j + 1] = G(xc) - 2; P[j + 2] = u0; P[j + 3] = v; P[j + 4] = r();
      for (let k = 0; k < 2; k++) {
        const psi = frac((k - u0) / 2), gust = (0.5 + 0.5 * Math.sin(TAU * 2 * psi + xc / 400)) * (0.72 + 0.28 * Math.sin(TAU * psi + 0.6));
        P[j + 5 + k] = 0.05 + 0.95 * smooth(0, 0.38, per(psi, v, xc));
        P[j + 7 + k] = gust;
      }
      P[j + 9] = r(); P[j + 10] = 0.4 + 0.6 * r(); P[j + 12] = 0.5 + 0.2 * r(); P[j + 11] = r() * TAU;
      plume.n++;
    }
  }
  const rDrift = rng(SEED + 5);
  // Ground drift: streaks creeping up the windward slope toward the crest.
  const drift = new Float32Array(ND * MAXK * 6);
  for (let i = 0; i < ND * MAXK; i++) { const j = i * 6; drift[j] = rDrift(); drift[j + 1] = Math.abs(gn(rDrift)); drift[j + 2] = rDrift(); drift[j + 3] = 0.08 * gn(rDrift); drift[j + 4] = rDrift(); drift[j + 5] = rDrift(); }
  // Loose flakes far downwind.
  const flakes = new Float32Array(NL * MAXK * 5);
  for (let i = 0; i < NL * MAXK; i++) { const j = i * 5; flakes[j] = rDrift(); flakes[j + 1] = 0.15 * H + rDrift() * 0.75 * H; flakes[j + 2] = rDrift() * TAU; flakes[j + 3] = 0.05 + 0.08 * rDrift(); flakes[j + 4] = 0.09 * gn(rDrift); }

  // ---------- buffers, framing, splats -------------------------------------
  let CW = 0, CH = 0, base, dyn, img, u32, gw = 0, gh = 0, gbuf, gtmp, glowCanvas, glowCtx, gimage, gpix;
  function ensureBuffers() {
    if (CW === canvas.width && CH === canvas.height) return;
    CW = canvas.width; CH = canvas.height;
    base = new Float32Array(CW * CH); dyn = new Float32Array(CW * CH);
    img = ctx.createImageData(CW, CH); u32 = new Uint32Array(img.data.buffer);
    gw = Math.ceil(CW / 4); gh = Math.ceil(CH / 4);
    gbuf = new Float32Array(gw * gh); gtmp = new Float32Array(gw * gh);
    glowCanvas = document.createElement('canvas'); glowCanvas.width = gw; glowCanvas.height = gh;
    glowCtx = glowCanvas.getContext('2d'); gimage = glowCtx.createImageData(gw, gh); gpix = new Uint32Array(gimage.data.buffer);
  }

  // Design -> screen: X = ox + a x - b y, Y = oy + b x + a y.
  function framing(values) {
    const fit = Math.max(CW / W, CH / H), size = 0.45 + 0.55 * values.scale, k = fit * size;
    const th = values.angle * Math.PI / 180, a = k * Math.cos(th), b = k * Math.sin(th);
    // Scale about the foot: the crest lands at (cx, cy); Angle turns about it.
    const fx = CW / 2 + (FOOT[0] - W / 2) * fit, fy = CH / 2 + (FOOT[1] - H / 2) * fit;
    const cx = fx + k * (ANCHOR[0] - FOOT[0]), cy = fy + k * (ANCHOR[1] - FOOT[1]);
    return { k, a, b, ox: cx - a * ANCHOR[0] + b * ANCHOR[1], oy: cy - b * ANCHOR[0] - a * ANCHOR[1] };
  }

  // A 1px mark centred on (x, y), bilinear, like an antialiased fillRect.
  function add(buf, x, y, m) {
    x -= 0.5; y -= 0.5;
    const ix = Math.floor(x), iy = Math.floor(y);
    if (ix < 0 || iy < 0 || ix >= CW - 1 || iy >= CH - 1) return;
    const fx = x - ix, fy = y - iy, k = iy * CW + ix;
    buf[k] += m * (1 - fx) * (1 - fy); buf[k + 1] += m * fx * (1 - fy); buf[k + CW] += m * (1 - fx) * fy; buf[k + CW + 1] += m * fx * fy;
  }
  // m = alpha x line width, per px of length. Above Stroke 1 the line
  // widens: a second pass sits beside it, offset across the line.
  let spread = 0;
  function seg(buf, x0, y0, x1, y1, m) {
    const dx = x1 - x0, dy = y1 - y0, len = Math.sqrt(dx * dx + dy * dy), n = Math.ceil(len / 0.8) || 1, q = m * len / n;
    for (let i = 0; i < n; i++) { const t = (i + 0.5) / n; add(buf, x0 + dx * t, y0 + dy * t, q); }
    if (spread > 0 && len > 0) {
      const nx = -dy / len * 0.9, ny = dx / len * 0.9, q2 = q * spread;
      for (let i = 0; i < n; i++) { const t = (i + 0.5) / n; add(buf, x0 + dx * t + nx, y0 + dy * t + ny, q2); }
    }
  }
  function dot(buf, x, y, m) {
    add(buf, x, y, m);
    if (spread > 0) { const e = m * 0.5 * spread; add(buf, x + 0.8, y, e); add(buf, x, y + 0.8, e); add(buf, x + 0.8, y + 0.8, e * 0.7); }
  }

  // Stroke: below 1 a mark thins (dims) toward a speck; above 1 it widens.
  const strokeA = (v) => Math.min(1, 0.35 + 0.65 * v);
  const strokeSpread = (v) => Math.max(0, 0.35 + 0.65 * v - 1) * 1.6;
  // Mark counts follow the area the mountain covers on screen.
  const staticWant = (fam, values, T) => Math.round(fam.base * values.density * Math.min(MAXK / 2, T.k * T.k));
  const snowK = (values, T) => values.density * Math.min(MAXK / 2, T.k);

  let baseKey = '', splatted = [0, 0, 0];
  function splatBase(values, T) {
    const key = [CW, CH, values.scale, values.angle, values.stroke, values.density].join();
    const sa = strokeA(values.stroke), { a, b, ox, oy } = T;
    spread = strokeSpread(values.stroke);
    if (key !== baseKey) {
      baseKey = key; base.fill(0); splatted = [0, 0, 0];
      for (let i = 0; i < ridge.length; i += 5) {
        const x0 = ridge[i], y0 = ridge[i + 1], x1 = ridge[i + 2], y1 = ridge[i + 3];
        seg(base, ox + a * x0 - b * y0, oy + b * x0 + a * y0, ox + a * x1 - b * y1, oy + b * x1 + a * y1, ridge[i + 4] * sa);
      }
    }
    // Marks generated since the last frame go straight in; a framing change starts over.
    for (let f = 0; f < FAMILIES.length; f++) {
      const fam = FAMILIES[f], upto = Math.min(fam.n, marksFor(fam, staticWant(fam, values, T)));
      if (splatted[f] >= upto) continue;
      const B = fam.buf;
      for (let i = splatted[f]; i < upto; i++) {
        const x = B[i * 3], y = B[i * 3 + 1];
        dot(base, ox + a * x - b * y, oy + b * x + a * y, B[i * 3 + 2] * sa);
      }
      splatted[f] = upto;
    }
  }

  // ---------- one frame of moving snow ------------------------------------
  let capture = null; // SVG export collects streaks here
  function frameState(values) {
    const g = values.gust;
    return {
      ph: frac(clock / PERIOD + values.phase / 2), mo: values.motion,
      // Gust: how far the plume carries, how fast it travels, how deep the
      // gust pulses run and how high they lift it, and how much snow lifts.
      lam: 210 * (0.4 + 0.6 * g), smax: 900 * (0.8 + 0.2 * g),
      gd: Math.min(0.9, 0.55 * g), lift0: 1 - 0.25 * g, lift1: 0.5 * g, amt: 0.55 + 0.45 * g,
    };
  }
  function drawSnow(values, T, f) {
    const { a, b, ox, oy } = T, sa = strokeA(values.stroke), mo = f.mo, ph = f.ph;
    const P = plume.buf, nP = Math.min(plume.n, Math.round(PLUME_N * snowK(values, T)));
    const w1 = TAU * 4 * ph, w2 = TAU * 10 * ph; // eddies roll downwind at about the grain speed
    const SMAX = f.smax, LAM = f.lam, endS = SMAX - 10;
    const xLo = -40, xHi = CW + 40, yLo = -40, yHi = CH + 40;
    for (let i = 0; i < nP; i++) {
      const j = i * GF;
      const q = P[j + 2] + 2 * ph, n = Math.floor(q), u = q - n, kk = n & 1, s = -10 + u * SMAX, sp0 = s > 0 ? s : 0;
      const gust = P[j + 7 + kk];
      const vis = Math.exp(-sp0 / LAM) * (0.12 + 0.88 * smooth(0, 90, s)) * (1 - smooth(0.7 * endS, endS, s))
        * P[j + 5 + kk] * (1 - f.gd + f.gd * gust) * f.amt - P[j + 4];
      if (vis <= 0) continue;
      const xc = P[j], x = xc + s, v = P[j + 3], pe = xc / 300;
      const lift = (-30 * (1 - Math.exp(-sp0 / 90)) + 0.12 * Math.pow(Math.max(0, s - 150), 1.08)) * (f.lift0 + f.lift1 * gust);
      const eddy = mo * 0.09 * sp0 * (0.62 * Math.sin(s / 72 - w1 + pe * 2.5) + 0.38 * Math.sin(s / 29 - w2 + pe * 4 + 1.7));
      const y = P[j + 1] + lift + eddy + v * (3 + 0.17 * sp0);
      if (y > G(x) - 1) continue;
      const X = ox + a * x - b * y, Y = oy + b * x + a * y;
      if (X < xLo || X > xHi || Y < yLo || Y > yHi) continue;
      const sp = Math.exp(-sp0 / 300);
      const roll = mo * 0.5 * (0.3 + 0.7 * (1 - sp)) * Math.sin(P[j + 11] + s / 45);
      const ang = Math.atan2(0.12 * smooth(100, 400, s) - 0.34 * Math.exp(-sp0 / 90), 1) + roll;
      const len = 1.5 + (3 + 13 * sp) * P[j + 9];
      const m = (0.05 + 0.21 * sp * P[j + 10]) * P[j + 12] * (vis > 0.04 ? 1 : vis / 0.04) * sa;
      const ca = Math.cos(ang), sn = Math.sin(ang), dX = (a * ca - b * sn) * len, dY = (b * ca + a * sn) * len;
      seg(dyn, X, Y, X + dX, Y + dY, m);
      if (capture) capture.push(X, Y, X + dX, Y + dY, m);
    }
    // Ground drift up the windward slope.
    const nD = Math.min(ND * MAXK, Math.round(ND * snowK(values, T)));
    for (let i = 0; i < nD; i++) {
      const j = i * 6;
      let u = drift[j] + ph; if (u >= 1) u -= 1;
      const x = 0.08 * W + u * 0.44 * W, prox = Math.min(1, x / (0.56 * W));
      const vis = (0.15 + 0.85 * prox ** 3) * smooth(0, 0.06, u) * (1 - smooth(0.9, 1, u)) - drift[j + 2];
      if (vis <= 0) continue;
      const sl = (G(x + 4) - G(x - 4)) / 8, hgt = drift[j + 1] * (2 + 9 * x / W), y = G(x) - hgt - 1;
      const X = ox + a * x - b * y, Y = oy + b * x + a * y;
      if (X < xLo || X > xHi || Y < yLo || Y > yHi) continue;
      const len = 2 + 9 * prox * drift[j + 4], an = Math.atan(sl) + drift[j + 3] * (0.4 + 0.6 * mo);
      const ca = Math.cos(an), sn = Math.sin(an), dX = (a * ca - b * sn) * len, dY = (b * ca + a * sn) * len;
      const m = (0.05 + 0.2 * prox * prox * drift[j + 5]) * 0.5 * (vis > 0.05 ? 1 : vis / 0.05) * sa;
      seg(dyn, X, Y, X + dX, Y + dY, m);
      if (capture) capture.push(X, Y, X + dX, Y + dY, m);
    }
    // Loose flakes far downwind.
    const nL = Math.min(NL * MAXK, Math.round(NL * snowK(values, T)));
    for (let i = 0; i < nL; i++) {
      const j = i * 5;
      let u = flakes[j] + ph; if (u >= 1) u -= 1;
      const x = 0.55 * W + u * 0.45 * W, y = flakes[j + 1] + 5 * mo * Math.sin(TAU * 3 * ph + flakes[j + 2]);
      if (y > G(x)) continue;
      const X = ox + a * x - b * y, Y = oy + b * x + a * y;
      if (X < xLo || X > xHi || Y < yLo || Y > yHi) continue;
      const env = smooth(0, 0.08, u) * (1 - smooth(0.9, 1, u));
      const an = flakes[j + 4], ca = Math.cos(an), sn = Math.sin(an), dX = (a * ca - b * sn) * 3, dY = (b * ca + a * sn) * 3;
      const m = flakes[j + 3] * 0.5 * env * sa;
      seg(dyn, X, Y, X + dX, Y + dY, m);
      if (capture) capture.push(X, Y, X + dX, Y + dY, m);
    }
  }

  // ---------- palette ------------------------------------------------------
  // Neutral ink added to the ground, so a faint mark never inherits a tint:
  // with saturation 0 every pixel keeps the ground's own chroma of 3.
  const lut = new Uint32Array(HUE_STEPS * LEVELS);
  let lutKey = '', groundPx = 0, glowInk = [0, 0, 0];
  function buildLut(values) {
    const key = [values.hue, values.hueB, values.saturation, values.colorMode, values.invert].join();
    if (key === lutKey) return;
    lutKey = key;
    const groundC = values.invert ? [242, 242, 244] : [10, 10, 13];
    for (let h = 0; h < HUE_STEPS; h++) {
      const stop = paletteHsl(values, h / (HUE_STEPS - 1));
      const ink = hslToRgb(stop.h, stop.s, values.invert ? 0.12 : INK_L);
      for (let l = 0; l < LEVELS; l++) {
        const t = (l / (LEVELS - 1)) * A_MAX;
        const c = values.invert
          ? groundC.map((gv, k) => gv + (ink[k] - gv) * Math.min(1, t))
          : groundC.map((gv, k) => Math.min(255, gv + ink[k] * t));
        lut[h * LEVELS + l] = (255 << 24) | (Math.round(c[2]) << 16) | (Math.round(c[1]) << 8) | Math.round(c[0]);
      }
    }
    groundPx = lut[0];
    const s = paletteHsl(values, 1);
    glowInk = hslToRgb(s.h, s.s, values.invert ? 0.12 : 0.6);
  }

  function present(values) {
    const op = values.opacity, mono = values.saturation === 0 || values.colorMode === 'solid';
    const gain = (LEVELS - 1) / A_MAX;
    for (let i = 0, n = CW * CH; i < n; i++) {
      const c = base[i], d = dyn[i], t = c + d;
      let v = t * op;
      if (v < 0.0005) { u32[i] = groundPx; continue; }
      if (v > A_MAX) v = A_MAX;
      const h = mono ? 0 : ((d / t) * (HUE_STEPS - 1) + 0.5) | 0;
      u32[i] = lut[h * LEVELS + ((v * gain) | 0)];
    }
    ctx.globalCompositeOperation = 'source-over';
    ctx.putImageData(img, 0, 0);
  }

  // Glow: a quarter-resolution copy of the snow, box-blurred twice, laid
  // back over the frame. It gathers where the plume is densest, at the crest.
  const GLOW_R = 3;
  function boxBlur(buf, tmp, bw, bh, r) {
    for (let y = 0; y < bh; y++) {
      const row = y * bw; let s = 0;
      for (let x = -r; x < bw; x++) {
        if (x + r < bw) s += buf[row + x + r];
        if (x - r - 1 >= 0) s -= buf[row + x - r - 1];
        if (x >= 0) tmp[row + x] = s;
      }
    }
    for (let x = 0; x < bw; x++) {
      let s = 0;
      for (let y = -r; y < bh; y++) {
        if (y + r < bh) s += tmp[(y + r) * bw + x];
        if (y - r - 1 >= 0) s -= tmp[(y - r - 1) * bw + x];
        if (y >= 0) buf[y * bw + x] = s;
      }
    }
  }
  function drawGlow(values) {
    gbuf.fill(0);
    for (let y = 0; y < CH; y++) {
      const row = y * CW, drow = (y >> 2) * gw;
      for (let x = 0; x < CW; x++) gbuf[drow + (x >> 2)] += dyn[row + x];
    }
    boxBlur(gbuf, gtmp, gw, gh, GLOW_R);
    boxBlur(gbuf, gtmp, gw, gh, GLOW_R);
    const norm = values.glow * values.opacity * 2.2 / (16 * (2 * GLOW_R + 1) ** 4);
    const [ir, ig, ib] = glowInk, inv = values.invert;
    for (let i = 0, n = gbuf.length; i < n; i++) {
      const v = Math.min(1, gbuf[i] * norm);
      gpix[i] = inv
        ? (255 << 24) | (Math.round(255 - (255 - ib) * v) << 16) | (Math.round(255 - (255 - ig) * v) << 8) | Math.round(255 - (255 - ir) * v)
        : (255 << 24) | (Math.round(ib * v) << 16) | (Math.round(ig * v) << 8) | Math.round(ir * v);
    }
    glowCtx.putImageData(gimage, 0, 0);
    // On a light ground the bloom darkens instead.
    ctx.globalCompositeOperation = inv ? 'multiply' : 'lighter';
    ctx.imageSmoothingEnabled = true;
    ctx.drawImage(glowCanvas, 0, 0, gw * 4, gh * 4);
    ctx.globalCompositeOperation = 'source-over';
  }

  // ---------- frame --------------------------------------------------------
  // Mark generation is staged: the first frame builds the default amount at
  // once, later frames add at most a budget each, so a high Density or Scale
  // fills in over a few frames instead of freezing the page.
  let clock = 0, first = true;
  function prepare(values, T) {
    const budget = first ? 1 << 20 : 1 << 17;
    first = false;
    for (const fam of FAMILIES) grow(fam, staticWant(fam, values, T), Math.max(BLOCK, Math.round(budget * fam.base / 742000)));
    growPlume(Math.round(PLUME_N * snowK(values, T)), budget >> 2);
  }

  function drawFrame(dt, elapsed, values) {
    ensureBuffers();
    clock += dt * values.speed;
    const T = framing(values);
    prepare(values, T);
    buildLut(values);
    splatBase(values, T);
    dyn.fill(0);
    drawSnow(values, T, frameState(values));
    present(values);
    if (values.glow > 0) drawGlow(values);
  }

  // SVG: the ridge line, a capped sample of the frame's streaks as short
  // polylines, and a capped sample of the mountain's stipple as circles.
  const SVG_STREAK_CAP = 6000, SVG_DOT_CAP = 8000;
  function exportVector() {
    const values = currentValues;
    ensureBuffers();
    const T = framing(values), { a, b, ox, oy } = T;
    const inside = (X, Y) => X >= 0 && Y >= 0 && X <= CW && Y <= CH;
    const paths = [];
    let run = [];
    for (let i = 0; i < ridge.length; i += 5) {
      const x = ridge[i], y = ridge[i + 1], X = ox + a * x - b * y, Y = oy + b * x + a * y;
      if (inside(X, Y) && ridge[i + 4] > 0.02) run.push([X, Y]);
      else { if (run.length > 1) paths.push(run); run = []; }
    }
    if (run.length > 1) paths.push(run);
    capture = [];
    dyn.fill(0);
    drawSnow(values, T, frameState(values));
    const st = capture; capture = null;
    const streaks = [];
    for (let i = 0; i < st.length; i += 5) if (st[i + 4] > 0.06 && inside(st[i], st[i + 1])) streaks.push(i);
    const sStride = Math.max(1, Math.ceil(streaks.length / SVG_STREAK_CAP));
    for (let q = 0; q < streaks.length; q += sStride) { const i = streaks[q]; paths.push([[st[i], st[i + 1]], [st[i + 2], st[i + 3]]]); }
    const stop = paletteHsl(values, 0);
    const [r, g, bl] = hslToRgb(stop.h, stop.s, values.invert ? 0.12 : INK_L);
    const fill = `rgb(${r},${g},${bl})`, rDot = 0.35 + 0.3 * values.stroke;
    const dots = [];
    for (const fam of FAMILIES) {
      const n = Math.min(fam.n, marksFor(fam, staticWant(fam, values, T)));
      for (let i = 0; i < n; i++) {
        const x = fam.buf[i * 3], y = fam.buf[i * 3 + 1], X = ox + a * x - b * y, Y = oy + b * x + a * y;
        if (inside(X, Y) && fam.buf[i * 3 + 2] > 0.08) dots.push(X, Y, fam.buf[i * 3 + 2]);
      }
    }
    const nd = dots.length / 3, dStride = Math.max(1, Math.ceil(nd / SVG_DOT_CAP)), circles = [];
    for (let i = 0; i < nd; i += dStride) circles.push({ cx: dots[i * 3], cy: dots[i * 3 + 1], r: rDot, fill, opacity: Math.min(1, dots[i * 3 + 2] * 3 * values.opacity) });
    exportSvg(paths, { width: canvas.width, height: canvas.height, circles });
  }

  const loop = createLoop({
    onFrame(dt, elapsed) {
      drawFrame(dt, elapsed, currentValues);
    },
  });
  loop.start();

  document.getElementById('btn-png-2x')?.addEventListener('click', () => exportPng(canvas, { multiplier: 2 }));
  document.getElementById('btn-png-4x')?.addEventListener('click', () => exportPng(canvas, { multiplier: 4 }));
  document.getElementById('btn-svg')?.addEventListener('click', exportVector);
  document.getElementById('btn-baked')?.addEventListener('click', () => {
    bakeHtml({ sourceHtml: document.documentElement.outerHTML, values: panel.values }).catch((err) => console.error('bakeHtml failed', err));
  });
  document.getElementById('btn-source')?.addEventListener('click', () => {
    exportSource().catch((err) => console.error('exportSource failed', err));
  });
  document.getElementById('btn-prompt')?.addEventListener('click', () => {
    describeForAI({ pieceName: PIECE_ID, values: panel.values });
  });
</script>
</body>
</html>
