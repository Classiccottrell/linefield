<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<!-- Without this a phone uses a ~980px layout viewport, so the panel's
     max-width:640px sheet rule never matches and the page renders zoomed
     out — the controls become an unusable corner card. -->
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>linefield — pleat</title>
<style>
  html, body { margin: 0; height: 100%; background: #0a0a0d; overflow: hidden; }
  canvas { display: block; width: 100vw; height: 100vh; }
  .lf-export-row { position: fixed; top: 12px; right: 12px; display: flex; gap: 6px; z-index: 9999; }
  .lf-export-row button { background: #222; color: #eee; border: 1px solid #444; border-radius: 4px;
    padding: 4px 8px; font: 11px -apple-system, sans-serif; cursor: pointer; }
</style>
</head>
<body>
<canvas id="canvas"></canvas>

<div class="lf-export-row" data-lf-panel>
  <button id="btn-baked">Baked HTML</button>
  <button id="btn-source">Source</button>
  <button id="btn-png-2x">PNG 2x</button>
  <button id="btn-png-4x">PNG 4x</button>
  <button id="btn-svg">SVG</button>
  <button id="btn-prompt">Copy AI Prompt</button>
</div>

<script type="module">
  import { createControlPanel } from '../../shared/controls.js';
  import { createLoop } from '../../shared/anim.js';
  import { hslToRgb, paletteHsl } from '../../shared/color.js';
  import { exportPng, exportSvg, bakeHtml, exportSource, describeForAI } from '../../shared/export.js';

  const PIECE_ID = 'pleat';
  const canvas = document.getElementById('canvas');
  const ctx = canvas.getContext('2d');

  function resize() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
  }
  window.addEventListener('resize', resize);
  resize();

  let polygons = [];
  let travel = 0;

  const PRESETS = {
    whisper: { opacity: 0.34, stroke: 0.55, density: 0.52, scale: 0.65, motion: 0.55, saturation: 0.12 },
    ink:     { opacity: 0.9, stroke: 1.5, density: 0.8, scale: 1.1, motion: 0.8, saturation: 0, angle: 352 },
    neon:    { opacity: 0.85, stroke: 0.8, density: 1.1, scale: 0.8, motion: 1.45, saturation: 0.65, glow: 0.8, phase: 0.5 },
    drift:   { opacity: 0.62, stroke: 0.85, density: 0.68, scale: 1.3, speed: 0.28, motion: 1.6, phase: 1.2, angle: 8 },
    dense:   { opacity: 0.82, stroke: 1.25, density: 1.7, scale: 1.15, speed: 0.62, motion: 0.7, phase: 0.65, angle: 355 },
  };

  const baked = window.__LF_BAKED_VALUES__;
  const panel = baked ? null : createControlPanel({
    pieceId: PIECE_ID,
    presets: PRESETS,
    onChange: () => {},
    defaults: { hue: 12, hueB: 38, saturation: 0.3, colorMode: 'gradient', colorA: '#c88d7e', colorB: '#e8d8bd', opacity: 0.9, stroke: 1.1, speed: 0.55 },
  });
  const currentValues = baked || panel.values;

  function drawFrame(dt, elapsed, values) {
    ctx.fillStyle = values.invert ? '#f2f2f4' : '#0a0a0d';
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    polygons = [];
    travel += dt * values.speed * 0.065;
    const W = canvas.width;
    const H = canvas.height;
    const cx = W * 0.64;
    const cy = H * 0.53;
    const theta = values.angle * Math.PI / 180;
    const ct = Math.cos(theta), st = Math.sin(theta);
    const columns = Math.max(16, Math.round(94 * values.density));
    const rows = Math.max(4, Math.round(15 * values.density));
    const breadth = H * (0.065 + values.scale * 0.095);
    const depth = H * (0.045 + values.motion * 0.18);
    const gap = H * 0.029;
    const crease = 0.52 + Math.sin(travel * 0.7) * 0.09;
    const advance = (travel * columns) % 1;

    // Two sampled surfaces share the same cut. All four rectangle corners
    // are transformed here, so Canvas and SVG receive identical geometry.
    for (let band = 0; band < 2; band++) {
      const side = band === 0 ? -1 : 1;
      for (let col = 0; col < columns; col++) {
        const u = (col + advance) / columns;
        const d = u - crease;
        const roundedCrease = Math.sqrt(d * d + 0.0008);
        const ridge = 1 - roundedCrease / 0.7;
        const cut = H * 0.65 - depth * ridge;
        const slope = depth * d / (0.7 * roundedCrease * W * 0.95);
        const tilt = Math.atan(slope);
        const ca = Math.cos(tilt), sa = Math.sin(tilt);
        const foldOffset = values.phase * (band === 0 ? 1 : -1);
        const facing = 0.5 + 0.5 * Math.sin(u * 8 - travel * 1.8 + foldOffset);
        const width = breadth * (0.55 + 0.45 * facing);
        const edge = Math.min(1, u * 13, (1 - u) * 20);
        const x0 = W * (0.23 + u * 0.95);
        const markWidth = W * 0.95 / columns * (0.3 + values.stroke * 0.3);

        for (let row = 0; row < rows; row++) {
          const v = (row + 0.5) / rows;
          const y0 = cut + side * (gap + width * v);
          const markHeight = width / rows * (0.42 + values.scale * 0.25);
          const points = [[-1, -1], [1, -1], [1, 1], [-1, 1]].map(([sx, sy]) => {
            const lx = sx * markWidth / 2, ly = sy * markHeight / 2;
            const x = x0 + lx * ca - ly * sa - cx;
            const y = y0 + lx * sa + ly * ca - cy;
            return [cx + x * ct - y * st, cy + x * st + y * ct];
          });
          const stop = paletteHsl(values, band === 0 ? v * 0.26 : 0.7 + v * 0.3);
          const highlight = Math.exp(-d * d / 0.004);
          const light = values.invert
            ? 0.24 + facing * 0.15
            : 0.47 + band * 0.17 + facing * 0.1 + highlight * 0.1;
          const [r, g, b] = hslToRgb(stop.h, stop.s, light);
          const color = `rgb(${r},${g},${b})`;
          const alpha = values.opacity * edge * (0.68 + facing * 0.32) * (1 - v * 0.15);
          ctx.beginPath();
          ctx.moveTo(...points[0]);
          for (let i = 1; i < points.length; i++) ctx.lineTo(...points[i]);
          ctx.closePath();
          ctx.fillStyle = color;
          ctx.globalAlpha = alpha;
          ctx.shadowColor = color;
          ctx.shadowBlur = values.glow * 7;
          ctx.fill();
          polygons.push({ points, fill: color, opacity: alpha });
        }
      }
    }
    ctx.globalAlpha = 1;
    ctx.shadowBlur = 0;
  }

  const loop = createLoop({
    onFrame(dt, elapsed) {
      drawFrame(dt, elapsed, currentValues);
    },
  });
  loop.start();

  document.getElementById('btn-png-2x')?.addEventListener('click', () => exportPng(canvas, { multiplier: 2 }));
  document.getElementById('btn-png-4x')?.addEventListener('click', () => exportPng(canvas, { multiplier: 4 }));
  document.getElementById('btn-svg')?.addEventListener('click', () => exportSvg([], { width: canvas.width, height: canvas.height, polygons }));
  document.getElementById('btn-baked')?.addEventListener('click', () => {
    bakeHtml({ sourceHtml: document.documentElement.outerHTML, values: panel.values }).catch((err) => console.error('bakeHtml failed', err));
  });
  document.getElementById('btn-source')?.addEventListener('click', () => {
    exportSource().catch((err) => console.error('exportSource failed', err));
  });
  document.getElementById('btn-prompt')?.addEventListener('click', () => {
    describeForAI({ pieceName: PIECE_ID, values: panel.values });
  });
</script>
</body>
</html>
