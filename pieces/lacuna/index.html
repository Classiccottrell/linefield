<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<!-- Without this a phone uses a ~980px layout viewport, so the panel's
     max-width:640px sheet rule never matches and the page renders zoomed
     out — the controls become an unusable corner card. -->
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>linefield — lacuna</title>
<style>
  html, body { margin: 0; height: 100%; background: #0a0a0d; overflow: hidden; }
  canvas { display: block; width: 100vw; height: 100vh; }
  .lf-export-row { position: fixed; top: 12px; right: 12px; display: flex; gap: 6px; z-index: 9999; }
  .lf-export-row button { background: #222; color: #eee; border: 1px solid #444; border-radius: 4px;
    padding: 4px 8px; font: 11px -apple-system, sans-serif; cursor: pointer; }
</style>
</head>
<body>
<canvas id="canvas"></canvas>

<div class="lf-export-row" data-lf-panel>
  <button id="btn-baked">Baked HTML</button>
  <button id="btn-source">Source</button>
  <button id="btn-png-2x">PNG 2x</button>
  <button id="btn-png-4x">PNG 4x</button>
  <button id="btn-svg">SVG</button>
  <button id="btn-prompt">Copy AI Prompt</button>
</div>

<script type="module">
  import { createControlPanel } from '../../shared/controls.js';
  import { createLoop } from '../../shared/anim.js';
  import { hslToRgb, paletteHsl } from '../../shared/color.js';
  import { exportPng, exportSvg, bakeHtml, exportSource, describeForAI } from '../../shared/export.js';

  const PIECE_ID = 'lacuna';
  const canvas = document.getElementById('canvas');
  const ctx = canvas.getContext('2d');

  function resize() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
  }
  window.addEventListener('resize', resize);
  resize();

  const BASE_FRONTS = 18;
  const SEG = 132;
  let paths = [];

  const PRESETS = {
    whisper: { opacity: 0.58, stroke: 0.65, density: 0.55, saturation: 0.04, glow: 0, scale: 0.7, angle: 0 },
    ink:     { opacity: 1, stroke: 1.6, density: 0.82, saturation: 0, glow: 0, angle: 70, scale: 1.12, phase: 0.18 },
    neon:    { opacity: 0.9, stroke: 1, density: 1.05, saturation: 0.85, glow: 0.85, phase: 0.4, angle: 340, scale: 1.15 },
    drift:   { opacity: 0.78, stroke: 0.9, density: 0.78, speed: 0.28, motion: 1.55, phase: 0.72, angle: 195, scale: 1.06 },
    dense:   { opacity: 0.9, stroke: 1.05, density: 1.65, speed: 0.62, angle: 280, scale: 1.4, phase: 0.55 },
  };

  const baked = window.__LF_BAKED_VALUES__;
  const panel = baked ? null : createControlPanel({
    pieceId: PIECE_ID,
    presets: PRESETS,
    onChange: () => {},
    defaults: { hue: 198, hueB: 224, saturation: 0.24, colorMode: 'gradient', colorA: '#7aa8b8', colorB: '#b7d4d7' },
  });
  const currentValues = baked || panel.values;

  function drawFrame(dt, elapsed, values) {
    ctx.fillStyle = values.invert ? '#f2f2f4' : '#0a0a0d';
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    paths = [];
    const W = canvas.width;
    const H = canvas.height;
    const unit = Math.min(W, H);
    const theta = values.angle * Math.PI / 180;
    // Angle steers the empty eye through the frame. Rotating the arc geometry
    // around a fixed centre left the composition unchanged at every setting.
    const cx = W * (0.48 + 0.22 * Math.cos(theta));
    const cy = H * (0.5 + 0.2 * Math.sin(theta));
    const fronts = Math.max(4, Math.round(BASE_FRONTS * values.density));
    const light = values.invert ? 0.22 : 0.88 - values.saturation * 0.24;
    const baseWidth = 1.3 + values.stroke * 1.5;
    const waveTime = elapsed * values.speed * 0.75;
    const sourceTime = elapsed * values.motion * 0.1;
    const sourceA = [unit * (-0.2 + 0.06 * Math.sin(sourceTime)), unit * (-0.1 + 0.05 * Math.cos(sourceTime * 0.7))];
    const sourceB = [unit * (0.18 + 0.05 * Math.cos(sourceTime * 0.8)), unit * (0.12 + 0.05 * Math.sin(sourceTime * 0.9))];

    for (let front = 0; front < fronts; front++) {
      const segments = [];
      let current = [];
      const depth = front / Math.max(1, fronts - 1);
      const baseRadius = (0.14 + front * 0.035) * unit * values.scale;
      for (let s = 0; s <= SEG; s++) {
        const u = s / SEG;
        const a = -Math.PI + u * Math.PI * 2;
        const ex = Math.cos(a) * baseRadius;
        const ey = Math.sin(a) * baseRadius * 0.67;
        const dA = Math.hypot(ex - sourceA[0], ey - sourceA[1]) / unit;
        const dB = Math.hypot(ex - sourceB[0], ey - sourceB[1]) / unit;
        const waveA = Math.sin(dA * 16 - waveTime + front * 0.17 + values.phase * Math.PI * 2);
        const waveB = Math.sin(dB * 21 - waveTime * 0.72 - front * 0.11 - values.phase * Math.PI);
        const interference = waveA + waveB * 0.7;
        // The arcs gather to the right of the eye and open on the left.
        // Coherent fragments remain; the rejected samples break the contours.
        const gather = 0.5 + 0.5 * Math.cos(a - 0.3);
        const keep = gather > 0.19 && interference > -0.62;
        if (!keep) {
          if (current.length > 1) segments.push(current);
          current = [];
          continue;
        }
        const radius = baseRadius + interference * unit * (0.012 + depth * 0.012);
        const x = cx + Math.cos(a) * radius;
        const y = cy + Math.sin(a) * radius * 0.67;
        current.push([x, y]);
      }
      if (current.length > 1) segments.push(current);

      const stop = paletteHsl(values, depth);
      const [r, g, b] = hslToRgb(stop.h, stop.s, light);
      const frontAlpha = values.opacity * (0.62 + 0.34 * depth);
      for (const segment of segments) {
        const meanX = segment.reduce((sum, point) => sum + point[0], 0) / segment.length;
        const gatherWeight = Math.max(0.55, Math.min(1, (meanX - cx + unit * 0.2) / (unit * 0.55)));
        const alpha = frontAlpha * gatherWeight;
        ctx.beginPath();
        ctx.moveTo(segment[0][0], segment[0][1]);
        for (let i = 1; i < segment.length; i++) ctx.lineTo(segment[i][0], segment[i][1]);
        ctx.lineCap = 'round';
        ctx.lineWidth = baseWidth;
        ctx.strokeStyle = `rgba(${r},${g},${b},${alpha})`;
        if (values.glow > 0 && alpha > values.opacity * 0.48) {
          ctx.globalAlpha = values.glow * 0.13;
          ctx.lineWidth = baseWidth + values.glow * 2.4;
          ctx.stroke();
          ctx.globalAlpha = 1;
        }
        ctx.stroke();
        paths.push(segment);
      }
    }

  }

  const loop = createLoop({
    onFrame(dt, elapsed) {
      drawFrame(dt, elapsed, currentValues);
    },
  });
  loop.start();

  document.getElementById('btn-png-2x')?.addEventListener('click', () => exportPng(canvas, { multiplier: 2 }));
  document.getElementById('btn-png-4x')?.addEventListener('click', () => exportPng(canvas, { multiplier: 4 }));
  document.getElementById('btn-svg')?.addEventListener('click', () => exportSvg(paths, { width: canvas.width, height: canvas.height }));
  document.getElementById('btn-baked')?.addEventListener('click', () => {
    bakeHtml({ sourceHtml: document.documentElement.outerHTML, values: panel.values }).catch((err) => console.error('bakeHtml failed', err));
  });
  document.getElementById('btn-source')?.addEventListener('click', () => {
    exportSource().catch((err) => console.error('exportSource failed', err));
  });
  document.getElementById('btn-prompt')?.addEventListener('click', () => {
    describeForAI({ pieceName: PIECE_ID, values: panel.values });
  });
</script>
</body>
</html>
