<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<!-- Without this a phone uses a ~980px layout viewport, so the panel's
     max-width:640px sheet rule never matches and the page renders zoomed
     out — the controls become an unusable corner card. -->
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>linefield — moire</title>
<style>
  html, body { margin: 0; height: 100%; background: #0a0a0d; overflow: hidden; }
  canvas { display: block; width: 100vw; height: 100vh; }
  .lf-export-row { position: fixed; top: 12px; right: 12px; display: flex; gap: 6px; z-index: 9999; }
  .lf-export-row button { background: #222; color: #eee; border: 1px solid #444; border-radius: 4px;
    padding: 4px 8px; font: 11px -apple-system, sans-serif; cursor: pointer; }
</style>
</head>
<body>
<canvas id="canvas"></canvas>

<!--
  moire — two gratings of fine parallel straight lines inside one circular
  aperture, one rocking slowly against the other, so broad moiré bands
  sweep across the disc.
  Text-safe zone: everything outside the aperture; the left third is
  widest.
  Anchor: the pinned bright band at the pivot, left of the disc's centre.
-->

<div class="lf-export-row" data-lf-panel>
  <button id="btn-baked">Baked HTML</button>
  <button id="btn-source">Source</button>
  <button id="btn-png-2x">PNG 2x</button>
  <button id="btn-png-4x">PNG 4x</button>
  <button id="btn-svg">SVG</button>
  <button id="btn-prompt">Copy AI Prompt</button>
</div>

<script type="module">
  import { createControlPanel } from '../../shared/controls.js';
  import { createLoop } from '../../shared/anim.js';
  import { hslToRgb, paletteHsl } from '../../shared/color.js';
  import { exportPng, exportSvg, bakeHtml, exportSource, describeForAI } from '../../shared/export.js';

  const PIECE_ID = 'moire';
  const canvas = document.getElementById('canvas');
  const ctx = canvas.getContext('2d');

  function resize() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
  }
  window.addEventListener('resize', resize);
  resize();

  // Two gratings of straight parallel lines, clipped to one circular
  // aperture. Grating B rocks a few degrees about a pivot left of the
  // aperture's centre; the beat between the two is the moiré, and a tilt
  // of a few degrees magnifies the line spacing into bands ~20x wider.
  // B sits half a period off A at the pivot, so the band pinned there is a
  // bright one: as the tilt grows the other bands close in on it.
  //
  // House-look exception (§3): the gratings draw near-opaque with
  // source-over, not low-alpha 'lighter'. Additive blending keeps the local
  // mean the same whether the two gratings coincide or interleave, so the
  // bands exist only as fine texture and vanish at card size. Occlusion
  // makes interleaved regions carry more coverage, which is what a moiré
  // band is. Only the anchor glow uses 'lighter'.
  const BASE_LINES = 96; // per grating, across the aperture's diameter
  const LINE_ANGLE = 58 * Math.PI / 180;
  let paths = [];

  const PRESETS = {
    whisper: { opacity: 0.55, stroke: 0.7, density: 0.6, glow: 0, split: 1.4 },
    ink:     { opacity: 1, stroke: 1.4, density: 0.85, saturation: 0, glow: 0, split: 0.75 },
    neon:    { opacity: 0.95, stroke: 1, density: 1.1, saturation: 0.9, glow: 1.1 },
    drift:   { opacity: 0.85, density: 0.8, speed: 0.4, motion: 1.8, split: 0.45, scale: 1.56 },
    dense:   { opacity: 0.95, stroke: 0.7, density: 1.7, split: 1.5, glow: 0.5 },
  };

  const baked = window.__LF_BAKED_VALUES__;
  const panel = baked ? null : createControlPanel({
    pieceId: PIECE_ID,
    presets: PRESETS,
    onChange: () => {},
    extraControls: [
      // Resting tilt between the two gratings: more tilt, narrower bands.
      { name: 'split', label: 'Split', type: 'range', min: 0, max: 2, step: 0.01, default: 1, category: 'visual' },
    ],
    defaults: { hue: 185, hueB: 320, saturation: 0, scale: 1.3, colorMode: 'gradient', colorA: '#00eaff', colorB: '#ff00aa' },
  });
  const currentValues = baked || panel.values;

  let clock = 0;

  // Draws one grating as chords of the aperture (centre cx,cy radius R),
  // all in one path. Lines run along `dir`; line k sits at signed offset
  // k*period + offset from the aperture centre, measured along the normal.
  function drawGrating(cx, cy, R, dir, period, offset, rgb, alpha, shade) {
    const ux = Math.cos(dir), uy = Math.sin(dir);
    const nx = -uy, ny = ux;
    const [r, g, b] = rgb;
    const kLo = Math.ceil((-R - offset) / period);
    const kHi = Math.floor((R - offset) / period);
    ctx.beginPath();
    for (let k = kLo; k <= kHi; k++) {
      const d = k * period + offset;
      const half = Math.sqrt(Math.max(0, R * R - d * d));
      if (half < 1) continue;
      const px = cx + nx * d, py = cy + ny * d;
      const a = [px - ux * half, py - uy * half], z = [px + ux * half, py + uy * half];
      ctx.moveTo(a[0], a[1]);
      ctx.lineTo(z[0], z[1]);
      paths.push([a, z]);
    }
    // A shaded grating first lays a slightly wider stroke of ground colour,
    // so where it lies over the other grating it hides it, like a slatted
    // screen held over a lit one.
    if (shade) {
      const w = ctx.lineWidth;
      ctx.lineWidth = w * 2.4;
      ctx.strokeStyle = shade;
      ctx.stroke();
      ctx.lineWidth = w;
    }
    ctx.strokeStyle = `rgba(${r},${g},${b},${alpha})`;
    ctx.stroke();
  }

  function drawFrame(dt, elapsed, values) {
    ctx.globalCompositeOperation = 'source-over';
    ctx.fillStyle = values.invert ? '#f2f2f4' : '#0a0a0d';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    clock += dt * values.speed;

    paths = [];
    const W = canvas.width, H = canvas.height;
    const R = Math.min(W, H) * 0.26 * (0.5 + 0.5 * values.scale);
    const cx = W * 0.6, cy = H * 0.5;
    const lines = Math.max(6, Math.round(BASE_LINES * values.density));
    const period = (2 * R) / lines;
    const pivotX = cx - R * 0.3, pivotY = cy + R * 0.16;

    // B rocks against A: one slow swing every 16s at Speed 1.
    const tilt = (values.split * 2 + 1.1 * Math.sin(clock * (Math.PI * 2 / 16))) * Math.PI / 180;
    // Motion sways B sideways, sliding the bands across the disc; Phase is
    // a fixed sideways offset of B (half a period turns bands inside out).
    const slide = period * (0.5 + values.phase * 0.5
      + values.motion * 0.3 * Math.sin(clock * (Math.PI * 2 / 11) - 0.7));

    const dirA = LINE_ANGLE + (values.angle * Math.PI) / 180;
    const dirB = dirA + tilt;
    // Offsets measured from the aperture centre: A passes a line through
    // the pivot, B does too before its slide.
    const pOff = (dir) => (pivotX - cx) * -Math.sin(dir) + (pivotY - cy) * Math.cos(dir);
    const offA = pOff(dirA);
    const offB = pOff(dirB) + slide;

    const light = values.invert ? 0.12 : 0.88 - 0.28 * values.saturation;
    const alpha = values.opacity;
    ctx.lineWidth = 0.4 + values.stroke * 0.5;
    const stopA = paletteHsl(values, 0);
    drawGrating(cx, cy, R, dirA, period, offA, hslToRgb(stopA.h, stopA.s, light), alpha);
    const stopB = paletteHsl(values, 1);
    drawGrating(cx, cy, R, dirB, period, offB, hslToRgb(stopB.h, stopB.s, light), alpha * 0.4,
      values.invert ? '#f2f2f4' : '#0a0a0d');

    // Lines are brightest around the pivot and ease off toward the rim: a
    // smooth veil of ground colour, so no stepped (ring-like) falloff. Ground
    // over ground is a no-op, so it needs no clip to the aperture.
    const veilR = R * 1.6;
    const veil = ctx.createRadialGradient(pivotX, pivotY, 0, pivotX, pivotY, veilR);
    const ground = values.invert ? '242,242,244' : '10,10,13';
    for (let i = 0; i <= 6; i++) {
      const d = (i / 6) * veilR;
      veil.addColorStop(i / 6, `rgba(${ground},${0.5 * (1 - Math.exp(-(d * d) / (2 * (R * 0.55) ** 2)))})`);
    }
    ctx.fillStyle = veil;
    ctx.fillRect(cx - R - 2, cy - R - 2, 2 * R + 4, 2 * R + 4);

    // Optional soft bloom on the pivot. Off by default.
    if (values.glow > 0) {
      ctx.globalCompositeOperation = values.invert ? 'source-over' : 'lighter';
      const { h, s } = paletteHsl(values, 0.5);
      const [r, g, b] = hslToRgb(h, s, light);
      const gr = R * 0.4 * (0.6 + values.glow * 0.4);
      const grad = ctx.createRadialGradient(pivotX, pivotY, 0, pivotX, pivotY, gr);
      grad.addColorStop(0, `rgba(${r},${g},${b},${0.28 * values.glow * values.opacity})`);
      grad.addColorStop(1, `rgba(${r},${g},${b},0)`);
      ctx.fillStyle = grad;
      ctx.fillRect(pivotX - gr, pivotY - gr, gr * 2, gr * 2);
      ctx.globalCompositeOperation = 'source-over';
    }
  }

  const loop = createLoop({
    onFrame(dt, elapsed) {
      drawFrame(dt, elapsed, currentValues);
    },
  });
  loop.start();

  document.getElementById('btn-png-2x')?.addEventListener('click', () => exportPng(canvas, { multiplier: 2 }));
  document.getElementById('btn-png-4x')?.addEventListener('click', () => exportPng(canvas, { multiplier: 4 }));
  document.getElementById('btn-svg')?.addEventListener('click', () => exportSvg(paths, { width: canvas.width, height: canvas.height }));
  document.getElementById('btn-baked')?.addEventListener('click', () => {
    bakeHtml({ sourceHtml: document.documentElement.outerHTML, values: panel.values }).catch((err) => console.error('bakeHtml failed', err));
  });
  document.getElementById('btn-source')?.addEventListener('click', () => {
    exportSource().catch((err) => console.error('exportSource failed', err));
  });
  document.getElementById('btn-prompt')?.addEventListener('click', () => {
    describeForAI({ pieceName: PIECE_ID, values: panel.values });
  });
</script>
</body>
</html>
