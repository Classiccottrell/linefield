<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<!-- Without this a phone uses a ~980px layout viewport, so the panel's
     max-width:640px sheet rule never matches and the page renders zoomed
     out — the controls become an unusable corner card. -->
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>linefield — rainfall</title>
<style>
  html, body { margin: 0; height: 100%; background: #0a0a0d; overflow: hidden; }
  canvas { display: block; width: 100vw; height: 100vh; }
  .lf-export-row { position: fixed; top: 12px; right: 12px; display: flex; gap: 6px; z-index: 9999; }
  .lf-export-row button { background: #222; color: #eee; border: 1px solid #444; border-radius: 4px;
    padding: 4px 8px; font: 11px -apple-system, sans-serif; cursor: pointer; }
</style>
</head>
<body>
<canvas id="canvas"></canvas>

<div class="lf-export-row" data-lf-panel>
  <button id="btn-baked">Baked HTML</button>
  <button id="btn-source">Source</button>
  <button id="btn-png-2x">PNG 2x</button>
  <button id="btn-png-4x">PNG 4x</button>
  <button id="btn-svg">SVG</button>
  <button id="btn-prompt">Copy AI Prompt</button>
</div>

<script type="module">
  import { createControlPanel } from '../../shared/controls.js';
  import { createLoop } from '../../shared/anim.js';
  import { hslToRgb, paletteHsl } from '../../shared/color.js';
  import { simplex2 } from '../../shared/noise.js';
  import { exportPng, exportSvg, bakeHtml, exportSource, describeForAI } from '../../shared/export.js';

  const PIECE_ID = 'rainfall';
  const canvas = document.getElementById('canvas');
  const ctx = canvas.getContext('2d');

  function resize() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
  }
  window.addEventListener('resize', resize);
  resize();

  // Deliberately a sparse piece — quiet rain, not a downpour. Sits between
  // tether (6, the sparsest) and meridian (7 long ribbons) in the library.
  // Two fewer drops offsets the extra marked pixels from the correlated
  // weather-front phase; the hero stays at or below its 0.008 ink baseline.
  const BASE_COUNT = 26;
  // Fraction of canvas height a streak crosses per second at speedMult=1,
  // values.speed=1 — slow enough that a single drop takes ~14s to fall.
  const BASE_FALL = 0.07;
  let drops = [];
  let paths = [];

  // Rainfall used to be pure random scatter edge to edge — legible as
  // "dots falling," not a composition. This shapes the same scatter into a
  // single broad veil (a raised-cosine window over x) so the piece reads
  // as one gesture — denser through the middle-right, quiet at both edges
  // — instead of uniform noise. The floor (0.12) keeps it continuous rain
  // rather than gapped holes. The window is centred right of the frame's
  // middle on purpose: the home page's hero copy sits over rainfall's left
  // third (home/quiet-drift/index.html, this piece is its background
  // specifically for its low, even ink), so the left edge is deliberately
  // the quietest part of the veil, on top of the page's own text gradient.
  function staticEnvelopeAt(x0) {
    const center = 0.62;
    const width = 0.62;
    const d = Math.abs(x0 - center) / width;
    const window = d < 1 ? 0.5 + 0.5 * Math.cos(d * Math.PI) : 0;
    const e = Math.pow(window, 0.85);
    // Keep the correlated front below the shipped hero's measured ink floor.
    const floor = 0.10;
    return floor + e * (1 - floor);
  }

  // The veil used to be a spatially-fixed shape: the same brightness
  // curve forever, revealed only by drops falling through it. That's a
  // static composition wearing a dynamic piece's clothes — next to
  // Lacuna's turning rings or Parallax's depth drift, rainfall's overall
  // silhouette never actually moved. This adds a slow weather-drift to the
  // window's centre, one-sided: it only ever pushes right (0.62 -> 0.72),
  // never left, and DRIFT_LEFT_GUARD's Math.min against the untouched
  // static curve holds `env(x, t) <= env_today(x)` for the left third at
  // every t regardless of drift phase — the home/quiet-drift hero copy
  // sits over that third and it must never get denser than it is today.
  const DRIFT_LEFT_GUARD = 0.35;
  const DRIFT_AMOUNT = 0.1;
  const DRIFT_FREQ = 0.05;
  function envelopeAt(x0, t) {
    const center = 0.62 + DRIFT_AMOUNT * (0.5 + 0.5 * Math.sin(t * DRIFT_FREQ));
    const width = 0.62;
    const d = Math.abs(x0 - center) / width;
    const window = d < 1 ? 0.5 + 0.5 * Math.cos(d * Math.PI) : 0;
    const e = Math.pow(window, 0.85);
    const floor = 0.10;
    const dynamic = floor + e * (1 - floor);
    return x0 < DRIFT_LEFT_GUARD ? Math.min(dynamic, staticEnvelopeAt(x0)) : dynamic;
  }

  function seedDrops(count) {
    drops = Array.from({ length: count }, () => {
      // Positions normalised so a resize doesn't need a reseed.
      const x = Math.random();
      return {
        x,
        // Vertical phase offset — without this every drop would fall in
        // lockstep and read as a single sheet, not individual streaks.
        // Correlate most of the vertical phase with x. The same sparse marks
        // now arrive as a quiet weather front instead of unrelated dots.
        seed: (x * 0.55 + Math.random() * 0.45) % 1,
        // Per-drop speed and length variety, per the brief ("varying speeds
        // and lengths"). Range chosen so slow/short and fast/long drops both
        // stay legible as rain, not as outliers.
        speedMult: 0.5 + Math.random() * 1.3,
        lenMult: 0.5 + Math.random() * 1.5,
      };
    });
  }

  // Sparsest piece in the library at ink coverage 0.011, so `whisper` barely
  // moves off the default and `dense` is what gives the piece its range.
  const PRESETS = {
    whisper: { opacity: 0.42, stroke: 1.35, density: 0.75, saturation: 0.04, glow: 0 },
    ink:     { opacity: 1, stroke: 1.9, density: 1, saturation: 0, glow: 0 },
    neon:    { opacity: 0.95, stroke: 1.1, density: 1.4, saturation: 0.9, glow: 1.2 },
    drift:   { opacity: 0.5, stroke: 1.5, density: 0.85, speed: 0.3, motion: 1.6 },
    dense:   { opacity: 0.7, stroke: 0.7, density: 1.9, speed: 1.2 },
  };

  const baked = window.__LF_BAKED_VALUES__;
  const panel = baked ? null : createControlPanel({
    pieceId: PIECE_ID,
    presets: PRESETS,
    onChange: (name, value, values) => {
      if (name === 'density') seedDrops(Math.max(4, Math.round(BASE_COUNT * values.density)));
    },
    extraControls: [
      // Off by default: a head-highlight dot is what sells "brighter head"
      // at a glance, but it's a distinct enough look to leave optional.
      { name: 'glint', label: 'Head glint', type: 'checkbox', default: true, category: 'ink' },
    ],
    // Cool, desaturated blue-grey — reads as overcast/rain, distinct from
    // tether's indigo (220/250) and wireframe-lattice's cyan (190/205).
    defaults: { hue: 205, hueB: 195, saturation: 0.18, colorMode: 'gradient', colorA: '#0095ff', colorB: '#00bfff' },
  });
  const currentValues = baked || panel.values;

  seedDrops(Math.max(4, Math.round(BASE_COUNT * currentValues.density)));

  function drawFrame(dt, elapsed, values) {
    // Full repaint each frame — streaks are drawn whole every frame, not
    // accumulated as trails, so there's nothing to fade out.
    ctx.fillStyle = values.invert ? '#f2f2f4' : '#0a0a0d';
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    paths = [];
    const W = canvas.width;
    const H = canvas.height;
    const t = elapsed * values.speed * BASE_FALL;
    const lineWidth = 0.6 + values.stroke * 1.8;
    const baseLen = H * 0.05 * (0.4 + values.scale);
    // Gentle wind sway, independent of fall speed — subtle by design so the
    // piece stays calm rather than turning into a gust.
    const swayAmount = W * 0.01 * values.motion;
    const leanAmount = W * 0.035 * values.motion;
    const theta = (values.angle * Math.PI) / 180;
    // Veil breathing, independent of fall speed too, and gated by Motion
    // (near-static at motion=0, full pace at motion=1) so the shared
    // control has a second, composition-level effect on this piece rather
    // than only nudging individual streaks.
    const veilT = elapsed * (0.3 + 0.7 * values.motion);

    ctx.save();
    ctx.translate(W / 2, H / 2);
    ctx.rotate(theta);
    ctx.translate(-W / 2, -H / 2);

    for (const d of drops) {
      // Head = leading (lower) end of the streak, wrapping endlessly top to
      // bottom. + values.phase gives a global stagger control; % 1 keeps it
      // periodic so the loop never runs out of range.
      const fall = ((t * d.speedMult + d.seed + values.phase * 0.5) % 1 + 1) % 1;
      const headY = fall * (H + baseLen * 2) - baseLen;
      const tailY = headY - baseLen * d.lenMult;

      // Sampled by x, not by an independent per-drop random phase, so
      // neighbouring drops lean the same way at any instant — a gust
      // crossing the veil, not decorrelated dot-jitter (the "scattered
      // dashes" read Chunk 11 left standing). Head and tail sample the
      // noise at different phases, so each streak tilts rather than
      // staying a rigid vertical translate.
      const swayHead = simplex2(d.x * 4, veilT);
      const swayTail = simplex2(d.x * 4, veilT + 0.4);
      // One shared diagonal lean turns the veil into weather, while the
      // smaller noise term preserves individual streak character.
      const xHead = d.x * W + swayHead * swayAmount + leanAmount * (headY / H - 0.5);
      const xTail = d.x * W + swayTail * swayAmount + leanAmount * (tailY / H - 0.5);
      let lw = lineWidth;

      const lightBase = values.invert ? 0.3 : 0.68;
      const headLight = Math.min(0.95, lightBase + 0.22);
      const tailLight = Math.max(0.04, lightBase - 0.4);
      const stopB = paletteHsl(values, 1);
      const [hr, hg, hb] = hslToRgb(stopB.h, stopB.s, headLight);
      const stopA = paletteHsl(values, 0);
      const [tr, tg, tb] = hslToRgb(stopA.h, stopA.s, tailLight);

      // Envelope shapes brightness, not count or width — a drop in a thin
      // stretch of the veil still falls at full speed, just paler, so the
      // motion is what reveals the veil's shape as drops cross it. Read at
      // x, t now (see envelopeAt) instead of a value fixed at seed time, so
      // the veil itself slowly breathes rather than sitting frozen forever.
      const env = envelopeAt(d.x, veilT);
      const op = values.opacity * env;

      const grad = ctx.createLinearGradient(xTail, tailY, xHead, headY);
      grad.addColorStop(0, `rgba(${tr},${tg},${tb},0)`);
      grad.addColorStop(1, `rgba(${hr},${hg},${hb},${op})`);

      ctx.strokeStyle = grad;
      if (values.glow > 0) {
        ctx.lineWidth = lw + values.glow * 4;
        ctx.globalAlpha = values.glow * 0.22 * env;
        ctx.beginPath();
        ctx.moveTo(xTail, tailY);
        ctx.lineTo(xHead, headY);
        ctx.stroke();
        ctx.globalAlpha = 1;
      }
      ctx.lineWidth = lw;
      ctx.beginPath();
      ctx.moveTo(xTail, tailY);
      ctx.lineTo(xHead, headY);
      ctx.stroke();

      if (values.glint) {
        // Soft radial highlight at the head — bigger than the stroke itself
        // so "brighter head" reads clearly even at a glance, still small
        // enough relative to the canvas to stay calm rather than blobby.
        const r = lw * 3;
        const glintGrad = ctx.createRadialGradient(xHead, headY, 0, xHead, headY, r);
        glintGrad.addColorStop(0, `rgba(${hr},${hg},${hb},${op})`);
        glintGrad.addColorStop(1, `rgba(${hr},${hg},${hb},0)`);
        ctx.fillStyle = glintGrad;
        ctx.beginPath();
        ctx.arc(xHead, headY, r, 0, Math.PI * 2);
        ctx.fill();
      }

      paths.push([[xTail, tailY], [xHead, headY]]);
    }

    ctx.restore();

  }

  const loop = createLoop({
    onFrame(dt, elapsed) {
      drawFrame(dt, elapsed, currentValues);
    },
  });
  loop.start();

  document.getElementById('btn-png-2x')?.addEventListener('click', () => exportPng(canvas, { multiplier: 2 }));
  document.getElementById('btn-png-4x')?.addEventListener('click', () => exportPng(canvas, { multiplier: 4 }));
  document.getElementById('btn-svg')?.addEventListener('click', () => exportSvg(paths, { width: canvas.width, height: canvas.height }));
  document.getElementById('btn-baked')?.addEventListener('click', () => {
    bakeHtml({ sourceHtml: document.documentElement.outerHTML, values: panel.values }).catch((err) => console.error('bakeHtml failed', err));
  });
  document.getElementById('btn-source')?.addEventListener('click', () => {
    exportSource().catch((err) => console.error('exportSource failed', err));
  });
  document.getElementById('btn-prompt')?.addEventListener('click', () => {
    describeForAI({ pieceName: PIECE_ID, values: panel.values });
  });
</script>
</body>
</html>
