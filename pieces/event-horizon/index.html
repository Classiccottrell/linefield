<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<!-- Without this a phone uses a ~980px layout viewport, so the panel's
     max-width:640px sheet rule never matches and the page renders zoomed
     out — the controls become an unusable corner card. -->
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>linefield — event-horizon</title>
<style>
  html, body { margin: 0; height: 100%; background: #0a0a0d; overflow: hidden; }
  canvas { display: block; width: 100vw; height: 100vh; }
  .lf-export-row { position: fixed; top: 12px; right: 12px; display: flex; gap: 6px; z-index: 9999; }
  .lf-export-row button { background: #222; color: #eee; border: 1px solid #444; border-radius: 4px;
    padding: 4px 8px; font: 11px -apple-system, sans-serif; cursor: pointer; }
</style>
</head>
<body>
<canvas id="canvas"></canvas>

<div class="lf-export-row" data-lf-panel>
  <button id="btn-baked">Baked HTML</button>
  <button id="btn-source">Source</button>
  <button id="btn-png-2x">PNG 2x</button>
  <button id="btn-png-4x">PNG 4x</button>
  <button id="btn-svg">SVG</button>
  <button id="btn-prompt">Copy AI Prompt</button>
</div>

<script type="module">
  import { createControlPanel } from '../../shared/controls.js';
  import { createLoop } from '../../shared/anim.js';
  import { hslToRgb, paletteHsl } from '../../shared/color.js';
  import { createCamera, rotatePoint } from '../../shared/project.js';
  import { exportPng, exportSvg, bakeHtml, exportSource, describeForAI } from '../../shared/export.js';
  import { createOrbit, createPointer } from '../../shared/pointer.js';
  import { createCursorOverlay, modeFactor } from '../../shared/cursor-modes.js';

  const PIECE_ID = 'event-horizon';
  const canvas = document.getElementById('canvas');
  const ctx = canvas.getContext('2d');

  function resize() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
  }
  window.addEventListener('resize', resize);
  resize();

  // Ring and spoke counts derive per frame from density — no persistent array.
  const BASE_RINGS = 40;
  const SEG = 96;   // segments per ring
  const SPOKES = 36;
  let paths = [];

  const PRESETS = {
    whisper: { opacity: 0.2, stroke: 0.8, density: 0.45, saturation: 0.06, glow: 0 },
    ink:     { opacity: 1, stroke: 1.5, density: 0.7, saturation: 0, glow: 0 },
    neon:    { opacity: 0.9, stroke: 0.8, density: 1.2, saturation: 1, glow: 1.2 },
    drift:   { opacity: 0.45, stroke: 0.7, density: 0.6, speed: 0.25, motion: 1.6 },
    dense:   { opacity: 0.6, stroke: 0.55, density: 1.8, speed: 0.85 },
  };

  const baked = window.__LF_BAKED_VALUES__;
  const panel = baked ? null : createControlPanel({
    pieceId: PIECE_ID,
    presets: PRESETS,
    onChange: () => {},
    extraControls: [
      { name: 'mass', label: 'Mass', type: 'range', min: 0, max: 2, step: 0.01, default: 1, category: 'visual' },
      { name: 'rotX', label: 'Pitch', type: 'range', min: -90, max: 90, step: 1, default: 32, category: 'interaction' },
      { name: 'rotY', label: 'Yaw', type: 'range', min: -180, max: 180, step: 1, default: 0, category: 'interaction' },
    ],
    defaults: { hue: 285, hueB: 230, saturation: 0.6, colorMode: 'gradient', colorA: '#bf00ff', colorB: '#002bff' },
  });
  const currentValues = baked || panel.values;
  const pointer = createPointer({ canvas });
  const clampDeg = (n, min, max) => Math.max(min, Math.min(max, n));
  // In panel mode the drag writes straight into rotX/rotY through setValue —
  // the only write path — so the Pitch/Yaw sliders and the rendered camera
  // never disagree. A baked export has no panel to write through, so it
  // mutates currentValues directly, clamped to the same ranges the panel
  // would have enforced.
  const orbit = createOrbit({
    canvas,
    onOrbit: (dPitch, dYaw) => {
      const dPitchDeg = (dPitch * 180) / Math.PI;
      const dYawDeg = (dYaw * 180) / Math.PI;
      if (panel) {
        panel.setValue('rotX', panel.values.rotX + dPitchDeg, { persist: false });
        panel.setValue('rotY', panel.values.rotY + dYawDeg, { persist: false });
      } else {
        currentValues.rotX = clampDeg(currentValues.rotX + dPitchDeg, -90, 90);
        currentValues.rotY = clampDeg(currentValues.rotY + dYawDeg, -180, 180);
      }
    },
    onSettle: () => {
      if (!panel) return;
      panel.setValue('rotX', panel.values.rotX, { persist: true });
      panel.setValue('rotY', panel.values.rotY, { persist: true });
    },
  });

  const camera = createCamera({ fov: 700 });
  const overlay = createCursorOverlay();
  // Shrink's ease factor (below) tops out at ~0.072 of a point's distance
  // to the pointer — deliberately small so Grow's lens bulge has the
  // headroom it needs without overshooting. At 260 that pull only reached
  // grid lines close to the disc's own converging center, where the
  // perspective warp already dominates and swallows a further few-percent
  // nudge. Widened to 420 so the pull also reaches the event horizon's own
  // silhouette — where a contracting edge against the black disc is what
  // actually reads as "shrink" here — without changing the ease factor
  // itself (still tuning the catchment, not deepening the per-point pull).
  const LENS_RADIUS = 420;

  function strokePts(pts, values, lineWidth, rgb) {
    // Walk in order and break the run at any point behind the camera
    // (scale <= 0) instead of filtering — a skipped interior point must
    // start a new subpath, not get bridged over by a single polyline.
    let anyRun = false;
    ctx.beginPath();
    let run = [];
    const flushRun = () => {
      if (run.length >= 2) {
        anyRun = true;
        ctx.moveTo(run[0].x, run[0].y);
        for (let i = 1; i < run.length; i++) ctx.lineTo(run[i].x, run[i].y);
        paths.push(run.map((p) => [p.x, p.y]));
      }
      run = [];
    };
    for (const p of pts) {
      if (p.scale > 0) run.push(p);
      else flushRun();
    }
    flushRun();
    if (!anyRun) return;

    const [r, g, b] = rgb;
    ctx.strokeStyle = `rgba(${r},${g},${b},${values.opacity})`;
    if (values.glow > 0) {
      ctx.lineWidth = lineWidth + values.glow * 3;
      ctx.globalAlpha = values.glow * 0.25;
      ctx.stroke();
      ctx.globalAlpha = 1;
    }
    ctx.lineWidth = lineWidth;
    ctx.stroke();
  }

  function drawFrame(dt, elapsed, values) {
    ctx.fillStyle = values.invert ? '#f2f2f4' : '#0a0a0d';
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    paths = [];
    const rings = Math.max(6, Math.round(BASE_RINGS * values.density));
    const extent = Math.min(canvas.width, canvas.height) * 0.85 * (0.4 + values.scale * 0.6);
    // The horizon: nothing is drawn inside it, which is the void at the centre.
    // Clamped so it can never swallow the whole disc on a small viewport
    // (e.g. a phone in portrait), which would collapse the void entirely.
    const horizon = Math.min(40 + 70 * values.mass, extent * 0.6);
    const t = elapsed * values.speed * 0.25;
    const light = values.invert ? 0.35 : 0.62;
    const lineWidth = 0.3 + values.stroke * 1.0;

    camera.set({
      tilt: (values.rotX * Math.PI) / 180,
      yaw: (values.rotY * Math.PI) / 180 + t * values.motion * 0.35,
      roll: (values.angle * Math.PI) / 180,
      cx: canvas.width / 2,
      cy: canvas.height / 2,
    });

    // Lensing: rings bunch just outside the horizon and spread further out.
    // u is 0 at the horizon and 1 at the outer extent.
    // Phase warps the radial mapping (not yaw — a constant yaw offset is
    // imperceptible on a figure this rotationally symmetric and already
    // spinning). The warp vanishes at u=0 and u=1 so the void and outer
    // extent are untouched, and stays monotonic in u so rings never cross.
    const phaseWobble = Math.sin(values.phase * Math.PI * 1.5);
    const warpU = (u) => Math.max(0, Math.min(1, u + 0.4 * u * (1 - u) * phaseWobble));
    const radiusAt = (u) => horizon + (extent - horizon) * Math.pow(warpU(u), 1 + values.mass * 0.9);
    // Off at pointer 0, off when cursorInteraction is 'None', eased by
    // influence. No term routed through values.speed or values.mass (both
    // user-zeroable).
    const pointerK = modeFactor(values, pointer);
    const pointerMode = values.cursorInteraction;
    // Cap the amplitude/radius/rotation input at pointerK=1: uncapped,
    // pointerK=2 (Pointer's max) quadruples Grow's amp AND is itself
    // multiplied into the pull magnitude again below, compounding to a
    // pull factor that can exceed 1 near the pointer (the same overshoot/
    // reflect hazard as the Attract fix, plus a falloff radius wide enough
    // to reach most of the disc) — together they can destroy the piece's
    // identity rather than swelling it. This holds Pointer 1..2 flat at
    // the Pointer=1 strength (gate numbers unchanged) instead of
    // compounding further.
    const pointerKAmp = Math.min(pointerK, 1);
    const projectWithLens = (pts) => {
      const projected = camera.projectPath(pts);
      if (!pointerK) return projected;
      for (const p of projected) {
        if (pointerMode === 'Grow' || pointerMode === 'Shrink') {
          // Grow/Shrink scale the lens's existing pull magnitude and radius
          // by the same amp — this IS the piece's existing Attract-like
          // behaviour, amplified/damped rather than replaced.
          const amp = pointerMode === 'Grow' ? 1 + pointerKAmp * 1.5 : 1 / (1 + pointerKAmp * 1.5);
          const f = pointer.falloff(p.x, p.y, LENS_RADIUS * amp);
          if (f) {
            const ease = Math.min(f * pointerKAmp * 0.18 * amp, 1);
            p.x += (pointer.x - p.x) * ease;
            p.y += (pointer.y - p.y) * ease;
          }
        } else if (pointerMode === 'Attract') {
          // The lens already pulls projected points toward the pointer —
          // unchanged from before wiring, just scoped to this mode. Max
          // factor here is pointerK*0.18 = 0.36, already well under 1, so
          // no overshoot clamp is needed.
          const f = pointer.falloff(p.x, p.y, LENS_RADIUS);
          if (f) {
            p.x += (pointer.x - p.x) * f * pointerK * 0.18;
            p.y += (pointer.y - p.y) * f * pointerK * 0.18;
          }
        } else if (pointerMode === 'Vortex') {
          // True tangential rotation about the pointer, not an offset
          // toward/away from it.
          const f = pointer.falloff(p.x, p.y, LENS_RADIUS);
          if (f) {
            const r = rotatePoint(p.x - pointer.x, p.y - pointer.y, 0, { roll: f * pointerKAmp * 1.1 });
            p.x = pointer.x + r.x;
            p.y = pointer.y + r.y;
          }
        }
      }
      return projected;
    };

    // Concentric rings, drawn on the XZ plane so the camera's tilt makes a disc.
    for (let i = 1; i <= rings; i++) {
      const u = i / rings;
      const R = radiusAt(u);
      const { h, s } = paletteHsl(values, u);
      const [r, g, b] = hslToRgb(h, s, light);

      const pts = [];
      for (let s = 0; s <= SEG; s++) {
        const a = (s / SEG) * Math.PI * 2;
        pts.push([Math.cos(a) * R, 0, Math.sin(a) * R]);
      }
      strokePts(projectWithLens(pts), values, lineWidth, [r, g, b]);
    }

    // Radial spokes, from the horizon outward.
    const spokes = Math.max(4, Math.round(SPOKES * values.density));
    for (let k = 0; k < spokes; k++) {
      const a = (k / spokes) * Math.PI * 2;
      const stopB = paletteHsl(values, 1);
      const [r, g, b] = hslToRgb(stopB.h, stopB.s, light * 0.85);

      const pts = [];
      for (let s = 0; s <= 24; s++) {
        const R = radiusAt(s / 24);
        pts.push([Math.cos(a) * R, 0, Math.sin(a) * R]);
      }
      strokePts(projectWithLens(pts), values, lineWidth * 0.7, [r, g, b]);
    }

    const stopA = paletteHsl(values, 0);
    const [ovR, ovG, ovB] = hslToRgb(stopA.h, stopA.s, light);
    overlay.draw(ctx, `rgb(${ovR},${ovG},${ovB})`, pointerK);
  }

  const loop = createLoop({
    onFrame(dt, elapsed) {
      pointer.step();
      const k = modeFactor(currentValues, pointer);
      overlay.step(currentValues.cursorInteraction, k, pointer);
      drawFrame(dt, elapsed, currentValues);
    },
  });
  loop.start();

  document.getElementById('btn-png-2x')?.addEventListener('click', () => exportPng(canvas, { multiplier: 2 }));
  document.getElementById('btn-png-4x')?.addEventListener('click', () => exportPng(canvas, { multiplier: 4 }));
  document.getElementById('btn-svg')?.addEventListener('click', () => exportSvg(paths, { width: canvas.width, height: canvas.height }));
  document.getElementById('btn-baked')?.addEventListener('click', () => {
    bakeHtml({ sourceHtml: document.documentElement.outerHTML, values: panel.values })
      .catch((err) => console.error('bakeHtml failed', err));
  });
  document.getElementById('btn-source')?.addEventListener('click', () => {
    exportSource().catch((err) => console.error('exportSource failed', err));
  });
  document.getElementById('btn-prompt')?.addEventListener('click', () => {
    describeForAI({ pieceName: PIECE_ID, values: panel.values });
  });
</script>
</body>
</html>
