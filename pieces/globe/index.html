<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<!-- Without this a phone uses a ~980px layout viewport, so the panel's
     max-width:640px sheet rule never matches and the page renders zoomed
     out — the controls become an unusable corner card. -->
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>linefield — globe</title>
<style>
  html, body { margin: 0; height: 100%; background: #0a0a0d; overflow: hidden; }
  canvas { display: block; width: 100vw; height: 100vh; }
  .lf-export-row { position: fixed; top: 12px; right: 12px; display: flex; gap: 6px; z-index: 9999; }
  .lf-export-row button { background: #222; color: #eee; border: 1px solid #444; border-radius: 4px;
    padding: 4px 8px; font: 11px -apple-system, sans-serif; cursor: pointer; }
</style>
</head>
<body>
<canvas id="canvas"></canvas>

<div class="lf-export-row" data-lf-panel>
  <button id="btn-baked">Baked HTML</button>
  <button id="btn-source">Source</button>
  <button id="btn-png-2x">PNG 2x</button>
  <button id="btn-png-4x">PNG 4x</button>
  <button id="btn-svg">SVG</button>
  <button id="btn-prompt">Copy AI Prompt</button>
</div>

<script type="module">
  import { createControlPanel } from '../../shared/controls.js';
  import { createLoop } from '../../shared/anim.js';
  import { hslToRgb, paletteHsl } from '../../shared/color.js';
  import { createCamera, rotatePoint } from '../../shared/project.js';
  import { exportPng, exportSvg, bakeHtml, exportSource, describeForAI } from '../../shared/export.js';
  import { createOrbit } from '../../shared/pointer.js';

  // globe — a tilted sphere described only by parallel latitude slices,
  // whose hairlines crowd and brighten toward the limb.
  //
  // There are no longitude lines and no pole marker: the slices are spaced
  // evenly along the axis (not evenly in latitude angle, which would bunch
  // them at the poles), stop short of both poles, and fade as they shrink,
  // so neither pole ever collects light.
  //
  // Text-safe zone: the left third of the frame. The sphere sits in the
  // central square, nudged right of centre.
  // Anchor: the brightest limb arc, upper right. It is not drawn as a glow:
  // a screen-fixed rim weight lifts the slices where they turn edge-on on
  // that side, and they stack there additively.
  //
  // Latitude slices are rotationally symmetric about their own axis, so a
  // spin about the pole would be invisible. The axis therefore leans at a
  // fixed obliquity and precesses (Speed) and nods (Motion); that keeps the
  // slices sweeping and keeps Yaw visible.
  const PIECE_ID = 'globe';
  const canvas = document.getElementById('canvas');
  const ctx = canvas.getContext('2d');

  function resize() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
  }
  window.addEventListener('resize', resize);
  resize();

  // Slice count derives per frame from density — no persistent array.
  const BASE_SLICES = 70;
  const SEG = 144;            // segments per slice
  const Y_MAX = 0.94;         // slices stop short of the poles
  const OBLIQUITY = 0.3;      // radians the axis leans off its mean direction
  const PRECESS_PERIOD = 20;  // seconds per precession turn at speed 1
  const NOD_PERIOD = 13;      // seconds per nod cycle (Motion's gesture)
  const BUCKETS = 8;          // alpha levels a slice's runs are stroked in
  // Screen direction of the rim light, pointing away from the left-third
  // safe zone (canvas y runs down, so this is up and to the right).
  const LX = 0.78, LY = -0.62;
  let paths = [];

  const PRESETS = {
    whisper: { opacity: 1, stroke: 1, density: 0.6, glow: 0, motion: 0.5 },
    ink:     { opacity: 1, stroke: 1.5, density: 0.75, glow: 0 },
    neon:    { opacity: 0.9, stroke: 0.9, density: 1.05, saturation: 0.9, glow: 1.1 },
    drift:   { opacity: 0.75, stroke: 0.8, density: 0.8, speed: 0.4, motion: 1.8, phase: 0.8 },
    dense:   { opacity: 0.9, stroke: 0.9, density: 1.5, glow: 0.4, rotX: 26 },
  };

  const baked = window.__LF_BAKED_VALUES__;
  const panel = baked ? null : createControlPanel({
    pieceId: PIECE_ID,
    presets: PRESETS,
    onChange: () => {},
    extraControls: [
      { name: 'rotX', label: 'Pitch', type: 'range', min: -90, max: 90, step: 1, default: 34, category: 'interaction' },
      { name: 'rotY', label: 'Yaw', type: 'range', min: -180, max: 180, step: 1, default: 0, category: 'interaction' },
    ],
    // Monochrome by default (house look §1). The hue pair is what the neon
    // preset and the colour pickers light up.
    defaults: { hue: 105, hueB: 130, saturation: 0, colorMode: 'gradient', colorA: '#3fd166', colorB: '#4bd18f' },
  });
  const currentValues = baked || panel.values;
  const clampDeg = (n, min, max) => Math.max(min, Math.min(max, n));
  // In panel mode the drag writes straight into rotX/rotY through setValue —
  // the only write path — so the Pitch/Yaw sliders and the rendered camera
  // never disagree. A baked export has no panel to write through, so it
  // mutates currentValues directly, clamped to the same ranges the panel
  // would have enforced.
  const orbit = createOrbit({
    canvas,
    onOrbit: (dPitch, dYaw) => {
      const dPitchDeg = (dPitch * 180) / Math.PI;
      const dYawDeg = (dYaw * 180) / Math.PI;
      if (panel) {
        panel.setValue('rotX', panel.values.rotX + dPitchDeg, { persist: false });
        panel.setValue('rotY', panel.values.rotY + dYawDeg, { persist: false });
      } else {
        currentValues.rotX = clampDeg(currentValues.rotX + dPitchDeg, -90, 90);
        currentValues.rotY = clampDeg(currentValues.rotY + dYawDeg, -180, 180);
      }
    },
    onSettle: () => {
      if (!panel) return;
      panel.setValue('rotX', panel.values.rotX, { persist: true });
      panel.setValue('rotY', panel.values.rotY, { persist: true });
    },
  });

  const camera = createCamera({ fov: 1200 });

  function strokeRuns(runs, alpha, lineWidth, rgb) {
    if (!runs.length || alpha <= 0) return;
    ctx.beginPath();
    for (const run of runs) {
      ctx.moveTo(run[0].x, run[0].y);
      for (let i = 1; i < run.length; i++) ctx.lineTo(run[i].x, run[i].y);
    }
    ctx.strokeStyle = `rgba(${rgb[0]},${rgb[1]},${rgb[2]},${Math.min(1, alpha)})`;
    ctx.lineWidth = lineWidth;
    ctx.stroke();
  }

  function drawFrame(dt, elapsed, values) {
    const W = canvas.width;
    const H = canvas.height;
    ctx.globalCompositeOperation = 'source-over';
    ctx.fillStyle = values.invert ? '#f2f2f4' : '#0a0a0d';
    ctx.fillRect(0, 0, W, H);
    // Additive on the dark ground, so wherever slices crowd (the limb) the
    // image brightens on its own. On the light ground `lighter` would clip
    // to white, so dark ink layers with plain alpha there.
    ctx.globalCompositeOperation = values.invert ? 'source-over' : 'lighter';
    // Butt caps: runs split at shared points (alpha buckets), and round caps
    // would overlap there and add up to beads under 'lighter'.
    ctx.lineCap = 'butt';

    paths = [];
    const S = Math.min(W, H);
    const size = 0.35 + 0.65 * values.scale;
    const R = S * 0.3 * size;
    // fov tracks the frame so the perspective reads the same at any size,
    // and stays well over R / 0.8 at Scale 2, so the near plane in
    // shared/project.js never clips the sphere's front.
    const fov = S * 1.6;
    const slices = Math.max(8, Math.round(BASE_SLICES * values.density));
    const light = values.invert ? 0.14 : 0.88 - 0.26 * values.saturation;
    const lineWidth = 0.5 + values.stroke * 0.4;
    const peak = values.opacity * (values.invert ? 0.5 : 0.4);

    // Speed is the tempo of everything (Speed 0 is a still frame). The axis
    // precesses once per PRECESS_PERIOD; Motion is the amplitude of a
    // separate slow nod of its lean, so Motion 0 keeps the precession and
    // loses the nod.
    const t = elapsed * values.speed;
    // Starts half a turn in, so the opening frames show the slices open.
    const precess = (t / PRECESS_PERIOD + 0.5) * Math.PI * 2;
    const lean = OBLIQUITY + values.motion * 0.1 * Math.sin((t / NOD_PERIOD) * Math.PI * 2);
    const cl = Math.cos(lean), sl = Math.sin(lean);
    const cp = Math.cos(precess), sp = Math.sin(precess);

    const view = {
      tilt: (values.rotX * Math.PI) / 180,
      yaw: (values.rotY * Math.PI) / 180,
      roll: (values.angle * Math.PI) / 180,
    };
    const cx = W / 2 + 0.07 * S;
    const cy = H / 2;
    camera.set({ ...view, fov, cx, cy });

    // Phase restructures the slicing: identity at 0, and increasingly
    // bunches slices toward the equator. Monotonic in v, so slices never
    // cross.
    const warp = (v) => Math.sign(v) * Math.pow(Math.abs(v), 1 + values.phase * 0.9);

    for (let k = 0; k < slices; k++) {
      const f = slices === 1 ? 0.5 : k / (slices - 1);
      const y = warp(f * 2 - 1) * Y_MAX;
      const ring = Math.sqrt(1 - y * y);
      // Small polar slices fade out so the poles never gather light.
      const polarFade = Math.min(1, Math.max(0, (ring - 0.2) / 0.3));

      const model = [];
      const weights = [];
      for (let s = 0; s <= SEG; s++) {
        const a = (s / SEG) * Math.PI * 2;
        // Unit sphere point, pole along +Y, then lean about Z and precess
        // about Y.
        const x0 = Math.cos(a) * ring, z0 = Math.sin(a) * ring;
        const x1 = x0 * cl - y * sl;
        const y1 = x0 * sl + y * cl;
        const nx = x1 * cp - z0 * sp;
        const nz = x1 * sp + z0 * cp;
        model.push([nx * R, y1 * R, nz * R]);

        // Limb weight, against the true eye position (the camera is close
        // enough that a straight-on view direction misplaces the limb).
        const n = rotatePoint(nx, y1, nz, view);
        const vz = R * n.z + fov;
        const facing = (R + fov * n.z) / Math.sqrt(R * R * (n.x * n.x + n.y * n.y) + vz * vz);
        const limb = 1 - Math.abs(facing);
        const nl = Math.hypot(n.x, n.y) || 1;
        const rim = Math.max(0, (n.x * LX + n.y * LY) / nl);
        const back = facing > 0 ? 0.5 : 1;
        // Toward the lit side the limb brightens; away from it the limb is
        // held down, since the slices' envelope already crowds there.
        const lit = rim * rim;
        weights.push(back * (0.3 * (1 - 0.6 * limb * (1 - rim)) + 0.7 * limb * limb * lit));
      }

      const pts = camera.projectPath(model);
      const buckets = Array.from({ length: BUCKETS }, () => []);
      const svgRuns = [];
      let run = [];
      let svgRun = [];
      let runB = -1;
      for (let s = 0; s < SEG; s++) {
        const p = pts[s], q = pts[s + 1];
        if (p.scale <= 0 || q.scale <= 0) {
          if (run.length >= 2) buckets[runB].push(run);
          if (svgRun.length >= 2) svgRuns.push(svgRun);
          run = []; svgRun = []; runB = -1;
          continue;
        }
        const w = (weights[s] + weights[s + 1]) / 2;
        const b = Math.min(BUCKETS - 1, Math.floor(w * BUCKETS));
        if (b !== runB) {
          if (run.length >= 2) buckets[runB].push(run);
          run = [p];
          runB = b;
        }
        run.push(q);
        if (!svgRun.length) svgRun.push([p.x, p.y]);
        svgRun.push([q.x, q.y]);
      }
      if (run.length >= 2) buckets[runB].push(run);
      if (svgRun.length >= 2) svgRuns.push(svgRun);
      for (const r of svgRuns) paths.push(r);

      const { h, s } = paletteHsl(values, f);
      const rgb = hslToRgb(h, s, light);
      for (let b = 0; b < BUCKETS; b++) {
        const alpha = peak * polarFade * ((b + 0.5) / BUCKETS);
        if (values.glow > 0 && b >= BUCKETS - 3) {
          strokeRuns(buckets[b], alpha * values.glow * 0.3, lineWidth + values.glow * 2.2, rgb);
        }
        strokeRuns(buckets[b], alpha, lineWidth, rgb);
      }
    }

    // Glow is a fallback for the anchor, off by default: the lit limb arc is
    // already the brightest place from the stacked slices alone.
    const centre = camera.project(0, 0, 0);
    if (values.glow > 0 && centre.scale > 0) {
      const rs = R * centre.scale * 0.96;
      const gx = centre.x + LX * rs, gy = centre.y + LY * rs;
      const { h, s } = paletteHsl(values, 1);
      const [r, g, b] = hslToRgb(h, s, light);
      const gr = (18 + 40 * values.glow) * size;
      const grad = ctx.createRadialGradient(gx, gy, 0, gx, gy, gr);
      grad.addColorStop(0, `rgba(${r},${g},${b},${Math.min(1, 0.35 * values.glow * values.opacity)})`);
      grad.addColorStop(1, `rgba(${r},${g},${b},0)`);
      ctx.fillStyle = grad;
      ctx.beginPath();
      ctx.arc(gx, gy, gr, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.globalCompositeOperation = 'source-over';
  }

  const loop = createLoop({
    onFrame(dt, elapsed) {
      drawFrame(dt, elapsed, currentValues);
    },
  });
  loop.start();

  document.getElementById('btn-png-2x')?.addEventListener('click', () => exportPng(canvas, { multiplier: 2 }));
  document.getElementById('btn-png-4x')?.addEventListener('click', () => exportPng(canvas, { multiplier: 4 }));
  document.getElementById('btn-svg')?.addEventListener('click', () => exportSvg(paths, { width: canvas.width, height: canvas.height }));
  document.getElementById('btn-baked')?.addEventListener('click', () => {
    bakeHtml({ sourceHtml: document.documentElement.outerHTML, values: panel.values })
      .catch((err) => console.error('bakeHtml failed', err));
  });
  document.getElementById('btn-source')?.addEventListener('click', () => {
    exportSource().catch((err) => console.error('exportSource failed', err));
  });
  document.getElementById('btn-prompt')?.addEventListener('click', () => {
    describeForAI({ pieceName: PIECE_ID, values: panel.values });
  });
</script>
</body>
</html>
