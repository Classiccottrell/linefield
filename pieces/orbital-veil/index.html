<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>linefield — orbital-veil</title>
<style>
  html, body { margin: 0; height: 100%; background: #0a0a0d; overflow: hidden; }
  canvas { display: block; width: 100vw; height: 100vh; }
  .lf-export-row { position: fixed; top: 12px; right: 12px; display: flex; gap: 6px; z-index: 9999; }
  .lf-export-row button { background: #222; color: #eee; border: 1px solid #444; border-radius: 4px;
    padding: 4px 8px; font: 11px -apple-system, sans-serif; cursor: pointer; }
</style>
</head>
<body>
<canvas id="canvas"></canvas>

<div class="lf-export-row" data-lf-panel>
  <button id="btn-baked">Baked HTML</button>
  <button id="btn-png">PNG</button>
  <button id="btn-svg">SVG</button>
  <button id="btn-prompt">Copy AI Prompt</button>
</div>

<script type="module">
  import { createControlPanel } from '../../shared/controls.js';
  import { createLoop } from '../../shared/anim.js';
  import { hslToRgb } from '../../shared/color.js';
  import { exportPng, exportSvg, bakeHtml, describeForAI } from '../../shared/export.js';

  const PIECE_ID = 'orbital-veil';
  const canvas = document.getElementById('canvas');
  const ctx = canvas.getContext('2d');

  function resize() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
  }
  window.addEventListener('resize', resize);
  resize();

  // Ring count is derived per frame from density — no persistent array.
  const BASE_RINGS = 34;
  const SEG = 72;
  let paths = [];

  const baked = window.__LF_BAKED_VALUES__;
  const panel = baked ? null : createControlPanel({
    pieceId: PIECE_ID,
    onChange: () => {},
    extraControls: [
      { name: 'sweep', label: 'Sweep', type: 'range', min: 0.05, max: 1, step: 0.01, default: 0.62 },
    ],
    defaults: { hue: 265, hueB: 330, saturation: 0.55 },
  });
  const currentValues = baked || panel.values;

  function drawFrame(dt, elapsed, values) {
    ctx.fillStyle = values.invert ? '#f2f2f4' : '#0a0a0d';
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    paths = [];
    const rings = Math.max(3, Math.round(BASE_RINGS * values.density));
    const cx = canvas.width / 2;
    const cy = canvas.height / 2;
    const maxR = Math.min(canvas.width, canvas.height) * 0.44 * (0.35 + values.scale * 0.65);
    const t = elapsed * values.speed;
    // Tilt squashes the rings vertically, giving the orb its 3D read.
    const tilt = 0.35 + 0.65 * Math.abs(Math.cos((values.angle * Math.PI) / 180));

    ctx.lineWidth = 0.4 + values.stroke * 1.2;
    ctx.shadowBlur = values.glow > 0 ? values.glow * 8 : 0;

    const light = values.invert ? 0.35 : 0.6;

    for (let i = 0; i < rings; i++) {
      const f = i / (rings - 1 || 1);
      // Pulse each ring's radius, offset per ring so the orb breathes unevenly.
      const pulse = 1 + Math.sin(t * 0.8 + f * 6 + values.phase * Math.PI) * 0.05;
      const radius = maxR * (0.12 + f * 0.88) * pulse;
      // Differential rotation: outer rings lag inner ones.
      const rot = t * (0.9 - f * 0.65) * values.motion + f * 0.6;
      const sweep = Math.PI * 2 * values.sweep;
      const start = rot;

      const [r, g, b] = hslToRgb(
        values.hue + (values.hueB - values.hue) * f,
        values.saturation,
        light
      );
      ctx.strokeStyle = `rgba(${r},${g},${b},${values.opacity})`;
      if (values.glow > 0) ctx.shadowColor = `rgba(${r},${g},${b},0.6)`;

      const pts = [];
      ctx.beginPath();
      for (let s = 0; s <= SEG; s++) {
        const a = start + (s / SEG) * sweep;
        const x = cx + Math.cos(a) * radius;
        const y = cy + Math.sin(a) * radius * tilt;
        if (s === 0) ctx.moveTo(x, y);
        else ctx.lineTo(x, y);
        pts.push([x, y]);
      }
      ctx.stroke();
      paths.push(pts);
    }
  }

  const loop = createLoop({
    onFrame(dt, elapsed) {
      drawFrame(dt, elapsed, currentValues);
    },
  });
  loop.start();

  document.getElementById('btn-png')?.addEventListener('click', () => exportPng(canvas, { multiplier: 2 }));
  document.getElementById('btn-svg')?.addEventListener('click', () => exportSvg(paths, { width: canvas.width, height: canvas.height }));
  document.getElementById('btn-baked')?.addEventListener('click', () => {
    bakeHtml({ sourceHtml: document.documentElement.outerHTML, values: panel.values });
  });
  document.getElementById('btn-prompt')?.addEventListener('click', () => {
    describeForAI({ pieceName: PIECE_ID, values: panel.values });
  });
</script>
</body>
</html>
