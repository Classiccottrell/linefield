<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<!-- Without this a phone uses a ~980px layout viewport, so the panel's
     max-width:640px sheet rule never matches and the page renders zoomed
     out — the controls become an unusable corner card. -->
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>linefield — orbital-veil</title>
<style>
  html, body { margin: 0; height: 100%; background: #0a0a0d; overflow: hidden; }
  canvas { display: block; width: 100vw; height: 100vh; }
  .lf-export-row { position: fixed; top: 12px; right: 12px; display: flex; gap: 6px; z-index: 9999; }
  .lf-export-row button { background: #222; color: #eee; border: 1px solid #444; border-radius: 4px;
    padding: 4px 8px; font: 11px -apple-system, sans-serif; cursor: pointer; }
</style>
</head>
<body>
<canvas id="canvas"></canvas>

<div class="lf-export-row" data-lf-panel>
  <button id="btn-baked">Baked HTML</button>
  <button id="btn-source">Source</button>
  <button id="btn-png-2x">PNG 2x</button>
  <button id="btn-png-4x">PNG 4x</button>
  <button id="btn-svg">SVG</button>
  <button id="btn-prompt">Copy AI Prompt</button>
</div>

<script type="module">
  import { createControlPanel } from '../../shared/controls.js';
  import { createLoop } from '../../shared/anim.js';
  import { hslToRgb, paletteHsl } from '../../shared/color.js';
  import { exportPng, exportSvg, bakeHtml, exportSource, describeForAI } from '../../shared/export.js';
  import { createPointer } from '../../shared/pointer.js';
  import { createCursorOverlay, modeFactor } from '../../shared/cursor-modes.js';
  import { rotatePoint } from '../../shared/project.js';

  const PIECE_ID = 'orbital-veil';
  const canvas = document.getElementById('canvas');
  const ctx = canvas.getContext('2d');

  function resize() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
  }
  window.addEventListener('resize', resize);
  resize();

  // Ring count is derived per frame from density — no persistent array.
  const BASE_RINGS = 34;
  const SEG = 72;
  let paths = [];

  const PRESETS = {
    whisper: { opacity: 0.3, stroke: 1.1, density: 0.55, saturation: 0.06, glow: 0 },
    ink:     { opacity: 1, stroke: 1.6, density: 0.7, saturation: 0, glow: 0 },
    neon:    { opacity: 0.9, stroke: 0.9, density: 1.2, saturation: 0.95, glow: 1.1 },
    drift:   { opacity: 0.45, stroke: 0.8, density: 0.6, speed: 0.25, motion: 1.6 },
    dense:   { opacity: 0.6, stroke: 0.6, density: 2, speed: 0.85, saturation: 0.5, glow: 0 },
  };

  const baked = window.__LF_BAKED_VALUES__;
  const panel = baked ? null : createControlPanel({
    pieceId: PIECE_ID,
    presets: PRESETS,
    onChange: () => {},
    extraControls: [
      { name: 'sweep', label: 'Sweep', type: 'range', min: 0.05, max: 1, step: 0.01, default: 0.62, category: 'form' },
    ],
    defaults: { hue: 265, hueB: 330, saturation: 0.55, colorMode: 'gradient', colorA: '#6a00ff', colorB: '#ff0080' },
  });
  const currentValues = baked || panel.values;
  const pointer = createPointer({ canvas });
  const overlay = createCursorOverlay();

  // Each ring is one continuous stroked path, so per-mark scaling isn't
  // available: all four modes get a per-point falloff-weighted radial
  // pull/swell/rotation, mirroring interference. No canvas rotation
  // transform is applied here, so pointer.x/y are usable directly.
  const SWELL_MAG = 30;
  const SWELL_RADIUS = 200;

  function drawFrame(dt, elapsed, values) {
    ctx.fillStyle = values.invert ? '#f2f2f4' : '#0a0a0d';
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    paths = [];
    const rings = Math.max(3, Math.round(BASE_RINGS * values.density));
    const cx = canvas.width / 2;
    const cy = canvas.height / 2;
    const maxR = Math.min(canvas.width, canvas.height) * 0.44 * (0.35 + values.scale * 0.65);
    const t = elapsed * values.speed;
    // Tilt squashes the rings vertically, giving the orb its 3D read.
    const tilt = 0.35 + 0.65 * Math.abs(Math.cos((values.angle * Math.PI) / 180));

    const lineWidth = 0.4 + values.stroke * 1.2;
    ctx.lineWidth = lineWidth;

    const light = values.invert ? 0.35 : 0.6;

    // Off at pointer 0, off when cursorInteraction is 'None', eased by
    // influence. No term routed through values.speed or values.sweep (both
    // user-zeroable).
    const k = modeFactor(values, pointer);
    const mode = values.cursorInteraction;

    // Cap the amplitude/radius/rotation input at k=1: uncapped, k=2
    // (Pointer's max) quadruples Grow's magnitude AND falloff radius
    // together (and widens Vortex's rotation radius the same way), which
    // pulls nearly every ring hard and destroys the piece's identity. This
    // holds Pointer 1..2 flat at the Pointer=1 strength (gate numbers
    // unchanged) instead of compounding further.
    const kAmp = Math.min(k, 1);

    // The piece's one prior pointer response was a global nx/ny tilt with
    // no positional falloff — against the "k and a positional falloff,
    // nothing else" contract. Replaced below with a genuine per-point
    // falloff pull/swell/rotation for all four modes, not kept for any of
    // them.

    for (let i = 0; i < rings; i++) {
      const f = i / (rings - 1 || 1);
      // Pulse each ring's radius, offset per ring so the orb breathes unevenly.
      const pulse = 1 + Math.sin(t * 0.8 + f * 6 + values.phase * Math.PI) * 0.05;
      const radius = maxR * (0.12 + f * 0.88) * pulse;
      // Differential rotation: outer rings lag inner ones.
      const rot = t * (0.9 - f * 0.65) * values.motion + f * 0.6;
      const sweep = Math.PI * 2 * values.sweep;
      const start = rot;

      const { h, s } = paletteHsl(values, f);
      const [r, g, b] = hslToRgb(h, s, light);
      ctx.strokeStyle = `rgba(${r},${g},${b},${values.opacity})`;

      const pts = [];
      ctx.beginPath();
      for (let s = 0; s <= SEG; s++) {
        const a = start + (s / SEG) * sweep;
        let x = cx + Math.cos(a) * radius;
        let y = cy + Math.sin(a) * radius * tilt;
        if (k && mode === 'Attract') {
          const f = Math.max(0, 1 - Math.hypot(x - pointer.x, y - pointer.y) / SWELL_RADIUS);
          if (f) {
            // Clamp the EASE FRACTION, not f*k directly: k can reach 2
            // (Pointer control's max), and a lerp factor above 1 overshoots
            // the pointer and reflects the point past it.
            const ease = Math.min(f * k, 1);
            x += (pointer.x - x) * ease;
            y += (pointer.y - y) * ease;
          }
        } else if (k && (mode === 'Grow' || mode === 'Shrink' || mode === 'Vortex')) {
          const amp = mode === 'Shrink' ? 1 / (1 + kAmp * 1.5) : 1 + kAmp * 1.5;
          const swellRadius = SWELL_RADIUS * amp;
          const f = Math.max(0, 1 - Math.hypot(x - pointer.x, y - pointer.y) / swellRadius);
          if (f) {
            if (mode === 'Vortex') {
              // True tangential rotation about the pointer, not an offset
              // toward/away from it.
              const rp = rotatePoint(x - pointer.x, y - pointer.y, 0, { roll: f * kAmp * 1.1 });
              x = pointer.x + rp.x;
              y = pointer.y + rp.y;
            } else {
              const dx = x - pointer.x, dy = y - pointer.y;
              const d = Math.hypot(dx, dy) || 1;
              const push = f * SWELL_MAG * amp;
              x += (dx / d) * push;
              y += (dy / d) * push;
            }
          }
        }
        if (s === 0) ctx.moveTo(x, y);
        else ctx.lineTo(x, y);
        pts.push([x, y]);
      }
      if (values.glow > 0) {
        ctx.lineWidth = lineWidth + values.glow * 3;
        ctx.globalAlpha = values.glow * 0.25;
        ctx.stroke();
        ctx.lineWidth = lineWidth;
        ctx.globalAlpha = 1;
      }
      ctx.stroke();
      paths.push(pts);
    }

    const stopA = paletteHsl(values, 0);
    const [ovR, ovG, ovB] = hslToRgb(stopA.h, stopA.s, light);
    overlay.draw(ctx, `rgb(${ovR},${ovG},${ovB})`, k);
  }

  const loop = createLoop({
    onFrame(dt, elapsed) {
      pointer.step();
      const k = modeFactor(currentValues, pointer);
      overlay.step(currentValues.cursorInteraction, k, pointer);
      drawFrame(dt, elapsed, currentValues);
    },
  });
  loop.start();

  document.getElementById('btn-png-2x')?.addEventListener('click', () => exportPng(canvas, { multiplier: 2 }));
  document.getElementById('btn-png-4x')?.addEventListener('click', () => exportPng(canvas, { multiplier: 4 }));
  document.getElementById('btn-svg')?.addEventListener('click', () => exportSvg(paths, { width: canvas.width, height: canvas.height }));
  document.getElementById('btn-baked')?.addEventListener('click', () => {
    bakeHtml({ sourceHtml: document.documentElement.outerHTML, values: panel.values }).catch((err) => console.error('bakeHtml failed', err));
  });
  document.getElementById('btn-source')?.addEventListener('click', () => {
    exportSource().catch((err) => console.error('exportSource failed', err));
  });
  document.getElementById('btn-prompt')?.addEventListener('click', () => {
    describeForAI({ pieceName: PIECE_ID, values: panel.values });
  });
</script>
</body>
</html>
