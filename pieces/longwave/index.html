<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<!-- Without this a phone uses a ~980px layout viewport, so the panel's
     max-width:640px sheet rule never matches and the page renders zoomed
     out — the controls become an unusable corner card. -->
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>linefield — longwave</title>
<style>
  html, body { margin: 0; height: 100%; background: #0a0a0d; overflow: hidden; }
  canvas { display: block; width: 100vw; height: 100vh; }
  .lf-export-row { position: fixed; top: 12px; right: 12px; display: flex; gap: 6px; z-index: 9999; }
  .lf-export-row button { background: #222; color: #eee; border: 1px solid #444; border-radius: 4px;
    padding: 4px 8px; font: 11px -apple-system, sans-serif; cursor: pointer; }
</style>
</head>
<body>
<canvas id="canvas"></canvas>

<!--
  longwave — one band of hairline traces riding a shared carrier wave
  across the frame on a shallow diagonal, pinching together at nodes and
  fanning apart between them.
  Text-safe zone: the upper-left region above the band (and the
  lower-right corner below it).
  Anchor: the tightest node, just right of centre.
-->

<div class="lf-export-row" data-lf-panel>
  <button id="btn-baked">Baked HTML</button>
  <button id="btn-source">Source</button>
  <button id="btn-png-2x">PNG 2x</button>
  <button id="btn-png-4x">PNG 4x</button>
  <button id="btn-svg">SVG</button>
  <button id="btn-prompt">Copy AI Prompt</button>
</div>

<script type="module">
  import { createControlPanel } from '../../shared/controls.js';
  import { createLoop } from '../../shared/anim.js';
  import { hslToRgb, paletteHsl } from '../../shared/color.js';
  import { exportPng, exportSvg, bakeHtml, exportSource, describeForAI } from '../../shared/export.js';

  const PIECE_ID = 'longwave';
  const canvas = document.getElementById('canvas');
  const ctx = canvas.getContext('2d');

  function resize() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
  }
  window.addEventListener('resize', resize);
  resize();

  // One band of hairline traces riding a shared carrier wave. Every trace
  // sits at a fixed fraction of the band's width, so traces never cross:
  // they only pinch together at the nodes and fan apart between them.
  // Geometry is built in band coordinates (s along, n across) and rotated
  // here rather than by a canvas transform, so SVG export carries Angle.
  const BASE_TRACES = 110;
  const STEP_PX = 6;
  const TILT = -11 * Math.PI / 180; // shallow rise, lower left to upper right
  let paths = [];

  const PRESETS = {
    whisper: { opacity: 0.75, stroke: 0.7, density: 0.55, glow: 0 },
    ink:     { opacity: 1, stroke: 1.4, density: 0.9, saturation: 0, glow: 0, sweep: 0.6 },
    neon:    { opacity: 0.9, stroke: 1, density: 1.1, saturation: 0.9, glow: 1.1 },
    drift:   { opacity: 0.8, density: 0.8, speed: 0.4, motion: 1.8, sweep: 1.6, scale: 1.25 },
    dense:   { opacity: 0.85, stroke: 0.8, density: 1.8, glow: 0.5, scale: 0.8 },
  };

  const baked = window.__LF_BAKED_VALUES__;
  const panel = baked ? null : createControlPanel({
    pieceId: PIECE_ID,
    presets: PRESETS,
    onChange: () => {},
    extraControls: [
      // Height of the carrier wave the whole band rides.
      { name: 'sweep', label: 'Sweep', type: 'range', min: 0, max: 2, step: 0.01, default: 1, category: 'motion' },
    ],
    defaults: { hue: 150, hueB: 180, saturation: 0, colorMode: 'gradient', colorA: '#00ff80', colorB: '#00ffff' },
  });
  const currentValues = baked || panel.values;

  let clock = 0;

  function drawFrame(dt, elapsed, values) {
    ctx.globalCompositeOperation = 'source-over';
    ctx.fillStyle = values.invert ? '#f2f2f4' : '#0a0a0d';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    clock += dt * values.speed;

    paths = [];
    const W = canvas.width, H = canvas.height;
    const unit = Math.min(W, H);
    const zoom = 0.5 + 0.5 * values.scale;
    const traces = Math.max(12, Math.round(BASE_TRACES * values.density));
    const halfWidth = unit * 0.115 * zoom; // widest fan, either side of the carrier
    const nodeGap = unit * 0.56 * zoom; // distance between pinches
    const carrierLen = nodeGap * 1.7;
    const carrierAmp = unit * 0.06 * values.sweep;
    // The carrier travels along the band: one wavelength every ~14s.
    const carrierShift = clock * (Math.PI * 2 / 14);
    const theta = TILT + (values.angle * Math.PI) / 180;
    const ux = Math.cos(theta), uy = Math.sin(theta);
    const ox = W * 0.5, oy = H * 0.56;
    // The anchor node sits right of centre; Phase slides the nodes along.
    const sAnchor = W * 0.1;
    const sNode = sAnchor + values.phase * nodeGap * 0.5;
    const reach = Math.hypot(W, H) * 0.62;

    // Motion: the fans breathe, and each trace weaves a little inside its fan.
    const breathe = values.motion * 0.22;
    const weave = values.motion * 0.05;

    const light = values.invert ? 0.12 : 0.86 - 0.26 * values.saturation;
    ctx.lineWidth = 0.3 + values.stroke * 0.5;
    ctx.lineJoin = 'round';
    ctx.globalCompositeOperation = values.invert ? 'source-over' : 'lighter';

    // Envelope (0..1) at s: sin^2 pinches at each node; nodes are tightest
    // near the anchor, so that one gathers the most light.
    function spread(s) {
      const d = (s - sAnchor) / (nodeGap * 0.9);
      const depth = 0.02 + 0.2 * (1 - Math.exp(-d * d));
      const sn = Math.sin(Math.PI * (s - sNode) / nodeGap);
      const swell = 1 + breathe * Math.sin(clock * 0.55 + s / nodeGap * 2.1);
      return (depth + (1 - depth) * sn * sn) * swell;
    }

    const steps = Math.ceil((reach * 2) / STEP_PX);
    const carrier = new Float32Array(steps + 1);
    const env = new Float32Array(steps + 1);
    for (let j = 0; j <= steps; j++) {
      const s = -reach + j * STEP_PX;
      carrier[j] = carrierAmp * Math.sin((Math.PI * 2 * s) / carrierLen - carrierShift + 0.9);
      env[j] = spread(s);
    }

    for (let i = 0; i < traces; i++) {
      const f = traces === 1 ? 0.5 : i / (traces - 1);
      const a = f * 2 - 1;
      const { h, s: sat } = paletteHsl(values, f);
      const [r, g, b] = hslToRgb(h, sat, light);
      ctx.strokeStyle = `rgba(${r},${g},${b},${0.3 * values.opacity})`;
      const pts = [];
      ctx.beginPath();
      for (let j = 0; j <= steps; j++) {
        const s = -reach + j * STEP_PX;
        const w = a + weave * Math.sin(s * 0.011 + i * 0.06 + clock * 0.7);
        const n = carrier[j] + w * halfWidth * env[j];
        const x = ox + ux * s - uy * n;
        const y = oy + uy * s + ux * n;
        if (j === 0) ctx.moveTo(x, y);
        else ctx.lineTo(x, y);
        pts.push([x, y]);
      }
      ctx.stroke();
      paths.push(pts);
    }

    // Optional soft bloom on the anchor node. Off by default: the node
    // already brightens from the traces crowding through it.
    if (values.glow > 0) {
      const j = Math.round((sAnchor + reach) / STEP_PX);
      const nx = ox + ux * sAnchor - uy * carrier[j];
      const ny = oy + uy * sAnchor + ux * carrier[j];
      const { h, s } = paletteHsl(values, 0.5);
      const [r, g, b] = hslToRgb(h, s, light);
      const gr = unit * 0.06 * (0.6 + values.glow * 0.4);
      const grad = ctx.createRadialGradient(nx, ny, 0, nx, ny, gr);
      grad.addColorStop(0, `rgba(${r},${g},${b},${0.3 * values.glow * values.opacity})`);
      grad.addColorStop(1, `rgba(${r},${g},${b},0)`);
      ctx.fillStyle = grad;
      ctx.fillRect(nx - gr, ny - gr, gr * 2, gr * 2);
    }
    ctx.globalCompositeOperation = 'source-over';
  }

  const loop = createLoop({
    onFrame(dt, elapsed) {
      drawFrame(dt, elapsed, currentValues);
    },
  });
  loop.start();

  document.getElementById('btn-png-2x')?.addEventListener('click', () => exportPng(canvas, { multiplier: 2 }));
  document.getElementById('btn-png-4x')?.addEventListener('click', () => exportPng(canvas, { multiplier: 4 }));
  document.getElementById('btn-svg')?.addEventListener('click', () => exportSvg(paths, { width: canvas.width, height: canvas.height }));
  document.getElementById('btn-baked')?.addEventListener('click', () => {
    bakeHtml({ sourceHtml: document.documentElement.outerHTML, values: panel.values })
      .catch((err) => console.error('bakeHtml failed', err));
  });
  document.getElementById('btn-source')?.addEventListener('click', () => {
    exportSource().catch((err) => console.error('exportSource failed', err));
  });
  document.getElementById('btn-prompt')?.addEventListener('click', () => {
    describeForAI({ pieceName: PIECE_ID, values: panel.values });
  });
</script>
</body>
</html>
