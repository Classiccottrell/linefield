<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>linefield — synapse</title>
<style>
  html, body { margin: 0; height: 100%; background: #0a0a0d; overflow: hidden; }
  canvas { display: block; width: 100vw; height: 100vh; }
  .lf-export-row { position: fixed; top: 12px; right: 12px; display: flex; gap: 6px; z-index: 9999; }
  .lf-export-row button { background: #222; color: #eee; border: 1px solid #444; border-radius: 4px;
    padding: 4px 8px; font: 11px -apple-system, sans-serif; cursor: pointer; }
</style>
</head>
<body>
<canvas id="canvas"></canvas>

<div class="lf-export-row" data-lf-panel>
  <button id="btn-baked">Baked HTML</button>
  <button id="btn-png-2x">PNG 2x</button>
  <button id="btn-png-4x">PNG 4x</button>
  <button id="btn-svg">SVG</button>
  <button id="btn-prompt">Copy AI Prompt</button>
</div>

<script type="module">
  import { createControlPanel } from '../../shared/controls.js';
  import { createLoop } from '../../shared/anim.js';
  import { hslToRgb } from '../../shared/color.js';
  import { simplex2 } from '../../shared/noise.js';
  import { exportPng, exportSvg, bakeHtml, describeForAI } from '../../shared/export.js';

  const PIECE_ID = 'synapse';
  const canvas = document.getElementById('canvas');
  const ctx = canvas.getContext('2d');

  function resize() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
  }
  window.addEventListener('resize', resize);
  resize();

  // Persistent node array — must re-seed when density changes.
  const BASE_COUNT = 220;
  let nodes = [];
  let paths = [];

  function seedNodes(count) {
    nodes = Array.from({ length: count }, () => {
      const x = Math.random() * canvas.width;
      const y = Math.random() * canvas.height;
      return {
        x, y,
        homeX: x, homeY: y, // anchor: noise-field drift wanders around this,
        // it never travels far from it, so the field can't collapse into thin
        // filaments over time the way pure unbounded advection does.
        j: Math.random() * Math.PI * 2, // per-node phase, so pulses aren't in lockstep
      };
    });
  }

  const baked = window.__LF_BAKED_VALUES__;
  const panel = baked ? null : createControlPanel({
    pieceId: PIECE_ID,
    onChange: (name, value, values) => {
      if (name === 'density') seedNodes(Math.max(8, Math.round(BASE_COUNT * values.density)));
    },
    extraControls: [
      { name: 'reach', label: 'Reach', type: 'range', min: 20, max: 200, step: 1, default: 90 },
    ],
    defaults: { hue: 75, hueB: 45, saturation: 0.7 },
  });
  const currentValues = baked || panel.values;

  seedNodes(Math.max(8, Math.round(BASE_COUNT * currentValues.density)));
  window.addEventListener('resize', () =>
    seedNodes(Math.max(8, Math.round(BASE_COUNT * currentValues.density)))
  );

  function drawFrame(dt, elapsed, values) {
    ctx.fillStyle = values.invert ? '#f2f2f4' : '#0a0a0d';
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    paths = [];
    const reach = values.reach;
    const noiseScale = 0.0016 * (0.3 + values.scale);
    const t = elapsed * 0.2 * values.motion;
    const stepDt = dt || 0.016;
    const drift = 18 * values.speed * stepDt;
    // Scale sets how far a node can wander from its seeded home before the
    // spring pulls it back — 0 pins nodes to a crisp, evenly-spread lattice;
    // 2 lets them roam far enough for the noise field's spatial frequency
    // (see noiseScale above) to actually show up as clumps/filaments/voids.
    // pull is derived from it, not hardcoded, so the equilibrium radius
    // stays ~wanderRadius regardless of speed (speed only affects how fast
    // nodes approach that radius, not how far they get).
    const wanderRadius = 4 + values.scale * 80;
    const pull = (18 * values.speed) / wanderRadius; // per-second return-to-home rate
    const light = values.invert ? 0.35 : 0.62;
    const lineWidth = 0.25 + values.stroke * 0.8;
    ctx.lineWidth = lineWidth;

    // Drift the nodes on a noise field, wrapping at the edges.
    for (const n of nodes) {
      const a =
        simplex2(n.x * noiseScale + values.phase, n.y * noiseScale + t) * Math.PI * 2 +
        (values.angle * Math.PI) / 180;
      n.x += Math.cos(a) * drift - (n.x - n.homeX) * pull * stepDt;
      n.y += Math.sin(a) * drift - (n.y - n.homeY) * pull * stepDt;
      if (n.x < 0) n.x += canvas.width;
      if (n.x > canvas.width) n.x -= canvas.width;
      if (n.y < 0) n.y += canvas.height;
      if (n.y > canvas.height) n.y -= canvas.height;
    }

    // Uniform spatial grid, cell size = reach, so a node's possible partners
    // are confined to its own cell plus the 8 around it. This is what keeps
    // the piece from going O(n^2) as density rises.
    const cell = Math.max(reach, 1);
    const cols = Math.max(1, Math.ceil(canvas.width / cell));
    const rows = Math.max(1, Math.ceil(canvas.height / cell));
    const buckets = new Map();
    const keyOf = (cx, cy) => cy * cols + cx;

    for (const n of nodes) {
      const cx = Math.min(cols - 1, Math.max(0, Math.floor(n.x / cell)));
      const cy = Math.min(rows - 1, Math.max(0, Math.floor(n.y / cell)));
      const k = keyOf(cx, cy);
      let arr = buckets.get(k);
      if (!arr) { arr = []; buckets.set(k, arr); }
      arr.push(n);
    }

    const reach2 = reach * reach;
    const [r0, g0, b0] = hslToRgb(values.hue, values.saturation, light);
    const [r1, g1, b1] = hslToRgb(values.hueB, values.saturation, light);

    for (let cy = 0; cy < rows; cy++) {
      for (let cx = 0; cx < cols; cx++) {
        const here = buckets.get(keyOf(cx, cy));
        if (!here) continue;

        for (let dy = 0; dy <= 1; dy++) {
          for (let dx = -1; dx <= 1; dx++) {
            // Visit each cell pair once: the current cell and the half-ring
            // after it, skipping the mirror images already handled.
            if (dy === 0 && dx < 0) continue;
            const nx = cx + dx;
            const ny = cy + dy;
            if (nx < 0 || nx >= cols || ny < 0 || ny >= rows) continue;
            const there = buckets.get(keyOf(nx, ny));
            if (!there) continue;
            const same = dx === 0 && dy === 0;

            for (let i = 0; i < here.length; i++) {
              const a = here[i];
              for (let j = same ? i + 1 : 0; j < there.length; j++) {
                const b = there[j];
                const ddx = a.x - b.x;
                const ddy = a.y - b.y;
                const d2 = ddx * ddx + ddy * ddy;
                if (d2 > reach2 || d2 === 0) continue;

                const closeness = 1 - Math.sqrt(d2) / reach;
                // Pulse travels as a wave through the field.
                const pulse = (Math.sin(elapsed * 2 * values.speed + a.j + b.j) + 1) / 2;
                const mix = pulse;
                const cr = r0 + (r1 - r0) * mix;
                const cg = g0 + (g1 - g0) * mix;
                const cb = b0 + (b1 - b0) * mix;
                const alpha = values.opacity * closeness * (0.25 + pulse * 0.75);

                ctx.strokeStyle = `rgba(${cr | 0},${cg | 0},${cb | 0},${alpha})`;
                ctx.beginPath();
                ctx.moveTo(a.x, a.y);
                ctx.lineTo(b.x, b.y);
                if (values.glow > 0) {
                  ctx.lineWidth = lineWidth + values.glow * 2.5;
                  ctx.globalAlpha = values.glow * 0.25;
                  ctx.stroke();
                  ctx.globalAlpha = 1;
                  ctx.lineWidth = lineWidth;
                }
                ctx.stroke();
                paths.push([[a.x, a.y], [b.x, b.y]]);
              }
            }
          }
        }
      }
    }
  }

  const loop = createLoop({
    onFrame(dt, elapsed) {
      drawFrame(dt, elapsed, currentValues);
    },
  });
  loop.start();

  document.getElementById('btn-png-2x')?.addEventListener('click', () => exportPng(canvas, { multiplier: 2 }));
  document.getElementById('btn-png-4x')?.addEventListener('click', () => exportPng(canvas, { multiplier: 4 }));
  document.getElementById('btn-svg')?.addEventListener('click', () => exportSvg(paths, { width: canvas.width, height: canvas.height }));
  document.getElementById('btn-baked')?.addEventListener('click', () => {
    bakeHtml({ sourceHtml: document.documentElement.outerHTML, values: panel.values })
      .catch((err) => console.error('bakeHtml failed', err));
  });
  document.getElementById('btn-prompt')?.addEventListener('click', () => {
    describeForAI({ pieceName: PIECE_ID, values: panel.values });
  });
</script>
</body>
</html>
