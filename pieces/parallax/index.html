<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<!-- Without this a phone uses a ~980px layout viewport, so the panel's
     max-width:640px sheet rule never matches and the page renders zoomed
     out — the controls become an unusable corner card. -->
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>linefield — parallax</title>
<style>
  html, body { margin: 0; height: 100%; background: #0a0a0d; overflow: hidden; }
  canvas { display: block; width: 100vw; height: 100vh; }
  .lf-export-row { position: fixed; top: 12px; right: 12px; display: flex; gap: 6px; z-index: 9999; }
  .lf-export-row button { background: #222; color: #eee; border: 1px solid #444; border-radius: 4px;
    padding: 4px 8px; font: 11px -apple-system, sans-serif; cursor: pointer; }
</style>
</head>
<body>
<canvas id="canvas"></canvas>

<div class="lf-export-row" data-lf-panel>
  <button id="btn-baked">Baked HTML</button>
  <button id="btn-source">Source</button>
  <button id="btn-png-2x">PNG 2x</button>
  <button id="btn-png-4x">PNG 4x</button>
  <button id="btn-svg">SVG</button>
  <button id="btn-prompt">Copy AI Prompt</button>
</div>

<script type="module">
  import { createControlPanel } from '../../shared/controls.js';
  import { createLoop } from '../../shared/anim.js';
  import { hslToRgb, paletteHsl } from '../../shared/color.js';
  import { exportPng, exportSvg, bakeHtml, exportSource, describeForAI } from '../../shared/export.js';

  const PIECE_ID = 'parallax';
  const canvas = document.getElementById('canvas');
  const ctx = canvas.getContext('2d');

  function resize() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
  }
  window.addEventListener('resize', resize);
  resize();

  const BASE_FRONTS = 18;
  const SEG = 88;
  let paths = [];

  const PRESETS = {
    whisper: { opacity: 0.18, stroke: 0.45, density: 0.48, saturation: 0.05, glow: 0 },
    ink:     { opacity: 0.88, stroke: 1.25, density: 0.7, saturation: 0, angle: 28 },
    neon:    { opacity: 0.72, stroke: 0.72, density: 1.08, saturation: 0.62, glow: 1.05 },
    drift:   { opacity: 0.34, stroke: 0.55, density: 0.65, speed: 0.24, motion: 1.55, phase: 0.7 },
    dense:   { opacity: 0.58, stroke: 0.48, density: 1.58, speed: 0.62, angle: 338 },
  };

  const baked = window.__LF_BAKED_VALUES__;
  const panel = baked ? null : createControlPanel({
    pieceId: PIECE_ID,
    presets: PRESETS,
    onChange: () => {},
    defaults: { hue: 344, hueB: 24, saturation: 0.3, colorMode: 'gradient', colorA: '#bd7f94', colorB: '#e0b26f' },
  });
  const currentValues = baked || panel.values;

  function drawFrame(dt, elapsed, values) {
    ctx.fillStyle = values.invert ? '#f2f2f4' : '#0a0a0d';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    paths = [];
    const W = canvas.width, H = canvas.height;
    const theta = values.angle * Math.PI / 180;
    const lines = Math.max(8, Math.round(24 * values.density));
    const light = values.invert ? 0.35 : 0.62;
    const width = 0.35 + values.stroke * 0.9;
    const lensX = W * (0.58 + Math.sin(elapsed * values.motion * 0.16 + values.phase) * 0.035);
    const lensY = H * 0.5;
    const sampleCount = Math.max(26, Math.round(42 * values.scale));
    for (let row = 0; row < lines; row++) {
      const offset = (row - lines / 2) * (H / lines) * 0.82;
      const points = [];
      for (let i = 0; i <= sampleCount; i++) {
        const t = i / sampleCount;
        let x = -W * 0.15 + t * W * 1.3;
        let y = H * 0.18 + t * H * 0.72 + offset;
        const rx = (x - lensX) / (190 * values.scale);
        const ry = (y - lensY) / (125 * values.scale);
        const d2 = rx * rx + ry * ry;
        if (d2 < 0.62) { if (points.length > 1) paths.push(points.splice(0)); continue; }
        const bend = Math.exp(-d2 * 1.4) * (1.15 + 0.25 * Math.sin(elapsed * values.motion + values.phase * Math.PI));
        x += rx * bend * 95;
        y += ry * bend * 62;
        const tx = (x - W / 2) * Math.cos(theta) - (y - H / 2) * Math.sin(theta) + W / 2;
        const ty = (x - W / 2) * Math.sin(theta) + (y - H / 2) * Math.cos(theta) + H / 2;
        points.push([tx, ty]);
      }
      if (points.length > 1) paths.push(points);
    }
    for (let i = 0; i < paths.length; i++) {
      const path = paths[i];
      const mid = path[Math.floor(path.length / 2)];
      const dist = Math.hypot((mid[0] - lensX) / 220, (mid[1] - lensY) / 150);
      const rim = Math.max(0.18, Math.min(1, 1.25 - Math.abs(dist - 1.05) * 1.5));
      const stop = paletteHsl(values, i / Math.max(1, paths.length - 1));
      const [r, g, b] = hslToRgb(stop.h, stop.s, light);
      ctx.beginPath(); ctx.moveTo(path[0][0], path[0][1]);
      for (let j = 1; j < path.length; j++) ctx.lineTo(path[j][0], path[j][1]);
      ctx.lineCap = 'round'; ctx.lineWidth = width;
      ctx.strokeStyle = `rgba(${r},${g},${b},${values.opacity * rim})`;
      if (values.glow > 0 && rim > 0.7) { ctx.globalAlpha = values.glow * 0.16; ctx.lineWidth = width + values.glow * 2.5; ctx.stroke(); ctx.globalAlpha = 1; }
      ctx.stroke();
    }
  }

  const loop = createLoop({
    onFrame(dt, elapsed) {
      drawFrame(dt, elapsed, currentValues);
    },
  });
  loop.start();

  document.getElementById('btn-png-2x')?.addEventListener('click', () => exportPng(canvas, { multiplier: 2 }));
  document.getElementById('btn-png-4x')?.addEventListener('click', () => exportPng(canvas, { multiplier: 4 }));
  document.getElementById('btn-svg')?.addEventListener('click', () => exportSvg(paths, { width: canvas.width, height: canvas.height }));
  document.getElementById('btn-baked')?.addEventListener('click', () => {
    bakeHtml({ sourceHtml: document.documentElement.outerHTML, values: panel.values }).catch((err) => console.error('bakeHtml failed', err));
  });
  document.getElementById('btn-source')?.addEventListener('click', () => {
    exportSource().catch((err) => console.error('exportSource failed', err));
  });
  document.getElementById('btn-prompt')?.addEventListener('click', () => {
    describeForAI({ pieceName: PIECE_ID, values: panel.values });
  });
</script>
</body>
</html>
