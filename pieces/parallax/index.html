<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<!-- Without this a phone uses a ~980px layout viewport, so the panel's
     max-width:640px sheet rule never matches and the page renders zoomed
     out — the controls become an unusable corner card. -->
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>linefield — parallax</title>
<style>
  html, body { margin: 0; height: 100%; background: #0a0a0d; overflow: hidden; }
  canvas { display: block; width: 100vw; height: 100vh; }
  .lf-export-row { position: fixed; top: 12px; right: 12px; display: flex; gap: 6px; z-index: 9999; }
  .lf-export-row button { background: #222; color: #eee; border: 1px solid #444; border-radius: 4px;
    padding: 4px 8px; font: 11px -apple-system, sans-serif; cursor: pointer; }
</style>
</head>
<body>
<canvas id="canvas"></canvas>

<div class="lf-export-row" data-lf-panel>
  <button id="btn-baked">Baked HTML</button>
  <button id="btn-source">Source</button>
  <button id="btn-png-2x">PNG 2x</button>
  <button id="btn-png-4x">PNG 4x</button>
  <button id="btn-svg">SVG</button>
  <button id="btn-prompt">Copy AI Prompt</button>
</div>

<script type="module">
  import { createControlPanel } from '../../shared/controls.js';
  import { createLoop } from '../../shared/anim.js';
  import { hslToRgb, paletteHsl } from '../../shared/color.js';
  import { exportPng, exportSvg, bakeHtml, exportSource, describeForAI } from '../../shared/export.js';

  const PIECE_ID = 'parallax';
  const canvas = document.getElementById('canvas');
  const ctx = canvas.getContext('2d');

  function resize() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
  }
  window.addEventListener('resize', resize);
  resize();

  let paths = [];
  let travel = 0;
  let lensTime = 0;

  const PRESETS = {
    whisper: { opacity: 0.4, stroke: 0.55, density: 0.55, scale: 0.7, motion: 0.45, saturation: 0.08 },
    ink:     { opacity: 0.9, stroke: 1.4, density: 0.7, scale: 1.2, saturation: 0, angle: 12, phase: 0.4 },
    neon:    { opacity: 0.85, stroke: 1.1, density: 1.1, scale: 0.85, saturation: 0.6, glow: 0.9, phase: 0.65 },
    drift:   { opacity: 0.65, stroke: 0.8, density: 0.75, scale: 1.3, speed: 0.25, motion: 1.5, phase: 1.2, angle: 352 },
    dense:   { opacity: 0.8, stroke: 0.75, density: 1.65, scale: 0.9, speed: 0.65, angle: 344, phase: 0.3 },
  };

  const baked = window.__LF_BAKED_VALUES__;
  const panel = baked ? null : createControlPanel({
    pieceId: PIECE_ID,
    presets: PRESETS,
    onChange: () => {},
    defaults: { hue: 344, hueB: 24, saturation: 0.3, colorMode: 'gradient', colorA: '#bd7f94', colorB: '#e0b26f', opacity: 0.9, stroke: 1.1, speed: 0.55 },
  });
  const currentValues = baked || panel.values;

  function drawFrame(dt, elapsed, values) {
    ctx.fillStyle = values.invert ? '#f2f2f4' : '#0a0a0d';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    paths = [];
    const W = canvas.width, H = canvas.height;
    const theta = values.angle * Math.PI / 180;
    const ct = Math.cos(theta), st = Math.sin(theta);
    const lines = Math.max(6, Math.round(36 * values.density));
    const unit = Math.min(W / 1280, H / 800);
    travel += dt * values.speed * 0.018;
    lensTime += dt * values.motion * 0.12;
    const lensX = W * (0.61 + Math.sin(lensTime) * 0.04 * values.motion);
    const lensY = H * (0.47 + Math.cos(lensTime * 0.7) * 0.035 * values.motion);
    const radiusX = W * (0.07 + values.scale * 0.09);
    const radiusY = H * (0.07 + values.scale * 0.11);
    // Travel over the short hue arc keeps rose-to-amber from crossing the
    // entire rainbow when the authored palette straddles zero degrees.
    const palette = { ...values, hueB: values.hue + ((values.hueB - values.hue + 540) % 360) - 180 };
    for (let row = 0; row < lines; row++) {
      const depth = (row % 4) / 3;
      const lane = ((row + 0.5) / lines + travel * (0.3 + depth * 0.9) + values.phase * 0.13) % 1 - 0.5;
      const segments = [];
      let points = [];
      for (let i = 0; i <= 180; i++) {
        const t = i / 180;
        let x = W * (-0.15 + t * 1.3);
        let y = H * (0.84 - t * 0.58 + lane * (0.68 + t * 0.48));
        const rx = (x - lensX) / radiusX;
        const ry = (y - lensY) / radiusY;
        const d2 = rx * rx + ry * ry;
        if (d2 < 1) {
          if (points.length > 1) segments.push(points);
          points = []; // Always clear, including a single point before a cut.
          continue;
        }
        const bend = Math.exp(-Math.pow((Math.sqrt(d2) - 1) / 0.72, 2))
          * (0.23 + values.motion * 0.13) * (0.6 + depth * 0.5);
        x += rx * radiusX * bend * 0.3;
        y += ry * radiusY * bend;
        const tx = (x - W / 2) * ct - (y - H / 2) * st + W / 2;
        const ty = (x - W / 2) * st + (y - H / 2) * ct + H / 2;
        points.push([tx, ty]);
      }
      if (points.length > 1) segments.push(points);
      const width = unit * (0.25 + values.stroke * (0.35 + depth * 2.5));
      const stop = paletteHsl(palette, depth * 0.85 + row / lines * 0.15);
      const [r, g, b] = hslToRgb(stop.h, stop.s, values.invert ? 0.25 + depth * 0.15 : 0.45 + depth * 0.3);
      const fade = Math.min(1, (0.5 - Math.abs(lane)) * 9);
      const alpha = values.opacity * (0.16 + depth * depth * 0.84) * fade;
      for (const path of segments) {
        ctx.beginPath(); ctx.moveTo(...path[0]);
        for (let j = 1; j < path.length; j++) ctx.lineTo(...path[j]);
        ctx.lineCap = 'round';
        ctx.strokeStyle = `rgba(${r},${g},${b},${alpha})`;
        if (values.glow > 0) {
          ctx.globalAlpha = values.glow * 0.15;
          ctx.lineWidth = width + values.glow * 4 * unit;
          ctx.stroke();
          ctx.globalAlpha = 1;
        }
        ctx.lineWidth = width;
        ctx.stroke();
        paths.push(path);
      }
    }
  }

  const loop = createLoop({
    onFrame(dt, elapsed) {
      drawFrame(dt, elapsed, currentValues);
    },
  });
  loop.start();

  document.getElementById('btn-png-2x')?.addEventListener('click', () => exportPng(canvas, { multiplier: 2 }));
  document.getElementById('btn-png-4x')?.addEventListener('click', () => exportPng(canvas, { multiplier: 4 }));
  document.getElementById('btn-svg')?.addEventListener('click', () => exportSvg(paths, { width: canvas.width, height: canvas.height }));
  document.getElementById('btn-baked')?.addEventListener('click', () => {
    bakeHtml({ sourceHtml: document.documentElement.outerHTML, values: panel.values }).catch((err) => console.error('bakeHtml failed', err));
  });
  document.getElementById('btn-source')?.addEventListener('click', () => {
    exportSource().catch((err) => console.error('exportSource failed', err));
  });
  document.getElementById('btn-prompt')?.addEventListener('click', () => {
    describeForAI({ pieceName: PIECE_ID, values: panel.values });
  });
</script>
</body>
</html>
